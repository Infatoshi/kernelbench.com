[project]
name = "kernelbench-mega"
version = "0.1.0"
description = "Megakernel-focused GPU benchmark starting with a MegaQwen-style decode block."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rich>=13.7",
    "matplotlib>=3.9",
    "pytest>=8.0",
    "einops>=0.8.2",
    "requests<2.33",
    # load_inline CUDA solutions need ninja at final-check time; without it the
    # fresh archive venv import-fails every CUDA submission (infra false-fail).
    "ninja>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
