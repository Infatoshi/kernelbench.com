    label: "Single-word release/acquire grid barrier across 376 CTAs"
    text: |2
      struct FastGridBarrier {
          uint32_t* arrived;
          __device__ __forceinline__ void sync() {
              __barrier_sync(0);
              if (threadIdx.x == 0) {
                  uint32_t nb = (blockIdx.x == 0) ? (0x80000000u - (gridDim.x - 1u)) : 1u;
                  uint32_t old_arrive;
                  asm volatile("atom.add.release.gpu.u32 %0, [%1], %2;\n"
                               : "=r"(old_arrive)
                               : "l"(arrived), "r"(nb)
                               : "memory");
                  uint32_t cur_arrive;
                  do {
                      asm volatile("ld.acquire.gpu.u32 %0, [%1];\n"
                                   : "=r"(cur_arrive)
                                   : "l"(arrived)
                                   : "memory");
                  } while (((old_arrive ^ cur_arrive) & 0x80000000u) == 0u);
              }
              __barrier_sync(0);
          }
      };
