summary: >
  Gemini 4 Carbon wrote one persistent CUDA kernel, 376 CTAs (two per SM) held
  together by a single-word release/acquire grid barrier, that runs the whole
  decode token: three KDA layers, the absorbed MLA layer and a 64-expert top-8
  plus shared-expert MoE after each. The int4 GEMVs build each weight as a bf16
  "128 + nibble" with one OR (0x43004300) and fold the zero point in once per
  group against precomputed 32-element activation sums; activations stay fp32
  from the bf16 RMSNorm output, so it is a true W4A16 GEMV. MLA attention runs
  in the 512-dim latent space on bf16 mma.sync tensor cores with a two-stage
  cp.async pipeline over up to 128 KV splits, and dense weights are pinned in L2
  with evict_last hints while routed experts stream evict_first.

