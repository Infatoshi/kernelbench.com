comparison: >
  Same plan as the other single-launch entries (one persistent launch, int4
  dequantised in registers, absorbed MLA in latent space). Closest in design to
  Gemini 4 Argon (27.03x): 376 CTAs, software grid barrier, 128+nibble FMA
  GEMVs with the zero point folded once per group; Carbon adds tensor-core MLA
  and L2 residency hints. 28 grid barriers per step. Fable 5.2 (31.41x) runs its
  GEMVs on integer tensor cores.

