implication: >
  Read the cell as a second real megakernel from the same model: independent code, the
  same design choices, and within 2.3% of session 1 on the isolated regrade, which says the
  23x level is this model's, not one lucky session's. Its in-session numbers are
  contended by session 1's unlocked jobs and are not results. The stale tetra checkout
  visible to both sessions is a harness hole to close before the next release.
