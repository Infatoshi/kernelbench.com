      def _append_space(t):
          length, width = t.shape
          backing = getattr(t, "_decode_backing", None)
          if backing is None or backing.shape[0] <= length or backing._used != length:
              backing = t.new_empty(((length // 128 + 1) * 128, width))
          backing._used = length + 1
          view = backing[:length + 1]
          view._decode_backing = backing
          return view
