authenticity_reason: >
  Genuine single-launch persistent CUDA megakernel built with load_inline. Model.step()
  launches `decode(Params)` once per token with cudaLaunchCooperativeKernel
  (solution.py:802) on min(occupancy, 4) x SM-count CTAs of 256 threads, with
  __launch_bounds__(NT, 2) (solution.py:725), and runs all four layers inside it separated
  by cooperative-groups grid.sync() (44 per step counted from the source: 10 per KDA layer,
  14 for the MLA layer). Every phase is in the kernel: RMSNorms, int4 dequant inside
  mma.sync m16n8k16 split-K GEMVs over weights repacked once into fragment order in a
  load_state_dict post-hook, the short conv and KDA delta-rule update, the MLA projections
  with RoPE, absorbed MLA attention with per-64-row chunk softmax, ldmatrix-transposed value
  accumulation and a global log-sum-exp merge, the router and top-8, and the routed plus
  shared expert FFNs, with bulk L2 prefetch of the next weight stream. No CUDA graph, no
  torch.compile, no library GEMM, no eager fallback; the host only allocates outputs and
  scratch and passes a pointer table.

