  - "Tuning it measured (records 165-459): split-K group counts, register caps and CTA shapes compiled side by side, a fused per-tile MLA score, softmax and value path, bulk L2 prefetch of the next weight stream, 256-thread CTAs; at record 461 it reported Nsight Compute at 59% of peak DRAM throughput at ctx 2048."
  - "Why it stopped (records 554-607, 2:42 to 2:45 pm): an A/B of launch-bound caps (record 565) gave 249.5 against 255.7 us per step at ctx 2048 for __launch_bounds__(NT, 2); it applied that with a tidy-up of the state update (record 569), ran check.py, benchmark.py (23.03x in-run) and an nsys trace of 20 steps showing 20 decode launches, deleted or moved its scratch into tuning/, and ended 43 seconds after reading the benchmark. The reasoning is encrypted; the visible summaries read 'Verifying state carry / Preparing state-carry checks / Skipping extra verification' (record 575) and 'Cleaning up project files' (record 592). The jump from 19.95x to 23.03x in its last four minutes is mostly contention leaving, not the 2.4% kernel change."

