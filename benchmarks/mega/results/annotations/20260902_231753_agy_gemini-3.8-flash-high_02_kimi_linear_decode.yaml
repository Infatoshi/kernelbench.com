summary: >
  RTX PRO 6000 Gemini 3.8 Flash (high) cell (2.74x isolated regrade; in-run was
  2.75x). Genuine single-launch W4A16 decode megakernel, honestly parallelised
  in its GEMVs and serialised in its attention: one block per SM at 256 threads
  (about 12.5% occupancy), the KDA state update spills a 128-float per-thread
  array, and the whole MLA phase runs under blockIdx.x < 32 while each head
  streams the latent cache twice, so speedup decays 3.35x -> 2.73x -> 2.27x
  with context. Same-buffer overwrite on the box 2026-09-03, sole GPU owner:
