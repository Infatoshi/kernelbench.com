implication: >
  Publishable as the muse-spark-1.3 RTX PRO 6000 mega cell, and the first
  muse mega cell with fully correct KDA gating: the H100 cell's
  tolerance-masked dropped sigmoid is fixed here, confirmed by S=1.0000
  everywhere rather than inferred from tolerance headroom. Two readings to
  attach. The ticket barrier is a correctness assumption, not a style choice:
  a plain launch gives no co-residency guarantee, so this exact binary could
  deadlock on a smaller or busier GPU, and it deadlocked once in-session
  during development, which is what the two GPU resets were about. And it is
  SKU-locked: sm_120 gencode and #define'd model dims, so it builds only for
  this board. The agent's final summary is accurate in every checkable
  particular.
