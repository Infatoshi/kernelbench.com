implication: >
  A real megakernel result, but the KDA gating is not the reference op: beta
  enters the delta rule unsquashed (range about -2.3..2.2 instead of 0..1), and
  the per-tensor 0.98 cosine gate on a rank-1 update to a large random state
  passes it. Confirmed on the quiet H100 2026-09-03 08:38Z: with
  b = 1/(1+expf(-beta)) patched into h_kdarec and nothing else changed, check.py
  reports S=1.0000 on all six seed/ctx cases (was 0.9954-0.9974) and still
  PASSes, so the entire S residual is the dropped sigmoid. Decide whether a
  tolerance-masked math deviation counts as a bug for the board. Bench-level: tighten cos_sim for
  kda_state or add a direct gating check, and add ctx=16384 to check.py.
