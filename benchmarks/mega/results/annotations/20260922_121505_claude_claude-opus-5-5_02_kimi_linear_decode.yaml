implication: >
  Treat this as the new RTX PRO 6000 leader and as honest work. The 1.43x jump
  over GPT-6 Astra (24.80x) is really a 1.9-2.0x jump in absolute latency:
  0.159-0.187 ms/tok here vs Astra's 0.323-0.359 ms/tok. The tetra baseline
  (5.49-6.88 ms/tok) is also faster than the one Astra was graded against
  (7.65-9.27 ms/tok), so the speedup ratio understates the kernel gap. That
  cross-box comparison is from the two annotations, not re-measured. Where the
  time goes: a W4A16 decode token must read about 243-259 MB (227.7 MB of int4
  experts, attention weights and scales, plus 12.6 MB of KDA state and the
  latent cache). The kernel reaches 1.39-1.53 TB/s effective, near the 1.55 TB/s
  the agent measured as the practical DRAM ceiling, so it is at the bandwidth
  roofline rather than the launch or barrier roofline where earlier cells sat.
  Four design choices get it there. (1) Each of the 188 blocks runs 16 compute
  warps plus a 17th streamer warp, which walks this block's future reads
  (weights, KDA state, MLA cache) two phases ahead with real L2-filling loads,
  so DRAM keeps streaming through the 25 grid barriers instead of draining at
  each one. Streamer depth was tuned to 5 lines per lane (154 us vs 173 us at
  depth 8). (2) Routed experts are prefetched before routing is known: the
  router is applied to the layer input in the layer's first phase, the
  predicted top-8 is streamed, and a miss is streamed on demand once the exact
  top-8 is published. (3) Every int4 matrix is re-laid out once at load into
  4352-byte 64x128 items and split stream-K over all 3008 compute warps with
  fp32 atomics, so every phase load-balances across the whole GPU with
  fully-coalesced 16-byte streaming loads and a 2-instruction nibble dequant.
  (4) The absorbed MLA runs on bf16 mma.sync over up to 188 position chunks
  with bf16 partials. About 20% of each step's bytes come from ordinary L2
  carry-over between tokens (ncu: 191-202 MB DRAM per step at ctx 8192 vs 250
  MB logical). That is not pinning, and it is available to any chained-decode
  solution. Fidelity cost of the atomics: output cosine is not deterministic,
  near-tie router picks flip, and 1 of 10 probed seeds fails the 0.98 bar.
  baseline.py shows the same failure class on different seeds.

