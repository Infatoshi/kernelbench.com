authenticity_reason: >
  One `__global__` in the file (`kimi_step_kernel`, solution.py:1347) and one
  launch site (`cudaLaunchCooperativeKernel`, solution.py:1510), grid = one
  544-thread block per SM (188 blocks). There are 25 software grid barriers per
  token (`grid_sync`, solution.py:309-323; 6 per KDA layer x3 + 7 for the MLA
  layer and its MoE, solution.py:1387-1402). `step()` (solution.py:1644-1677)
  runs the following host work per token: shape/dtype asserts, a 20-entry
  pointer list, `torch.empty_like` for the output, and on a fresh cache only a
  `torch.empty` capacity buffer (solution.py:1638-1642). The copy of the caller's
  cache into that buffer happens inside the kernel (solution.py:1273-1281). No
  CUDA graph, no torch.compile, no memcpy/memset, and no eviction-priority or
  access-policy-window hints (grep for evict/accessPolicy/persisting is empty).
  Measured on GPU 2: torch.profiler over 6 steps (5 chained append-path steps +
  1 fresh-state copy-path step) recorded exactly 6 device events, all
  `kimi_step_kernel`, and 6 `cudaLaunchCooperativeKernel` calls. That is 1.00
  launches per step on both cache paths and satisfies `launches_per_step: 1`.
  Everything per token is inside the kernel: both RMSNorms, every int4
  dequant-GEMV (nibble -> float via `__byte_perm` into the mantissa of 0.5f with
  the group-128 zero point folded into one FMA per column,
  solution.py:372-388), the short conv + SiLU and window shift, the gated-delta
  S update, absorbed MLA with bf16 mma.sync flash-decoding over the 576-d latent
  cache and a cross-block combine, the cache append, router softmax + top-8 +
  2.446 renormalisation, 8 routed + 1 shared expert, and the residuals. The only
  weight transform is a one-time re-layout of the packed int4 bytes into
  4352-byte (64 col x 128 k) items at `load_state_dict` time
  (solution.py:1549-1557, 1581-1586). It is still int4 plus bf16 scales/zeros,
  and bf16 weights are never materialised. All 8 template files are
  md5-identical to template_files/ and to the canonical deck, and
  `template_mutated` is false.

