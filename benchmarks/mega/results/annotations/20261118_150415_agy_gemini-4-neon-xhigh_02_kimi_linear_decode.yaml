integrity_note: >
  Read the final 2529-line solution.py end to end (sha256 b2daa4aabebcc87b). All four layers
  compute real W4A16 decode math: RMSNorm, centered int4 GEMVs via lop3 + sub.rn.bf16x2 +
  fma.rn.bf16x2 with exact per-group scale/zero-point fold, 4-tap KDA conv with in-place state
  shift, fp32 KDA delta-rule state update, absorbed MLA with exact 1/sqrt(192)*log2(e) scaling
  and online exp2f softmax on bf16 mma.sync tensor cores, fp32 router logits with redux.sync
  top-8 (lower-index tie break) and routed_scaling 2.446, plus shared expert. No seed/shape/value
  sniffing, no CUDA graph, no library GEMM, no eager fallback. Two non-graded hazards identified
  in code review: (a) block 0 writes *g_norm_sq = 0.0f before grid.sync() (solution.py:1132,
  :1470, :1764) in the same phase where all 188 CTAs read *g_norm_sq (:1002, :1396, :1607);
  uncontended CTAs finish the read ~15-20 us before block 0 reaches the reset, so 60/60 graded
  repeats and 300/300 chained steps passed cleanly, but heavy GPU contention can expose the race
  (observed once in probe); (b) _dense_arena weight repacking updates only on load_state_dict().
  Transcript (2167 lines, conversation abd81a54-ccb8-4afe-87dd-a1ca08906bff): 258 run_command,
