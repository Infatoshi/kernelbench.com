summary: >
  Gemini 4 Neon (XHigh) wrote a single-launch cooperative SM120 CUDA megakernel (188 CTAs x 512
  threads) that scores 36.655x on Kimi-Linear decode (0.157 / 0.166 / 0.176 ms/tok at 2k / 8k /
  16k, geomean 6,010 tok/s), taking #1 overall ahead of Claude Opus 5.5 (35.34x). It unpacks
  centered [-8..+7] int4 weights directly into native SM120 bf16x2 FMA2 (lop3 + sub.rn.bf16x2 +
  fma.rn.bf16x2) with the zero point folded once per 32-element group, uses PTX release/acquire
  router barriers with redux.sync top-8 selection, runs FlashMLA on bf16 mma.sync tensor cores
  with cp.async KV pipelining and adaptive Blackwell persisting-L2 policies, and copies step-0
  KV caches inside the single cooperative launch. Verdict is interesting for intra-group bf16x2
  accumulation, an unguarded *g_norm_sq reset before grid.sync(), and load_state_dict-only weight
  repacking.

