authenticity_reason: >
  step() makes exactly one launch, rt["step"] -> kimi_mega<<<188, 1024>>>
  (solution.py:1350-1404); phases are separated by an in-kernel atomic grid
  barrier. torch.profiler on tetra GPU 1 over 6 steps (one fresh-cache copy step
  plus 5 in-place append steps) recorded exactly 6 kimi_mega(KArgs) device events
  and 6 launch API calls, so 1.00 launches per step on both cache paths
  (launches_per_step: 1). The only other device event was the probe's own
  h.clone(). The eager path (_step_eager) runs only when _fused_supported() is
  false (non-matching config or KIMI_EAGER=1); every graded shape takes the
  fused launch. The int4 weights are permuted once at first use into tile order
  (same 4-bit values, scale and zero inlined); no bf16 weight matrix is built.
  No CUDA graph, torch.compile or prebuilt quantized kernel.

