summary: >
  Fable 5.2 wrote one persistent 188-block kernel that runs the whole Kimi-Linear
  decode token: three KDA layers, absorbed MLA and the 64-expert MoE. It runs the
  int4 GEMVs on the integer tensor cores (mma m16n8k32 u8 x s8) by holding each
  activation as 16-bit fixed point with a scale per 64-element slab, split into
  two signed base-256 digit planes. The two products recombine exactly, so the
  math is W4A16 with exact integer accumulation, not an 8-bit activation
  shortcut. Attention weights are kept L2-resident and experts are streamed
  evict-first, with a speculative expert prefetch at short contexts. The agent
  itself warned that its 35x reading was inflated by GPU sharing and that the
  idle-GPU number is about 31x; the regrade agrees.

