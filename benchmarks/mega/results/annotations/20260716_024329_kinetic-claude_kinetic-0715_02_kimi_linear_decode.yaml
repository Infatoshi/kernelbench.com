withdrawn: |
  2026-11-16: withdrawn after the grader v3 replay (graded surface c522e2010e34) on tetra GPU 2,
  alone on the card with a GPU-use log. check.py now fails it: attention case seed 27 ctx 2048: out
  cosine 0.6444 < 0.98; the second run read 0.6665. Reason it stood: the pre-v3 check graded only a
  random MLA cache, where attention moves the output by about 0.1%, so an error in the attention
  path cost nothing.
  Root cause (probe on tetra, 2026-11-16): a shared-memory overflow. kimi_mega.py:620 (KDA) and :985
  (MLA) call load_sx_bf16(..., sx, 4096) into a 2304-float sx; smx and tp0 sit directly after it
  (:467-469), so tp0 scratch writes land in the activations the o_proj GEMV is reading. It is wrong
  and a race: repeats of one case differ by up to 0.19, and even the plain graded cache reads 0.95
  to 0.9996 from run to run (its July check passed at 0.984 to 0.993). Moving both loads to h1x
  reads 0.9996 at every cache gain with zero spread.
  The published 18.088 (no grading host recorded, pre-v3 check, verdict clean) is voided, not
  re-measured; the raw value is kept in result.grader_v1.json and under regrade.prior_regrade in
  result.json. Original audit follows unchanged.
