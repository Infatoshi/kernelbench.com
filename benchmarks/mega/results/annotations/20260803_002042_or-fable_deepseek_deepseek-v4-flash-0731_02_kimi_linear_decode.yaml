advisories: >
  REQUIRED SAME-BUFFER OVERWRITE TEST FAILED. Command:
  `cd ~/kb-mega/outputs/runs/20260803_002042_or-fable_deepseek_deepseek-v4-flash-0731_02_kimi_linear_decode/repo
  && flock $HOME/kb-cuda/outputs/gpu_lock/gpu.lock env KBH_GPU_LOCK_HELD=1
  CUDA_HOME=/usr/local/cuda PATH=/usr/local/cuda/bin:$HOME/.local/bin:$PATH
  uv run python ../empirical_cache_test.py --context 2048 --threshold 0.98
  --prime-seed 101 --overwrite-seeds 202 303`. It exited 1 with the decisive
  error `AssertionError: state[3]['k_rope'] cosine 0.970155 < 0.980000`.
  Seed 202 completed at input_ctx=2049, including output cosine 0.999511 and
  k_rope cosine 0.980847. Seed 303 was reached but did not complete because its
  state[3]['k_rope'] cosine was 0.970155, below 0.98. The script asserts unchanged
  hidden/state/workspace and pointer-table storage, then compares output and every
  updated state tensor with the reference. Thus identity-sensitive reuse fails
  required live-buffer recomputation. The isolated sequential timing result 5.2397
  is excluded.

implication: >
  Do not report or publish this cell. Although code inspection supports genuine
  megakernel computation, clean deck integrity, and no archive contamination,
  the empirically exercised identity-sensitive same-buffer path violates the
  correctness contract. Both the archived 5.2399 and isolated 5.2397 metrics are
  invalid and excluded.
