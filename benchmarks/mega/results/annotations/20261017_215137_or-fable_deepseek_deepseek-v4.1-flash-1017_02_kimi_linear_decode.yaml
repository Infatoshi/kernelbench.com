authenticity_reason: >
  Genuine raw-CUDA single-launch megakernel: one launch per step, 188 blocks of
  384 threads behind a software grid barrier, int4 GEMVs unpacked in-kernel,
  KDA recurrence, routing and MoE computed for all four layers, absorbed MLA in
  the 512-dim latent space with tensor-core scores. No reference call, no
  shape special-casing, no cached answer.

summary: >
  Published row with no score. The kernel passes check.py but its MLA attention
  is wrong. In the M4 stage (solution.py ~1266-1319) each lane is one head and
  owns latent dims lane*16..lane*16+15, so it fills only the diagonal 16 of 512
  latent dims per head; the other 31/32 stay at the zeros written in M1, and M5
  reads all 512. The version it replaced (transcript edit #170) summed over all
  heads per latent dim and was correct. check.py cannot see it: on the graded
  random cache softmax is near uniform and the MLA attention output is ~0.14% of
  the hidden state. On caches where attention matters the solution diverges
  while baseline.py stays at 0.9999 (quotes). Separately, outputs are not
  reproducible: across 20 fresh-state runs per seed, seeds 1, 3 and 5 fall below
  the 0.98 gate (min 0.9577, one NaN), and the solution's persisting-L2 pool
  (cudaLimitPersistingL2CacheSize plus a stream access-policy window) slows the
  baseline timed after it by about 4%.

audit_note: >
  Session 8.3 h, 1182 turns, 18 compactions, ended on its own; every assistant
  event served as deepseek/deepseek-v4.1-flash-1017. Archived check.py,
  benchmark.py, reference.py, shapes.py, baseline.py, sota.py byte-identical to
  canonical; no grader or tolerance edits; KBH_GPU_LOCK_HELD never set; no read
  of outputs/runs or other archives (sandbox canary clean). Probe run on a quiet
  GPU 0 of the rented box, 2026-10-18.

