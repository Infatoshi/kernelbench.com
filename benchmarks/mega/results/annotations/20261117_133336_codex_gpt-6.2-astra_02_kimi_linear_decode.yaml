probe_note: >
  audit/astra_mega_probes.py (copied into this archive with its log audit/probes.log)
  copies solution.py and the deck's reference.py, baseline.py and shapes.py into
  audit/work on tetra, builds into its own extension dir, and prints one PASS/FAIL line per
  gated check. Run 5:28:38 to 5:29:28 pm CST 2026-11-17 on tetra GPU 2 under an
  overnight-compute lease (agent audit-astra62-mega), nvidia-smi showing no compute
  process on GPU 2 before the start. P1 token rewritten in the same buffer: cos(out1,out2)
  -0.0060, cos(ref,sol) 0.999994. P1s every state tensor rewritten in place:
  cos(before,after) 0.1355, cos(ref,sol) 0.999976. P1r the returned cache (storage reused
  in place) rescaled x60 on 64 rows, then stepped: 0.999988. P1w-b every weight rewritten
  at the same addresses through load_state_dict: cos(out_old,out_new) 0.0212, cos(ref,sol)
  0.999970; P1w-a (INFO) a raw in-place copy without reload is not seen (0.3605 vs old,
  -0.0019 vs new reference), the documented load-time repack. P2 6 steps = 6 `decode`
  kernels and 6 cudaLaunchCooperativeKernel calls, no memcpy, memset or graph. P3
  attention-heavy caches at ctx 2048 and 8192 (64 hot rows x10/x30/x60/x120, whole cache
  x30/x60, 16 hot rows x30, rope-only x30, one row x200): 18/18 PASS at cos(ref,sol)
  0.999944 to 0.999995, with attention moving the output by up to 0.881 (1 -
  cos(ref, ref with no history)); baseline.py reads 0.999404 to 0.999934 on the same cases.
  P5 every returned state tensor at 0.99999 or better, cache 8193 rows. P6 seeds 3-6 x ctx
  0, 1, 127, 128, 129, 1000, 4097, 16384: 32/32, min 0.999991. Past the graded range (64
  hot rows x60): ctx 32768 / 40000 / 65536 / 131072 read 0.999947 / 0.999945 / 0.999953 /
  0.999951 while baseline.py reads 0.969 / 0.956 / 0.969 / 0.966, so there is no cache
  length limit. P8 two steps from the same returned prefix, then continuing branch A:
  0.999994 / 0.999981 / 0.999974. P9 five fresh runs bitwise identical. P4 6-step chains:
  the random cache at ctx 2048 holds 0.99985 at step 6 (baseline.py 0.96556); the
  hot-cache chain (ctx 8192, 64 rows x60, seed 21) printed FAIL, falling to 0.98340 at step
  4 and 0.96658 at step 6, with baseline.py on the same chain at 0.98188 and 0.96263. A
  follow-up (audit/chain_diag.log, 5:33:48 pm, same lease rules) showed the reference's
  own top-8 router margin on those chains at 0.0 to 0.03 at most steps (check.py rejects
  cases under 0.025), so a bf16-level difference flips an expert and the chain diverges:
  over seeds 21-26 this solution ends step 6 at 0.967 to 0.999, session 2's at 0.968 to
  0.998 and baseline.py at 0.963 to 0.998, and each of the three drops below 0.98 on some
  seed (this one on seeds 21 and 22, session 2 on 22, baseline.py on 21). That FAIL is
  router-tie chaos on a chained trajectory, which check.py's docstring excludes, not a
  kernel error; every single-step probe holds 0.9999.

notes:
  - "Field (RTX PRO 6000, grader v3 numbers from DEVLOG 2026-11-16): Opus 5.5 35.34, Sonnet 5.5 31.65, Fable 5.2 31.01, Gemini 4 Carbon 24.68, then this run at 23.48 and the second GPT-6.2 Astra session (20261117_133406) at 22.93, ahead of GPT-6 Astra Pro 20.87."
  - "Design (record 63, 1:38 pm): it chose the absorbed MLA path from the start, keeping the cache compressed and moving the key projection onto the query and the value projection after the latent reduction."
  - "Recovery, MoE precision (records 141, 212): the first build passed with one random case at 0.9879; it traced that to bf16 rounding of the SiLU product changing an expert pick and carried the rounding residual into the down projection's second MMA column, after which the case printed 1.0000."
  - "Measured and reverted: a flash-style fused attention variant (records 256-272), a first 256-thread layout that ran 579 us per step (records 272-289), a WMMA cache-tiling variant and 256-row chunks (records 379-395), and a 512-thread single-CTA-per-SM layout (records 497-514); a geometry sweep over CTAs per SM (records 449, 493) picked 2 per SM at 256 threads, 252 us per step at ctx 2048 against 273 us before."
  - "Verification it did itself: torch.profiler showing one decode kernel per step (record 378), a state-carry test against the reference over several steps including a forked prefix (records 469, 559), and the official check and benchmark on the cleaned final file (records 514, 545)."
  - "Why it stopped (records 527-585, 2:40 to 2:48 pm): after the 256-thread, two-CTA layout won the sweep it ran clean-up formatting, the official check, its state test and benchmark (23.64x in-run), a last profile, deleted its scratch, and ended. The reasoning is encrypted; the visible summaries read 'Verifying production kernel / Checking GPU contention / Assessing kernel compliance' (record 551) and 'Cleaning up' (record 576). Its largest gain came last: 18.75x at its 2:28 pm benchmark, 23.64x at its 2:47 pm benchmark, and it ended 55 seconds after reading that number without trying to build on it. Part of that jump is contention, not kernel: its own globaltimer sweep put the change at 273.5 to 252.0 us per step at ctx 2048 (about 8%, records 449, 493), while every in-session benchmark.py ran unlocked next to session 2's jobs (session 2's benchmark at 2:41 pm read 19.95x while this session's final benchmark was running)."

