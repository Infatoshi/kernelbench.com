authenticity_reason: >
  Genuine single-launch persistent CUDA megakernel built with load_inline. Model.step()
  launches `decode` once per token with cudaLaunchCooperativeKernel (solution.py:822) on
  min(occupancy, 2) x 188 CTAs of 256 threads (solution.py:812, __launch_bounds__(T, 2)),
  and all four layers run inside it, separated by cooperative-groups grid.sync() (32 per
  step counted from the source: 7 per KDA layer, 11 for the MLA layer). Every phase is in
  the kernel: RMSNorms, int4 dequant inside mma.sync m16n8k16 GEMVs (weights repacked once
  into MMA fragment order in a load_state_dict post-hook, never dequantized to bf16 in
  memory), the short conv, the KDA gated delta-rule update, the MLA projections with RoPE,
  absorbed MLA attention over every cached row with chunked softmax, the router and top-8,
  and the routed plus shared expert FFNs. No CUDA graph, no torch.compile, no library GEMM,
  no eager fallback; the host side only allocates outputs and scratch and passes pointers.

# Points are in-session benchmark.py results (minutes since 1:33:37 pm CST, the
# time each result was read). The session's GPU jobs did not hold the GPU lock and
# ran next to session 2's, so every in-session number is contended (harness_note).
