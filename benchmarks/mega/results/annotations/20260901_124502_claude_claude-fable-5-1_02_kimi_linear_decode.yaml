summary: >
  Rerun of 20260901_120240 on Claude Code 2.1.257 (model recognized: 1M
  context). Output cap was the CLI's model-table default of 64000 because the
  first-party `claude)` harness block did not export
  CLAUDE_CODE_MAX_OUTPUT_TOKENS (the CLI allows up to 128000 for this model).
  Same failure one level up: after 21 turns (5250 s, 389k output tokens of which 386k were
  thinking), a single max-effort reasoning turn exceeded 64000 output tokens
  while the agent was still in recon (torch/triton probe, reference.py
  timing, a baseline bench script). terminal_reason=api_error, no solution.py.
  No rate-limit event fired (five-hour window peaked at 78%, status allowed).

quotes:
  - file: transcript.jsonl
    lines: [3412]
    label: "Terminal API error at the model's 64k output ceiling"
    text: |
      API Error: Claude's response exceeded the 64000 output token maximum. To configure this behavior, set the CLAUDE_CODE_MAX_OUTPUT_TOKENS environment variable.

implication: >
  Exclude from the board. At effort max on this problem claude-fable-5-1
  produces single reasoning turns longer than 64000 output tokens early in
  recon, and Claude Code -p treats that as a terminal error rather than
  continuing. The July claude-fable-5 max run on the same problem never hit
  this in 367 turns at the same default. Fix: run_hard.sh `claude)` block now
  exports CLAUDE_CODE_MAX_OUTPUT_TOKENS=128000; the xhigh rerun
  (20260901_142726) made at the old default died the same way, so effort tier
  was not the lever.
