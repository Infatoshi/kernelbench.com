authenticity_reason: >
  One __global__ built with load_inline, launched once per step() with
  cudaLaunchCooperativeKernel (solution.py L1065), blocks = SM count (132 on
  this H100) x 256 threads, 14 grid.sync() barriers per layer set. step()
  (L1215-L1238) issues no other GPU op: it reads a shape, allocates two empty
  cache tensors, calls launch_megakernel once, rebinds state[3]. Inside the one
  kernel: every int4 dequant-GEMV (compute_gemv_col L241, per-group asymmetric
  dequant folded into the accumulator, bf16 weight never materialised), both
  RMSNorms, the short causal conv with in-place window shift, the KDA
  gated-delta state update, MLA absorbed-latent attention over the full cache,
  the cache append, the MoE router + top-8 + 9 expert SwiGLU FFNs, and both
  residual adds. No CUDA graph, no torch.compile, no per-op loop. Static
  counts: cuda_global 1, cuda_inline 2, triton_jit 0, all four tripwires false,
  no forbidden imports, no sidecar modules. framework.txt = cuda_raw.

summary: >
  H100 SXM5 Gemini 3.8 Flash (high) cell (H100 board) (2.07x isolated regrade; in-run was
  2.11x). A real, correct, single-launch W4A16 decode megakernel that leaves
  most of the GPU on the table: one block per SM at 256 threads (about 12.5%
  occupancy) with one thread per output column, and the MLA phase runs on only
  32 of 132 blocks while each head re-reads the whole latent cache twice, so
  the speedup decays 2.76x -> 2.13x -> 1.51x with context (3.37/4.54/6.94
  ms/tok, roughly 2% of the H100 bandwidth roofline). Same-buffer overwrite on
  the box 2026-09-03, sole GPU owner: primed step cos(ref,sol)=1.0000;
  continuation step with the hidden buffer overwritten in place (same
  data_ptr) cos(out1,out2)=0.0346 and cos(ref,sol)=0.9958; fresh state with a
  third token cos(out2,out3)=-0.0338 and cos(ref,sol)=0.9999. Transcript:
  outputs/runs held only this run's own directory (bwrap tmpfs), no results/,
  leaderboard or DEVLOG reads, no env or key printing; template files
  unchanged. The agent self-terminated at 27 minutes on an unlimited budget
  after two check/benchmark cycles. Separately written from the same model's
  RTX PRO 6000 kernel (2.74x there).

