        unsigned g = 0;
        if (threadIdx.x == 0) {
          if (d.cnt != nullptr) { while (ld_acquire(d.cnt) < d.tgt) { __nanosleep(32); } }
          if (qcnt != nullptr) g = atomicAdd(qcnt, 1u);
          sm.t_wait = gtimer();
        }
        __syncthreads();
