authenticity_reason: >
  One __global__ megakernel (solution.py line 1253) built from the embedded
  CUDA source via torch cpp_extension load_inline(), launched exactly once
  per step() as a genuine cudaLaunchCooperativeKernel (line 1366) of 188
  blocks x 512 threads on the current torch stream, with TORCH_CHECK on the
  launch status (line 1367) so block co-residency is validated by the CUDA
  runtime on every launch. Phases do not use grid.sync(): a global atomic
  task queue feeds phase-ordered tasks that spin on hand-rolled
  acquire/release dependency counters (ld.acquire spin in wait_dep, lines
  357-366; red.release deferred signals, lines 343-348; atom.acq_rel, lines
  349-353). step() (lines 1610-1654) issues no other GPU work: one
  torch.empty_like for the output, a cache-capacity realloc only when the
  incoming MLA cache is foreign or full (the ingest copy runs as K_COPY tasks
  inside the same launch, lines 686-705), and the single extension call
  (line 1650). Inside the launch: both RMSNorms with fp32 residual staging,
  every int4 dequant-GEMV on mma.m16n8k16 tensor cores from a repacked
  fragment layout with the 2^23 magic-number decode and per-group
  asymmetric (s,z) epilogue (lines 585-586), KDA short convs with in-place
  window shift, softplus decay gate, sigmoid beta (line 731), the fp32
  gated-delta S update, o_proj, absorbed MLA with flash-decoding split over
  the 576-d latent cache and in-kernel combine, MoE router plus top-8 plus
  8 routed experts plus the shared expert with per-expert dependency
  counters, and the final residual writeback. No CUDA graph, no
  torch.compile, no Triton; framework label cuda_raw. Gencode sm_120 only.

summary: >
  Claude Fable 5.1 through OpenRouter (or-fable harness), max effort,
  unlimited budget, RTX PRO 6000: a single cooperative persistent megakernel
  with a task-queue scheduler and mma tensor-core int4 dequant-GEMVs. Isolated
  sequential regrade on the same box 2026-09-04 (clocks reset with nvidia-smi
  -rgc first): 22.9457x geomean over the untouched baseline (23.01x / 22.80x /
  23.02x at ctx 2048 / 8192 / 16384, 0.330-0.401 ms/tok); the contended
  in-run grade was 22.9889. Overwrite probe (probe.log): primed step matches
  the reference at cos 1.0000, a continuation step with the token overwritten
  in place produces a different output (cos(out1,out2)=0.0335) that still
  matches the reference at 1.0000, and a fresh state at seed+1 matches at
  1.0000, so nothing is served from a cache. Same design lineage as the
  model's native 15.84x run two days earlier, extended in-session from
  16.45x to 22.99x across six benchmarks; the final +5.3x came from deferring
  the next-task grab until after each dependency spin. check.log shows
  S=1.0000 and cache=1.0000 on all six seed/ctx combos, out 0.9963-1.0000
  against the 0.98 gate. All 8 template files byte-identical, no foreign
  reads, no clock commands, one pip install of ninja, zero lock contention,
  no key strings in the archive. Session ended at 2h10m on an upstream
  "stream closed before completion" API error while the agent was still
  optimizing, not on a deliberate stop; the graded file is the last
  self-measured version (self-measured 22.9889 at 23:58Z, contended grade 22.9889).
  OpenRouter cost $41.74 (500k output tokens, 20.2M cache reads).

