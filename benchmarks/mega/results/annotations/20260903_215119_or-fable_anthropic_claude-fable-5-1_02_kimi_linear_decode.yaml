implication: >
  Publishable as the anthropic/claude-fable-5-1 RTX PRO 6000 mega cell: the
  isolated regrade reproduced it (22.9457 vs 22.9889 contended, -0.2%). The 23x is a scheduler number as much as a
  GEMV number: the mma dequant core took the design to 19.2x and the final
  jump came from not letting dependency-waiting blocks hold queued tasks,
  so the cell measures in-kernel dataflow engineering, not just tensor-core
  int4. The multi-step state path (in-place S, conv-window shift,
  parity-reset counters, capacity-buffer cache views) is exercised for up to
  99 chained steps per timed shape but only graded at step 1; the
  same-buffer overwrite probe and the chained-step probe both passed in the
  regrade (probe.log). The session was cut by an OpenRouter stream
  error while the agent was still chasing stragglers, so 23x is a floor for
  the design, not a ceiling; harness_exit_code 1 is that error, not an agent
  failure. Co-residency is API-guaranteed by the cooperative launch, so the
  plain-launch deadlock caveat on the muse cell does not apply, but the
  binary is SKU-locked (sm_120 gencode, grid = SM count, compile-time dims).
