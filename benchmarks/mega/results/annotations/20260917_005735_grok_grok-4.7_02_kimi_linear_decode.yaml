measurement_note: >
  Run executed 2026-09-17 on tetra, a bare-metal box with two RTX PRO 6000
  Blackwell Workstation Edition cards, pinned to GPU 1 (KBH_GPU=1) while GPU 0
  carried an unrelated fine-tuning job. Five agents (mega 02, cuda 01-04)
  shared GPU 1 during the sessions, so the in-run 5.6520 is contended; the
  published 6.3791 is the isolated sequential regrade on GPU 1 with the
  canonical deck and no other compute process on that GPU. ncu was available
  to the agent through a sudo shim (KBH_NCU_BIN) because
  RmProfilingAdminOnly=1 could not be cleared without a driver reload;
  gpu_lock.log records whether it was used.

authenticity_reason: >
  One `__global__` in the file (`kimi_mega_kernel`, solution.py:823-824) and one
  launch site (`cudaLaunchCooperativeKernel`, solution.py:1153), with 72
  `grid.sync()` phase barriers per token (35 `GSYNC()` sites, solution.py:699,
  walked 4 times through the layer loop: 3 KDA passes + 1 MLA pass + 4 MoE
  tails). `step()` (solution.py:1386-1417) writes device pointers into a CPU
  int64 pack tensor, calls the extension once, and re-slices two cache views;
  no `torch.empty`, no copy, no CUDA graph, no `torch.compile`, no per-op loop.
  Everything per token is inside the kernel: both RMSNorms, every int4
  dequant-GEMV with the group-128 asymmetric zero point folded into the FMAs
  (the bf16 weight is never materialised), the KDA short conv + SiLU with
  in-place window shift, the gated-delta S update, absorbed MLA over the 576-d
  latent cache with a grid-parallel softmax and cross-CTA context reduction,
  the in-kernel cache append, router + top-8 + 8 routed + 1 shared expert, and
  the residuals. Measured, not inferred: torch.profiler over 5 warm steps on
  GPU 1 recorded exactly 5 device events, all `kimi_mega_kernel(Pack)` - 1.00
  launches per step, zero memcpy, zero memset, satisfying
  `constraints.launches_per_step: 1`. All 8 template files are byte-identical
  to the canonical deck (md5-checked against
  benchmarks/mega/problems/02_kimi_linear_decode and against the run's own
  template_files/), and `template_mutated` is false in result.json. The
  `codegen` advisory tripwire does fire - `_ext()` writes a .cu and shells out
  to nvcc (solution.py:1180-1191) instead of using `load_inline` - but that is
  ordinary kernel building, not an escape hatch: the artifact it builds is the
  one cooperative kernel.

probe_note: >
  Probe ran on tetra GPU 1 in the bench venv (`uv run --no-sync`), solution.py
  staged out of the repo into /tmp with its cached .so (kernel digest
  b9e6d45ca9f2039f). (A) Same-buffer token overwrite is honoured: with the
  token buffer overwritten in place at the same data_ptr (0x73f46b9f9400),
  cos(out1,out2) is 0.007278 for the solution against 0.007287 for the
  reference, on inputs whose own cosine is 0.003327; outputs were cloned before
  comparison because `step()` returns one of two persistent buffers
  (solution.py:1388-1391). (B) Same-buffer MLA latent-cache overwrite is also
  honoured: swapping the fed c_kv/k_rope contents in place moves the reference
  by cos 0.999993 and the solution by 0.999995 (too small to discriminate at
  ctx 2048), so the probe was sharpened - scaling the fed cache by 30x in place
  at the same data_ptr moves the reference to cos(out1,out2) 0.978054 and the
  solution to 0.978143, i.e. the `same_c`/`same_k` pointer gate
  (solution.py:445-446) ingests the caller's cache every time and never reuses
  a stale one. cos(ref,sol) stayed 0.99996 / 0.999957 on every variant, and a
  repeat call with identical inputs reproduced bit-for-bit (cos 1.0).

summary: >
  Grok 4.7 built a genuine single-launch cooperative megakernel for the
  Kimi-Linear decode block in 63 minutes: in-kernel int4 dequant-GEMVs, short
  conv, gated-delta recurrence, absorbed MLA with a grid-parallel softmax, and
  the full 64-expert MoE, all behind one `cudaLaunchCooperativeKernel`.
  torch.profiler confirms 1.00 launches per step. Correctness is perfect
  (1.0000 on output, KDA state and MLA cache across all six check cases) and
  the templates are untouched. It is simply slow for this problem - 5.65x
  contended - and it stopped after one official benchmark.py run.

