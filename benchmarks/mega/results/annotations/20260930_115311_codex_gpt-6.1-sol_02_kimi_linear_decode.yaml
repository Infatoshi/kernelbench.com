static_probe_note: >
  Reading the code ahead of the probe: there is no output, weight-pack or graph
  cache. Every layer reads weights, scales and zeros live through the pointer
  table, the hidden input is read from the caller's buffer each step, KDA state
  is updated in place in the caller's tensors, and the MLA cache is copied in
  full into a fresh (L+1)-row tensor every step (real work, about 17 MB at 16k
  context). The only identity dependence is the pointer table, rebuilt on
  load_state_dict and on .to()/_apply; reassigning a buffer attribute directly
  would leave a dangling pointer, which no graded path does. The barrier counter
  is monotonic and never reset; int32 wrap is far beyond any graded run (on the
  order of 3e5 steps). Expect the probe to show cos(out1,out2) low and
  cos(ref,sol) at gate.
comparison: >
  Same plan as the leaders (Opus 5.5 35.46x, Fable 5 35.43x, Sonnet 5.5 32.13x):
  one persistent launch per token, int4 weights dequantized in-register, KDA
  delta-rule updates and absorbed MLA attention in latent space. The 7x gap is
  implementation depth, not approach: Sol's GEMVs are Triton FMA reductions over
  128-row groups at 255 registers and 12.5% DRAM throughput (its own ncu), with
  no tensor cores, no shared-memory weight staging, a full KV-cache copy each
  step, and serial single-CTA phases (RMSNorm, router top-8). It is the first
  submission that passed check.py, from a 17-minute session. GPT-6 Sol scored
  0.959x on this problem.
