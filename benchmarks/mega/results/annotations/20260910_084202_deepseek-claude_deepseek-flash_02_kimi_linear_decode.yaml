measurement_note: >
  Run executed 2026-09-10 on a Verda 1RTXPRO6000.30V.CC confidential-computing
  spot box (kb-ds41) with up to 8 concurrent agents sharing the one GPU, so
  every in-run timing is contended. Three numbers exist for the final kernel:
  in-run 19.6675, isolated sequential regrade on the same CC box 19.9455, and
  the published isolated sequential regrade 17.1008 on a separate non-CC
  1RTXPRO6000.30V on-demand box (kb-ds41-rg, 2026-09-11, canonical deck, GPU
  otherwise idle). The CC box has an intrinsic event-timing floor: the
  harness's own time_fn on a null kernel read 42.4 us quiet (43.6 us loaded,
  bare event pair 21.7 us) against 8.3 us on the non-CC board (bare event pair
  3.5 us), so CC-box timings are not comparable with the rest of the RTX PRO
  6000 board. ncu was unavailable on the CC box (confidential-computing mode
  blocks Nsight Compute).

authenticity_reason: >
  One `__global__` in the file (`kimi_forward`, solution.py:338) and one launch
  site (`cudaLaunchCooperativeKernel`, solution.py:1094), 19 `grid.sync()` phase
  barriers, sm_120. Everything per token is inside it: both RMSNorms, every int4
  dequant-GEMV with the group-128 asymmetric zero point folded into the FMAs (the
  bf16 weight matrix is never materialised), the KDA short conv + SiLU with
  in-place window shift, the gated-delta S update, absorbed MLA over the 576-d
  latent cache with flash-decoding splits and a cross-CTA softmax merge, the
  in-kernel cache append, router + top-8 + 8 routed + 1 shared expert, residuals.
  `step()` (solution.py:1496-1531) only does host-side pointer bookkeeping and
  calls the extension once: no `torch.empty`, no copy, no CUDA graph, no
  `torch.compile`, no per-op loop. The `data_ptr` comparison at solution.py:1513
  gates MLA cache ingest only, never output reuse. All 8 template files are
  byte-identical to the deck and `template_mutated` is false.

probe_note: >
  Probe (probe_mega.py, mega02_v3.log): same-buffer token overwrite is
  honoured (cos(out1,out2) -0.015 for the solution vs -0.007 for the
  reference; the solution returns one persistent output buffer, so the probe
  clones it, an earlier probe revision compared that buffer to itself and
  printed a false cos=1.000000). Fresh state at seed+1 in the same process:
  cos(ref,sol)=0.9997. The carryover signature reproduces directly: primed
  step out 0.9997 / S 1.0000, the next step on the same state out 0.9799 / S
  0.9877. A 6-step autoregressive chain, each model on its own tokens, drifts
  to out cos 0.02 and S cos 0.49 by step 6 at ctx 2048 and 8192; part of that
  is ordinary bf16 chaos amplification, no same-dtype baseline was run, so the
  chain is reported, not scored.

summary: >
  DeepSeek V4.1 Flash built a real single-launch cooperative megakernel for the
  Kimi-Linear decode block: int4 dequant-GEMVs in registers, short conv,
  gated-delta recurrence, absorbed MLA, full MoE. Fast and honestly earned, but
  it computes the wrong answer inside the 0.98 cosine gate: a persistent
  atomicAdd accumulator is never zeroed, so every KDA layer inherits the previous
  one's activations.

