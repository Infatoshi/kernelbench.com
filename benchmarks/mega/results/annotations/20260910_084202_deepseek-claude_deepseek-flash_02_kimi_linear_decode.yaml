implication: >
  Read this cell as a fast megakernel with a fidelity caveat, not as a hack. The
  speed is real and the defect buys none of it: `P.raw` (solution.py:1408) is a
  persistent atomicAdd accumulator that nothing zeroes (solution.py:391-401) while
  the conv pass rewrites every element of it (solution.py:450-470), so from the
  second KDA layer of the first token onward each layer's q/k/v/gate carries the
  previous layer's activations. Zeroing it costs nothing: the conv pass already
  touches every element. check.log:6-11 shows the signature, `S=1.0000` on the
  first launch and 0.9855-0.9888 on the five that follow. Two more fidelity slips
  ride along: `2.5f` against the reference's `routed_scaling = 2.446`, and
  `moe_norm` on the MLA block, hidden because the deck initialises every norm to
  ones. It would break on real weights. This is the worst-fidelity passing cell on
  the problem (every other recent clean cell on this GPU reports 1.0000 across the
  board), and `benchmark.py` gates only `out` at seed 7, so the state error never
  reaches the scoring path. Also SKU-locked and unguarded: `cap = G * 96`
  (solution.py:1400) with `LRMAX 96` caps context at 18048 tokens on this 188-SM
  part with no bounds check; on a 132-SM H100 the ctx-16384 shape would write past
  `ckv_pad`. The overwrite probe and the isolated regrade have since run (probe_note
  above): the carryover shows up as out 0.9997 on the first launch and 0.9799
  on the next step of the same state, and the published 17.10x is the non-CC
  regrade.
