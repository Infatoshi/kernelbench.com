authenticity_reason: >
  torch.profiler on one steady-state decode step (anvil GPU 1, RTX PRO 6000
  Blackwell) shows EXACTLY ONE device event: mk::megakernel(mk::Params),
  351.9us self device time, and exactly one CPU launch API call,
  cudaLaunchCooperativeKernel. Zero other kernels, zero memcpy/memset. The
  single __global__ (load_inline, 376 blocks = 2 per SM x 188 SMs, 256
  threads, 24576 B dyn smem, __launch_bounds__(256,2)) is a persistent
  work-queue dataflow kernel: one atomic ticket counter hands out ~4.7k items
  (n_items 4747 at ctx 2048) in topological order across all four layers;
  dependencies are per-tile arrival counters (ld.acquire spin + atomicAdd
  release), not grid barriers, so phases overlap; split-K GEMV tiles write
  fp32 partials and the last-arriving split (atomic ticket) runs the fused
  epilogue (residual, SiLU*up, RoPE, cache append, router partials); the last
  block out zeroes the counters so no memset launch is needed. Inside it:
  every int4 dequant-GEMV (4 B/lane, 8 nibbles -> 8 FMAs, per-group
  asymmetric dequant folded into a per-16-row epilogue, bf16 weight never
  materialised), short conv + SiLU, KDA gated-delta state update in place,
  MLA absorbed-latent attention (flash-decoding chunk partials + combine),
  MoE router + top-8 + 9 expert FFNs, RMSNorms, residuals, and the MLA cache
  append (item_kva writes row pos of the Model-owned capacity buffer; a
  foreign cache is ingested by copy inside item_attn). step() only builds a
  CPU int64 pointer table and calls mk_step; the returned state holds views
  (no torch.cat, no eager op). No CUDA graph, no torch.compile, no per-op
  loop. megakernel_evidence.py: 1 cuda_global, 0 triton_jit, tripwires
  graph/compile/codegen/obfuscation all false, no forbidden imports, no
  sidecar modules. framework.txt = ptx (inline asm for ld.acquire /
  globaltimer / L2 prefetch).

summary: >
  Manual audit (solution.py end-to-end + transcript + empirical GPU recompute
  test + launch-count profile + template diff + seed sweep), plus a
  sequential isolated regrade on anvil GPU 1 as sole owner
  (scripts/regrade_sequential.sh, 2026-09-01T18:40-06:00): in-run 15.8199 ->
  regraded 15.8402 (+0.1%), 0.344/0.388/0.431 ms/tok; the contended
  originals are kept in result.json.regrade and *.contended.log. The 15.84x
  is real and the megakernel is genuine: one cooperative persistent kernel per
  step(), the same design class as the July Fable 5 18.71x cell, here with a
  work-queue + arrival-counter dataflow instead of grid barriers. Lint
  FLAGGED [HACK] "output memoization @L1473: data_ptr() ==" -- a false
  positive: that check only decides whether the incoming MLA cache is the
  Model's own capacity buffer (append in place) or a foreign one (ingest
  inside the kernel); it never gates output reuse. EMPIRICAL RECOMPUTE
  (~/audit_ws/audit_recompute_0901.py on anvil GPU 1): loaded the archived
  solution, ran a step, overwrote the SAME buffers in place (hidden, KDA S +
  cq/ck/cv windows, MLA c_kv/k_rope; every data_ptr unchanged, c_kv aliasing
  the capacity buffer), re-stepped: cos(o1,o2) = -0.017682 (output changed
  completely), cos(o2, reference on mutated inputs) = 0.994407, KDA S vs ref
  1.000000 / 0.999998 / 0.999997, MLA c_kv 0.999785, k_rope 0.999792 --
  recompute, not a stale lookup. Magnitude: profiled 351.9us/step and 32-step
  wall 342/385/427 us/tok reproduce the archived 344/390/430; weight + state
  + cache traffic is 243/251/260 MB/tok so the bandwidth floor at 1.8 TB/s is
  135/139/144 us -> the kernel runs at 0.39/0.36/0.34 of roofline, far from
  lookup-fast. Templates: all 8 problem files byte-identical to
  problems/02_kimi_linear_decode (cmp), template_mutated=false. Numeric
  stress is N/A by design for this problem (src/eval/numeric_stress.py
  declares no cases for the mega deck; check.py has no stress hook and is
  unmodified); correctness is cosine on output + KDA S + MLA cache, 3 seeds x
  ctx {2048,8192}, check.log 1.0000/1.0000/0.9964, plus benchmark.py's seed-7
  gate per shape. Contamination: run_hard.sh bwrap sandbox (outputs/runs,
  results/, hard, v3, public, ~/.claude/projects tmpfs'd, DEVLOG ro-bound to
  empty). Every outputs/runs reference in the transcript is the run's own id
  except one: at transcript line 1634, mid-way through a GCC 15 pybind
  compile fight, the agent globbed outputs/runs/*/cache/torch_extensions/*/
  build.ninja and *.so looking for compile flags of a prior successful build;
  the sandbox returned only its own run (grep empty, ls "no matches found",
  the "sample" build.ninja was its own). No other archive content reached
  the agent. Read check.py/benchmark.py/PROMPT.txt at line 22 and the
  authenticity judge doc at line 472 (contract discovery; PROMPT.txt names
  the judge). No tolerance edits, no grader edits, no stack sniffing. Seed
  sweep (seeds 0-11 x ctx {2048,8192}): output cosine is >= 0.9999 whenever
  the solution's MoE top-8 matches the reference; the dips (seed 2 0.9964,
  seed 6 0.9966, seed 5 0.9770 -- below the 0.98 gate) are exactly the seeds
  where the reference's 8th/9th router probabilities are within 0 to 1e-3
  (seeds 2 and 10 are exact ties in the reference itself) and the kernel's
  bf16-rounded logit picks the other expert. State/cache cosines stay
  >= 0.9997 on those seeds. That is a near-tie ambiguity of the reference,
  not wrong math; the graded seeds (0,1,2,7) all pass. Dev trajectory:
  baseline-copy 1.00x (scratch/bench_baseline.log) -> first megakernel 14.31x
  (0.385/0.436/0.482 ms/tok, transcript line 1942) -> per-item globaltimer
  timeline (scratch/prof_timeline.py, kernel span 370.6 -> 324.3 -> 339.2 us
  at ctx 2048), a DRAM access-pattern microbench (/tmp/bw/bw.cu), then
  per-layer static prefetch queues drained by blocks that are waiting on a
  counter -> graded 15.82x (0.344/0.390/0.430 ms/tok). Early on it lost
  ~45 min (lines 1617-1904) to GCC 15.2 rejecting torch's python headers
  (c10::List "need typename before decltype"); fixed by putting
  PYBIND11_MODULE in the nvcc translation unit, building the empty host stub
  with -UTORCH_API_INCLUDE_EXTENSION_H, and -std=c++20. The session ended on
  the provider five-hour rate limit (transcript line 2718, "You've hit your
  session limit") right after the final prefetch-macro edit (line 2713) and
  its timeline check; the harness's post-session check.py PASSed the final
  file (harness_exit_code 1 is the rate-limit stop, session_complete true).

