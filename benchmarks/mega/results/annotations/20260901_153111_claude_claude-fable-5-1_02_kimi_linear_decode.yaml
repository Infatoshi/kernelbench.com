implication: >
  Publishable as a megakernel-authentic cell for 02_kimi_linear_decode on
  the RTX PRO 6000 board, effort max. It is the fourth attempt today: the
  first three (20260901_120240 max, 20260901_124502 max, 20260901_142726
  xhigh) died on a Claude Code per-turn output-token cap before writing any
  solution.py and are annotated as bug; this run had the cap raised to
  128000 and finished, though the provider five-hour limit cut the session
  at ~91 min while it was still optimising. Read against the July Fable 5
  cell (20260701_172615: 18.71x, 0.31 ms/tok at ctx 2048, single cooperative
  kernel with 14 grid barriers, same GPU class, RTX PRO 6000 Blackwell,
  effort max): this run lands at 0.344 ms/tok, 0.39 of the 1.8 TB/s roofline
  versus ~0.55-0.60 for the July kernel, with a more aggressive design (no
  grid barriers, counter dataflow, in-wait L2 prefetch queues) that was still
  being tuned when the provider limit cut the session at ~91 min; the July
  session ran to self-termination. Same GPU and baseline, so the gap is
  comparable, but it reads as a session-length effect at least as much as a
  model delta. Two notes for future audits: (1) the
  returned hidden aliases a Model-owned ping-pong buffer and the returned
  state holds views into the Model's capacity cache and conv-window buffers
  (proven legitimate by the in-place-overwrite recompute test), so a
  rescoring harness that assumes fresh tensors per step should clone;
  (2) output cosine drops below the 0.98 gate on a seed (seed 5, 0.9770)
  whose reference MoE top-8 is a near-tie -- the graded seeds pass, but the
  gate is sensitive to router ties at bf16, which is a property of the
  problem's reference and tolerance rather than of this kernel.
