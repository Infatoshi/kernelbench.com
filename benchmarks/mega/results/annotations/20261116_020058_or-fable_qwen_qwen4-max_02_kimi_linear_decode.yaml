numeric_stress: >
  This problem's check.py has no separate stress block; its gate is 3 seeds x
  ctx 2048/8192 on out, layer-0 KDA S and MLA c_kv at cosine 0.98, and the
  harness check.log ran all six cells and ends in PASS (check.log:7-13). The
  random graded cache leaves MLA attention nearly uniform, which is why the
  probe's P3 rescales the cache; it passed 14/14 there (probe_note), so the
  absorbed MLA is right where the graded cache cannot tell.

probe_note: >
  qwen_mega_probes.py copies solution.py and
  template_files/{reference,baseline,shapes}.py into a fresh temp dir with its
  own Triton cache, writes nothing into the archive, and prints one PASS or
  FAIL line per gated check. The predictions were written from the read audit
  before any run. RESULT: the operator ran it on tetra GPU 2 from 8:47:50 to
  8:48:35 am CST 2026-11-16 under an overnight-compute lease, zero compute
  PIDs before the start, window verified clean against the host GPU-use log
  (2 log blocks, 0 foreign processes). Every gated check passed. A first run
  at 8:45:39 am died inside P1 on a script error (an in-place write to a leaf
  tensor without no_grad) that skipped the weight restore and poisoned the
  later checks; the script was fixed, given a state-overwrite check (P1d), and
  rerun, and only the rerun is quoted here.
  P0: grid 752 as predicted. P1 same-buffer overwrite of every weight, scale,
  zero and the input token: cos(out1,out2) 0.0145 with cos(ref,sol) 0.999962
  (-0.0117 and 0.999935 when written through the tensors' data attribute), so the
  kernel reads live values. P1d every state tensor rewritten in place at the
  same address: cos(ref,sol) 0.999995, so the address-keyed cache pack is safe
  for the harness's in-place appends. P2: 6 steps gave 6 _megakernel events
  and 6 cuLaunchKernelEx calls, no memcpy, memset or graph call. P3 MLA on
  caches where attention matters (rows x10, random x30 and x60, 16-row x30,
  rope-only x30, at ctx 2048 and 8192): 14/14 PASS at cos(ref,sol) 0.999945
  to 0.999998 with the attention effect as large as 0.92; baseline.py itself
  sits at 0.9960 to 0.9999 on the same cases, so the solution tracks the
  reference more closely than the frozen baseline does. P4 6-step chains
  PASS, 0.9995 or better at every step, where baseline.py drifts to 0.82 to
  0.84 by step 5. P5 every KDA state, conv window and new cache row at
  1.0000. P6 seeds 3 to 6 x ctx 0, 1, 127, 128, 129, 1000, 4097, 16384:
  32/32 PASS, out 0.99998 to 1.00000.
  INFO hazards, all off the graded path and as predicted: P1b replacing only
  k_rope while c_kv keeps its address gives a stale read (0.9330 vs baseline
  0.99995); P1c the output tensor is the same buffer every call; P7 at 40,000
  rows the 256-chunk combine limit shows on an attention-sensitive cache
  (0.9917 vs baseline 0.99991, error 22% of the effect vs 1.7%) while still
  above the 0.98 gate; P8 rebinding router weights to new storage after the
  first step gives 0.273 (pointer table built once); P9 at ctx 16384 the
  harness-style chain (1 repack, 15 in-place appends) costs 0.384 ms/step vs
  0.415 ms/step when the cache is repacked every step.

notes:
  - "Field (RTX PRO 6000, annotation files in benchmarks/mega/results/annotations/): Opus 5.5 35.4596 (20260922_121505_claude_claude-opus-5-5), Sonnet 5.5 32.1306 (20260928_122208_claude_claude-sonnet-5-5), Fable 5.2 31.4138 (20261109_143648_claude_claude-fable-5-2), Gemini 4 Argon 27.033 (20261013_175145_agy_gemini-4-argon-high), Gemini 4 Carbon 23.7628 (20261110_113616_agy_gemini-4-carbon-high); DeepSeek V4.1 Flash (20261017_215137) and Kimi K3.1 Pro (20261116_012038) are bug with no score. Among the 20 correct, scored annotations for this problem whose gpu field names the RTX PRO 6000 (this one included; older files without a gpu field and the reward_hack cell excluded), 16.2864 ranks 11th."
  - "Design (record 59, 2:14 am): it costed materializing k_nope and v at 16k context at about 1.5 to 2 ms for MLA alone and chose the absorbed path, citing the shapes.py hint that the absorb-vs-materialize fork determines everything."
  - "Recovery, Triton miscompile (records 317, 337, 2:47 to 2:49 am): online-softmax accumulators updated with tl.where(j==k, dot, acc) kept only the last subchunk; it isolated this as a Triton 3.6 loop-carried select bug at every num_stages and switched to a static_range unroll that feeds the rescale into tl.dot's accumulator."
  - "Recovery, cross-call barrier epoch (record 442, 3:02 am): ctx 8192 failed at cosine 0.09 only after a ctx 2048 step on the same model, because the monotonic barrier counter carried over while the phase index restarted at 0, so every barrier in the second call passed immediately; fixed with the host-tracked BASE epoch that survives in solution.py:868."
  - "Recovery, router top-8 flip (records 454 to 514, 3:04 to 3:13 am): seed 2 then passed at only 0.9879, one expert swapped by drift; it traced the main drift to casting the MoE hidden to bf16 before the down projection (the reference keeps fp32) and moved down to an fp32 FMA path; the shipped file passes seed 2 at 1.0000 (check.log:11-12)."
  - "Recovery, own shell killed (records 893, 905): pkill -f ns_sweep matched its own bash command line."
  - "Occupancy move (record 645, 3:42 am; benchmark at record 1034): it found the kernel at 255 registers and 1 CTA per SM, redesigned attention into small chunks to fit about 100 registers and 25 KB of smem, and moved to 752 CTAs; the next benchmark went from 6.5117 to 15.8565."
  - "Zero-barrier attempt (record 1061, 5:23 am): with the barrier kernel at about 370 us per step, it argued phase boundaries leave the bandwidth pipeline draining and set out to replace barriers with per-task dependency counters; compile time exploded (record 1159, 845% CPU for minutes) and it deadlocked."
  - "Recovery, wrong solution under test (record 1606, 6:57 am): a symlinked check.py made Python put the symlink target's directory on sys.path, so its 'fallback' checks had been importing the fine-grained solution, explaining the 20-plus-minute 100% check.py runs on GPU 3; fixed by copying real files."
  - "Recovery, deadlock diagnosis (record 1850, 7:47 am): it had the kernel write progress into a pinned host buffer readable while the kernel spins, and found the deadlock was in its dependency logic (a //128 vs //192 divisor and counter aliasing), not the asm spin semantics."
  - "Measured and reverted: fine-grained variant 2300.9 us at grid 376 (record 2068), 548.0 us with native spins (record 2099), 645.2 us at maxnreg 128 and grid 752 (record 2118), all at ctx 2048, against the barrier fallback's 0.361 ms; the tuned-fallback knobs (attention 8-way, recurrence 256, o_proj BN64) measured neutral (record 2004)."
  - "Why it stopped (record 2121, 8:04 am): it judged the fine-grained version would need a large uncertain rework, shipped the barrier fallback, ran the ship check and benchmark, and ended at 8:08:21 am."

