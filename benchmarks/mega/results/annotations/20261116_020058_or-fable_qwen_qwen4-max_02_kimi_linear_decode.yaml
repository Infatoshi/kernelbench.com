authenticity_reason: >
  Genuine single-launch persistent Triton megakernel. Model.step() launches
  _megakernel once per step (solution.py:867) on a grid picked by a
  compile-only occupancy probe: 752 CTAs (4 per SM on 188 SMs, maxnreg 128,
  smem under 25600 B), else 376, else 188 (solution.py:856-866); num_warps=4,
  so 128 threads per CTA. Phases are separated by 35 software grid barriers
  per step (1 + 3 KDA blocks x 8 + 1 MLA block x 10, matching the host's BASE
  epoch bump at solution.py:868), implemented as two-slot monotonic int64
  atomic counters (_bar, solution.py:150-158). Every phase (RMSNorms, KDA
  projections, conv, recurrence and gate, MLA projections, absorbed query,
  flash-style attention, combine, V un-absorb, o_proj, routers and top-8, the
  merged MoE gate/up, SiLU and down phase synchronized by per-tile and
  per-expert spin counters, all int4 unpacking) runs across all CTAs through
  grid-stride task loops. No CUDA graph, no torch.compile, no eager fallback,
  no library GEMM. The shipped file is the cleaned barrier "tuned fallback"
  (copied in 8:04:30 am, debug and timing knobs stripped 8:05:01 am), not the
  fine-grained zero-barrier variant; it has no os import and no env switches,
  and its only inline asm is cos.approx and sin.approx in the rope.

