implication: >-
  Publishable as the openai/gpt-6-astra-pro RTX PRO 6000 mega cell: the audit-time
  isolated regrade reproduced it (24.8043 vs 24.8188 contended, -0.06%) and the
  overwrite and fresh-state probes passed (probe.log). At 24.8043x it takes the
  top of the RTX PRO 6000 mega board by 0.8% over claude-fable-5 (24.609x), with
  claude-fable-5-1 at 22.9457x. The design contrast with the Fable 5.1 cell is the
  interesting part: Fable won on a hand-rolled task-queue scheduler with mma dequant-GEMVs;
  astra-pro wins with plain grid.sync() phases and scalar-FMA GEMVs, spending tensor
  cores only on the MLA attention -- at batch 1 the GEMVs are bandwidth-bound so
  FFMA suffices, and the barrier design is the simpler one to validate. Numeric
  fidelity is unusually high (1.0000 on every check combo) because the kernel mirrors
  the reference's bf16 rounding points with fp32 accumulation; two faster variants
  that dropped cosines to 0.983-0.9997 were reverted in-session rather than shipped.
  The multi-step state path (fresh S/conv tensors per step, in-place latent-cache
  append via as_strided views, in-kernel ingest copy on realloc) is exercised for
  up to 32 chained steps per timed shape but graded at step 1; the same-buffer overwrite
  probe and the fresh-state probe both passed in the regrade (probe.log). Co-residency
  is API-guaranteed by the cooperative launch, and the binary is SKU-locked (sm_120
  gencode, grid = 2x SM count, compile-time dims; Model.__init__ raises on any other
  config).
