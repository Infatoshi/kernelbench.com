authenticity_reason: >-
  One __global__ megakernel (solution.py line 660) built from the embedded CUDA
  source via torch cpp_extension load_inline() (line 885), launched exactly once
  per step() as a genuine cudaLaunchCooperativeKernel (line 863) of 376 blocks x
  256 threads on the current torch stream, with C10_CUDA_CHECK on the launch status
  so block co-residency is validated by the CUDA runtime on every launch; the grid
  itself is sized from cudaOccupancyMaxActiveBlocksPerMultiprocessor (lines 837-838).
  Phases synchronize with real cooperative-groups grid.sync() barriers (13 sites,
  lines 689-797), not hand-rolled counters. step() (lines 932-963) issues no other
  GPU work: one torch.empty_like for the output (line 940), fresh empty_like tensors
  for the KDA state and conv windows, an as_strided view-append for the MLA latent
  cache when storage capacity allows (lines 953-955; the ingest copy runs inside
  the launch, lines 439-444), and the single extension call (line 962). Inside the
  launch: both RMSNorms with fp32 staging, every int4 dequant-GEMV as a split-K
  scalar-FMA GEMV with the bf16 0x43004300 magic-nibble decode and per-group asymmetric
  (s,z) epilogue (lines 160-166, 221-266), KDA short convs with in-place window
  shift, sigmoid decay gate and beta, the fp32 gated-delta S update, o_proj, absorbed
  MLA (query absorbed through kv_b, lines 452-470) with flash-decoding splits over
  the 576-d latent cache, cp.async double-buffered tiles, wmma 16x16x16 bf16 tensor-core
  QK^T and P.V (lines 517, 530, 575) and an in-kernel cross-part softmax combine,
  the MoE router with warp-reduce top-8 plus 8 routed experts plus the shared expert,
  and the final residual writeback. No CUDA graph, no torch.compile, no Triton,
  no cuBLAS; check.py's framework label is ptx (asm volatile cp.async). Gencode
  sm_120 only (line 889). The agent's own torch-profiler trace of the final file
  shows exactly one GPU kernel per step (scratch/profile_final.log line 7).
summary: >-
  OpenAI gpt-6-astra-pro through OpenRouter (codex harness, CLI 0.140.0), xhigh
  effort, unlimited budget, RTX PRO 6000: a single cooperative persistent megakernel
  using classic grid.sync() phase barriers, scalar-FMA int4 dequant-GEMVs, and wmma
  tensor cores reserved for the absorbed-MLA attention. Post-session trusted grade
  on the same box 2026-09-06 (check then benchmark via trusted_entrypoint.py after
  the agent exited, gpu_lock.log lines 148-153): 24.8188x geomean over the untouched
  baseline (23.65x / 24.95x / 25.91x at ctx 2048 / 8192 / 16384, 0.323-0.358 ms/tok);
  the agent's final in-run self-measurement was 24.7390. check.log shows out/S/cache
  = 1.0000 on all six seed/ctx combos against the 0.98 gate. All 8 template files
  byte-identical, zero foreign reads (bwrap masked outputs/runs and DEVLOG.md),
  no clock commands, one ninja install (pip failed, uv pip succeeded), zero lock
  contention, no key strings in the archive. Session ended on a deliberate task_complete
  at 5h05m after three transient CLI reconnects (all recovered). Audit-time isolated
  sequential regrade on the same box 2026-09-07 (clocks reset with nvidia-smi -rgc,
  sole GPU owner): 24.8043x geomean (23.66x / 24.95x / 25.85x, 0.323 / 0.336 / 0.359
  ms/tok), -0.06% vs the 24.8188 post-session grade, which is kept as benchmark.contended.log.
  Overwrite probe (probe.log): primed step cos(ref,sol)=1.0000; a continuation step
  with the hidden buffer overwritten in place at the same data_ptr changes the output
  (cos(out1,out2)=0.0335) and matches the reference at 1.0000; a fresh state at
  seed+1 with the buffer overwritten again gives cos(out2,out3)=-0.0342 and matches
  at 1.0000. OpenRouter cost $83.75.
