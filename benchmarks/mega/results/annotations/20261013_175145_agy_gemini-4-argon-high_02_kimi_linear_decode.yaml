  four cuda sessions in the same release. Five sessions shared one GPU through the lock, so every in-run
  number is contended.

comparison: >
  Same plan as the leaders (Opus 5.5 35.46x, Fable 5 35.43x, Sonnet 5.5 32.13x): one persistent launch per
  token, int4 weights dequantised in registers, absorbed MLA in latent space. At 0.287-0.332 ms per token
  it is 1.8x slower than Opus 5.5, with CUDA-core FMA GEMVs (a byte_perm trick builds 128+nibble floats so
  one FMA per weight and one zero-point subtraction per group), 30 grid barriers per step and no
  shared-memory weight staging. 27.03x would sit fourth on the mega board. GPT-6.1 Sol scored 4.99x.

