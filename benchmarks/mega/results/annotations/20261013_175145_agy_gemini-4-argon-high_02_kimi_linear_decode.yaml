    label: "Software grid barrier across 376 CTAs, two per SM"
    text: |2
      __device__ __forceinline__ void grid_barrier(uint32_t& local_epoch) {
          __syncthreads();
          if (threadIdx.x == 0) {
              uint32_t next_epoch = local_epoch + 1u;
              asm volatile("membar.gl;" ::: "memory");
              uint32_t arrived = atomicAdd(&g_sync_arr[0], 1u);
              if (arrived == NUM_SMS - 1) {
                  *reinterpret_cast<volatile uint32_t*>(&g_sync_arr[0]) = 0u;
                  asm volatile("membar.gl;" ::: "memory");
                  *reinterpret_cast<volatile uint32_t*>(&g_sync_arr[1]) = next_epoch;
              } else {
                  while (*reinterpret_cast<volatile uint32_t*>(&g_sync_arr[1]) != next_epoch) {
                      __nanosleep(40);
                  }
                  asm volatile("membar.gl;" ::: "memory");
              }
              local_epoch = next_epoch;
          }
          __syncthreads();
      }
