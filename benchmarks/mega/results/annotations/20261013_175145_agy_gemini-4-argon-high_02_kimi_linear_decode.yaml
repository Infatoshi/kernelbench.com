summary: >
  Gemini 4 Argon wrote one hand-written CUDA kernel that runs the whole four-layer decode step in a
  single launch: 376 CTAs (two per SM) synchronised by a software grid barrier, int4 GEMVs that fold the
  zero point into one subtraction per group, KDA short-conv and delta-rule state updates, MLA attention
  in the 512-dim latent space with W_uk absorbed into the query, a 188-way split-K flash-decoding pass,
  and router top-8 plus shared expert MoE in every layer. 27.03x over baseline.

