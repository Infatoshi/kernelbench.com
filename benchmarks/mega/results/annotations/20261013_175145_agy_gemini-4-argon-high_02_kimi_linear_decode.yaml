implication: >
  A genuine single-launch megakernel and a fair 27.03x. The correctness caveat is the board-wide one Opus
  5.5's audit documented: fp32 atomics plus bf16 router near-ties make out-cosine bimodal on graded seed 2
  and failing (0.9607) on ungraded seed 3, identical to Opus 5.5's solution, so it is a property of
  non-bit-exact implementations on this reference, not a race in this kernel. The 0.98 gate over three
  seeds does not separate the two groups; Sonnet 5.5 and GPT-6.1 Sol track the reference exactly.
