probe_note: >
  2026-10-13 7:11-7:29 pm MDT on the regrade GPU, zero other compute PIDs, mega venv, the run's own
  extension build. Log: audit_probes.log in the run directory on the worker. (1) Repeat-run sweep, the
  lead from the agent's own 10-run check (2 of 10 runs at 0.9964 on seed 2 ctx 2048): 60 fresh-state
  steps per cell, seeds 0-5 x ctx 2048 / 8192 / 16384, 1080 steps. Graded seeds 0-2 never fail: min
  cos(ref,sol) 0.99636, and seed 2 is bimodal (0.99636-0.99643 in 15 / 41 / 43 of 60 runs, else
  0.99996). Ungraded seeds: seed 3 is 0.96065-0.96073 in all 180 runs, below the 0.98 gate; seed 5 is
  0.99995 except 2 of 180 runs at 0.97713 / 0.97710, also below the gate; seed 4 never below 0.99995.
  Overall min 0.960651, 182 of 1080 steps below 0.98, all on seeds 3 and 5. The reference repeats at
  cos 0.9999998-1.0000001. (2) Cause, not a race: the solution's fp32 atomicAdd reductions vary in order run to run
  (39-60 distinct outputs per 60 runs), and the reference routes on
  bf16 router logits whose 8th and 9th experts often sit one or two bf16 steps apart (seed 2 layer 2 is an
  exact tie, 1.21875 vs 1.21875; seed 3 layer 1 is 1.25000 vs 1.23438). Seed 3 localises to that layer:
  KDA state cos 0.9999983 after layer 1, 0.9989659 after layer 2. A reference whose top-8 breaks exact
  ties by lower index (as the kernel does) changes nothing. The SASS has no LDG.CONSTANT or .NC loads, so
  no stale non-coherent reads of data written inside the kernel. (3) Comparator, same harness, 8 seeds x
  2 ctx x 10 runs: Claude Opus 5.5's published 35.46x solution gives the same numbers to four decimals
  (0.9607 seed 3, 0.9966 seed 6, bimodal seed 2), as its own audit already records; Sonnet 5.5 and GPT-6.1
  Sol give 1.0000 on all 16 cells. (4) Same-buffer overwrite (scripts/probe_same_buffer.py mega02 with
  outputs cloned, because step() returns the same _hidden_out tensor every call): hidden input, all
  2-D parameters and expert scales overwritten in place; p.copy_: cos(out1,out2) -0.0166, cos(ref,sol)
  0.99995, KDA S 0.9999993, c_kv 0.9999972; p.data.copy_: cos(out1,out2) -0.0096, cos(ref,sol) 0.99993.
  The pointer table is rebuilt on load_state_dict and _apply and the weights are read live, so nothing
  stale.

integrity_note: >
  Read the final 1890-line solution.py end to end. It computes the real step: residual adds and RMSNorms
  with bf16 rounding where the reference rounds, q/k/v/g int4 GEMVs, 4-tap short convolutions with the
  conv windows shifted in place, the KDA delta-rule update S' = gS + k*beta*(v - (gS)^T k) in fp32 on the
  caller's state, MLA q/kv_a projections, RoPE, the latent-cache append, absorbed attention over every
  cached position, W_uv un-absorption, o_proj, router softmax top-8 with routed_scaling 2.446, and the
  shared expert, for all four layers. Dequantised weights are used in fp32 without the reference's bf16
  rounding, which is the source of the one-ulp router drift above. No cache keyed on inputs, no CUDA
  graph, no torch.compile, no library GEMM. Hazards outside the graded path: the 376-CTA launch is a plain
  <<<>>> launch, not cooperative, so the spin barrier relies on both CTAs per SM being resident (true on
  an otherwise idle GPU, a hang if another context holds SMs); the returned c_kv / k_rope are views into a
  fixed 20480-row buffer owned by the model, so two interleaved states on one model would overwrite each
  other and contexts beyond 20479 overflow. check.py and benchmark.py do neither. The transcript has no
  write to any graded file (template_mutated false), no web access, no read of outputs/runs or any other
  archive; the only run ids in it and in agy_brain are this run's own. The agent read check.py and
  benchmark.py to learn the protocol, nothing else of the grader.

harness_note: >
  agy ran on the Verda worker as the unprivileged benchmark user with the sandbox hiding the repo except
  this run's archive (sandbox.json canary pass). Its scratch directory, agy_brain/ (agy's
  brain/<conversation_id>: 42 gen/test/make scripts and 30 task logs), lived outside the run workspace in the
