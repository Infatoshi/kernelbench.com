authenticity_reason: >
  Genuine raw-CUDA single-launch megakernel. solution.py builds one __global__
  decode_kernel with load_inline and launches it once per step with
  cudaLaunchCooperativeKernel on 188 blocks (one per SM) of 512 threads;
  phases are separated by 18 cooperative-groups grid.sync() call sites (45
  barriers per step), int4 weights are unpacked from global memory inside
  the kernel, and all four layers plus the four MoEs run in it. No CUDA
  graph, no torch.compile, no eager fallback, no library GEMM; the advisory
  tripwires (scripts/megakernel_evidence.py) are all false.

