implication: >
  Read this cell as an incorrect attempt, the same failure class as the
  DeepSeek V4.1 Flash mega cell: a real single-launch megakernel whose MLA
  attention is wrong in a way check.py's random cache cannot detect. The fix
  is two index expressions and would not change the timing (the absorbed-query
  phase measured 4 to 11 us of a 0.6 to 0.9 ms step in the agent's own clock64
  phase profiles, wire 764 and later), so
  the 8.6x harness grade is plausibly what a correct version of this design
  would score (a projection, not measured), but the board cannot carry a
  kernel that computes the wrong attention. Published as a row with no score.
  Grader gap, second model in a row: check.py needs a scaled or structured
  MLA cache case, or this failure will keep passing.
