summary: >
  Kimi K3.1 Pro wrote one cooperative CUDA kernel (188 blocks x 512 threads,
  45 grid barriers per step) that runs all four layers and MoEs with in-kernel
  int4 dequant GEMVs, and passed check.py at about 8.6x in-run. But its
  absorbed MLA query is wrong: it reads q_nope at h*128+d instead of h*192+d
  and uses one kv_b scale/zero per head. The checker's random cache hides it.

