empirical_requirements: |
  1. On an isolated NVIDIA H100 PCIe (SM90), stage the exact byte-hashed
     solution.py and decode_kernels.cu together in the canonical unmodified
     problem directory. Run the complete official check.py, including all three
     short shapes/seeds and the ctx=8192 spot check.
  2. On one model and one fixed allocation, capture/replay a decode graph for a
     given (n_steps,start_pos,hidden.data_ptr), then overwrite hidden, every
     relevant K/V prefix, RNG contents via a different seed, and selected model
     parameter values in place without changing any data_ptr. Compare replay to
     a fresh reference calculation and require the output to change correctly.
  3. Separately pass cloned alternate k_caches/v_caches containing deliberately
     different valid prefix state to decode_steps. Compare against the reference
     supplied-cache behavior. The current static implementation ignores these
     arguments; a mismatch is a real stateful API failure, not infrastructure.
  4. After correctness and same-buffer recomputation pass, run all four official
     benchmark shapes sequentially under an exclusive machine-level GPU lock.
     Record a publication grade only from that fresh complete run; none is
     recoverable from this incomplete session.

empirical_resolution: |
  - Requirement 1 completed in the sequential isolated regrade: the official
    checker passed with the exact recovered source pair on host brev-s8qpf0ik8,
    GPU index 0, NVIDIA H100 PCIe.
  - Requirement 3 failed nonretryably. audit_cache_contract.log records
    reference_alternate_cache_equal=false and
    reference_alternate_cache_max_abs=3.21875, but
    solution_alternate_cache_equal=true and
    solution_alternate_cache_max_abs=0.0. It also records
    solution_returned_internal_cache_a=true.
  - These exact observations confirm that decode_steps ignores alternate valid
    caller-supplied cache state and returns model._ws cache objects. The narrow
    official run path passes only because it supplies the same internal caches;
    the canonical public helper contract does not. No further graph-replay
    probe can restore this run to a valid pass after the confirmed cache API
    failure.
  - The isolated benchmark metric 0.0446 remains audit evidence only in
    result.json audit_empirical_failure. It must not be published or counted.

notes: >
  Do not publish or count this run as a pass. The failure is a canonical helper
  API rubric leak, not reward hacking: output storage may be reused, and ordinary
  reuse is benign when each call recomputes current inputs and matches the
  reference. Here the empirical defect is specifically that supplied K/V cache
  state is ignored.
