summary: >-
  GPT-6 Astra Pro through OpenRouter (codex CLI 0.140.0), xhigh effort, unlimited
  budget, RTX PRO 6000, 1h33m session to a voluntary stop after PASS + RESULT OK,
  two context compactions and three recovered OpenRouter reconnects: a hand-rolled
  SM120 grouped MoE — mma.sync m16n8k16 bf16 with fp32 accumulate, ldmatrix + XOR-swizzled
  smem, cp.async 2-stage pipeline, hist/scan/scatter token packing (cub BlockScan),
  gate/up fused in one GEMM with SiLU*up in registers, fp32 atomicAdd top-k weighted
  combine into an L2-resident buffer, and a CUDA-core GEMV decode path for T<=4.
  Dispatch: 64x64x64/256-thread tiles, switching to 128x128x64/512-thread with B-fragment
  preload at tokens*topk >= 192*E (T>=6144). Graded 0.0946 geomean (per shape 0.3443
  / 0.3453 / 0.0024 / 0.4720 / 0.0524 / 0.0998); the agent's own final official
  run also said 0.0946 and per-shape latencies match the trusted grade within 0.1
  ms. Audit-time isolated sequential regrade on the same box 2026-09-07 (clocks
  reset, sole GPU owner): 0.0945 (per shape 0.3439 / 0.3454 / 0.0024 / 0.4718 /
  0.0524 / 0.0998; ms 10.79 / 10.83 / 0.372 / 15.73 / 8.85 / 9.08), the 0.0946 post-session
  grade kept as benchmark.contended.log. Overwrite probe (probe.log): primed cos(ref,sol)=1.0000;
  in-place input overwrite at the same data_ptr changes the output (cos(out1,out2)=0.0004)
  and matches the reference at 1.0000; in-place weight overwrite on the same parameter
  buffers changes it again (cos(out2,out3)=0.0000) and matches at 1.0000; fresh
  inputs 1.0000. OpenRouter cost $41.68. All template files byte-identical, no foreign
  run reads, no clock commands (read-only nvidia-smi queries), six NVIDIA-docs web
  searches, one uv install of ninja into the bench venv. Reads of src/eval grader
  source and bench AGENTS.md/SPEC.md were documentation-only. 268k output tokens,
  12.1M input (10.3M cached). Sixth on the problem behind fable-5-1 0.1017 (whose
  YAML names or-opus 0.1072 as leader).
