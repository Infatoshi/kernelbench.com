summary: >
  Haiku 5.5 wrote exact per-token NSA selection and attention as two plain fp32 CUDA kernels, one
  warp per query: fp32 block key sums, block scores as q·sum/64 with the diagonal block scored as the
  causal mean of its real q·k scores, a warp-shuffle top-8 with ties to the larger block index, then
  one-pass softmax over the eight selected blocks plus the 64-token window with overlap removed.

