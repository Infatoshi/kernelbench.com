comparison: >
  Same selection semantics as the leader, Sonnet 5.5 at 1.362 peak, which scores blocks on tensor
  cores with three-piece bf16 key sums and attends key-stationary with int8 partials. Haiku does the
  same work on CUDA cores, one warp per query re-reading K and V rows from global memory, about 14x
  slower. 0.0987 would sit 8th of 15 passing cells, between Grok 4.7 (0.100) and Gemini 3.8 Flash
  (0.096).

