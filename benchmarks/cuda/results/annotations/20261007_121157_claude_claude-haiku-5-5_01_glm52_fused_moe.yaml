summary: >
  Haiku 5.5 wrote the GLM-5.2 MoE layer as four hand-written CUDA kernels: a one-block counting sort
  of the routed pairs with the shared expert scheduled as one more expert group, a grouped bf16
  mma.sync GEMM for gate/up with silu(gate)*up fused into its epilogue, a second grouped GEMM for
  down, and a per-token reduce that applies the routing weights and adds the shared expert.

