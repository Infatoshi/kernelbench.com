  Same structure as the board leader, Sonnet 5.5 at 0.113 (sorted routing, two tensor-core grouped
  GEMMs with SiLU*up fused into the first), but without Sonnet's swap-AB tiles for small groups, fused
  weighted-combine epilogue or L2-resident fp32 accumulator, and with no separate decode GEMV: the
  T=1 shape runs the same 128-row tiles. 0.0969 would sit sixth of 21 passing cells, level with
  DeepSeek V4 Pro (0.0968) and GLM-5.3 (0.0997).

