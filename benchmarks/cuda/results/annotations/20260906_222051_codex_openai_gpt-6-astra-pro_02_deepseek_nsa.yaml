implication: >-
  Publishable: the overwrite, fresh-seed and long-context probes all passed (probe.log,
  probe_long.log) and the audit-time isolated regrade reproduced the grade (0.3946
  vs 0.3941 contended); the post-session trusted grade was already an isolated sequential
  run (gpu_lock.log shows zero other GPU jobs in the grade window) and it matches
  the agent's in-session 0.3944 to 0.0003. At 0.3941 the cell sits fourth among
  clean entries on 02_deepseek_nsa, behind claude-fable-5-1 (1.0627), claude-opus-5
  (1.0367) and claude-fable-5 (0.7266); per the ms-anchored policy for this problem
  the headline is the six millisecond numbers, not the geomean. Two readings to
  carry into the audit note: the trusted check never exercises the selection path
  (both check shapes select every block), so the long-context probe is the one doing
  real work here (six shapes with real top-8 selection, worst max abs 0.0081); and
  the tf32 two-part split ranks at ~20-bit precision where Fable's bf16 triple ranks
  at ~24-bit - absorbed by the 0.1 tolerance on every test the agent ran and on
  the fresh-seed probes (seeds 7 and 991 at max abs 0.0054 and 0.0065). The latent
  /64 mean of the final partial block (solution.py:62) is unobservable on legal
  inputs and needs no action.
