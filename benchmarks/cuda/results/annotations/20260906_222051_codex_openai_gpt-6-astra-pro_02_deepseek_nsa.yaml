summary: >-
  GPT-6 Astra Pro through OpenRouter (codex CLI 0.140.0), xhigh effort, unlimited
  budget, RTX PRO 6000, 2h22m to a voluntary stop. Two-kernel query-major NSA in
  CUDA with inline PTX: key_means writes fp32 per-position causal prefix means plus
  block means; tensor_attention (one CTA per 64-query block per head) re-runs selection
  per CTA - tf32 MMA over a two-part split of the fp32 mean keys (~20-bit ranking),
  exact fp32 prefix dot for the home block, 8-round argmax top-8 with the reference
  (imp, block-id) tie-break - unions the 4 warps' masks with the window blocks in
  smem, then cp.async double-buffered bf16 mma.m16n8k16 online softmax over the
  union tiles. Selection is entirely in CUDA; the only torch on the path is empty
  allocations. The check.py blind spot (S<=384 selects every block; the blocks>8
  selection path is never hit by the trusted check) is covered by the agent's own
  tests: reference oracle at S=577/641/1055 and a vectorized oracle with the exact
  tie-break on all six deck shapes at scales 0.01/1.0/8.0, worst max_abs 0.125 at
  scale 8, plus memcheck/racecheck clean. Templates byte-identical, no foreign reads,
  no clock commands, doc-only web searches, one OpenRouter reconnect pair recovered
  at ~23:52. In-session final benchmark 0.3944; the trusted post-session isolated
  regrade on a quiet GPU gives 0.3941 (per shape 0.2932/0.4597/0.5438/0.6156/0.2169/
  0.3829; ms 0.117/0.303/0.505/0.893/0.079/0.193). Audit-time isolated sequential
  regrade 2026-09-07 (clocks reset, sole GPU owner): 0.3946 (per shape 0.2899/0.4635/0.5397/0.6164/0.2188/0.3860;
  ms 0.119/0.301/0.509/0.892/0.079/0.191), the 0.3941 grade kept as benchmark.contended.log.
  Overwrite probe (probe.log): primed 1.0000; in-place q/k/v overwrite at the same
  data_ptr changes the output (cos(out1,out2)=-0.0041) and matches the reference
  at 1.0000; the weight-overwrite step is a no-op at cos 1.0000 because the reference
  Model has no parameters; fresh inputs 1.0000. Long-context probe past the check.py
  select-everything regime (probe_long.log): S=1024/1500/2048 x D=64/128 with seeds
  42/123/7/991 against reference.nsa_attend, all six ok at cos 0.999998 and max
  abs diff <= 0.0081 against the 0.1 bf16 gate, LONG_CTX_OK. OpenRouter cost $55.54.
  On this problem the run trails claude-fable-5-1 (1.0627), claude-opus-5 (1.0367)
  and claude-fable-5 (0.7266) - the gap is design, not hygiene: Fable reads each
  selected K/V block once per head (key-major gather with flash-decoding partials)
  and replays three launches as a CUDA graph, while this kernel re-reads every selected
  block per query tile and re-runs selection per CTA, which is why the deficit widens
  from 2.0x at S=2048 to 4.6x at S=8192. Cost not reported (OpenRouter via codex,
  total_cost_usd null).
