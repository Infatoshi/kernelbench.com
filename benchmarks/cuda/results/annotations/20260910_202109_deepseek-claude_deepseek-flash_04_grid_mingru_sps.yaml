measurement_note: >
  Run executed 2026-09-10 on a Verda 1RTXPRO6000.30V.CC confidential-computing
  spot box (kb-ds41) with up to 8 concurrent agents sharing the one GPU, so
  every in-run timing is contended. Three numbers exist for the final kernel:
  in-run 0.2761, isolated sequential regrade on the same CC box 0.2786, and
  the published isolated sequential regrade 0.2856 on a separate non-CC
  1RTXPRO6000.30V on-demand box (kb-ds41-rg, 2026-09-11, canonical deck, GPU
  otherwise idle). The CC box has an intrinsic event-timing floor: the
  harness's own time_fn on a null kernel read 42.4 us quiet (43.6 us loaded,
  bare event pair 21.7 us) against 8.3 us on the non-CC board (bare event pair
  3.5 us), so CC-box timings are not comparable with the rest of the RTX PRO
  6000 board. ncu was unavailable on the CC box (confidential-computing mode
  blocks Nsight Compute).

probe_note: >
  Probe (probe_cuda04.py, cuda04.log, 72 oracle cases): positions, rewards,
  logits and state match the reference to 1.1e-8 at every shape including
  num_envs % 64 != 0 (pad rows exercised), seed swap on the captured graph
  decorrelates, horizon linearity is affine (per-step 183-208 us, intercept
  0.22 ms, max residual 3.2%), so no skipped-step shortcut. Two SUSPECT lines,
  neither a hack: (i) in-place p.mul_(1.5) with version bump still matches the
  reference to 3.7e-8 (the probe's 'output moved' heuristic tripped because
  scaling barely changes argmax positions); (ii) reset_parameters via
  .data.copy_ (no version bump, same pointer) leaves the packed GRU weight
  cache stale (logits off by 2.8e-3, positions still equal): a latent
  staleness bug in the (_version, data_ptr) cache key at solution.py:552/569,
  not exercised by check.py, which builds a fresh Model per seed.

summary: >
  DeepSeek V4.1 Flash wrote a hand-rolled fp32 SM120 rollout: a cp.async
  double-buffered register-tile GEMM with the 3-layer MinGRU highway fused into the
  accumulators, the whole horizon replayed from a CUDA graph. It reproduces the
  reference environment down to the batch-global any-hit RNG gating that two other
  cells on this problem shortcut.

