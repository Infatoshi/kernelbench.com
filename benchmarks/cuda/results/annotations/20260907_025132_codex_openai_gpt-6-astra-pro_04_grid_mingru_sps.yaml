summary: >-
  GPT-6 Astra Pro through OpenRouter (codex CLI 0.140.0 harness), xhigh effort,
  unlimited budget, RTX PRO 6000, 2h01m to a voluntary stop, 23 solution.py revisions
  from a first PASS benchmark at 0.2732 (03:08Z) to 0.6836 self-measured (04:50Z);
  trusted post-session grade 0.6834; audit-time isolated regrade 2026-09-07 (clocks
  reset, sole GPU owner) 0.6837 (per shape 0.5306 / 0.7774 / 0.6950 / 0.7624; 79.6M
  / 116.6M / 104.2M / 114.4M sps), the 0.6834 grade kept as benchmark.contended.log.
  load_inline CUDA extension with two graded rollout paths: above 4096 envs, one
  fused_policy<48,16> launch per step (48 envs per 512-thread block, MinGRU state
  round-tripping through a global in-place buffer, the kernel boundary serving as
  the grid barrier the LCG any-hit rule needs); at or below 4096, a cooperative
  persistent_policy<32,16> with grid.sync() per step and state held in registers/shared
  (128 blocks on the 188-SM card for shape 0). Layer 1 folded algebraically into
  a 768x5 composed encoder recomputed in fp32 on every call; layers 2 and 3 run
  mma.sync.m16n8k16 with split-fp16 hi+lo operands, three MMAs per tile; heads as
  fp32 warp-reduction dot products; greedy argmax keeps the first index on ties
  like torch.argmax. Deferred one-step LCG respawn via a flags[] array honors the
  reference any-hit rule exactly. No caching anywhere: weights re-packed every run(),
  fresh outputs and a fresh CPU-randint init every call. Agent's own extended validation:
  positions and rewards bit-exact vs reference over 18 in-place weight draws at
  odd env counts (1 to 4609), max abs logit error 1.7e-8 against the 1e-3 gate.
  Audit probe at benchmark scale (probe.log; check.py itself only runs 128 envs):
  all four deck shapes at seeds 42 and 123 (not benchmark.py's 2026+trial seeds),
  positions bit-exact for every env (0 diverged of 4096 / 16384 / 65536 / 8192),
  rewards equal, max abs logit error 1.9e-8, exercising both the persistent path
  (4096 envs) and the per-step-launch path (8192 / 16384 / 65536); then an in-place
  weight overwrite on the same parameter buffers and a re-run: positions bit-exact
  and logits cos 1.00000 against the new reference, ALL_POSITIONS_EQUAL. OpenRouter
  cost $53.87. Templates byte-identical, no foreign archive reads, three nvidia-smi
  query-only calls, nine provider-side web searches all against docs.nvidia.com
  PTX pages. Third on the RTX PRO 6000 board for this problem behind claude-opus-5
  (1.961) and claude-fable-5-1 (0.7093), ahead of gemini-3.8-flash-high (0.3637);
  the geomean deficit to Fable is entirely shape 0 (0.5275 vs 0.6726), while shapes
  1 and 3 beat Fable (0.7781 vs 0.7036 and 0.7618 vs 0.7433).
