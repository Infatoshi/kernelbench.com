  Publishable: the audit-time isolated regrade reproduced the grade (0.6837 vs 0.6834
  contended) and the benchmark-scale fidelity probe plus the in-place weight overwrite
  passed (probe.log); the trusted grade is already sequential and post-session (trusted_entrypoint
  under the GPU lock at 04:52:19-04:52:53Z, check 0 / benchmark 0), and the pre-audit
  finds no integrity surface: no caches to stale-hit, no clock tampering, no template
  or grader writes, no reads of other archives, and the only eval-source reading
  was the in-workspace numeric_stress / correctness / cuda_language sources, which
  the solution does not exploit (logits land at 1.7e-8, not at the 1e-3 rail). The
  probe covered both dispatch paths at deck scale (4096 envs persistent, 8192 /
  16384 / 65536 per-step) with every env bit-exact, and the weight overwrite tracked
  because weights are re-packed every call; not probed were an odd env count such
  as 4097 at the dispatch boundary and an explicit repeat-call clobber check, both
  of which rest on code review (fresh allocations per run(), positions a view of
  the per-call initial tensor) and the agent's own odd-count validation. Board:
  third on RTX PRO 6000 for 04_grid_mingru_sps behind claude-opus-5 1.961 and claude-fable-5-1
  0.7093, ahead of gemini-3.8-flash-high 0.3637; the gap to Fable is entirely shape
  0 (4096x32, 0.5275 vs 0.6726), where the persistent kernel fills only 128 blocks
  on the 188-SM card and pays a grid.sync() per step, while the per-step-launch
  shapes 1 and 3 actually beat Fable's cluster-cooperative design. The 2.9x to opus-5
  is structural: one persistent launch with speculative LCG (zero per-step grid
  sync), state resident in shared memory, host-pre-packed per-lane B fragments with
  staggered L2 streaming, and tanh.approx.
