summary: >
  Kimi K3.1 Pro wrapped cuBLAS in CUDA plumbing: a gather kernel, a SwiGLU
  kernel and a per-token weighted reduce around cuBLAS grouped GEMMs, switching
  to bucket-padded batched cuBLAS GEMMs for T >= 2048, plus a hand-written
  two-kernel GEMV path for T=1. It also caches the routing sort keyed on the
  expert_ids tensor's identity. Because benchmark.py reuses the same tensors,
  that work never lands in the timed window, and its reasoning says so. The
  probe puts the effect at 6.8% of the score.

