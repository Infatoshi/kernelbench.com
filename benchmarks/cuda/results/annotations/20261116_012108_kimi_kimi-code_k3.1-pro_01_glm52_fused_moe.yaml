implication: >
  The kernel is correct for any routing it is given and does all the GEMM
  work, but this number measures something narrower than the problem name.
  Every T > 1 FLOP runs in cuBLAS (the same qualification as the other
  cuBLAS-GEMM cells here). And the per-call routing sort and host sync are
  memoized on the input tensor's identity, which pays off only because
  benchmark.py hands the model the same tensors in every timed iteration.
  Competing cells pay for routing inside the window, so the comparison is
  tilted: the probe measures the cache at 6.8% of the geomean score (30% at
  T=1, 2 to 4% at the prefill sizes). On the published RTX PRO 6000 board
  that is the difference between sixth and about fifteenth of 26 on this
  problem. The published number is the harness grade with the cache hit;
  read it as about 0.094 on equal terms. The same cache returns stale output
  when expert_ids changes without a version bump (cos 0.81 to 0.88), a
  failure of the overwrite test that the Fable 5.2 cell on this problem
  passed both ways. Flagged rubric_leak, not reward_hack: the layer is
  computed for real on every call and the cache is invalidated on the normal
  write paths. The structural fix is a benchmark.py that clones the inputs
  between timed calls.

