summary: >
  Fable 5.2 wrote a persistent megakernel (188 blocks x 16 warps) that runs
  every decode step and all layers in one launch, handing work between phases
  through atomic-exchange publishes and phase counters instead of grid.sync.
  Weights and KV feed mma.sync directly in fragment order while each fp32
  partner vector is split exactly into three bf16 pieces, so the math stays
  bf16 x fp32 with fp32 accumulation. For long contexts, completed 16-position
  KV chunks get a lossless 12-bit packed mirror with a per-fragment exponent
  base and raw fallback, cutting DRAM bytes on the attention read. During the
  run it found and fixed a real atomic-publish race in its own phase handoff.

