implication: >
  The published 0.0455 came from a kernel that does not implement the
  reference op at the timed shapes. Every one of the six graded shapes has
  more than 8 causal blocks, every one therefore goes through the swapped
  A-fragment ranking, and the probe fails all of them at the grader's own
  tolerance. This is not a near-tie or a bf16 rounding edge: cos(ref,sol)
  falls to 0.89 at S=2048 while cos(dense,sol) rises above it. The latency is
  not obviously inflated, since a wrong top-8 still touches eight blocks, but
  a number cannot be published as a correct-kernel result when the kernel is
  not correct on the shapes that produced it. The cell should come off the
  board pending the RTX PRO 6000 re-run of the long-context probe; if RTX
  confirms, it stays off. The earlier contamination and grader-integrity
  findings are unaffected and remain clean: this is a correctness failure by
  the agent, not a gamed eval, and the agent flagged the S<=384 coverage gap
  in writing three times, including after its own S=1024 test returned 0.183,
  before finalizing. The broader lesson is for the bench, not just this cell:
  check.py grades only S=256 and S=384, both at or under top_n_blocks=8, so
  the graded gate never executes a line of top-k comparison.
