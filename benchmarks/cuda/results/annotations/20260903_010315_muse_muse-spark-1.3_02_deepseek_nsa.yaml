implication: >
  Real fused NSA CUDA and an honest number, but an unambitious one: the top-8
  scan and the 576-entry index build both run on tid==0 alone and it spends a
  whole 128-thread block per query, which is why it lands ~4x under the
  warp-per-query scalar cells (gemini-3.8-flash-high 0.0958, deepseek-v4-pro
  0.0945, grok-4.6 0.0796) on the same no-tensor-core budget. Ran 2085 s of an
  uncapped budget and stopped voluntarily after PASS plus clean sanitizers;
  ~9 min of that was dead time blocked on the leaked lock. The shipped kernel
  builds under tempfile.gettempdir() at grade time (fixed shared path), a
  mild regrade-reproducibility hazard. Infra: the path-wrapper lock is
  trivially bypassed by export PATH plus an absolute interpreter, and a wedged
  compute-sanitizer subreaper can hold it indefinitely.
