implication: >
  Valid for ranking with the same comparability caveat as grok-4.6 and
  deepseek-v4-pro, only stronger: the peak is authored routing, gather,
  activation and accumulation CUDA wrapped around torch's cuBLAS calls, with
  no GEMM code of its own. Second H100 SXM cell on this problem after the
  contaminated gemini one (0.0805), and the first clean one; there is no H100
  SXM cuda board yet. T=1 scores 0.0008 and drags the geomean hard - without
  it the score would be 0.178 - and the padded (A, Cmax) batch is what costs
  shapes 4 and 5 (0.05 / 0.09 against 0.30 / 0.42 for the big prefills), so
  ragged grouped GEMM is the obvious next step. Three follow-ups, none
  blocking: solution.py prepends dirname(sys.executable) to PATH at import
  (inert under uv run, but it is the shape of a lock-wrapper shadow), the
  agent left 21 scratch files in /tmp despite TMPDIR pointing into the run
  dir, and muse_export.json's encrypted_content blobs trip hf_ secret regexes
  at byte offsets 2633420 and 4417985 at redaction time.
