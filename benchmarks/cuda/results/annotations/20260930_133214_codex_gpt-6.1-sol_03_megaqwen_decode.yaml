comparison: >
  Same design family as the board leader, Sonnet 5.5 at 0.080: one cooperative
  persistent kernel per decode call over all four layers with split-KV GQA.
  Sonnet adds 12 mover CTAs that prefetch upcoming KV rows and weights into L2;
  Sol has no prefetch and syncs the full grid seven times per layer,
  which roughly halves throughput (0.0386). GPT-6 Sol (0.0398) looped layers
  from Python with separate kernels; this run is the single-launch version at
  about the same score.
