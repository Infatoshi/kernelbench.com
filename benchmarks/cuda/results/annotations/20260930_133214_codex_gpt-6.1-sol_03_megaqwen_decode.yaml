summary: >
  One cooperative CUDA launch runs every decode step and all four layers: warp
  GEMVs with 128-bit weight loads, per-head Q/K RMSNorm and RoPE, split-context
  GQA attention that shares each KV load between the two query heads, a
  cross-split merge, and SwiGLU, with grid.sync between phases. Built with nvcc
  into a ctypes library rather than a torch extension.
implication: >
  The MegaQwen-style persistent decode the prompt asks for, retargeted to SM120.
  0.0386 sits low on this problem; the session ended at 80 minutes waiting for
  permission to kill two of its own stuck GPU processes (see harness_note), so
  the number likely understates the model.
