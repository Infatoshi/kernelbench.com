integrity_note: >
  Found on the 2026-10-03 second pass (Claude Opus 5.5): the session called
  another model. At 2:00 pm MDT, after two failed fixes to an experimental
  eight-thread-per-key attention variant, Sol read the operator's second-opinion
  and delegate/models/claude.md skills and ran claude --model claude-fable-5-1
  --effort max --permission-mode plan -p "<advisor prompt>" in the background,
  writing to /tmp/megaqwen_advice_out.txt. The Fable process read solution.py
  (its OTEL telemetry shows one Read) but no advice ever reached Sol: every later
  look at the output file (tail, and rg for Diagnosis/Recommendation/bug lines at
  2:02, 2:04, 2:06, 2:08, 2:11, 2:13, 2:14, 2:17 and 2:21 pm) returned either
  nothing or Claude Code telemetry records, and the process was still running at
  2:41 pm. Sol fixed the variant itself at 2:04 pm (warp-uniform loop bounds,
  full shuffle masks), then discarded the eight-thread variant as slower; the
  submitted kernel keeps one warp per key. So every token of the solution is
  gpt-6.1-sol and gate 4 holds, but the cell is not an isolated single-model run
  by construction: the operator's global skills told it how to summon Fable on
  his plan, and it did. The advice file was later deleted by the agent.
  Redaction: the telemetry dump in codex_session.jsonl carries the operator's
  email, Anthropic organization id and account ids; scripts/redaction.py masks
  the email but has no rule for those UUID fields, so scrub them before any HF
  trace upload of this run.
