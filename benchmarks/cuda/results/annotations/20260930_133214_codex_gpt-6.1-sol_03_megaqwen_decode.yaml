harness_note: >
  Harness exposure, same as the published 2026-09-22 GPT-6 Sol/Luna cells and the 2026-09-28 Sonnet 5.5 cells: the cell ran in host mode (bwrap sandbox, no container), so Codex loaded the operator's global ~/.codex/AGENTS.md (his personal CLAUDE.md) as instructions and listed and read his ~/.codex/skills (kernel, benchmark-integrity, optimize-loop, nsight-compute and similar). Those files hold workflow and profiling advice and the operator's GPU etiquette; they contain no KernelBench solution, grader detail or score. The audit treats this as disclosed context, not contamination: it cannot make a kernel pass or run faster on the graded path, and every cell on the board from this launcher carries it. Effect here: the agent ended its turn asking for approval to stop two of
  its own stuck GPU 0 test processes, citing the global AGENTS.md rule against
  killing GPU jobs without permission. It fetched Infatoshi/MegaQwen sources from
  GitHub, which PROMPT.txt invites, and rg-listed file names under a stale tetra
  checkout (~/dev/sites/kernelbench.com) that the sandbox does not hide; no file
  there was opened.
audit: >
  Read solution.py end to end (2026-10-03, Claude Opus 5.5). Served model
  gpt-6.1-sol at xhigh. No read or copy of outputs/runs* or of the stale
