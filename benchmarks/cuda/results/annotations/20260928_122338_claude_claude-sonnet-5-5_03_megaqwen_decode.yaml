summary: >
  Sonnet 5.5 retargeted the MegaQwen idea to one cooperative persistent kernel per decode call: 176
  compute CTAs run RMSNorm plus QKV, Q/K norm plus RoPE plus split-KV causal GQA over the full cache,
  the O projection and the SwiGLU MLP for all four layers behind a hand-rolled grid barrier, while 12
  mover CTAs prefetch upcoming KV rows and streamed weights into L2.

