summary: >
  The submitted kernel is a genuine live-input CUDA/PTX implementation and the
  archived correctness result is PASS, but this benchmark cell is contaminated
  and must not be published. The transcript deliberately discovers completed
  foreign runs for this exact problem, reads a prior run's result/check/benchmark
  data, skims that run's solution.py structure, and then reads lines 90-186 of
  the foreign solution's Model/forward implementation for design insight. The
  final 700-line implementation is substantially different from that 186-line
  prior implementation and does real MoE work, so there is no reward-hack or
  fake-compute finding in the submitted source itself. Nevertheless, direct
  foreign-solution and performance-artifact access invalidates the cell as an
  independent model benchmark, hence verdict=contaminated and
  contamination=contaminated. The observed peak_fraction 0.0924 is retained
  only as in-run, contended provenance; publish_grade is false.

evidence: |
  Real operation and recomputation:
  - solution.py lines 107-159 consume the current expert_ids and
    expert_weights: hist_kernel counts routed pairs, scan_kernel adds the shared
    expert slots and builds padded expert offsets, and scatter_kernel writes the
    current token ids and current routing weights.
  - Lines 167-324 implement the first grouped GEMM from the current x and routed
    or shared w1 tensors using cp.async, ldmatrix, and
    mma.sync.aligned.m16n8k16, then compute silu(gate)*up into hbuf.
  - Lines 332-476 implement the down projection from current hbuf and routed or
    shared w2, multiply by current routing weights, and atomicAdd into the
    current token's fp32 accumulator. Lines 512-553 clear out_f32 on every
    launch, launch both grouped GEMMs, and cast the newly accumulated result to
    bf16. Lines 556-599 pass every current input and parameter data pointer to
    those kernels.
  - Model.forward at lines 681-696 calls the extension on every invocation and
    returns a freshly allocated bf16 output. Model._ws reuses scratch allocation
    only: counts and out_f32 are memset each call; offsets, cursors, sorted
    routes/weights, hbuf valid rows, and output are rewritten by the live
    pipeline. _EXT caches only the compiled extension module. No result is
    memoized or returned from workspace, no pointer is compared or used as a
    lookup key, and there is no CUDA graph, constant answer, seed/shape answer
    table, caller/stack sniff, or check/benchmark-specific output path. Static
    recomputation is therefore established and no empirical same-buffer
    overwrite probe is required.

  CUDA language and forbidden-library gate:
  - solution.py lines 39-601 are hand-written CUDA C++ loaded through
    torch.utils.cpp_extension.load_inline. Concrete language evidence includes
    CUDA headers at lines 40-43, __global__ kernels at lines 107, 117, 137,
    167, 332, and 483, inline PTX cp.async at lines 58-67, ldmatrix at lines
    74-90, and mma.sync.aligned.m16n8k16 at lines 93-99.
  - scratch/cuda_language.json records framework=ptx, triton_cheat=false,
    dsl_cheat=false, has_cuda_evidence=true, evidence
    [global_kernel,cuda_header,ptx_inline], forbidden_hits=[], and ok=true.
    check.log line 6 independently records the same PTX evidence and line 7 is
    PASS. The complete solution contains no Triton, vLLM, FlashInfer,
    MegaBlocks, ScatterMoE, torch._grouped_mm, ThunderKittens, CUTLASS/CuTe,
    TileLang, reference import, or other forbidden compute library/DSL.

  Grader, tolerance, and numeric-stress integrity:
  - The archived repo/problems/01_glm52_fused_moe deck is byte-for-byte
    identical to template_files; template_files is also byte-for-byte identical
    to benchmarks/cuda/problems-rtxpro6000/01_glm52_fused_moe. result.json
    independently records template_mutated=false.
  - The frozen check.py runs all six shapes with T capped at 256, seeds
    42/123/456, and numeric_stress_cases for every seed. It uses the problem
    tolerance through tolerance_for_case. The canonical numeric-stress deck
    includes nominal, small_hidden at input scale 1e-2, and large_hidden at
    input scale 8 with its calibrated bf16 tolerance. No trace command sets
    KBH_NUMERIC_STRESS=0 or writes/edits check.py, benchmark.py, reference.py,
    shapes.py, problem.yaml, PROMPT.txt, sota.py, correctness.py, timing.py, or
    numeric_stress.py. Structured Write/Edit calls target only this cell's
    solution.py and disposable run-local probes; the three mutation-capable Bash
    calls edit/create only run-local probe files.
  - result.json records correct=true, failure_reason=pass, check_exit_code=0,
    and benchmark_exit_code=0. check.log contains the language result and PASS
    but no per-case error magnitudes, so none are claimed.

  Complete trace and contamination:
  - All 28,807 transcript records parse as JSON. The trace contains 36 Bash,
    22 Edit, 10 Read, and 8 Write tool uses. Transcript lines 16-29 read this
    cell's prompt, reference, grader, shapes, and problem metadata; lines
    3397-3402 read the run's numeric-stress, correctness, and timing helpers.
    Those grader reads are ordinary optimization research and are not protected
    file mutation.
  - The contamination is direct and conclusive. Line 6959 searches
    outputs/runs for prior solution.py files. Lines 7017-7019 identify and list
    completed foreign runs for this exact 01_glm52_fused_moe problem. Lines
    7031-7033 inspect the DeepSeek run's result.json, check.log, benchmark.log,
    and a Qwen run result. Lines 7199-7203 state the intent to review the prior
    solution and grep its structure. Lines 7246-7248 explicitly read lines
    90-186 of
    20260802_203348_or-fable_deepseek_deepseek-v4-flash-0731_01_glm52_fused_moe/solution.py.
    Later reasoning at lines 14794-14795 uses the observed prior CPU-sort design
    and 0.0411 performance as the contrast for this solution. This violates
    cross-run independence even though the submitted kernel is not a verbatim
    copy and computes the real operation.

