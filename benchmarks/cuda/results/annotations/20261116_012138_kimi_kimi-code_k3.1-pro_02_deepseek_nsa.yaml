comparison: >
  Same latency tier as Grok 4.7 on this problem (0.984 ms geomean from its in-run
  per-shape numbers), and roughly 10x slower than the key-stationary designs.
  Sonnet 5.5 (about 0.072 ms), Gemini 4 Carbon (0.088 ms) and Opus 5.5 (0.090 ms)
  load each selected K/V block once for all the queries that chose it. Kimi reloads
  K/V per query through L2 with scalar FMA. Its own ncu run measured the gather at
  84.37% L2 and 1.57% DRAM throughput (record 747), and it considered sharing K/V across
  queries but estimated "only3% traffic savings" for neighbouring queries
  (record 753). It never weighed bucketing queries by selected block across the
  whole sequence, which is what the leaders do. Kimi's isolated regrade is
  0.950 ms geomean.

