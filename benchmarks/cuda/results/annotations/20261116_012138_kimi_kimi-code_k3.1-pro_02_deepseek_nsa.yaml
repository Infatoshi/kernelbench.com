probe_note: >
  The solution has no cache, CUDA graph, pointer-keyed state or memoized
  output. Model holds only the reference's _dummy buffer (solution.py:462-469).
  nsa_forward allocates `selected` and `out` with torch::empty on every call
  (solution.py:408-409) and recomputes block scores and selection from the live q
  and k each call. data_ptr() only passes raw pointers to the two launches.
  AGENTS.md item 3 requires the overwrite test only for a cache, graph, data_ptr
  identity or similar pattern, so the verdict did not depend on it; it was run
  anyway on tetra GPU 3, 3:53 to 3:54 am CST 2026-11-16, alone on the card.
  Part 1 overwrites q/k/v in place at three selection-regime shapes:
  cos(out1,out2) -0.022 / 0.035 / 0.000015 and cos(ref,sol) 1.000000 at all
  three, gate PASS. Part 2 makes every full K block identical so the importances
  tie, which checks the tie direction (the reference gives ties to the larger
  block id) the way the Grok 4.7 audit did: cos(ref,sol) 1.000000 at D=64 and
  D=128, gate PASS.

integrity_note: >
  Read the 469-line solution.py end to end (sha256 988f580f2a71..., the same hash
  the agent printed before and after its final check, kimi_wire.jsonl records 1135
  and 1552). The CUDA source is inline in load_inline with nvcc -O3 --use_fast_math
  for sm_120; there is no torch op on the compute path other than torch::empty. The
  kernels are select_blocks_kernel<D> and sparse_attend_kernel<D> (D=64 or 128 only,
  TORCH_CHECK otherwise).

  Selection: Q (32 x D) times each causal 64-key K block on WMMA bf16 m16n16k16 with
  fp32 accumulators, so the products are exact and the fp32 sums differ from the
  reference only in summation order. Each query sums its masked row
  (col < min(64, t-key0+1)) over 8 lanes and divides by `valid`, giving the mean.
  The means are unscaled, which preserves the order (exactly so for D=64, where
  scale = 0.125). A register insertion sort keeps the top 8 with `better_block`,
  which gives ties to the larger block index, matching the reference's
  sort(reverse=True) on (importance, id) tuples (reference.py:57-58).
  Queries t < 512 skip selection and attend the whole causal prefix. This is exact,
  not a shortcut: for t < 512 there are at most 8 causal blocks, so the reference
  selects all of them.

  Attention: for t >= 512 each selected block is clipped to end before t-63, and the
  window [t-63, t] is attended once, so no key is counted twice, at most 576 keys.
  Scores are computed with scalar fp32 FMA and kept in per-warp shared memory, then
  a global max and a second pass compute __expf weights and fp32 PV accumulation.
  Output is normalized in fp32 and rounded to bf16 once. It has no bf16 P and no
  low-precision intermediate, so it spends none of the 0.1 tolerance.
  --use_fast_math makes __expf, rsqrtf(D) and the two divisions approximate (a few
  ulp). That can only flip a selection at a sub-ulp near-tie, the accumulation-order
  class that check.py already excuses (check.py:84-91).

