summary: >
  Kimi K3.1 Pro wrote NSA as two raw CUDA kernels. A WMMA bf16 tensor-core kernel
  scores every causal 64-key block for 32 queries per CTA and keeps an exact top-8
  per query (fp32 means, ties to the larger block id, as in the reference). A
  warp-per-query gather kernel then runs an fp32 two-pass softmax over the
  selected blocks plus the 64-token window, with the overlap removed. The
  semantics are exact, but it is slow: 0.950 ms geomean.

