notes:
  - "Numeric stress ran in the final graded check. check.py (byte-identical to the deck) runs every graded shape in shapes.py at seed 42, which includes S=8192 and S=8191 D=128, so top-8 selection is live. At each shape it runs the nominal and small_qkv (x0.01, atol 5e-4) cases. large_qkv is skipped by design (check.py:84-91). numeric_stress_cases only drops to nominal when KBH_NUMERIC_STRESS is 0/false/no, and nothing in the archive sets it. check.log:7-8 shows the language gate and PASS. The 334 s check matches the agent's own two full checks (334 s and 342 s, gpu_lock.log)."
  - "Selection correctness was tested by the agent itself, not only by check.py. It exposed a temporary nsa_select binding and compared per-query selected block ids against a Python loop of the reference rule (records 240, 265, 273, 282). Once the mean and stride bugs were fixed, outputs at S=1024 matched with zero out-of-tolerance elements at scale 1 and 0.01. Max abs diff was 0.00098 and 7.6e-6 (agent_home task log bash-3z2k6ewf/output.log, collected at record 428). The binding was removed before the final check (records 1043-1074)."
  - "Process slip, non-scoring: one Edit inserted a stray `</src>` token into the CUDA string (record 1043). The agent spotted it in the tool echo and removed it in the next edit (records 1050, 1059), before any build."
  - "Process slip, non-scoring: it killed its own S=1024 debug run as 'hanging' (record 372) when it was only queued behind sibling jobs on the GPU lock. It later recognised this: 'I already stopped old debug which perhaps just slow compile too, not stale' (record 426). It also cancelled an ncu run (record 713) on the theory that it was still queued. gpu_lock.log shows that run waited 1:52:56 to 1:58:05 am and had been running about 2 minutes, rebuilding the edited extension, when it was killed. It then reran ncu with a 30 s lock-wait cap (record 746), which returned the L2 numbers."
  - "It stopped at 58.8 minutes with the prompt's 'Take as long as you need' and no budget cap visible. The final message reports 0.1032 and lists no remaining bottleneck, although its own ncu record shows the gather is L2-bound and it had sketched a cross-query K/V sharing design (record 753) it never built."
  - "The first in-session benchmark (0.0977, 1:51:34 am) overlapped an ncu run by the mega 02 Kimi cell on the same physical GPU under a different lock domain (see measurement_note). That point may be depressed by contention."

implication: >
  An honest, exact-semantics NSA kernel in raw CUDA: a real tensor-core
  selection GEMM, the reference's tie rule, fp32 everywhere that matters, no cache
  or graph, and nothing read from outside its own run. The number (0.950 ms
  geomean) measures a straightforward two-kernel design that leaves the attention
  gather as scalar per-query L2 traffic. That is why it sits about 10x behind the
  key-stationary leaders and level with Grok 4.7. In this wave the mega cell and
  the cuda cells ran on the same GPU under separate lock files, which is the
  standard release recipe; it only affects in-session numbers.

