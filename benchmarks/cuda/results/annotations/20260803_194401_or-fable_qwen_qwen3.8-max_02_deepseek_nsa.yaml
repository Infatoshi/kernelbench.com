contamination_evidence: |
  - Transcript lines 5386-5387 list completed outputs/runs entries, including
    foreign run
    20260802_204049_or-fable_deepseek_deepseek-v4-flash-0731_02_deepseek_nsa.
    At line 5409 the agent explicitly says the previous same-problem run is
    interesting and proposes looking at it. Lines 5412-5413 list that run's
    archive and problem directory.
  - Intent and access are direct, not a passive process-list false positive.
    Transcript line 5434 calls the artifacts "valuable" for checking a good
    solution's score and approach. Lines 5435-5436 read the foreign result.json
    and complete benchmark.log, observing its 0.0161 peak fraction and all six
    timings. Lines 5594-5596 inspect its failed-check tail. Lines 5597-5598,
    5677-5678, and 5843-5844 read foreign solution.py lines 1-470; line 21203
    later reads lines 490-560, including the load_inline configuration. Thus the
    agent accessed nearly the entire 540-line foreign implementation.
  - The reasoning then uses what it read. At transcript line 5842 it diagnoses
    the foreign solution's union-based active-block loop, per-row masking,
    top-eight behavior, and performance bottlenecks. Lines 11528-11529 describe
    the foreign 0.0161 score as the baseline and propose an improved version of
    its kmean plus fused score/select/masked sparse-attention design. The final
    solution uses exactly that high-level two-kernel factorization, although it
    is not a verbatim artifact copy: the archived foreign and final files have
    different SHA-256 hashes and only 81 of 540/516 lines align in a
    sequence-matching comparison. Independent rewriting does not cure the
    direct foreign-solution/performance contamination.
  - A complete scan of structured tool inputs found no second foreign run id.
    The direct same-problem access above is sufficient to invalidate the cell.
    A publishable Qwen H100 NSA result requires a fresh sandboxed run with prior
    run artifacts inaccessible, not merely an isolated rebenchmark.

