  Manual read-only audit on 2026-08-03. Read all 516 lines of solution.py,
  parsed all 68,854 transcript.jsonl records (including all 111 structured
  agent tool calls: 71 Bash, 13 Read, 12 Edit, 7 TaskUpdate, 4 Write, and
  4 TaskCreate), reviewed result.json, the complete check/benchmark/GPU-lock
  logs, CUDA-language sidecar, frozen prompt/grader/reference/shape files, and
