summary: >
  Gemini 4 Carbon wrote one cooperative CUDA megakernel (188 blocks x 512 threads, five grid.sync
  per layer) that runs every decode step of all four layers in a single launch: fused RMSNorm and
  QKV GEMV, q/k-norm plus RoPE plus the KV append, split-KV flash decoding with a last-arriver
  merge, O-proj, SwiGLU and down-proj with atomic residual adds. KV stays bf16 and the softmax
  keeps its running max. Its one unusual move: the timed decode's random inputs are drawn on the
  CPU while the kernel is already running and streamed to the GPU through mapped host memory.

design_note: >
  Weights are repacked once into a flat bf16 buffer ordered norms, QKV, O, down, gate/up, and the
  first 80 MB are pinned in L2 with a persisting access-policy window plus evict_last hints
  (gate/up stream with evict_first). GEMVs are full-warp v8.b32 loads with fp32 activations in
  shared memory. Attention picks one of three compile-time modes by cache length (<=2560 KV kept in
  L2, <=49152 streamed one KV head per 23-24 blocks, longer flat 1/188 split), each 8-lane group
  owning a key position with an online exp2 softmax. Decode RNG: step 0's row is drawn before the
  launch into the __grid_constant__ params, rows 1..n-1 are drawn by at::randn_out on the host
  after cudaLaunchCooperativeKernel returns, and block 1 spins on a host-written ready counter in
  the last layer of each step before copying the next row into a GPU staging buffer.

precision_note: >
  Checked against the three shortcuts DeepSeek V4.1 Flash took on this problem; Carbon takes none.
  (1) KV cache: bf16 in and out, written with __float2bfloat16 exactly where the reference casts,
  no fp8 or packed copy. (2) Softmax: running max m with exp2(s - m) rescaling in
  attn_accum_step (solution.py:273-283) and max-aligned merges across 8-lane groups, warps and
  splits. (3) RNG: the decode stream (seed+2) is generated inside decode_steps, in the timed
  window, overlapped with the kernel rather than moved to prefill; the agent checked that one
  randn of (n-1, 1024) is bit-identical to the reference's per-step draws. Activations are fp32
  inside a block and rounded to bf16 at the block boundary as the reference does; weights are bf16
  read directly.

