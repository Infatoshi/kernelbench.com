notes: >
  Operator events. At 12:24 pm CST the operator killed this agent's `python check.py` (lock
  wrapper pid 2758441, python pid 2758448) after 1810 s at 98% CPU and 100% GPU with 1.1 GB
  resident: a kernel spinning, because it held the shared cuda GPU lock and blocked two other
  cells; the 1800 s cap matches the grader's check timeout (gpu_lock.log: start 11:53:58, end
  12:24:09, status 143). That version was the first megakernel (v1, written at steps 46-51 plus a
  cache-hint fix at step 58): its split-KV loop gave each key position to a 16-lane half-warp, but the score
  reduction used __shfl_xor_sync(0xffffffff, ...). When a split's position count is odd the two
  half-warps run different trip counts, so one half waits forever in the shuffle for lanes that
  never arrive, that block never reaches grid.sync, and the other 187 blocks spin at the grid
  barrier. The agent had launched the check without a timeout and went idle waiting. On the kill
  it read the kernel's sync points, ruled out __syncthreads and the RoPE path, traced the
  divergence to odd fast_end - pos_start (step 63 reasoning), and fixed it by giving each half-warp
  its own mask (0x0000ffff / 0xffff0000) for the in-loop shuffles (steps 63-65); the next check,
  now under `timeout 120`, passed in 53 s at 12:26 pm; many later GPU experiments also carried a
  timeout (its final check.py and boundary runs did not). The final kernel keeps the lesson: 8-lane groups shuffle
  with per-group masks (qw_mask) and full-warp shuffles only run after the groups reconverge.
  Separately, the host CPU storm (load about 3000) ran about 3:45-4:15 pm, after the session and
  into the first regrade, as above.

probe_note: >
  Tetra GPU 2 under the cuda GPU lock, zero other compute PIDs, archived solution.py (sha256
  100fbbf8ec9f), 2026-11-10 5:26-5:28 pm CST after REREGRADE_DONE, gain control at 9:19 pm.
  Overwrite at ctx 512, 8 decode steps, through prefill plus decode_steps: same inputs twice gave
  max |diff| 0 (deterministic here). Hidden and every KV cache overwritten in place with copy_ (same
  data_ptr): cos(out1,out2) 0.137, cos(ref,sol) 0.99995. Every 2-D weight overwritten with
  p.copy_: cos(out2,out3) 0.068, cos(ref,sol) 0.99999, delta cos 0.99999. Every 2-D weight
  overwritten through p.data.copy_ (bypasses the _version counter): cos(out3,out4) 1.0000000 and
  cos(ref,sol) 0.0038, the packed weight copy served stale weights; clearing _packed_sig restored
  0.9994. Same class as Fable 5.2's packed KV mirror; check.py and benchmark.py build or load each
  model normally, so the graded path never hits it. q_norm/k_norm gain stress through run() at
  reference init scale (std 0.02): gain 1 cos 0.99999, gain 2 0.99947, gain 4 0.701, gain 8 0.572,
  all finite. DeepSeek V4.1 Flash, which skips the max subtraction, measured 0.99906 and 0.668 at
  gains 2 and 4 on its probe, so a gain-4 drop also appears with the max subtraction in place: this
  probe does not isolate that shortcut (likely the 512-step prefill recurrence amplifying bf16
  rounding once the softmax sharpens; not proven). With std 0.05 weights the residual reaches
  about 68 and even gain 1 falls to cos 0.18, so that regime is ill-conditioned for any
  bf16 implementation and was not used. Repeat check: check.py three times from the run workspace,
  PASS, PASS, PASS in 26.7 / 26.8 / 26.9 s. Launch-blocking probe (CUDA_LAUNCH_BLOCKING=1, ctx 64,
  4 decode steps through the host-streamed RNG path): completed in 1.7 s with finite output, no
  deadlock.

integrity_note: >
  Read the final 1603-line solution.py (sha256 100fbbf8ec9f, identical to the workspace copy) end
  to end: load_inline CUDA with inline PTX, no Triton, DSL or torch math on the timed path; every
  layer of every requested step computes the real block over the whole cache with no windowing.
  Transcript (agy stream plus the brain's transcript_full.jsonl with tool arguments and thinking):
  check.py, benchmark.py, reference.py, shapes.py and src/eval/correctness.py and cuda_language.py
  were read to learn the API and tolerance (steps 1, 6, 13, 116, 340, 355); none was edited (all
  41 writes target solution.py, the rest go to its own brain scratch), and template_mutated is
  false. Step 316 imported check.py as a module to call its main() before its own boundary tests,
  not to patch it. No read of outputs/runs beyond its own run directory, results/, public/, or any
  other conversation's brain; no other run id appears anywhere in the full transcript.
  KBH_GPU_LOCK_HELD never set. Commands that bypassed the python lock wrapper by calling the venv
  python directly were compile-only or CPU-only (nvcc/ptxas register checks, several with
  CUDA_VISIBLE_DEVICES="" for precompile, and CPU randn and signature timing at steps 320 and 322);
  every GPU run went through the lock. No shape, seed or input sniffing: the mode switches are on
  cache length (2560, 49152) and the streamed path on n_steps <= 256, all generic. Web: cloned
  github.com/Infatoshi/MegaQwen, which PROMPT.txt points to. At step 351 its own call to
  check_cuda_language returned a false negative (wrong argument); the grader's gate reports ptx.
  State kept across calls: the packed weight buffer, keyed on every parameter's (data_ptr,
  _version); the persisting-L2 window, left set after the call; a persistent fp32 workspace whose
  split counters reset themselves; an 8-slot pinned host ring for the streamed RNG guarded by CUDA
  events. No CUDA graph and no cached outputs.

comparison: >
  First regrade per shape 9683 / 5622 / 2328 / 705 tok/s at ctx 2k / 8k / 32k / 128k. Against
  DeepSeek V4.1 Flash (0.081: 9805 / 6962 / 3407 / 1170), Sonnet 5.5 (0.080: 15948 / 8600 / 2586 /
  721), Opus 5.5 (0.074: 14310 / 7302 / 2508 / 713) and Fable 5.2 (0.067: 8892 / 6147 / 2693 /
  858). At 128k Carbon reads about 2.15 GB of bf16 KV per step, so 705 tok/s is about 1.5 TB/s,
  level with the other bf16 caches; DeepSeek's lead there is its unscaled e4m3 cache (half the
  bytes) and Fable's is its lossless 12-bit packed mirror. Carbon's gap to Sonnet and Opus is at
  short context, 103 us per token at 2k against 63 and 70, where the step is weight and barrier
  bound (five grid.sync per layer, 20 per step, plus the host-RNG handoff).

