implication: >
  The number is a real full-precision megakernel's decode throughput with none of the DeepSeek
  shortcuts (bf16 KV, max-subtracted softmax, RNG in the timed window). Verdict is interesting, not
  clean, for two disclosed behaviours: the timed decode depends on a host thread drawing random
  inputs while the kernel spins waiting for them, so the score is sensitive to host CPU load (the
  reason the storm-overlapped regrade was redone); and the packed weight copy goes stale under
  .data writes, which no graded path makes. The 12:24 pm hang was a development-time half-warp
  shuffle deadlock that the agent diagnosed and fixed in about a minute; the final kernel uses
  per-group shuffle masks and passed check.py three times in a row on a quiet GPU; the host-wait
  path also completed under synchronous launches.
