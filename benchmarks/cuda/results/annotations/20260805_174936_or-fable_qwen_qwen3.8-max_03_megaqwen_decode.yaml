summary: >
  This run produced no agent output of any kind. The or-fable session
  initialized inside the agent container and its very first model call was
  answered by a synthetic assistant message reading "API Error: 402
  Insufficient credits. Add more using https://openrouter.ai/settings/credits";
  the session terminated on that same turn with terminal_reason=api_error and
  api_error_status=402. Zero input tokens, zero output tokens, zero cost, zero
  tool calls, and 2 seconds of wall clock. No solution.py, no CUDA sidecar, no
  scratch file, and no check or benchmark log exists anywhere in the archive.
  The harness failure classifier's label provider_insufficient_credits is
  accurate, and result.json correctly records has_solution=false. There is no
  kernel to grade, so no correctness, reward-hack, caching, CUDA-graph, or
  input-identity assessment is possible or asserted; contamination and
  template-integrity checks pass vacuously and byte-exactly respectively. The
  run is nonpublishable and must be excluded from any pass-rate denominator
  that counts only genuine model attempts; it is a provider-side truncation
  before the first token, not a model failure on the problem.

