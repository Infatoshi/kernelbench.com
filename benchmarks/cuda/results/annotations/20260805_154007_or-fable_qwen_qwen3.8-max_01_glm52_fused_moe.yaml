summary: >
  Natural-completion run whose official checker failed at extension build
  time, before any numeric comparison: the solution's CUTLASS include path
  candidates (/opt/pytorch/ao/third_party/cutlass/include and
  /opt/pytorch/pytorch/third_party/cutlass/include) exist only inside the
  agent's TensorRT-LLM development container, and neither exists in the
  official host check environment, so nvcc fails with "cutlass/cutlass.h: No
  such file or directory". This is a genuine candidate-code portability
  defect, not an integrity problem, not reward hacking, and not retryable
  infrastructure failure. The submitted source is a real CUDA C++ / CUTLASS
  SM90 grouped-GEMM fused MoE that recomputes from live inputs on every call;
  the trace shows the identical file passing the unmodified check.py
  (including all numeric-stress cases) repeatedly inside the container. No
  grader mutation, no forbidden ops, no contamination, no output caching, no
  CUDA graphs. correct=false stands; nothing from this run is publishable.

evidence: |
  Official outcome and genuine failure:
  - result.json records has_solution=true, correct=false,
    failure_reason=check_failed, retryable_infra_failure=false,
    template_mutated=false, check_exit_code=1, benchmark_exit_code=null,
    harness_exit_code=0, session_complete=true, elapsed 13,915 s agent +
    61 s check, container image nvcr.io/nvidia/tensorrt-llm/release:1.2.1,
    gpu_queue_mode=agent_container_native_profiling_path_wrapper_gpu_lock.
  - check.log shows the official check building the extension with
    /usr/local/cuda-13/bin/nvcc under
    /home/ubuntu/kb-cuda/outputs/runs/.../repo/.venv (CPython 3.11.15) and
    failing: "fatal error: cutlass/cutlass.h: No such file or directory" at
    cuda.cu line 11, with include flag
    -I/opt/pytorch/ao/third_party/cutlass/include. The traceback cites
    solution.py:560 (self._ext = _get_ext()) and solution.py:533
    (load_inline); those line numbers match the archived solution.py exactly,
    confirming the archived file is the one checked.
  - solution.py lines 31-39: _CUTLASS_CANDIDATES lists the two container-only
    paths and falls back to candidate[0] when neither exists. The official
    check host has neither, so the build cannot succeed there. Transcript
    Bash commands show the agent probing broadly for portable CUTLASS
    locations (find over /opt, /usr/local, /workspace for
    cutlass/include/cutlass/cutlass.h, excluding flashinfer/tensorrt) but
    only container paths existed to discover; the failure mode was invisible
    from inside the container, where check.py PASSED.
  - The checker never reached model execution, so no numeric comparison, no
    numeric-stress case, and no benchmark ran officially. benchmark.log does
    not exist and benchmark_status is not_run.

  Real requested operation (full solution.py read, lines 1-672):
  - CUDA C++ via torch.utils.cpp_extension.load_inline: counting-sort routing
    kernels (count_kernel, scan_kernel, scatter_pairs_kernel), vectorized
    uint4 gather (gather_rows_kernel), CUTLASS SM90 grouped GEMM through
    CollectiveBuilder / GemmUniversal / KernelPtrArrayTmaWarpSpecializedCooperative
    with three tile/cluster instances and nine raster/swizzle presets
    (lines 106-190), fused silu-mul kernel, grouped GEMM #2, and an fp32-accum
    weighted reduce (reduce_out_kernel) honoring live expert_weights and
    weight-1 shared experts. Every forward reads current x, expert_ids,
    expert_weights, and the live parameter tensors; group pointer tables are
    rebuilt host-side from the current sort each call.
  - No constant answers, no seed/shape lookup tables, no reference import, no
    result-file reads, no caller sniffing, no CUDA graphs, no output
    memoization. The only caches are (a) the autotuned preset pair keyed by
    (T, device) - a config, not an output - and (b) persistent scratch
    workspaces including out_bf16, which is fully rewritten by
    reduce_out_kernel on every call before being returned. Ordinary
    output-buffer reuse with per-call recomputation from live buffers; no
    pointer-keyed or input-identity-keyed output path exists, so no empirical
    recompute is required (and there is no result to publish regardless).
  - GLM52_CFG env override (forward, lines 655-660) merely forces the
    autotune preset choice; graders do not set it and it cannot alter
    numerics. os.environ TORCH_CUDA_ARCH_LIST="9.0a" (line 28) only pins the
    build arch, a legitimate build setting.

