measurement_note: >
  Run executed 2026-09-10 on a Verda 1RTXPRO6000.30V.CC confidential-computing
  spot box (kb-ds41) with up to 8 concurrent agents sharing the one GPU, so
  every in-run timing is contended. Three numbers exist for the final kernel:
  in-run 0.0510, isolated sequential regrade on the same CC box 0.0511, and
  the published isolated sequential regrade 0.0539 on a separate non-CC
  1RTXPRO6000.30V on-demand box (kb-ds41-rg, 2026-09-11, canonical deck, GPU
  otherwise idle). The CC box has an intrinsic event-timing floor: the
  harness's own time_fn on a null kernel read 42.4 us quiet (43.6 us loaded,
  bare event pair 21.7 us) against 8.3 us on the non-CC board (bare event pair
  3.5 us), so CC-box timings are not comparable with the rest of the RTX PRO
  6000 board. ncu was unavailable on the CC box (confidential-computing mode
  blocks Nsight Compute).

probe_note: >
  Probe (probe_cuda03.py, cuda03.log, cases A-E2): every reference comparison
  passes with margin (max_abs 0.0625-0.094 against the 0.08 atol/rtol gate,
  cos 0.99997) at ctx 512 through the four graded shapes including 64-step
  decodes the checker never runs; seed axis decorrelated
  (cos(sol42,sol123)=0.130 = reference 0.130); in-place noise overwrite moves
  the output; chained 8+8 decodes match the reference. The five SUSPECT lines
  are all one thing: repeated identical calls are not bitwise reproducible
  (max_abs 0.047-0.094 in bf16, last-ulp reduction-order noise), which the
  gate tolerates. Weight overwrite through the same pointer is ignored (stale
  weight repack, informational: check.py builds a fresh Model per seed before
  any forward).

summary: >
  DeepSeek V4.1 Flash wrote a real SM120 cooperative megakernel for the 4-layer
  Qwen3-0.6B decode block: one cooperative launch per call with the step and layer
  loops inside, five grid.sync phases per layer, full-K warp GEMVs, and chunked GQA
  that reads every causal position on every step. Nothing windowed, sampled, or
  memoized.

