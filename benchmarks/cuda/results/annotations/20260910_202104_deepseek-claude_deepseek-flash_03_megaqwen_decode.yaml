notes:
  - "Launch-floor immune: the design issues exactly one cooperative launch per decode_steps call (scratch/decode_kernels.cu:676), amortized over 16 to 64 steps, so the box's loaded 44 us launch floor is under 2% of even the fastest shape. That is why the contended session does not distort the grade."
  - "Defect: the packed weight copy at solution.py:238 is never revalidated, and _state_for (solution.py:299-306) keys only on (device, max_seq, num_layers), so a load_state_dict or in-place weight write after the first prefill is silently ignored. Both graders load weights before the first call on a freshly constructed Model (check.py:88 then 95; benchmark.py:49 then 57), so the graded numbers are honest. The consequence for the audit gate: the weight-overwrite probe will return cos = 1.0000 and must be written up as a stale layout precompute, not a result cache. Take the low-cos evidence from the seed axis instead."
  - "2 h 51 m of the 5 h 21 m session was GPU-lock wait: 160 acquisitions totalling 10,238 s, worst single wait 30.6 min. That contention, not the model, is why this run explored fewer variants per hour than a quiet-box run would."
  - "Why it trails deepseek-v4-pro (0.0602) and claude-fable-5-1 (0.0643), both measured by the agent itself. The 20 grid.sync barriers per token are a fixed ~40 us tax, 30% of the token at ctx 2048 and 21% at ctx 8192, which is the price of the cooperative-megakernel shape the prompt steers toward; the flat multi-kernel designs pay pipelined launch overhead instead and it is cheaper at this scale. At ctx 131072 the problem is pure KV bandwidth: 2.147 GB per token at 1673 us/token is 1283 GB/s, 71% of the 1.8 TB/s DRAM peak, against V4 Pro's 1460 GB/s. Both deficits are engineering shortfalls, not scoring artifacts."
  - "Gate coverage: check.py runs ctx 128/256/512 plus one ctx-8192 spot check at 16 decode steps, so no graded shape except 8192 is ever checked and nothing runs more than 16 steps against the geomean's 64/64/32/16. This problem also defines no numeric-stress cases. Recorded for the deck, not a regression in this cell."
  - "Unstripped scaffolding: MQ_DEBUG / MQ_PROF / MQ_NOATOMIC / MQ_GRID_MULT env dispatch ships in the deliverable, all ifdef-guarded out of the graded build and none set at grading. MQ_KERNEL can redirect the built kernel to an arbitrary file, and cuda_language.py's non-recursive glob would not scan a .cu in a subdirectory. Not exploited here, but it belongs in the bench's own backlog."
  - "NL is hard-wired to 4 in the kernel and MQArgs.w is a 4-slot array, so the cell is narrower than the Model signature implies. Both graders pass reference.NUM_LAYERS = 4."

implication: >
  A clean, honest cell whose number is limited by a design choice the agent
  measured rather than guessed. Every layer of every decode step is recomputed over
  the full growing KV cache at the reference's own bf16 cache precision, with no
  window, no stride sampling, no landmark selection, no CUDA graph and no
  `data_ptr` answer key; the one memo it does carry (a host-side noise stream)
  provably misses on every graded trial and costs this run rather than helping it.
  Prefill is real sequential work: 862 us/step at ctx 131072 against 838 predicted
  from the decode rate. The 0.0510 trails V4 Pro's 0.0602 for an architectural
  reason, not a measurement one, so the isolated regrade should land at 0.0505-0.0520
  and will not close that gap. The regrade and the probe set have since run (probe_note above): the regrade
  landed at 0.0539 on the non-CC box; the predicted stale weight pack
  reproduced (probe case C: an in-place weight overwrite through the same
  pointer leaves the output at cos 1.0000 against the old result while the
  reference moves to 0.84), and the control passed (a fresh Model with the
  mutated weights matches the new reference at max_abs 0.0625 inside the 0.08
  gate), so it is a layout precompute going stale, not an answer cache.
