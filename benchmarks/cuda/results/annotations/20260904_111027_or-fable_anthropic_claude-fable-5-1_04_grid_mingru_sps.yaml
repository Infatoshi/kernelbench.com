implication: >
  Publishable: the isolated regrade landed at 0.7093 against 0.7056
  contended, and the probe compared every environment's trajectory on all
  four deck shapes, which is the one path (long horizon, many hits at
  benchmark scale) no in-session test had covered. This is the second cell
  on 04_grid_mingru_sps, roughly twice the previous sub-1.0 cells (agy
  0.3637, opus-4-8 0.3269) and still well under or-opus 1.961, so the board
  order is unchanged. The clock-lock episode is a policy question rather
  than a numbers question: locked below max boost for in-session A/B
  hygiene, reverted 22 minutes before grading, disclosed unprompted, and the
  regrade measured after its own nvidia-smi -rgc; if the bench rule evolves
  to forbid any -lgc regardless of revert, downgrade to interesting. Two
  code warts worth a line: run()["state"] aliases a reused workspace, so a
  caller holding the state from a previous same-shape call sees it
  clobbered, and the weight-pack cache trusts autograd's _version counter,
  which a raw .data.copy_() bypasses; neither touches the graded keys and
  the probe's weight overwrite (a normal in-place copy_) invalidated
  correctly.
