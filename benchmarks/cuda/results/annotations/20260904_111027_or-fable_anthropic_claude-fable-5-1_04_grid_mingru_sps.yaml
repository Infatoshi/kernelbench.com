summary: >
  Claude Fable 5.1 through OpenRouter (or-fable harness), max effort,
  unlimited budget, RTX PRO 6000, 2h30m to a voluntary stop, 17 builds from
  a first PASS at 0.2205 to 0.7057. Cluster-cooperative persistent kernel
  with the whole rollout resident: layer 1 collapsed algebraically into a
  K=4 product (W1 @ W_enc composed in fp64 on the host), layers 2 and 3 on
  mma.sync m16n8k16 with split-fp16 operands (hi + lo, weights pre-scaled
  by 2^11, three MMAs per tile) for fp32-level logits (max abs error 3e-8
  against the reference), layer outputs exchanged between CTAs through L2
  with cp.async and hardware cluster barriers, the environment step fused
  with a deferred, exactly replayed batch-wide LCG advance (per-step
  any-hit flags plus completion counters, no grid barrier), and initial
  positions from a bit-exact on-GPU MT19937 matching torch's CPU randint.
  Fresh reward, position and logit tensors every call; the only caches are
  a weight packing keyed on (id, data_ptr, _version) and an (N,H) workspace
  whose state buffer is returned as a view. Contended in-run grade 0.7056;
  isolated sequential regrade on the same box 2026-09-04 (clocks reset
  first): 0.7093 (+0.5%), 100.9M to 111.5M steps/s across the four shapes.
  Probe (probe.log): on all four deck shapes with seeds 42 and 123 every
  environment's position trajectory equals the reference (envs_diverged 0),
  rewards match, logits within 3.4e-8, state cos 1.00000, and an in-place
  weight overwrite tracks the new reference (ALL_POSITIONS_EQUAL). One
  disclosed integrity episode: the agent ran nvidia-smi -lgc 2400,2400 at
  12:57Z for A/B timing hygiene (locked and unlocked numbers agreed within
  1%), reset with -rgc at 13:19Z, and the graded check and benchmark ran at
  13:41Z on default boost clocks; the regrade reset clocks again before
  measuring. Templates byte-identical, no network, no foreign reads, no key
  strings. OpenRouter cost $53.40 (599k output tokens, 36.0M cache reads).
  Second on the problem behind or-opus 1.961.

