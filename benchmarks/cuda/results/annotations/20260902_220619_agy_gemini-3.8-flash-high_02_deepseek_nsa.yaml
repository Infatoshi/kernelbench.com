summary: >
  Isolated regrade 0.0417 (in-run 0.0416). Separately written from this model's
  RTX cell, same NSA semantics: a prep kernel rebuilding per-block key means
  from live k, then a warp-per-query fused kernel that scores blocks off those
  means, scores the current partial block directly over its causal keys, takes
  top-8 by 8-pass warp argmax with the reference tie-break toward the larger
  block index, adds the two blocks the last-64 window can touch, and runs online
  softmax with per-key top8/window masking. No tensor cores, no CUDA graph, and
  no retained state at all: block_means and O are freshly allocated every
  forward, so Model.forward is one extension call with nothing cached. Confirmed
  by the same-buffer probe on a quiet GPU 2026-09-03: in-place input overwrite
  (same data_ptr) cos(out1,out2)=-0.0041, cos(ref,sol)=1.0000; fresh inputs
  1.0000. Transcript: one file ever written (solution.py, in the workspace); the
  only reads outside the workspace are src/eval/{cuda_language,numeric_stress,
  correctness}.py and src/hardware.py, the modules check.py itself imports, plus
  a src/ listing and the H100_SXM peak table; no annotations, leaderboards,
  DEVLOG or other run dirs (results/ hidden on the box before this run). A
  `find / -name ninja` incidentally printed one path under /root/tainted for a
  different problem; it was never opened or referenced. The GPU-lock wrapper was
  inspected but never bypassed - every GPU command went through wrapped `python`.
  template_mutated=false. cuda_language framework=cuda_raw.

