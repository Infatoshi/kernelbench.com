implication: >
  Publishable, and it cross-checks against this model's RTX cell exactly. The
  H100 number is less than half the RTX 0.0958 for two honest reasons: the bf16
  peak denominator is 989.5 vs 500.0 (1.979x) and the scalar kernel is 1.16x
  slower in wall clock on H100 (132 SMs, 67 TFLOP/s SIMT fp32, vs 188 SMs and
  125), and 0.0958 / (1.979 * 1.1616) = 0.0417. Real work is about 5.2 TFLOP/s
  of fp32 FMA on the S=8192 shape, near 8 percent of SIMT peak, which is the
  shuffle-bound ceiling for a warp-per-query kernel with no mma.sync. Same
  deck-shaped limits as the RTX cell: the score buffer and the two uint64
  selection masks hold 128 key blocks (exactly S=8192) and only D of 64 and 128
  are dispatched. ms is the headline for this problem.
