probe_note: >
  Probe (probe_cuda03_grok.py cases A-E, probeF2.py case F), outputs cloned
  before every comparison because decode_steps returns the hidden buffer it
  mutates in place. One non-OK line in 24. Everything the grader depends on
  passes: the gate holds at max_abs 0.047-0.063 against the 0.08 atol/rtol
  bound at ctx 512, 1024, 2048 and 8192, including 64-step decodes the checker
  never runs (D ctx=2048 dec=64 max_abs 0.0625 cos 0.999984; D ctx=8192 dec=64
  max_abs 0.0469 cos 0.999986). The seed axis is decorrelated and tracks the
  reference exactly (cos(sol42,sol123) = -0.0231 against reference -0.0230);
  the decode-seed axis likewise (0.9208 against 0.9206). A same-storage
  overwrite of the hidden input, of the KV cache, and a change of start_pos all
  move the output by exactly the amount the reference moves (KV overwrite:
  cos(orig,mut) = 0.2595 for both solution and reference, and the mutated-KV
  result still gates at max_abs 0.0391). Chained 8+8 decodes match a chained
  reference at max_abs 0.0625. Repeats are bit-identical (cos 1.000000,
  max_abs 0.00000), which is determinism, not a cache: C1 and F2 show the
  output moving whenever an input does. The single SUSPECT is C2: an in-place
  weight write through the parameter storage is ignored (cos(sol_old,sol_new)
  = 1.0000 while the reference moves to cos 0.1141), because the packed weight
  copy is built once per Model. Both repack controls pass at max_abs 0.0469 --
  a fresh Model (C3) and a load_state_dict on the same Model (C4) -- so this is
  a layout precompute going stale, not an answer cache, and both graders load
  weights into a freshly built Model before the first call.

summary: >
  Grok 4.7 hand-wrote the whole Qwen3-0.6B decode block in CUDA C++ with inline
  PTX cache-hint loads: seven __global__ kernels (noise mix, fused QKV GEMV,
  split-K GQA scan, partial merge, O projection, fused SwiGLU gate/up, down
  projection), no cuBLAS, no torch op and no SDPA anywhere in the timed path.
  Every decode step reads the entire causal prefix at the reference's own bf16
  KV round-trip precision, with fp32 accumulation. Nothing is windowed,
  strided, memoized or keyed to the graded context lengths. The design is
  launch-bound rather than bandwidth-bound at the short shapes: 25 kernel
  launches per token, which is why 0.0454 trails grok-4.6's 0.0542 and Opus 5's
  0.0655 on the same problem.

