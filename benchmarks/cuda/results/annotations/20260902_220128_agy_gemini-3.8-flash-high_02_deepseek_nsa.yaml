  Publishable. Real sparse-attention CUDA and a SIMT ceiling, not a hack: no
  mma.sync anywhere, so it lands with the other scalar NSA kernels on this GPU
  (deepseek-v4-pro 0.0945, grok-4.6 0.0796) and well below the tensor-core runs.
  Deck-shaped limits: the selection bitmask holds 128 key blocks (S=8192) and
  only D of 64 and 128 are dispatched.
