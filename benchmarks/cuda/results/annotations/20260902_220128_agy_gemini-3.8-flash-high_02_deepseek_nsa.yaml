summary: >
  Isolated regrade 0.0958 (in-run 0.0946). Two hand-written CUDA kernels behind
  load_inline: a prep pass rebuilding per-block key prefix sums and block means
  from live k, then a warp-per-query fused kernel that scores blocks off those
  means, takes top-8 with the reference tie-break, unions the last-64 window
  into at most ten intervals, and runs online softmax over them. No tensor
  cores, no CUDA graph, no output memoization; the only retained state is a
  shape-keyed scratch/output buffer that both kernels fully rewrite every call.
  Same-buffer probe on a quiet GPU 2026-09-03: in-place input overwrite (same
  data_ptr) cos(out1,out2)=-0.0041, cos(ref,sol)=1.0000; fresh inputs 1.0000.
  Transcript: every write inside the problem workspace, no reads of other runs,
  annotations or leaderboards (results/ hidden on the box before this run),
  grader read only via the src/eval imports check.py itself makes.
  template_mutated=false. cuda_language framework=cuda_raw.

