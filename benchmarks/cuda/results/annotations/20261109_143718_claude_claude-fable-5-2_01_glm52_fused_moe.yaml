summary: >
  Fable 5.2 treated the MoE layer as a weight-streaming problem. One prep CTA
  counting-sorts (token, slot) pairs by expert and builds balanced work lists;
  persistent CTAs then stream each expert's weights from DRAM once with
  warp-wide cp.async and bf16 mma.sync, fusing SiLU(gate) * up * route weight
  into the first GEMM's epilogue, and a combine kernel sums shared plus top-k
  outputs in fp32. The warp grid is picked per expert from its token count.

