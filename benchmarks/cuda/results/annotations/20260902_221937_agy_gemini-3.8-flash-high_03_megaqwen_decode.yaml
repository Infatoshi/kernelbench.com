  cache (about 73% of DRAM peak at ctx 128k), so the score measures the decode
  kernel; it lands mid-pack (fable-5 0.0778, opus-5 0.0655, grok-4.6 0.0542,
  ox-alpha 0.0392). The untimed prefill shortcut above ctx 8192, exactly where
