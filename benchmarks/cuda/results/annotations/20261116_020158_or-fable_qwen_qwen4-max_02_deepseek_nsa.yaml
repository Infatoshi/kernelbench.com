summary: >
  Qwen 4 Max wrote a key-stationary NSA pipeline in CUDA: tensor-core scoring on
  block-mean keys split into three bf16 planes, register top-8 with the reference tie rule, a
  per-key-block query list, mma attention tiles that load each selected K/V block once for up to
  128 queries, a window tile and a log-sum-exp merge, all in a pointer-keyed CUDA graph.

