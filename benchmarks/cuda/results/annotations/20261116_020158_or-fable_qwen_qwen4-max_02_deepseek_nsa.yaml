implication: >
  An honest, exact-semantics NSA kernel in the leaders' key-stationary family, with fp32-class
  selection and the reference tie rule. The overwrite probe shows the pointer-keyed graph
  recomputes from live memory, so the regrade measures real work; the graph saves about 4% of
  launch overhead and nothing else. At 0.1408 ms it is roughly twice Sonnet 5.5's latency and
  about 6.7x faster than Kimi K3.1 Pro (0.950 ms). The session's conduct was the cleanest of the
  four Qwen cells: it never left its GPU and refused to kill a sibling's job, while two sibling
  sessions killed six of its own (five by the MegaQwen session, one by the Mega session).

