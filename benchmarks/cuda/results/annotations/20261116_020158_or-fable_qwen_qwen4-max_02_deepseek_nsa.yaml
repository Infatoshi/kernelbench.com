notes:
  - "Family: key-stationary, the same family as the fast designs (Sonnet 5.5, Gemini 4 Carbon, Opus 5.5). Nothing in the graded path is new to the field: the three-piece bf16 split of block keys for tensor-core importance is also Sonnet 5.5's (its annotation lines 16-17), and bf16 partials with a log-sum-exp merge match Carbon's. Its own touches are the bucketed count/scan/scatter list with 128-query tiles, folding a selected block tb-1 into the banded window tile, and the pointer-keyed CUDA graph. The one original idea, the L2-resident locked online-softmax merge for D=128, was built, debugged through two deadlocks, measured wrong and slower, and switched off; its code stays in the file behind LOCKED."
  - "Numeric stress ran in the final graded check. check.py (byte-identical to the deck) runs all six graded shapes at seed 42 with the nominal and small_qkv cases; large_qkv is skipped by design (check.py:84-91). Nothing in the run dir sets KBH_NUMERIC_STRESS. check.log:7-8 shows the gate and PASS after a 326 s run (gpu_lock.log:485-486). The session also passed check.py on its own four times (scratch/check_run1..3.log, check_final.log) and ran its own dev suite including x8 inputs."
  - "Debugging arc, minutes 31 to 184: the first build had a reversed ldmatrix.trans assumption (it wrote a probe of hardware fragment layouts, records 371-388), a divergent warp shuffle, a per-head prefix overlapping a global list (record 617), a scatter offset double count, a tmap overflow invisible to memcheck inside torch's pool (record 1237), shared-memory OOB that does trap on SM120 (record 1383), a uint32 sort key losing its sign bit (record 1510) and a warp-local diagonal prefix (record 1547). It reached a working kernel at 77.6 min (0.2846) and passed its first official check at 87.4 min."
