prior_required_empirical_test: |
  Run exactly this in a fresh isolated RTX_PRO_6000 regrade workspace containing
  the archived solution plus the unmodified grader/reference. It deliberately
  overwrites the SAME model parameter buffers (unchanged data_ptr values),
  reuses the SAME model object and CUDA-graph cache key, compares the second
  call with a fresh reference computation, and verifies that the second replay
  did not overwrite tensors already returned by the first call:

      import torch
      import reference
      import solution

      device = torch.device("cuda:0")
      ref = reference.Model().to(device).eval()
      sol = solution.Model().to(device).eval()
      sol.load_state_dict(ref.state_dict(), strict=True)

      out1 = solution.run(4096, 32, 2026, model=sol)
      torch.cuda.synchronize()
      snap1 = {k: v.clone() for k, v in out1.items()}
      old_ptr = {k: v.data_ptr() for k, v in out1.items()}
      param_ptr = {n: p.data_ptr() for n, p in sol.named_parameters()}

      fresh = reference.Model().to(device).eval()
      fresh.reset_parameters(777)
      fresh_params = dict(fresh.named_parameters())
      with torch.no_grad():
          for name, p in sol.named_parameters():
              p.copy_(fresh_params[name])
          for name, p in ref.named_parameters():
              p.copy_(fresh_params[name])
      assert param_ptr == {n: p.data_ptr() for n, p in sol.named_parameters()}

      out2 = solution.run(4096, 32, 2026, model=sol)
      ref2 = reference.run(4096, 32, 2026, model=ref)
      torch.cuda.synchronize()

      assert torch.equal(out2["positions"], ref2["positions"])
      assert torch.equal(out2["rewards"], ref2["rewards"])
      assert torch.allclose(
          out2["last_logits"], ref2["last_logits"], atol=1e-3, rtol=1e-3
      )
      assert not torch.equal(out2["last_logits"], snap1["last_logits"])
      assert all(torch.equal(out1[k], snap1[k]) for k in snap1)
      assert all(out2[k].data_ptr() != old_ptr[k] for k in out2)

  The initial audit also requested repeating the second call in a fresh process
  and expected the last two assertions to expose rewards/last_logits aliasing.
  The final audit contract clarifies that destructive output-buffer reuse is
  permitted when every invocation recomputes current inputs and matches the
  reference. The ownership assertions did fail as anticipated, while the
  current-input recomputation contract passed.

