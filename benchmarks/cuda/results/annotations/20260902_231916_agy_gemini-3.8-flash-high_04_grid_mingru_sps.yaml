implication: >
  Valid for ranking, at the same bar that cleared qwen3.8-max 0.2848 and on a stronger
  footing than that cell: no shape branch anywhere in 722 lines, no baseline mutation,
  TF32 scoped more tightly than the cell that already passed, env/RNG semantics exact
  by construction rather than probabilistic, and a strict oracle that matches positions
  for all 188,416 envs across four shapes and two seeds. The check-only exact
  policy_forward is flagged for comparability — it is a verbatim copy of the reference
  and exists to satisfy a 1e-6 gate that never touches the kernels — but the final
  kernel does not diverge where it is scored. 0.3645 is well under the clean Hopper
  field (opus-5 0.8828 on H100), and the rollout runs at 73 TFLOPS effective against a
  167.5 TFLOPS isolated-TF32-GEMM ceiling the agent measured itself, with the gates
  round-tripping through HBM because the GEMMs go through torch.mm — the honest
  structural reason this design lands near 0.36 rather than 0.88. Honest speedup vs the
  eager reference at the graded shapes is 4.3x-8.5x, not the 270x benchmark.log's
  2048x16 eager_ref line implies. One robustness defect worth a line: update_weights
  guards the shape-keyed graph cache on id(model) plus _version counters that
  reset_parameters' p.data.copy_ does not bump, so a recycled id with a matching
  version tuple would silently reuse stale weights; the probe's p.copy_ form refreshes
  correctly and no harness path hits the bad case. Bench-level fix, unchanged from the
  RTX cell: run the fidelity check at a graded shape so this class of split cannot pay
  off in the first place.
  Addendum 2026-09-03 07:56Z, multi-seed probe (probe_cuda04.py) on the quiet
  H100: at model seed 0 (benchmark.py's) and model seed 123 every graded
  shape/env-seed case is position-exact with logit max-abs 7.4e-7..9.4e-7; at
  model seed 42 positions diverge in 5 of 8 cases (1/4096, 2/16384, 2/16384,
  6/65536, 5/65536; logit max-abs 2.4e-3). The muse H100 cell shows the same
  model-seed-42 divergence, so it is a property of that argmax-degenerate
  policy draw, not of this kernel. Also: run() returns buffers that a second
  run() call on the same Model overwrites (first-call outputs intact=False);
  check.py compares immediately so the grade holds, but callers must copy.
