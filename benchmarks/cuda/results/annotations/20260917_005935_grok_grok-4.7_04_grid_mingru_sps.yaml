measurement_note: >
  Run executed 2026-09-17 on tetra, a bare-metal box with two RTX PRO 6000
  Blackwell Workstation Edition cards, pinned to GPU 1 (KBH_GPU=1) while GPU 0
  carried an unrelated fine-tuning job. Five agents (mega 02, cuda 01-04)
  shared GPU 1 during the sessions, so the in-run 0.6542 is contended; the
  published 0.6398 is the isolated sequential regrade on GPU 1 with the
  canonical deck and no other compute process on that GPU. ncu was available
  to the agent through a sudo shim (KBH_NCU_BIN) because
  RmProfilingAdminOnly=1 could not be cleared without a driver reload;
  gpu_lock.log records whether it was used.

probe_note: >
  Probe ran on tetra GPU 1 in the bench venv (`uv run --no-sync`), solution.py
  and kernels.cu staged into /tmp/audit_grok_cuda04 beside the run's own
  reference.py / shapes.py / problem.yaml; outputs cloned before comparison
  because run() returns persistent buffers. 45 strict-oracle cases plus a
  12-case top-up covering every (shape, seed) pair benchmark.py actually
  grades (seed = 2026 + shape_idx, trials seed+0/+1/+2). Result: positions
  exact and rewards bitwise-equal at every graded shape and every graded seed,
  with run logits max-abs 2.3e-6 to 2.5e-6 and state max-abs 1.85e-5 against a
  1e-3 gate and `position_exact: true` - 0 mismatched envs out of 4096 /
  16384 / 65536 / 8192. The same holds at the checker shape (128x8), at four
  num_envs % 64 != 0 pads (100, 129, 1000, 4097), and at benchmark.py's
  1024x4 warmup key. Repeat with identical inputs reproduces bitwise; seed
  swap on the already-captured graph decorrelates and returns; horizon is
  affine at 4096 envs (per-step 44.6 us, intercept 0.108 ms, max residual 1.7%
  over h = 4/8/16/32/64/128), so no skipped-step or precomputed-trajectory
  shortcut. No allow_tf32 and no set_float32_matmul_precision anywhere in the
  file. Three non-OK lines, one of them a real defect: (i) SUSPECT - run()
  returns `rewards`, `last_logits` and `state` as the same persistent tensors
  on consecutive calls (solution.py:267-272, no clone), which is only a
  caller-aliasing hazard because every call re-zeroes and re-replays; (ii)
  FAIL - `reset_parameters` via `.data.copy_` bumps no `_version` and keeps
  the same `data_ptr`, so the packed-weight cache key at solution.py:144
  short-circuits and the rollout runs on stale weights: 4060/4096 positions
  wrong, reward sum 188 against the reference's 186, logits off by 2.2e-2;
  in-place `p.mul_(1.5)` (version bump) and a fresh Model (new pointer) both
  repack correctly, so check.py never reaches it; (iii) FAIL by construction -
  the rollout's hidden activations and packed GRU weights are float16
  (`h16`, `gates`, `WT`) against the reference's fp32, which is the finding
  below, not a fidelity failure.

summary: >
  Grok 4.7 built a CUDA-graph rollout in 53 minutes and scored 0.6542: an
  encode kernel, a cuBLAS fp16 tensor-core GEMM for the three gate matrices, a
  fused MinGRU highway epilogue that keeps the hidden state in fp16, and greedy
  action plus LCG food respawn, the whole horizon replayed from one graph. The
  headline question is the fp16: problem.yaml declares `precision: fp32` and the
  entire graded policy runs in half. It is not a blind downgrade. Nine minutes
  in, before writing a kernel, the agent ran a controlled fp32-vs-bf16-vs-fp16
  rollout at graded shapes, measured bf16 flipping positions and fp16 not, and
  picked fp16 on that evidence (transcript.jsonl:233). My independent strict
  oracle agrees at every shape and every seed benchmark.py grades: positions
  exact, rewards bitwise, logits 2.3e-6 against a 1e-3 gate. There is no shape
  branch on precision, no torch global is mutated, and check.py's own run(128,8)
  exercises the identical fp16 kernels. What the deck cannot see is the
  numeric-stress gate: solution.policy_forward is byte-identical PyTorch to
  reference.policy_forward, so the 1e-6 stress case measures exactly 0.0 and
  validates nothing about the kernels - the agent said so in its final message.

