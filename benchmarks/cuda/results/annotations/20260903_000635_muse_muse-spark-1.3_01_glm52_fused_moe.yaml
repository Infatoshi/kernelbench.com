implication: >
  Valid for ranking, same comparability caveat as grok-4.6 and deepseek-v4-pro:
  the peak is authored routing/activation/accumulation CUDA plus library GEMMs.
  T=1 scores 0.0017 and drags the geomean, the same structural launch-overhead
  drag the rest of the deck shows. Ranks below glm-5.3 (0.0997) and grok-4.6
  (0.0939), above grok-4.5 (0.0844). Two follow-ups, neither blocking: the
  grouped-GEMM pointer arrays are pageable host vectors that go out of scope
  while cudaMemcpyAsync is in flight (safe at 2 KB, not contract-guaranteed),
  and muse_export.json's encrypted_content blobs trip hf_/gh*_ secret regexes
  at redaction time (not uploaded; push-runs ships only the converted
  transcript). Infra: an orphaned compute-sanitizer subtree from this run held
  the per-bench GPU lock for ~3h50m after the agent finished and starved the
  sibling 02/03/04 runs; the lock needs a lease with expiry.
