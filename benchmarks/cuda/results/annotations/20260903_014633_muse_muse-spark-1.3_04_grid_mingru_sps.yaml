implication: >
  Not valid for ranking: the kernel is not a faithful MinGRU-grid step. It
  agrees with the oracle only for the weight draw the harness happens to hand
  it (reset_parameters(0) in benchmark.py, 128x8 in check.py) and computes
  wrong observations for 248/256 encoder units after every respawn. The fix is
  two __shfl_sync lines before solution.py:167 at negligible cost, so a
  corrected kernel would land near 0.2056, well under gemini-3.8-flash-high's
  0.3637 on this board. Bench-level: check.py's numeric-stress sweep tests the
  verbatim-reference policy_forward copy, so its only CUDA coverage is one
  run(128, 8) per seed; run the fidelity check at a graded shape with a
  non-default model seed. Infra: regrade_all.sh now runs nvidia-smi -rgc
  first because of this cell.
