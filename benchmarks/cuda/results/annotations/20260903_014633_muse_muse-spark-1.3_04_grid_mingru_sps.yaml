summary: >
  Isolated sequential regrade 0.2056 on the quiet RTX PRO 6000 2026-09-03
  13:08Z after nvidia-smi -rgc (in-run 0.2058 with SM clocks locked at 2430
  MHz, so the lock bought nothing). Real CUDA and real work: load_inline with
  three custom kernels (k_respawn_obs fuses LCG respawn + obs + encoder,
  k_math the MinGRU highway per layer, k_act_env the action head + argmax +
  move/clamp/reward + cross-block any-hit reduce), the three 256->768 gate
  GEMMs left to fp32 torch.mm, and the whole horizon captured once in a CUDA
  graph. No shape branch, no answer cache, no precision split, no fast-math,
  no TF32 or torch.backends mutation, no tolerance edit; _init_buffers
  re-seeds agent/food/rng/state on every call. The defect is a warp-broadcast
  bug in k_respawn_obs (solution.py:149-170): all 32 lanes load food into
  registers, only lane 0 applies the respawn, and the code relies on
  __syncwarp instead of __shfl_sync to publish it, so on any step after a hit
  248 of the 256 encoder units are computed from the pre-respawn food. A CPU
  emulation predicted exact agreement for the two weight/shape configurations
  the graders use and a failure at model seed 42 / 4096x32 (7/4096 envs,
  reward differs, logit 2.0e-3 > the 1e-3 gate); the multi-seed GPU probe on
  the quiet box reproduced that prediction exactly and worse at scale: at
  model seed 42 positions diverge in 8 of 8 graded cases (7/4096, 27/16384,
  123/65536, 16/8192) with rewards wrong in 6 of them, while model seeds 0
  and 123 are position-exact with logit max-abs 3.7e-9. That is a different
  mechanism from the tie-flip divergence the gemini and H100 muse 04 cells
  show at seed 42 (1-6 envs, rewards equal): here the kernel computes the
  wrong observation. Two more traps confirmed by the probe: _GCACHE is keyed
  on data_ptr with a copied w_gru_t but aliased w_enc/w_a, so an in-place
  weight overwrite yields mixed weights (cos(ref,sol)=0.99796 after
  overwrite), and run() returns the persistent buffers, which a second call
  silently mutates. Agent ran nvidia-smi -lgc 2430 (transcript 4307) and never
  reset it, disclosed in its final report; measured effect on identical code
  <=0.25% per shape, 0.00% on geomean. After a sibling run leaked the lock the
  agent ran its dev loop with an export PATH bypass from transcript 971
  onward; the graded check/benchmark were run by the harness under the lock
  as sole owner (gpu_lock.log:16-21). Only foreign-archive touch is the
  sibling 01 run's bin/gpu-lock-exec shim and an ls of its bin/ (different
  problem, no solution or result read): human verdict clean, mechanical
  excluder overridden. template_files byte-identical, template_mutated false,
  no credentials, no resemblance to the gemini kernel.

