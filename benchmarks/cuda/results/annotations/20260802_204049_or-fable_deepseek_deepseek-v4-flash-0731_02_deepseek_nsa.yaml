implication: >
  2026-09-03 long-context addendum. A probe on a quiet H100 SXM with the grader's
  own tolerance at S=1024 (H2 D64), S=1500 (H1 D128) and S=2048 (H2 D64), seeds
  42 and 123, is exact on five of six cases (maxdiff 0.0078-0.0156, cos 0.999998)
  but the S=2048 seed-123 output contains NaN. The mechanism is an
  under-initialized shared-memory accumulator: the region is laid out with
  stride DSTR = DIM+6 at D=64 (line 82; lines 97-98) but only Q_TILE*DIM floats are zeroed (line
  208), leaving 348 live slots at D=64 holding whatever the
  previous block left; a finite leftover is scrubbed by the exp(-inf) rescale at
  line 322, an Inf/NaN leftover is not. It is data- and schedule-dependent, not
  shape-specific. check.py grades only S=256/384 (all blocks selected) and the
  isolated regrade passed, so the published 0.0161 is a valid timing of a kernel
  whose math is correct at every graded shape, with a latent NaN hazard; verdict
  moved from clean to interesting. The same model's sibling RTX run
  20260802_203913 has a different, deterministic selection bug (see its
  annotation).
