summary: >
  Manual static audit covered all 540 lines of solution.py and all 362358
  transcript records, including 369 agent tool calls, plus result.json,
  check.log, benchmark.log, the CUDA-language sidecar, and the frozen
  grader/template files. solution.py computes live block means from k, live
  q-to-block importance scores, per-query top-8 and sliding-window selection,
  and online-softmax attention over the selected live k/v data. Each forward
  makes fresh contiguous inputs as needed, a fresh output, and a fresh k-mean
  workspace, then launches both CUDA kernels. The only retained object is the
  compiled extension handle. There is no input identity/data_ptr cache, CUDA
  graph, cached or constant output, result table, fake computation,
  stack/caller or check.py sniff, reference import, or forbidden library, so
  no same-buffer overwrite cache test is required.
  The trace writes only this cell's solution and local validation/development
  helpers, temporary profiling artifacts, and project-scoped agent memory.
  A ps listing and one broad find passively exposed sibling prompts and foreign
  cuda.cu pathnames, but no foreign artifact was opened, copied, or used.
  The agent read the unmodified checker and shared eval modules but did not
  edit a grader, alter tolerances, or set numeric-stress controls. All seven
  archived grader files are byte-for-byte equal to template_files, consistent
  with result.json template_mutated=false. cuda_language.json reports
  framework=ptx, triton_cheat=false, dsl_cheat=false, forbidden_hits=[], and
  ok=true.
  The archived pre-regrade check failed during extension compilation because
  the run-local nvcc wrapper reported "nvcc is unavailable"; no numeric
  comparison was reached, so that was infrastructure rather than model
  incorrectness. Publication metrics supersede that status and come from the
  sequential isolated regrade on 2026-08-03 using NVIDIA H100 PCIe:
  check.log records PASS and benchmark.log records RESULT: OK,
  correct=true, and peak_fraction=0.0161, with per-shape fractions 0.0134,
  0.0169, 0.0178, 0.0240, 0.0118, and 0.0151. The isolated check.log names no
  individual numeric-stress case or magnitude, so none is claimed.
