empirical_requirements: |
  - Run the unmodified CUDA-language gate and full official check.py against the
    exact recovered solution SHA-256
    d7d9de9d031966aa8e217335624423d80d70aa35b3095db4dbad28425612b3b7
    on an isolated RTX_PRO_6000. Preserve all three short-check seeds and the
    8,192-context spot check; report actual residuals rather than inferring PASS
    from the earlier trace.
  - Add a stateful decode oracle test with MQ_GRAPHS=1 that prefills once, clones
    K/V into distinct tensors, overwrites those cloned buffers in place with
    distinguishable valid prefix state, and calls decode_steps with them. Check
    both last_hidden and every returned cache against reference.decode_steps.
    This is expected to expose the static rt-cache substitution unless the
    implementation is repaired before grading.
  - Exercise the same graph key at least twice using the same hidden/cache
    storage but overwrite the hidden, cache prefix, and seed-derived input
    values between calls. Compare graph-hit results against MQ_GRAPHS=0 eager
    execution and the reference. Also test distinct cache objects at identical
    start_pos/n_steps and repeated prefill/decode on one Model instance.
  - After correctness, run benchmark.py sequentially under an exclusive
    machine-level RTX_PRO_6000 lock with the exact final source and normal
    environment. Keep any resulting metric unpublished because contamination
    is permanent; a publishable Qwen MegaQwen Decode cell requires a fresh
    sandboxed run with prior run artifacts inaccessible.
