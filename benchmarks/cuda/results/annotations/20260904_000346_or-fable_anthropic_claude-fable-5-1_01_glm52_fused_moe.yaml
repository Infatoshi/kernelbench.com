implication: >
  Publishable: the isolated regrade matched the contended grade exactly, and
  it is the board's second cell on this problem (0.1017 vs or-opus 0.1072), with the served model id matching
  the requested one. The number is measured kernel work: every geomean term
  is computed, the T=1 term is floored by the bytes formula charging all 257
  experts while 9 fire, and the rejected-experiment trail (CUDA graphs
  scored 0.0965 and were deleted) shows the final artifact was chosen by
  measurement, not by gaming the timer. Two coverage gaps the regrade
  probes closed (probe.log, all four checks at cos 1.0000): check.py caps T at 256, so the hist/scan/scatter alignment
  and the bf16-Y reduce path used at T=4096/4127/8192 were only compared to
  the reference at the T=2048 boundary by the agent itself; and the
  same-buffer overwrite probe ran in-session on the since-deleted graph
  variant, so it is re-run on the final build. Microbenchmark and ncu GPU
  work ran outside the gpu-lock wrapper via the sandbox's own REAL_* escapes,
  harmless on this dedicated box but a wrapper-coverage gap.
