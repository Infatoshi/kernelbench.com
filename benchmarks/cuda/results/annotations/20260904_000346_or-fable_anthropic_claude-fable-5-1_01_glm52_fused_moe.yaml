summary: >
  Claude Fable 5.1 through OpenRouter (or-fable harness), max effort,
  unlimited budget, RTX PRO 6000, 4h00m to a voluntary stop: persistent
  128x256x64 bf16 mma.sync grouped GEMMs with the gate/up N-tile interleaved
  so SiLU*up fuses in registers, a mainloop specialized on valid m16
  fragments so padded rows cost no tensor-pipe time, hist/scan/scatter token
  alignment for large T, fp32 L2-resident red.global.add accumulation for
  small outputs, and a CUDA-core GEMV decode path for T<=8. DSMEM operand
  exchange, TMA multicast, wider stores and a CUDA-graph replay variant were
  built, measured slower, and deleted. Graded 0.1017 geomean (per shape
  0.3587 / 0.3634 / 0.0026 / 0.6009 / 0.0538 / 0.1023); the agent's own last
  official run said 0.1018 and the graded file is byte-identical to the
  snapshot it validated. Isolated sequential regrade on the same box
  2026-09-04: 0.1017, identical to the contended grade. Overwrite probe
  (probe.log): primed cos(ref,sol)=1.0000; overwriting the input in place at
  the same data_ptr changes the output (cos(out1,out2)=-0.0007) and still
  matches the reference at 1.0000; overwriting the weights in place changes
  it again (0.0001) and matches at 1.0000; fresh inputs 1.0000. All template
  files byte-identical, no foreign
  reads, no clock commands, no key strings, two curl HEAD probes and no
  downloads, zero lock contention. OpenRouter cost $36.39 (381k output
  tokens, 28.9M cache reads). Second on the problem behind or-opus 0.1072.

