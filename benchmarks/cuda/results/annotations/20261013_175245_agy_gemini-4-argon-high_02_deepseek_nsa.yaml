summary: >
  Gemini 4 Argon wrote exact NSA selection and sparse attention as one tensor-core CUDA kernel, one CTA
  per 64-query block: the causal diagonal block on mma.sync, fp32 key means published between CTAs with
  release/acquire flags, a register top-8 over q·mean(k) with ties to the larger block, the 64-token
  window, and a cp.async-pipelined loop over the CTA's union of selected blocks with online softmax.

measurement_note: >
  Hardware is a Verda cloud RTX PRO 6000 Blackwell Server Edition (188 SMs, 96 GB), not tetra's
  Workstation Edition; gpu_name maps to the RTX_PRO_6000 key. Isolated sequential regrade 2026-10-13
  6:50-6:56 pm MDT after all five Argon sessions and their in-run grades had ended: check PASS
  (framework=ptx) on all six graded shapes with numeric stress, benchmark 0.0932 / 0.2357 / 0.3795 /
  0.6585 / 0.0603 / 0.1441 ms, geomean 0.190 ms (peak_fraction 0.5177, a context column for this
  problem). The board headline is milliseconds and geomean speedup over the frozen eager anchor. The
  harness in-run grade (0.5139, geomean 0.192 ms) ran under GPU sharing and differs by about 1%.
  Launched 11:52 am MDT, the session ended on its own at 6:37 pm after 405 minutes with result status
  SUCCESS; 4 h 13 min of that was its first full-shape correctness run (see integrity_note). The agy
  stream records the model only in its init event (gemini-4-argon-high, always-proceed); nothing reports
  a fallback. Usage: 1.19M input, 723K output (301K thinking) tokens; no cost reported.

probe_note: >
  2026-10-13 7:28 pm MDT on the regrade GPU, zero other compute PIDs, cuda venv, the run's own
  extension build. Log: audit_probes.log in the cuda 01 run directory on the worker (all four cuda
  cells). The oracle is a vectorised fp32 port of reference.nsa_attend (ties to the larger block index
  via a stable sort), validated against the graded reference at (1,2,200,64) and (1,1,300,128): max
  |diff| 3.6e-07 / 3.0e-07. Unseen seeds 2027 and 31337 at all six graded shapes: 12 of 12 PASS at 0.1,
  cos(ref,sol) 0.999998, mean |error| 1.2e-04 to 1.6e-04, max |error| 0.0073-0.0106, so no selection
  flips. Same-buffer overwrite of q, k, v at shapes 1 and 4: cos(out1,out2) -0.0049 / 0.0065,
  cos(ref,sol) 0.999998 / 0.999998, PASS, and five repeats are bitwise identical. The static K_mean /
  flag buffers are scratch with a per-call generation counter, so nothing carries over between calls.

integrity_note: >
  Read the final 974-line solution.py end to end. Selection semantics match the reference: off-diagonal
  block importance is q·(mean of the block's keys)·scale in fp32, equal to the reference's mean of q·k
  scores up to reassociation; the diagonal block uses the causal mean of its tensor-core scores over
  t-s0+1 keys; top-8 keeps (score, block) pairs with ties to the larger index like the reference's
  descending sort; blocks before index 8 are all taken; the previous block is attended in full if
  selected, else only from t-63, and is then cleared from the mask so no key counts twice. Precision:
  Q·K^T runs on bf16 mma with fp32 accumulation (inputs are already bf16), softmax in fp32, P rounded to
  bf16 for the P·V mma, output bf16. The lead about the first test: its run at transcript line 74 held
  the GPU lock 12:03-4:16 pm MDT (15,173 s), printed every shape and was then killed (exit 137); it
  compared a bf16 key-mean variant, which failed tolerance (max |diff| 0.17-0.20 nominal, 8.3e-04 against
  5e-04 on small_qkv), with an fp32 key-mean variant, which passed. The agent kept the fp32 key means and
  fixed a divergent warp-shuffle, after which the same test took 135 s. The final choices are inside the
  spec (precision bf16, tolerance 0.1, stress atol 5e-4 / 5e-2), and the probe errors sit at the bf16
  floor. Cross-CTA dependency: CTAs spin on flags written by lower-index CTAs of the same head, which
  relies on in-order block scheduling (true in practice, not guaranteed). No CUDA graph, no cache keyed
  on inputs, no grader import. No write outside solution.py and its scratch, no web access, no read of
  outputs/runs; it read src/eval (correctness, numeric_stress, timing, cuda_language) to reuse the
  checker in its own tests.

harness_note: >
  agy ran as the unprivileged benchmark user with the sandbox hiding the repo except this run's archive
  (canary pass). Its scratch directory, agy_brain/ (agy's brain/<conversation_id>: 21 test/profile
  scripts, 34 task logs), lived outside the run workspace and was copied into the archive afterwards;
  it references only this run. This session never bypassed the lock, but its 4 h 13 min lock hold is
  what pushed the cuda 01, 03 and 04 sessions to read the lock wrapper and run with
  KBH_GPU_LOCK_HELD=1, so all in-run numbers in this release are contended.

comparison: >
  Same selection semantics as the leader, Sonnet 5.5 (1.362 peak, about 0.072 ms geomean), which scores
  blocks on tensor cores and attends key-stationary. Argon's 0.190 ms is 2.6x slower but 5x faster than
  Haiku 5.5's CUDA-core version (0.98 ms). At 0.5177 peak it would sit just behind Fable 5 (0.727) and
  ahead of DeepSeek V4 Flash (0.502); Gemini 3.8 Flash scored 0.096 on this problem.

