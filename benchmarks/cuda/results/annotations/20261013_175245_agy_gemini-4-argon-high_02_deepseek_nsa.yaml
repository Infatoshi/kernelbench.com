implication: >
  A real fused NSA kernel with exact selection; 0.190 ms geomean is a fair second-tier result. The lead's
  precision question resolves in its favour: the one intermediate it tried in bf16 (key means) failed and
  was reverted to fp32, and what stays bf16 (P for the P·V mma) is the FlashAttention convention and sits
  at the bf16 error floor on unseen seeds.
