implication: >-
  Publishable: the audit-time isolated regrade reproduced the grade (0.0490 vs 0.0492
  contended), and the in-place weight-overwrite probe flipped the output as the
  pointer-keyed engine cache requires (cos(s1,s2)=-0.0194, new reference matched
  at 1.0000), so the design has no value-caching surface (engine caches pointers
  and tables only; weights are re-read via __ldg every launch). This is the openai/gpt-6-astra-pro
  cell on 03_megaqwen_decode: 0.0490, third behind claude-opus-5 0.0655 and claude-fable-5-1
  0.0643. The deficit is structural, not numeric: six cooperative grid.sync barriers
  per layer over 376 blocks versus five cheap barriers over 188 blocks for both
  leaders costs the two short shapes (0.1309 vs 0.2212/0.2286 at ctx 2048; 0.0888
  vs 0.1280/0.1254 at 8192) while the long-context shapes are within 15% and 8%
  respectively, all three runs bounded by the same 125.8 MB weights + 16 KB/ctx-len
  KV stream. Exact online softmax (no norm-derived constant shift) makes the numerics
  robust to arbitrary grader-seeded weight scales. Grid size is occupancy-derived
  (376 = 188 SMs x 2 blocks), so the binary is not hard-locked to this SKU but is
  tuned for it.
