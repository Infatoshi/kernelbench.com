summary: >-
  GPT-6 Astra Pro through OpenRouter (codex CLI 0.140.0 harness), xhigh effort,
  unlimited budget, RTX PRO 6000, 1h53m to a voluntary stop. One persistent cooperative
  megakernel: 376 blocks (2 per SM) x 256 threads, all decode steps x all four layers
  in a single cudaLaunchCooperativeKernel, six grid.sync barriers per layer (QKV
  | attention partials | cross-split combine | O-proj+residual | gate/up | down+residual).
  The 125.8 MB bf16 weight set is streamed with plain __ldg (no eviction policy);
  the KV cache streams evict-first via inline-PTX ld.global.cs. Attention is true
  split-KV flash-decoding: 47 splits per kv head with exact online softmax (running
  max + rescale, no fixed-shift trick), fp32 partials in global workspace, exact
  16-block cross-split combine; ctx 131072 uses the same path. RMSNorm/RoPE/SwiGLU
  fully fused; residuals fp32 in-layer, bf16 between layers; prefill is real, run
  through the same kernel. Fresh h_out (clone) and fresh seeded noise every call;
  engine caches hold only weight/cache data_ptr tables, RoPE table, and workspace,
  and weights are re-read from GPU memory every launch. Agent verified batched torch.randn
  equals the reference's per-step draw before relying on it. In-run grade 0.0488;
  isolated sequential trusted grade after session end 0.0492 (+0.8%): 6,545 tok/s
  at ctx 2048 down to 634 tok/s at ctx 131072. Audit-time isolated regrade 2026-09-07
  (clocks reset, sole GPU owner): 0.0490 (6,430 / 4,435 / 2,001 / 634 tok/s at ctx
  2048 / 8192 / 32768 / 131072; per shape 0.1286 / 0.0887 / 0.0400 / 0.0127), the
  0.0492 grade kept as benchmark.contended.log. Probe (probe.log): primed ctx 2048
  dec 16 cos(ref,sol)=1.0000; a second decode_steps call with seed+1 on the same
  model gives a different output (cos(s1,s1b)=0.3321) that matches its own reference
  at 1.0000; an in-place weight overwrite on the same parameter buffers flips the
  output (cos(s1,s2)=-0.0194) and matches the new reference at 1.0000. OpenRouter
  cost $53.83. All template files byte-identical, patches only to solution.py, no
  foreign reads, no clock commands, a failed `pip install ninja` (nothing installed),
  and sanctioned fetching of the MegaQwen baseline repo only. Third on the problem
  behind claude-opus-5 0.0655 and claude-fable-5-1 0.0643; the gap is the two short
  shapes, where 24 cooperative grid syncs per token over 376 blocks lose to the
  leaders' 5-barrier/188-block designs.
