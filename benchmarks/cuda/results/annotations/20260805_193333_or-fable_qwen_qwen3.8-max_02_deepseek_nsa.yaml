summary: >
  Clean cell. The passing 0.0452 implementation is genuine custom CUDA written
  entirely inside this sandboxed rerun: a six-kernel pipeline (block-mean/
  prefix-sum prep, warp top-8 select with the reference tie-break, bucket
  scan/fill, a tensor-core m16n8k16 scatter attention kernel with per-row
  spinlocked online-softmax merge, and a finalize divide) developed and
  debugged in-session over 4h18m through three architecture generations
  (v1 scatter -> v2 -> MMA rewrite). The container workspace contained only
  this problem plus the shared src tree; the transcript has zero references to
  any foreign run id, outputs/runs path, sibling problem, or network fetch, so
  the contamination that invalidated the 20260803 Qwen NSA cells is absent
  here. All seven grader files and the entire repo/src tree are byte-identical
  to the canonical H100 deck. Forward recomputes everything from live q/k/v on
  every call with a fresh output tensor: no pointer-keyed cache, CUDA graph,
  or input-identity behavior exists, so no empirical recompute is required.
  Grading ran on the dedicated per-GPU rerun queue with zero lock wait
  immediately after session end; publish_grade is true.

correctness_evidence: |
  - result.json records correct=true, failure_reason=pass,
    peak_fraction=0.0452, template_mutated=false, check_exit_code=0 (54 s),
    benchmark_exit_code=0 (3 s), session_complete=true. harness_exit_code=1 is
    the session terminator, not a grading failure: transcript lines 76306-76307
    are a synthetic assistant record (model "<synthetic>",
    stop_reason=stop_sequence, is_error=true) emitted at 23:51:56 after the
    final tool result "patched merge v4"; the harness then ran the official
    check and benchmark successfully at 23:51:57 (gpu_lock.log lines 1-6).
  - check.log lines 6-7: "cuda_language: ok framework=ptx
    evidence=global_kernel,cuda_header,ptx_inline" and PASS from the frozen
    checker: shapes (1,4,256,64) and (1,2,384,64), seeds 42 and 123, strict
    state_dict load (solution's _dummy bf16 buffer at solution.py line 825
    mirrors reference.py), and all three canonical numeric-stress cases for
    this problem per the byte-identical src/eval/numeric_stress.py lines
    114-126: nominal (0.1 bf16), small_qkv (q/k/v x1e-2, atol 5e-4/rtol 5e-2),
    large_qkv (x8, atol 5e-2/rtol 5e-2). The log names no per-case residuals,
    so none are claimed.
  - The implementation follows the reference pipeline on live data.
    nsa_prep_kernel (solution.py lines 57-104) recomputes fp32 block means and
    within-block prefix sums from the current K. nsa_topk_kernel (lines
    109-247) scores current Q against those means, uses the prefix mean for
    the query's own diagonal block (v/(r+1), matching reference's causal
    partial-block mean), and selects top-8. nsa_scan/nsa_fill (lines 250-289)
    bucket rows per selected block. nsa_scatter_mma_kernel (lines 322-649)
    loads each K/V block once into smem, serves selected rows for pre-window
    keys [0, w0-q0), own-block rows for [0, r+1), and next-block rows for the
    window tail [r'+1, 64), computes QK^T and PV with inline
    mma.sync.aligned.m16n8k16 tensor-core PTX, and merges per-row (m, l, acc)
    online-softmax state under a per-row spinlock. nsa_finalize_kernel (lines
    656-671) writes bf16 acc/l. This tiling exactly covers the reference union
    (top-8 blocks + last-64 window, causal) with no double counting: for a
    selected block at distance >=2 the window cutoff exceeds the block so the
    full block is served; at distance 1 the bucket range [0, w0-q0) and next
    range [w0-q0, 64) partition it; for the own block the bucket range is
    empty and the own tile serves the causal prefix.
  - Unlike the contaminated 20260803 lineage, the exact-tie semantics match
    the reference: solution.py line 207 uses imp[ii] >= bv scanning ascending
    block ids within a lane, and line 216 breaks cross-lane ties with
    ob > bbi, so equal importance prefers the larger block id, the same order
    as reference.py's reverse-sorted (importance, block_id) tuples. No tie
    caveat applies to this cell.
  - Supplementary in-run validation (not a substitute for the frozen check):
    transcript line 74175, immediately before the final solution was staged,
    shows the agent's vectorized-oracle sweep passing on all eight dev shapes
    including S=4127, S=3000, D=128, and both scale-stress cases
    (nominal max_abs 0.0078; scale 1e-2 max_abs 1.22e-4; scale 8 max_abs
    0.125), with zero elements outside the tolerance predicate. The earlier
    multi-lane-RMW race (line 68634, max_abs 0.499) was diagnosed and reverted
    to the proven single-lane locked merge before staging; the never-validated
    post-staging "merge v4" experiment went only to scratch/solution_mma.py
    (archived, 127 diff lines vs the graded file) and is not part of the
    graded solution.

real_operation_and_cache_review: |
  - Model.forward (solution.py lines 829-839) calls contiguous() on the
    current q/k/v, allocates a fresh torch.empty_like output every call, and
    invokes _ext.nsa_forward, whose launcher (lines 686-772) memsets the
    counts and locks regions and launches all six kernels on every invocation
    on the current stream. Every workspace region (kmean, psum, stACC, stM,
    stL, counts, offsets, cursor, locks, bucket, sel) is fully rewritten from
    the current inputs before use each call.
  - The only retained state is the compiled extension handle and the
    shape-sized fp32 workspace allocated on first forward (line 835); check.py
    and benchmark.py instantiate a fresh Model per shape, so the one-shot
    sizing is safe, and the workspace holds no output data across calls.
  - solution.py contains no os/sys/environ/inspect/getattr access, no
    data_ptr or tensor-identity comparison in Python, no CUDA graph or graph
    replay, no memoized or constant output, no reference import, and no
    check/benchmark sniffing (full-file scan; the only imports are torch,
    torch.nn, and load_inline). The 20260803 lineage's dormant _maxblocks
    hook does not exist in this rerun. Static recomputation is established,
    so no empirical same-buffer-overwrite test is required
    (empirical_recompute_required=false).

