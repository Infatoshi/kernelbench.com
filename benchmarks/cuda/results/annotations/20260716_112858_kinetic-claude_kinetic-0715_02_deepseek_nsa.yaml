summary: >
  Real input-dependent NSA in custom CUDA/PTX, but the ranking is done on
  bf16-rounded block means (solution.py:305), and that quantization flips the
  8th/9th selected block for a measurable fraction of ranking-eligible rows,
  so the kernel gathers different keys than the reference. The tie-break
  itself is correct (solution.py:630 uses (importance, block_id) descending,
  matching reference.py), which isolates the cause to the rounding. A
  long-context probe on an H100 SXM at the grader's own bf16 tolerance
  (atol/rtol 0.1) fails S=2048 H2 D64 on both seeds: maxdiff 0.1263 with
  cos(ref,sol) 0.999737 and 2 bad elements of 262144, and maxdiff 0.1392 with
  cos 0.999810 and 1 bad element of 262144. The shorter shapes only graze the
  limit and pass: S=1024 H2 D64 maxdiff 0.07715 / 0.09973, S=1500 H1 D128
  maxdiff 0.08716 / 0.1058. A handful of bad elements against ~0.01 drift
  everywhere else is one query's swapped block, not float noise. Reproduced on
  H100 SXM; RTX confirmation pending. The shipped docstring puts the rate at
  ~1e-5 of rows; the measured rate is two to three orders of magnitude higher.
  Everything in the provenance and evidence sections below still holds: no
  cache, CUDA graph, pointer dispatch, forbidden library, grader mutation, or
  cross-run contamination, and the score arithmetic reproduces exactly.

