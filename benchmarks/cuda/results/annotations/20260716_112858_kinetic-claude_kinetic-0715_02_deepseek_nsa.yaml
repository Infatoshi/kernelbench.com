implication: >
  The published 0.4246, the top score on the RTX PRO 6000 board for this
  problem, came from a kernel that does not implement the reference op at the
  timed shapes: at S=2048 it gathers a different block than the reference for
  some rows and misses the grader's own bf16 tolerance on both seeds. Every
  one of the six graded shapes runs the same bf16-ranked tile path, so none of
  them is exempt; check.py never catches it because it grades only S=256 and
  S=384, where every causal block fits inside top_n_blocks=8 and no ranking
  comparison ever executes. The cell should come off the board pending the RTX
  PRO 6000 re-run of the long-context probe. There is a second reason not to
  read 0.4246 as a like-for-like number: the agent built the fp32 adjudication
  that restores reference ranking, measured it in its own dev harness at
  geomean 0.4347 against 0.4725 for the shipped combination, called that ~8%
  perf cost, and removed it before submitting. Those are the agent's own
  numbers from its own harness, not an audit measurement, but the direction is
  its own conclusion: the semantically faithful variant it judged correct was
  about 8% slower than what it published. Nothing here changes the
  contamination or grader-integrity findings recorded above, which remain
  clean; this is a correctness verdict on the kernel, not on the run's
  conduct.
