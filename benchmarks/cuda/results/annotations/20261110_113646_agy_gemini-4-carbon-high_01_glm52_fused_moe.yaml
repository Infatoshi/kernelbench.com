summary: >
  Gemini 4 Carbon wrote the GLM-5.2 MoE layer as hand-written CUDA with inline PTX for SM120. One
  512-thread CTA counting-sorts the (token, slot) pairs by expert and builds a tile table (tile height
  32, 64 or 128 rows picked from the average tokens per expert); two grouped GEMMs then run on
  TMA-loaded weights with an mbarrier pipeline, cp.async-gathered activation rows, ldmatrix and bf16
  mma.sync, with silu(gate)*up fused into the first GEMM's epilogue and the routing weight applied in
  the second before red.global.add.v4.f32 scatters rows into an fp32 buffer. The shared expert is a
  dense TMA GEMM pair that writes that buffer first, a cast kernel produces bf16, and T <= 2 takes a
  separate two-kernel persistent GEMV path.

