comparison: >
  Same family as the leaders (sorted routing, two tensor-core grouped GEMMs, SiLU*up fused into the
  first, weighted atomic scatter). On the weight-bandwidth-bound shapes it is level with Sonnet 5.5
  (11.3%), Fable 5.2 (10.85%) and Opus 5.5 (10.4%): T=1 0.308 ms vs 0.306 / 0.318 / 0.327, T=512 8.10
  vs 7.96 / 8.05 / 8.13, T=1000 8.21 vs 8.02 / 8.26 / 8.25. The gap is the compute-heavy prefill
  shapes: T=4096 10.19 ms vs 8.57 / 9.27 / 9.46 and T=8192 16.13 ms vs 13.04 / 13.21 / 15.93 (182-230
  TFLOPS against Sonnet's 217-284), where its non-warp-specialized mma.sync GEMMs with a 2-3 stage
  pipeline sit closest to Opus 5.5. Its scratch warp-specialized end-to-end build timed 9.25 ms at
  T=4096 and 13.88 ms at T=8192 (step 233, in-run, not a result); folded in, that would project to
  roughly 0.108 (rough projection from unregraded in-session timings), so most of the gap to Fable is
  work the stream errors cut off, and Sonnet's T=4096 lead remains.

