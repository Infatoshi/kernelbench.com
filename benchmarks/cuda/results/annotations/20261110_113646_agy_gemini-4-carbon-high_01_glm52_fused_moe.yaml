implication: >
  A clean, real CUDA grouped-GEMM MoE: the kernel matches the leaders on decode and short batches and
  trails them on long prefill. The number is publishable once the re-regrade lands (expected near the
  first regrade's 0.1021). The session ended on provider stream errors rather than on its own, which
  left a faster scratch version unshipped; that is the model's result as delivered, not a scoring issue.
