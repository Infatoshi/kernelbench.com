summary: >
  Two grouped bf16 tensor-core GEMMs (mma.sync m16n8k16) over expert-sorted rows with the shared
  expert as an extra group: the up GEMM fuses silu(gate)*up, the down GEMM scales each row by its
  routing weight, and a last kernel sums the top-k rows plus the shared row. Routing histogram, prefix
  sums and scatter are recomputed every call; the intermediate h and per-expert outputs are rounded to
  bf16 before the fp32 final sum.

