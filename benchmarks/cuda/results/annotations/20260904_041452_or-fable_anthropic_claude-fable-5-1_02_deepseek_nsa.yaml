summary: >
  Claude Fable 5.1 through OpenRouter (or-fable harness), max effort,
  unlimited budget, RTX PRO 6000, 3h07m to a voluntary stop. Key-major NSA
  pipeline in raw CUDA with inline PTX tensor-core MMA: a fused select
  kernel (fp32 block mean keys split into three bf16 parts so ranking stays
  fp32-grade, masked causal-prefix mean for the home block, exact top-8
  under the reference (imp, block-id) tie-break via 64-bit sortable keys),
  a gather kernel writing flash-decoding partials per (query, block), and a
  window/merge kernel; the three launches replay as a CUDA graph with
  programmatic dependent launches. The check.py blind spot (S<=384 selects
  every block) hides nothing here: the agent's own tests against the exact
  python reference at S=1024/700/1100 and a vectorized oracle on all six
  deck shapes show zero out-of-tolerance elements, and a CPU emulation of
  the selection rule during pre-audit matched reference.nsa_attend
  selections on every one of 6,602 emulated rows at S=1024-2048, D=64/128.
  The agent measured and rejected a persisting-L2 trick whose gain came
  from the harness's inter-call cache flush. Graph replay is worth ~3%
  (0.9755 with, 0.9461 without). Per shape 0.060/0.106/0.109/0.218/0.054/
  0.080 ms; fractions above 1 are structural (dense-equivalent FLOPs
  against ~9% of the attention work). Templates byte-identical, no foreign
  reads, no network, no clock commands, no key strings, zero lock
  contention. In-session final benchmark 1.0586 equals the contended grade;
  isolated sequential regrade on the same box 2026-09-04: 1.0627 (+0.4%).
  Overwrite probe with cloned outputs (probe.log): primed 1.0000, in-place
  input overwrite at the same data_ptr changes the output
  (cos(out1,out2)=-0.0041) and matches the reference at 1.0000, the
  weight-overwrite step is a no-op at cos 1.0000 because the reference Model
  has no parameters (only a dummy buffer), fresh inputs 1.0000. Long-context probe past the check.py
  select-everything regime (probe_long.log): S=1024/1500/2048, D=64/128,
  seeds 42/123, all six ok=True at cos(ref,sol)=0.999998 and max diff
  <=0.0156 against reference.nsa_attend, LONG_CTX_OK. OpenRouter cost $53.15.

