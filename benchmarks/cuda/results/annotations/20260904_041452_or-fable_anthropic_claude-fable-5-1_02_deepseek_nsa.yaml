implication: >
  Publishable: the isolated regrade (1.0627) and the long-context probe both
  confirm it, and every audit question this problem usually raises has an answer in the
  archive itself. Selection is exact, not approximate: the three-way bf16
  split keeps ranking at fp32 noise level, which is what sank kinetic-0715
  (bf16-rounded means) and deepseek-v4-flash (swapped MMA fragment) on this
  problem. At 1.0627 it takes the top of the 02_deepseek_nsa board from
  claude-opus-5's 1.0367. Two readings need care. First, fractions
  above 1 are structural (dense-equivalent FLOPs against ~9% of the
  attention work), so the six millisecond numbers are the headline per the
  ms-anchored policy, not the geomean. Second, the CUDA-graph path returns
  the same output tensor object per input-pointer key, so the overwrite
  probe clones each output before comparing (probe_cuda_model.py does);
  the work itself is recomputed on every call. Off-deck shapes hard-error
  rather than falling back, which costs nothing on this deck.
