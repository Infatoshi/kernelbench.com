summary: >
  Solo rerun of Gemini 4 Neon (XHigh) on GLM-5.3 Fused MoE (following the lock-blocked V1
  0.1010 run). Wrote a self-contained 1,977-line SM120 CUDA C++/PTX/TMA kernel suite with
  zero CPU-GPU synchronization across four adaptive regimes: split-warp 128-thread streaming
  GEMV for decode (T <= 4); single-barrier hybrid cp.async + 3D-TMA (L2::evict_first when
  nm==1) with high-priority direct-store shared-expert overlap for small batches; disjoint
  2-bucket [BM=128, BM=192] hybrid 3D-TMA with low-priority shared overlap for medium batches;
  and sequential direct-store shared + universal 3-bucket [BM=128, BM=96, BM=192] schedule
  minimizing (padded_rows, m_tiles) for large batches, all reducing via SM120 vectorized
  red.relaxed.gpu.global.add.v4.f32. Lands 0.1105 (#2 overall, +9.4% over V1, fastest on board
  at T=1, T=512, and T=1000).

