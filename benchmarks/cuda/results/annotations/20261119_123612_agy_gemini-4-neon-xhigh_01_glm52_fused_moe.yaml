integrity_note: >
  Read the final 1,977-line solution.py end to end (sha256 6d888b7df5f26feb). Pure hand-written
  SM120 CUDA C++/PTX/TMA via load_inline (-O3 -arch=sm_120a -lcuda): zero Triton, zero cuBLAS,
  zero CUTLASS, zero torch math on the forward path, zero CUDA graph, zero weight preprocessing
  or input/routing identity cache. Every call recomputes routing from scratch (cudaMemsetAsync
  on expert_counts, histogram, prefix/multi-bucket schedule, scatter) and encodes fresh 2D/3D
  CUtensorMap descriptors from live data pointers. Persistent DeviceWorkspace g_ws[16] holds
  only regrowable scratch tensors and two non-blocking streams + two events; dual-stream
  shared-expert overlap brackets every call cleanly with ev_in_ready and ev_sh_done before
  routed GEMM2 reduces into out_fp32 (direct-store s==0 initializes every element of out_fp32
  without memset; n_shared==0 falls back to cudaMemsetAsync). Audited the single-barrier hybrid
  cp.async + 3D-TMA ring buffer (routed_gemm1_hybrid_tma_kernel): write stage (k-1)%STAGES is
  distinct from active read stage k%STAGES and separated by the prior iteration's __syncthreads,
  making it race-free. Audited the Regime 4 max_mt192 bound (total_tokens/129 + 1): every expert
  assigned bucket C satisfies c/mtc >= 129. All GEMMs and SwiGLU accumulate in FP32 and round
  to BF16 only on final output. Transcript (373 full steps, 92 thinking blocks, conversation
  4df7dda0-ea73-436d-b400-9e7979a42446): 91 run_command, 25 read_file, 14 write_file, 1
  edit_file, 1 manage_task, 12 schedule; 4 writes to solution.py plus scratch benchmarks, zero
  edits to graded files (template_mutated false). Sandbox canary PASS (11 foreign archives
  hidden, 15 lock shims, own PID namespace, GPU 2 only); kb lint CLEAN (authored kernel: True);
  kb contamination 0 hits; 0 web calls; 335 gpu_lock.log lines (100 exit 0, 10 exit 1, 1 exit
  143).

comparison: >
  At 0.1105, Neon's solo rerun jumps +9.4% over its lock-blocked V1 (0.1010) and takes #2
  overall on GLM-5.3 Fused MoE, passing Claude Fable 5.2 (0.1085), GPT-6.2 Astra (0.1064),
  Claude Opus 5.5 (0.1036), and Gemini 4 Carbon (0.1020), and trailing only #1 Claude Sonnet
  5.5 (0.1130) by 2.2%. Across the 6 shapes, Neon sets the fastest published latency on the
  board at T=1 decode (0.299 ms vs Sonnet 0.306 / Carbon 0.306), T=512 (7.921 ms vs Sonnet
  7.955 / Fable 8.054), and T=1000 (7.993 ms vs Sonnet 8.020 / Carbon 8.198), while trailing
  Sonnet on dense prefill compute at T=4096/4127 (8.829/9.069 ms vs 8.569/8.616 ms) and T=8192
  (14.215 ms vs 13.044 ms).

