summary: >
  Qwen 4 Max wrote the MoE layer in hand-written CUDA: a routing-sort
  kernel, a gate/up tensor-core GEMM with SiLU fused, a down GEMM and a
  weighted reduce. No cuBLAS, no input caching. It shipped a serialised
  pipeline because it blamed a race in its own code on the GPU, and
  benchmarked on two cards that were not its own.

