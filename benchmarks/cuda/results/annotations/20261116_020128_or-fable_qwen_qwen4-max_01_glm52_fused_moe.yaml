probe_note: >
  Predictions written before any probe ran. There is no cache keyed on input
  identity, version or pointer. The only cross-call state is self._ws, a dict
  keyed on (T, pad) holding six buffers, including the returned output tensor
  (solution.py:614-631); moe_align_kernel rebuilds the routing from expert_ids
  on every call, and x, expert_weights and all four weights are read live.
  Probe: probe_overwrite_moe.py next to this YAML. Part A gate at T=1/512/4096:
  cos(ref,sol) about 0.9999+, PASS. Part B copy_ overwrite of inputs and all
  weights at the same data_ptr: cos(out1,out2) low, cos(ref,sol) about 1,
  PASS. Part C .data overwrite of the three inputs (no _version bump): same as
  B, PASS. Part D: two calls at one T return the same storage, so the first
  output is overwritten by the second (prediction True, True, low cosine);
  check.py and benchmark.py never hold two outputs, so the grade is unaffected,
  but it is a usability caveat. Part E, harness-style timing on all six T,
  same inputs vs fresh clones per call: geomean ratio 1.00 within noise (no
  untimed work to hide). Optional Part F (--tail) tests the auditor's reading
  of the docstring's SM120 erratum (see notes): F0, wait_group<STAGES-2> as the
  session had it, should mismatch the shipped build on some reps at T>=512;
  F1, the same plus an empty commit_group when no load is issued, should be
  bitwise equal on all 20 reps and faster at large T (size of the speedup not
  predicted). Part F is diagnostic and does not change the verdict.
  RESULT, run 8:38:30 to 8:42:37 am CST on 2026-11-16 on tetra GPU 2 under the
  overnight-compute lease, zero compute PIDs on the card before the run and
  only the probe on GPU 2 in the host-wide GPU-use log for that window. (A
  first run on GPU 3 at 8:03 am overlapped another session's check.py and
  benchmark.py on that card, so its timings were discarded; its correctness
  results were the same.) Every prediction held. Part A cos(ref,sol) 0.999996 /
  0.999997 / 0.999997 at T = 1 / 512 / 4096, PASS. Part B copy_ overwrite:
  cos(out1,out2) 0.0085 / -0.0009 / 0.0000, cos(ref,sol) 0.999997 at all
  three, PASS. Part C .data overwrite (no _version bump, same storage):
  cos(out2,out3) -0.0282 / -0.0001 / 0.0005, cos(ref,sol) 0.999997, PASS.
  Part D: same storage True, first output now equals the second True at all
