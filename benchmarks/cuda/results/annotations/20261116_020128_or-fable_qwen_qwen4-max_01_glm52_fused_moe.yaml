implication: >
  The cell measures what the problem name promises: every FLOP is the model's
  own tensor-core CUDA, routing is recomputed inside the timed window, and
  nothing depends on benchmark.py reusing its inputs (unlike the Kimi cell's
  routing cache). At 0.0936 it sits in the lower middle of the board. A
  missing empty commit_group in the pipeline tail produced a race, the agent
  filed it as an SM120 hardware erratum, and it shipped a wait_group 0
  pipeline that serialises copy and compute. Probe Part F settles it: with
  the one-line fix the deeper pipeline is bitwise equal on 20 of 20 reps, so
  the erratum is not real and the write-up should not repeat it as fact. The
  misdiagnosis cost little speed (the fixed pipeline is 0.7% to 2.0% faster
  at the large shapes, 8.3% at T=1), so it is not why the kernel stops at
  9.4%. The GPU crossings are a harness gap, not
  a scoring problem: the session moved its benchmark to GPU 3 and GPU 1 on
  stale or unchecked readings, once onto a card another job was using, and
  misread that job's load as its own heat. Its in-session numbers are
  therefore not comparable with anything. Pin each session to its card
