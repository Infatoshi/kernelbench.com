comparison: >
  Same overall shape as the leader, Sonnet 5.5 (about 0.072 ms geomean): exact selection, then
  key-stationary attention that loads each selected K/V block once for all the queries that chose it,
  merged by log-sum-exp. Carbon keeps its partials in bf16 where Sonnet stores int8, and replaces
  Sonnet's three-piece bf16 split of the block sums with plain fp32 scoring (D=64) or a bound-guarded
  bf16 prefilter (D=128). Opus 5.5 (0.090 ms) and Fable 5.2 (0.117 ms) also keep fp32-grade selection
  with the reference tie rule; Fable runs a ticketed persistent scheduler with a dense path for
  S <= 2048. Carbon's superseded first regrade (0.0875 ms) would sit between Sonnet and Opus and well
  ahead of Gemini 4 Argon (0.190 ms); the placement waits for the re-regrade.

