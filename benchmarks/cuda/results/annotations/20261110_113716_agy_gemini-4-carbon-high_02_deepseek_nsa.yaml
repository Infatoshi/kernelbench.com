summary: >
  Gemini 4 Carbon wrote NSA block selection and sparse attention as four raw CUDA launches with
  inline-PTX bf16 mma.sync. A key-mean kernel stores fp32 block means of K; a per-query-block kernel
  scores every earlier block as q·mean(k) (exact fp32 FMA for D=64; for D=128 a bf16 tensor-core
  prefilter to 16 candidates, then fp32 rescoring wherever a Cauchy-Schwarz error bound cannot decide
  membership), takes the causal mean of the diagonal block from its tensor-core scores, keeps a top-8
  with ties to the larger block index, attends the diagonal block and the previous block (whole if
  selected, else only the sliding-window tail), and scatters each remote selection into a per-key-block
  bucket. A persistent key-stationary kernel loads each selected K/V block once and attends all of its
  bucketed queries, and an epilogue merges the bf16 partials by log-sum-exp.

