implication: >
  A real, exact-semantics NSA kernel in raw CUDA with a key-stationary design close to the leader's,
  and it gets there without int8 intermediates: selection stays fp32-grade (bound-guarded on D=128)
  and the only extra rounding is bf16 partial outputs. Publishable once the re-regrade fills the TBD
  score fields; until then quote no milliseconds from this cell.
