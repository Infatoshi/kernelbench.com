integrity_note: >
  Read the final 1485-line solution.py end to end (sha256 d6b8fb9f82c45001). Pure raw CUDA
  C++/PTX via load_inline: no Triton, no cuBLAS, no torch math on the forward path, no CUDA
  graph, no weight preprocessing or input/routing identity cache. Every call zeroes expert_counts
  and out_fp32 via cudaMemsetAsync, re-histograms and scatters expert_ids on GPU, runs all top-8
  routed experts plus shared expert(s) with FP32 MMA accumulation, bf16 intermediate h =
  silu(gate)*up, FP32 routing weights, and vectorized FP32 scatter-add fused into final bf16
  output by the last shared expert. Only persistent state is _WORKSPACES[device] scratch buffers
  regrown by capacity. Dispatch branches only on T <= 4 (decode GEMV) and average tokens per
  expert (bm = 32 when m_avg <= 20 else 64), never on seeds or values. Transcript (372 lines,
  conversation 7a6e83e4-6995-4fdc-82ad-e6547a16185a): 32 run_command, 15 read_file, 5
  manage_task, 1 write_file, 2 edit_file; every write targets solution.py (3x). Zero edits to
  graded files (template_mutated false). Sandbox canary pass (11 foreign archives hidden, 15
  lock shims, own PID namespace, GPU 0 only); kb lint CLEAN (authored kernel: True); kb
  contamination 0 hits; 0 web calls; KBH_GPU_LOCK_HELD never set (69 gpu_lock.log lines).

