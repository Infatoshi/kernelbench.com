  graded artifact fails the unmodified frozen checker on an undeclared
  identifier introduced by the agent's final mid-session refactor; that
  check_failed grade must not be relabeled as provider truncation, and the
  session's terminal 402 must not be laundered into a correctness claim for
  the earlier in-session passing variant, which was never archived or
  officially graded. There is no reward hacking, contamination, or template
