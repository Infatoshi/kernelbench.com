    mma.sync.aligned.m16n8k16.row.col.f32.bf16 inline asm throughout, explicit
    kernel launches in nsa_forward (lines 1102-1183), and load_inline at lines
    1190-1197 with TORCH_CUDA_ARCH_LIST="12.0+PTX" (line 25). Zero grep hits
    in the final source for any problem.yaml forbidden string: no triton,
