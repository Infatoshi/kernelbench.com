    lines 31-34), six __global__ kernels (ksum_prefix_kernel line 72,
    scores_kernel line 118, top8_kernel line 256, pairbuild_kernel line 341,
    group_attn_kernel line 373, window_mma_kernel line 674, merge_kernel line
