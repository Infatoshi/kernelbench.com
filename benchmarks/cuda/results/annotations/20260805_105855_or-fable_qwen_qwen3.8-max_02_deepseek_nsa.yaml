real_operation_and_cache_review: |
  - The extension never builds, so no computation of any kind was graded; this
    review is recorded for the archived design. nsa_forward (solution.py lines
    1078-1183) allocates a fresh torch::empty_like output per call, launches
    the full six-kernel pipeline on the current q/k/v data pointers and
    stream, and returns the fresh output; there is no constant answer,
    precomputed table, reference import, or caller sniff anywhere in the
    source.
  - Model.forward (lines 1213-1235) wraps _run in a pointer-keyed CUDA-graph
    cache: key=(q.data_ptr(), k.data_ptr(), v.data_ptr(), shape), capture on
    miss, ent[0].replay() then return ent[1] on hit, dict cleared past 24
    entries, eager fallback on capture exception. Graph replay re-executes the
    captured kernels, which re-read the live contents of the keyed input
    buffers and rewrite the captured output buffer, so a hit recomputes rather
    than returning a stale constant; the same output tensor object is,
    however, returned on every hit for a given key. Because the artifact fails
    the checker at import, no publication claim exists for this run and
    empirical_recompute_required=false is recorded as moot rather than as
    clearance: any future compiling descendant of this design must have its
    graph-replay input-identity behavior re-audited (and live-buffer recompute
    demonstrated) before publication.

