  cos(ref2,out2) = 0.999998 / 1.000000 at gate. Selection regime matches the
  reference on every graded geometry: (1,1,2048,64) cos 0.999998,
  (1,1,4127,64) 1.000000, (1,1,8192,64) 1.000000, (1,1,8191,128) 1.000000,
  (1,1,3000,64) 0.999997, (1,1,576,64) 0.999998, all gate PASS (LONG_CTX_OK).
  The vectorised oracle was itself validated against reference.nsa_attend at
  (1,2,576,64): cos 1.000000, maxabs 0.0001. One divergence, only under exact
  ties: with K built so every full block is bitwise identical,
  cos(reference, solution) = 0.9285 at (1,1,1024,64) and 0.9245 at
  (1,1,1024,128), gate FAIL. Re-running the same oracle with the tie-break
  flipped to smaller-id-wins gives cos 0.999936 / 0.999969, gate PASS, which
  pins the divergence exactly on the tie-break direction and nothing else.

summary: >
  Grok 4.7 hand-wrote an SM120 NSA kernel in CUDA C++ with nvcuda::wmma bf16
  m16n16k16 fragments, no cuBLAS and no torch op in the timed path: a
  block-sum kernel, a fused fp32 block-scoring plus top-8 kernel, a WMMA tile
  attention kernel for D=64 short sequences and a register-resident
  warp-per-query kernel for the long shapes and D=128. It computes the real op
  on every graded shape, verified against the reference at S=8192 and S=8191.
  It is also slow: 0.1002 of dense bf16 peak, against 0.5019 for the DeepSeek
  V4.1 Flash PTX kernel on the same problem.

