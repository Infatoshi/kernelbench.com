notes:
  - "The one real semantics defect, non-scoring: the reference's `block_imp.sort(reverse=True)` on `(importance, block-id)` tuples gives an exact tie to the LARGER block id (reference.py:58); the CONSIDER macro in solution.py:46-47 gives it to the smaller one. Demonstrated, not inferred: with K built so every full block is bitwise identical the solution fails the gate against the reference (cos 0.9285 / 0.9245) and passes against an otherwise identical oracle with the tie-break flipped (cos 0.999936 / 0.999969). It cannot fire on the graded deck or on check.py, both of which feed torch.randn bf16 where two fp32 block means never collide; the agent's own S=8192 sweep measured min_gap 4.3e-07 over 15,360 queries with zero flips (transcript.jsonl:214). The agent disclosed the direction in its final message (transcript.jsonl:924-1268) and encoded the same misreading in its own oracle (transcript.jsonl:204), so nothing inside the archive could have caught it."
  - "Coverage hole, the same one every cell on this problem has: check.py:57-60 caps S at 384, so 4 and 6 key blocks against top_n_blocks=8 means every causal block is selected and the selection path is never exercised by the trusted check. `correct: true` here says nothing about the selection regime on its own. The independent long-context probe has now run and passed: (1,1,8192,64) and (1,1,8191,128) match the reference at cos 1.000000, gate PASS."
  - "Dead code, non-scoring: `tc_compact_kernel` (solution.py:215-434, about 220 lines) is compiled but never launched by `nsa_forward`. It was the live path at the 0.0692 microbench, where the torch.profiler table at transcript.jsonl:770 names `tc_compact_kernel<64, 64>`, and it was dropped from the dispatch when the S<=3072 / long split won, without being deleted."
  - "Generality limit, not reachable from the deck: `TORCH_CHECK(n_blocks <= 128, \"nsa n_blocks\")` (solution.py:773) caps S at 8192, and the selection bitmask in warp_attend_kernel is four 32-bit words with `if (b < 0 || b >= 128) return;` (solution.py:696). The longest graded shape is exactly S=8192, so the deck sits on that boundary; anything longer throws rather than silently truncating."
  - "Contamination clean on every axis. Templates byte-identical to both template_files/ and the canonical deck at problems-rtxpro6000/02_deepseek_nsa (all seven files SAME), `template_mutated: false`, no tolerance edit, no check.py or benchmark.py edit. The agent read check.py, benchmark.py, problem.yaml, cuda_language.py, correctness.py, numeric_stress.py and timing.py, which is the documented flywheel, and wrote only solution.py. The only foreign run ids anywhere in the archive come from one `find /home/infatoshi -name python -path '*bin/python'` (transcript.jsonl:79) whose output listed hard-deck run directories from 2026-07 and 2026-08 as bare path names; no file under any of them was opened, and every read_file and grep target is inside this run dir, ~/.grok/skills, or /usr. One web_search call at transcript.jsonl:216 returned an empty result, and there is no web_fetch anywhere."
  - "benchmark.py ran exactly once in-session, at t=56.0, printing peak_fraction 0.1002 (transcript.jsonl:863), and the harness ran it once more to grade. Every other number in the trajectory is the agent's own microbench: median of 8 to 15 CUDA-event trials with a 32 MB L2 flush between trials against the harness's 128 MB flush, so the agent's numbers run slightly optimistic. Its 0.1006 microbench at t=54.9 and the harness's 0.1002 at t=56.0 are the same kernel."
  - "No precision shortcut hidden from the checker: scores accumulate in fp32 WMMA accumulators from bf16 fragments, the softmax weights are rounded to bf16 for the PV matmul (standard flash-attention practice, and what the DeepSeek PTX kernel on this problem does too), the online-softmax accumulator is fp32 and only the output is bf16. `--use_fast_math` is passed to nvcc for the agent's own extension only; there is no `allow_tf32` flip and no global torch state change at import."

implication: >
  Read the 0.1002 as an honest number for an honest kernel that is simply not
  fast: real WMMA fragments, real online softmax, real top-8 selection, no
  cache, no graph, no library call standing in for the kernel, and the correct
  answer on every graded geometry including the S=8192 selection regime that
  check.py cannot reach. The gap to DeepSeek V4.1 Flash's 0.5019 on this same
  problem is a 5x kernel-quality gap, not a measurement or integrity gap: this
  kernel loads K and V through plain uint4 copies with no cp.async pipeline,
  runs both the QK and the PV WMMA on warp 0 alone in the tile path
  (solution.py:333 and solution.py:396) while the other three warps wait at a
  barrier, and falls back to a scalar warp-per-query gather for the three
  longest shapes. The one thing worth carrying forward is the tie-break: two
  cells on this problem have now turned on how the reference's
  `sort(reverse=True)` resolves equal block importances, and the deck's own
  check.py cannot tell the two directions apart at any S it runs. Per the
  ms-anchored policy for this problem the headline is the six millisecond
  numbers, not the geomean; the isolated regrade is still outstanding and the
  in-run numbers were taken with four siblings on the board.

