notes:
  - "The 0.5615 reading at 20:55Z was a clock-boost island, not a code state. The agent snapshotted that exact file, re-ran it back to back at 22:47Z for 0.4844 against the deliverable's 0.4893 (transcript.jsonl:946167), and concluded the machine had drifted. All six shapes improved by roughly the same multiplicative factor at 20:55Z, which is a clock signature, not an algorithmic one; the two quiet-GPU readings minutes before the co-tenants started (0.4678 / 0.4710) sit in the same regime as every contended reading after."
  - "Defect, non-scoring: the graph path returns the same tensor object on every replay and the `_ref_base` guard is off by one (solution.py:828-835 against solution.py:883-886), so a result the caller still holds is judged free and silently overwritten by the next replay. `time_fn` discards the result and `check.py` rebinds before comparing, so it never touches the grade, but the same-buffer overwrite probe must clone each output before comparing or it will read a false 1.0000."
  - "Coverage hole, and the one that matters: check.py:57-60 caps S at 384, so the trusted check selects every block and never exercises the selection path, while the graded deck runs 16 to 128 blocks with 8 chosen. The agent's own oracle tops out at S=576. The long-context probe against the reference in the selection regime has since run and passed: (1,1,8192,64,11) and (1,1,8191,128,5) match the reference (LONG_CTX_OK, cuda02_long.log)."
  - "Second latent bug in the same area: `_get_scratch` frees the old BM/SEL when the shape changes while `self._graphs` still holds graphs recorded against those pointers. Not reachable from the deck, which builds a fresh `Model` per shape."
  - "Contamination clean on every axis: templates byte-identical, `template_mutated: false`, an intact bwrap jail whose results/DEVLOG/sibling trees were empty, zero git, network, `KBH_` or clock commands. The only sibling run ids in the archive are incidental `ps` output from hunting a GPU hog."

implication: >
  Read the 0.4879 as a real number for a kernel that deliberately leaves the
  sparsity on the table. All three NSA branches are implemented against the
  reference's own `(importance, block-id)` tie-break, the `data_ptr`-keyed CUDA
  graph caches launches rather than results and self-validates before use, and the
  one skip is a warp-uniform vote. At S=8192 the reference needs about 14% of the
  causal triangle and this kernel executes 78%, which is the whole 2.2x gap to
  claude-fable-5-1's 1.0627 and the reason the fraction stays under 1. Per the
  ms-anchored policy for this problem the headline is the six millisecond numbers,
  not the geomean. Both of those have since run: the isolated regrade landed at 0.5019 on the
  non-CC box, inside the predicted 0.48-0.52, and the same-buffer overwrite
  probe with outputs cloned passed (cuda02.log). The load-bearing check was neither: nothing in the archive itself compares the
  shipped selection code to the reference above S=576, and a prior DeepSeek
  cell on this same problem earned `bug` for a fragment swap that only showed
  up in the selection regime. That check has since run as well: the long-
  context probe matches the reference at S=8192 and S=8191 in the selection
  regime (LONG_CTX_OK, cuda02_long.log).

