summary: >
  DeepSeek V4.1 Flash hand-wrote an SM120 NSA kernel in inline PTX: mma.sync bf16,
  ldmatrix, xor-swizzled cp.async, and an fp32 block-scoring top-8 prologue fused
  into the attention kernel. It reproduces the reference's exact tie-break and then
  over-computes, executing about 78% of the dense causal block triangle where the
  semantics need 14%.

