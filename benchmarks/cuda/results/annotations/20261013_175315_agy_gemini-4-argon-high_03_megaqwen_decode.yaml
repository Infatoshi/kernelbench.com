implication: >
  The 0.054 is the kernel's real decode throughput; the prefill cache never touches the timed decode or
  the graded correctness path. It is a correctness defect for any caller that edits weights in place
  (cos 0.60 against the reference in the probe), the same class as Grok 4.7's stale packed-weight cache
  on 04. The persisting-L2 window and the lock bypass are disclosed context, not score changes.
