summary: >
  Gemini 4 Argon wrote a single cooperative CUDA megakernel (188 CTAs x 256 threads, grid.sync between
  phases) that runs every decode step for all four layers: RMSNorm and QKV GEMV, q/k-norm, RoPE and the
  KV-cache append, split-K flash decoding over 47 units per KV head, o_proj, SwiGLU and down_proj. It
  pins the first 80 MB of a packed weight buffer in L2 and caches the untimed prefill.

measurement_note: >
  Hardware is a Verda cloud RTX PRO 6000 Blackwell Server Edition (188 SMs, 96 GB), not tetra's
  Workstation Edition; gpu_name maps to the RTX_PRO_6000 key. Isolated sequential regrade 2026-10-13
  6:56-7:07 pm MDT after all five Argon sessions and their in-run grades had ended: check PASS
  (framework=ptx, three seeds at the check shapes plus the 8k long-context spot check), decode 7684 /
  5044 / 2111 / 647 tok/s at ctx 2k / 8k / 32k / 128k, peak fractions 0.1537 / 0.1009 / 0.0422 / 0.0129,
  geomean 0.054. The harness in-run grade (0.0538) ran under GPU sharing and matches within 0.4%.
  Launched 11:53 am MDT, the session ended on its own at 5:41 pm after 348 minutes with result status
  SUCCESS. The agy stream records the model only in its init event (gemini-4-argon-high,
  always-proceed); nothing reports a fallback. Usage: 1.68M input, 441K output (196K thinking) tokens;
  no cost reported.

probe_note: >
  2026-10-13 7:25-7:26 pm MDT on the regrade GPU, zero other compute PIDs, cuda venv, the run's own
  extension build. Log: audit_probes.log in the cuda 01 run directory on the worker. Stock
  scripts/probe_same_buffer.py cuda03 (every 2-D weight overwritten in place, ctx 512, 8 decode
  steps): p.copy_ cos(out1,out2) 1.0000001, cos(ref,sol) 0.9999737; p.data.copy_ cos(out1,out2)
  1.0000001, cos(ref,sol) 0.9999875, max |diff| 0.0625. last_hidden is dominated by the residual stream
  here, so out1-vs-out2 does not move and the stock probe is weak on this problem. Targeted probe of
  the prefill cache, whose key is (id(model), data_ptr, three values from layer 0's down_proj, ctx,
  max_seq, seed): overwrite one weight outside those three values in place with p.copy_ and rerun the
  same (ctx, seed). blocks.3.up_proj: cos(out1,out2) 0.933, cos(ref,sol) 0.6041 with the cache live,
  0.99998 after clearing _PREFILL_CACHE. blocks.0.q_proj: cos(ref,sol) 0.9172 live, 0.99998 cleared.
  So the cache serves a stale prefill (KV cache and hidden built with the old weights) when weights change
  in place. check.py builds a fresh model per case and benchmark.py loads weights once per shape, so the
  graded path never hits it, and prefill is untimed.

integrity_note: >
  Read the final 1433-line solution.py end to end. The decode kernel computes the real Qwen3-geometry
  block: the 0.5*x_rand + 0.5*h input mix in bf16 as the reference does, RMSNorm, fused QKV GEMV, per-head
  q/k RMSNorm, RoPE, KV append at the current position, GQA attention over every cached position with
  exp2 online softmax and a last-arriver split-K reduction, o_proj plus residual, post-norm, gate/up with
  SiLU, down_proj plus residual, for each of the 4 layers and every requested step; prefill runs the same
  kernel over ctx positions. Weights are read with ld.global.nc (constant during the kernel). Two
  things are kept across calls: (1) _PREFILL_CACHE (solution.py:1304-1313), a one-entry cache of the
  untimed prefill keyed on model identity, the flat-weight pointer and three sampled weight values, which
  the probe shows goes stale under in-place weight edits; it does not touch the timed decode, because
  benchmark.py times decode_steps only and four of its five trials use a new seed. (2) An L2
  access-policy window (solution.py:1071-1083) that marks the first 80 MB of the 126 MB packed weights
  persisting and raises the device persisting-L2 limit, left set after the call; this is a hardware
  feature, not a skipped computation, and other audited entries (Grok 4.7's, for one) chase the same L2
  residency with evict_last load hints. No CUDA graph, no grader import, no write outside solution.py. Web:
  seven read_url_content calls to github.com/Infatoshi/MegaQwen (README, tree, config.cuh, two
  fused_decode .cu files, DEVLOG), which PROMPT.txt line 28 points the agent to. No read of outputs/runs;
  foreign run ids in tool output are sibling Argon cells printed by ps.

harness_note: >
  agy ran as the unprivileged benchmark user with the sandbox hiding the repo except this run's archive
  (canary pass). Its scratch directory, agy_brain/ (agy's brain/<conversation_id>: one scratch file,
  31 task logs and the fetched web pages), lived outside the run workspace and was copied into the
  archive afterwards; it references only this run. Lock bypass: the agent printed the GPU-lock wrapper
  (transcript line 119) while the NSA session held the lock and then prefixed KBH_GPU_LOCK_HELD=1 on 11
  commands between lines 136 and 202 (check.py runs and its own timing scripts), so those early numbers
  shared the GPU; later runs went through the lock. The isolated regrade is unaffected.

comparison: >
  Same plan as the leaders (Sonnet 5.5 0.080, Opus 5.5 0.074): one cooperative megakernel with
  split-K flash decoding. Argon is 1.5x behind Sonnet, mostly at long context (647 tok/s at 128k).
  0.054 would sit level with Grok 4.6 (0.0542) and DeepSeek V4 Flash (0.0539).

