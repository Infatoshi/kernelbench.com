  comparison and one extension call; the only torch ops are setup (packing, RoPE tables, scratch,
  cache allocation, the seeded randn) in _prepare and prefill. No CUDA graph, no output memoization,
  no data_ptr identity check on inputs, no seed, shape or context special-casing (the 256-row decode
  input cap falls back to drawing in decode_steps). cuda_language gate: framework=cuda_raw,
  evidence=global_kernel (check.log:7). Trace (kimi_wire.jsonl, 153 tool calls): read the seven
  problem files plus its own repo copy of cuda_language.py and correctness.py (records 53-54); tried
