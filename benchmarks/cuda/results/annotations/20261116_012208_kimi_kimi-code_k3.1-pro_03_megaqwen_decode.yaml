implication: >
  A real full-model-slice megakernel in raw CUDA: bf16 KV and weights, fp32 math, one launch for the
  whole timed decode. Verdict interesting, not clean, for two disclosed choices the checker cannot see:
  the softmax drops the max subtraction (exact for the unit q/k gains every graded input uses, but it
  goes non-finite in the probe once the q/k norm gains reach 6), and the
  decode inputs are drawn in the untimed prefill, which shaves host work off the timed window (3.3% at
  2k context, measured). Both are the DeepSeek V4.1 Flash pattern on this problem, and the agent wrote
  down both as deliberate. The packed weights go stale under in-place edits, which no graded path does.
  Separate from the verdict: one 29 s timing job ran on GPU 2 alongside a qwen4-max session's job,
  because GPU choice is not enforced.

