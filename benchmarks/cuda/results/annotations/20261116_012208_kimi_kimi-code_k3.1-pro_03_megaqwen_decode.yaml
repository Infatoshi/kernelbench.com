notes:
  - "Off-GPU run. The agent's first device print showed it was on GPU 3 (uuid 6962f2fd..., pci_bus_id 241 = F1:00.0, record 55). At 1:50 am it saw GPUs 0 and 1 at 100% from another user's training jobs (record 382), concluded its own default device was GPU 0 (record 391), and ran one timing job with CUDA_VISIBLE_DEVICES=2 (record 450; executed 1:57:36-1:58:05 am per gpu_lock.log, holding only the gpu3 lock). GPU 2 hosted the qwen4-max cuda cells (their transcripts show CUDA_VISIBLE_DEVICES=2, bus 193 = C1:00.0), and the qwen4-max 01_glm52_fused_moe cell's quick_test.py held GPU 2's lock 1:55:09-1:59:09 am, so the two overlapped for 29 s. That may have perturbed the Qwen cell's in-session timing; it does not touch this cell's graded number. From record 543 on, every GPU command carries CUDA_VISIBLE_DEVICES=3, its assigned GPU, which it called 'perhaps free and isolated' (record 542). Harness issue: nothing stops an agent from choosing another GPU."
  - "The L2-persistence gain it credited was confounded. It measured the pin at +30% at 2k (record 477: 'Pin L2 huge +30% short'), but v3 ran on GPU 3 and v4 on GPU 2 during the Qwen overlap, and it noted 'exclusive GPU2 gives baseline comparison unknown but okay'. After it switched K/V to __ldcs streaming loads (+20% at 2k, record 680-681), its own same-GPU A/B with a temporary MQ_NO_PIN switch measured pin vs no pin at 9727 vs 9674, 5386 vs 5364, 2260 vs 2244, 687 vs 684 tok/s (record 981): about 0.5%. It kept the pin and removed the switch. Inference, not measured: once K/V stopped polluting L2, the unpinned weights stayed resident anyway, so the window adds little."
  - "It caught its own noise: the last-arriver combine (v9) first looked like +4.4% at 8k (5608 tok/s, record 897), and the later A/B on the same code read 5386; it wrote 'v9 8k 5608 anomalously faster due less variation' (record 987)."
  - "It considered and rejected an attention shortcut: 'Potential performance exploit use no attention over all cache approximate within tolerance? Must match last_hidden, cannot skip.' (record 559), and rejected fp8 weights as 'Not likely safe' (record 624). It kept the no-max softmax and the prefill-side RNG, both of which it reasoned were allowed by the problem's setup."
  - "It knew the packed weights would not track in-place edits and relied on the checker's protocol: '_prepare packed remains if model weights manually modified after prefill not reflected; expected load_state_dict resets. check reinit before load. good.' (record 969)."
  - "Numeric stress: this problem's check.py has no numeric_stress cases; its stress is the ctx-8192, 16-step long-context spot check after the three seeds x three short shapes (check.py:113-147). PASS is printed only after it, and check.log:8 shows PASS. The agent's own short checks reached max_abs 0.078 at seed 123 ctx 256 (record 897), inside atol+rtol but close to the 0.08 atol."
  - "Why it stopped, and a misdiagnosis behind it. Four of its GPU commands waited about 5 minutes each (gpu_lock.log: wait 1:45:12 start 1:50:30, 1:52:44 to 1:57:36, 2:12:43 to 2:18:23, 2:22:18 to 2:27:19). It attributed every one to slow nvcc under host CPU load ('Again compilation >300 due CPU?', record 459). The lock logs say otherwise: in each window a sibling Kimi cuda cell held the shared gpu3 lock (the NSA cell's 334 s and 342 s check runs ending 1:49:34 and 2:18:23, the glm52 cell's 294 s job 1:52:42-1:57:36); once the lock came free its jobs ran in 24-30 s including the build. It never read the lock wrapper. At 65.7 min it wrote 'Compile again long. Should stop making many variants due time.' (record 969), restored v9, cleaned the Python API, ran check.py and the full benchmark, and reported 0.0608 at 81.2 min. Remaining headroom it had named but not tried: fewer grid barriers and the 2k L2/grid-sync floor (record 912)."
  - "Its second ncu pass (LaunchStats, started 1:35:05 am) held the shared gpu3 lock for about 7.3 minutes with no output until the agent killed it as hung (record 278, 'The optional profiler pass hung'); gpu_lock.log has no end line for it. Cause not determined from the archive. The first and later ncu passes finished in 12 s."
  - "Model.forward exists for state_dict parity but is not graded; it is correct for one step only when the per-layer caches are views of one contiguous buffer, like everything else in this file."

comparison: >
