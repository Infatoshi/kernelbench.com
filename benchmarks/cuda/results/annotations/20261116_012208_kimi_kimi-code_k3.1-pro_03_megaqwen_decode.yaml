summary: >
  Kimi K3.1 Pro wrote one cooperative CUDA megakernel that runs every timed decode step of all four
  layers in a single launch: 376 blocks of 256 threads, five grid barriers per layer, split-KV GQA
  attention over a bf16 cache with a last-arriver combine, and the weights held in L2 with a
  persisting access window. Two shortcuts ride on the checker: the softmax skips the max
  subtraction, and the decode inputs are drawn during the untimed prefill.

design_note: >
  solution.py (642 lines, sha256 f3a9d52ccb9f...) compiles one kernel, decode_kernel, with
  load_inline (-O3 --use_fast_math, sm_120). decode_steps makes exactly one
  cudaLaunchCooperativeKernel for all n_steps (solution.py:483-485); prefill uses the same kernel
  for all ctx_len positions in one launch (solution.py:600-602). Per layer: every block redundantly
  computes the input RMSNorm into shared memory (layer 0 also forms bf16(0.5*x_rand + 0.5*h) as the
  reference does), then the fused QKV GEMV, one warp per row with 16-byte __ldg loads (grid.sync 1,
  solution.py:192). Attention: 47 splits per KV head x 8 KV heads = 376 blocks; each block applies
  q_norm and RoPE (fp32 tables built with the reference's formula) to its two query heads, the last
  split also normalizes, ropes and writes the new K and V for this position, and each warp walks
  two positions per iteration with 16-lane groups and __ldcs streaming loads. Partial numerators and
  denominators go to global scratch; an atomic per-KV-head counter lets the last-arriving split sum
  the 47 partials and divide (solution.py:314-332), which saved the separate combine barrier
  (grid.sync 2, :334). O projection splits each row across 4 warps and adds into the fp32 residual
  (grid.sync 3, :365); post-norm plus gate/up with SiLU (grid.sync 4, :400); down projection across 4
  warps writes bf16 hidden (grid.sync 5, :431, skipped after the last layer of the last step). So 20
  barriers per token minus one. The KV cache is one bf16 tensor (2, L, 8, max_seq, 128) allocated in
  prefill; the returned per-layer lists are views, and the kernel indexes all layers from
  k_caches[0] / v_caches[0] with a fixed stride (solution.py:128, 135-136, 621-623). Weights are
  packed once per model into a 126 MB bf16 buffer (solution.py:546-557). The host function sets a
  persisting L2 window over the first ~84 MB of that buffer (the device maximum) once per weight
  pointer, via a function-static (solution.py:458-482).

precision_note: >
  Checked against the shortcuts DeepSeek V4.1 Flash took on this problem. (1) KV cache: bf16 in and
  out, written with __float2bfloat16 where the reference casts; no fp8 or packed copy. Weights bf16
  read directly; activations, QKV, attention and residual in fp32; hidden rounded to bf16 at each
  block boundary like the reference. The agent considered fp8 weights and rejected it (kimi_wire.jsonl
  record 624). (2) Softmax: NO max subtraction. Each position's weight is __expf(score * 1/sqrt(128))
  (solution.py:263-266), summed into fp32 numerators and denominators across 47 splits and divided at
  the end. This is safe only because q and k are RMS-normalized with unit gains: |score| <= 128/sqrt(128)
  = 11.3, exp <= 8.3e4, and the 131k-position sum stays far inside fp32. The agent derived exactly this
  bound and noted it depends on the checker's unit norm weights (record 86). With per-dimension gains g
  on q_norm and k_norm the bound is 11.3*g^2, so fp32 exp can overflow (>88.7) from about g = 2.8 if a
  key aligns with the query. check.py and benchmark.py always use ones for the 1-D weights
  (check.py:35-36, reference init). (3) Decode inputs: prefill draws the seed+2 input rows for up to 256
  decode steps and copies them to the GPU (solution.py:603-607); decode_steps reuses them when the seed
  matches (solution.py:616-620), which is every graded call. The values are bit-identical to the
  reference's per-step draws (the agent checked, record 88), so numerics are unaffected, but the host
  RNG and H2D copy move out of benchmark.py's timed window. Size is unmeasured here; the timed decode at
  2k is about 103 us/step, and DeepSeek's audit measured the same move at about 4.5% at ctx 2048
  (projection, not measured for this kernel; probe P2 measures it).

