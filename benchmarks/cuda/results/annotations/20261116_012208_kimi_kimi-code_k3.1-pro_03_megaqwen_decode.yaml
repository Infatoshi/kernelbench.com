probe_note: >
  Run on tetra GPU 3, 3:51 to 3:53 am CST 2026-11-16, alone on the card (the GPU-use log shows only
  the probe process on GPU 3), against the archived solution.py and reference.py. The solution keeps
  state across calls (a packed weight copy rebuilt only by load_state_dict, a decode-input cache keyed
  on seed, a function-static L2 policy keyed on the weight pointer, in-place hidden/KV updates), so
  AGENTS.md item 3 requires the overwrite test. Predictions were written before the run and all held.
  P1 hidden and every K/V layer overwritten in place at the same addresses: cos(out1,out2) 0.245,
  cos(ref,sol) 0.999995 on both states; one V-cache layer negated in place: cos(out2,out3) 0.482,
  cos(ref,sol) 0.999993. Nothing is memoized. P7 same state twice: bit-identical. P2 decode-input
  cache: hit and miss both at gate (0.999992 and 0.999994); timed decode at ctx 2048 x 64 steps is
  101.7 us/step on a hit and 105.0 us/step with the draw forced back into the timed call, so the moved
  host work is 3.3% at 2k (one run, noise not measured; the reference-style per-step draw and copy
  costs 693 us per 64 steps, and the share shrinks at longer context where a step costs more). P3
  in-place weight edits after first use: stale for both copy_ and the tensor data (cos(ref,sol)
  0.053), fixed by load_state_dict (0.999989); the same class as the Gemini 4 Carbon and Fable 5.2
  packed copies, and never hit by the graded path, which builds a fresh model and calls
  load_state_dict per shape (benchmark.py:47-49, check.py:84-88). P4 q/k norm gain sweep from an
  identical cache: exact at gains 1, 2, 3 and 4, non-finite solution output at gains 6 and 8
  (the probe did not record the reference's finiteness there); the softmax without max subtraction is
  a real robustness hole outside unit gains. P5 decode-only at ctx 32768 and 131072 from the kernel's own prefilled cache: cos 1.000000
  and 0.9999992. P6 (informational) per-layer caches not laid out as one contiguous block: wrong
  output (cos 0.356), since the kernel indexes every layer from the first cache tensor; the graded
  path only ever passes the caches the solution's own prefill allocated.

integrity_note: >
