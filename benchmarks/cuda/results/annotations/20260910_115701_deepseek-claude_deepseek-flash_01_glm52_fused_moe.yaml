summary: >
  DeepSeek V4.1 Flash hand-rolled the whole GLM-5.2 MoE layer in inline PTX:
  mma.sync bf16 tensor cores, ldmatrix, xor-swizzled cp.async, hist/scan/scatter
  token packing, one code path for every T. Every expert GEMM runs on real
  weights at full K and N; row padding makes it burn 25-50% more FLOPs than the
  roofline charges. Error margin 2.5x inside the gate.

