implication: >
  Publishable as the deepseek-flash RTX PRO 6000 cuda 01 cell once the two GPU-side
  gates clear. It is the same class as the clean comparators on this problem
  (claude-fable-5-1 0.1017, gpt-6-astra-pro 0.0945) and explicitly not the
  deepseek-v4-pro class that drew `interesting` for routing its GEMMs through
  `cublasGemmBatchedEx`: there is no cuBLAS and no torch matmul here, only authored
  mma.sync. Nothing reads hidden material, times a baseline, touches clocks, or
  mutates a template; all seven template files hash byte-identical and
  `template_mutated` is false. The agent even considered and rejected a
  `data_ptr()`-keyed weight repack cache on correctness grounds. Three caveats to
  read the number with. First, `check.py:57` caps T at 256, so trusted correctness
  never covers the T=4096 / 4127 / 8192 shapes that carry the geomean; full-T
  agreement rests on the agent's own T=1000 and T=8192 harness runs quoted above.
  Same caveat is already on record for the gpt-6-astra-pro cell. Second, the kernel
  implements `n_shared = 1` and needs `H % 256 == 0` and `I % 128 == 0`, so it is
  narrower than the `Model` signature implies, though nothing in the deck reaches
  those edges. Third, shape 2 (T=1) prints `gbps=28924.977`, 16x above DRAM peak;
  that is the dense-eq formula charging all 257 experts' weights while only 9 fire,
  and the grade is `regime: compute` so the cosmetic gbps line does not enter the
  score. Still owed before publish: the same-buffer overwrite probe
  (probe_cuda_model.py) against `static Scratch g` at solution.py:557, and the
  isolated sequential regrade to replace the REGRADE_PENDING score. Source reading
  predicts the probe passes cleanly, but that is a prediction, not a measurement.
