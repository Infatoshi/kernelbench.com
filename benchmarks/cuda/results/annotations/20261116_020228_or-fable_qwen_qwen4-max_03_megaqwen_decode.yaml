summary: >
  Qwen 4 Max wrote one cooperative CUDA megakernel that runs every decode step of all four layers in a
  single launch (188 blocks, 5 barriers per layer, bf16 KV, softmax without max subtraction). The
  kernel is honest, slow at short context. The session killed five of a live
  sibling session's GPU jobs and ran an A/B on GPU 1.

design_note: >
  solution.py (241 lines) builds the sidecar megaqwen.cu (611 lines, archived in scratch/) with
  cpp_extension.load (-O3, sm_120). decode_steps makes one cudaLaunchKernelExC with the cooperative
  attribute for all n_steps (megaqwen.cu:577-603); prefill uses the same kernel for all ctx_len
  positions in one launch (solution.py:181). Grid = SM count (188), 768 threads, one block per SM, a
  hand-written sense-reversing grid barrier split into arrive and wait so cp.async weight staging into
  shared memory overlaps barrier convergence (megaqwen.cu:101-104). Per layer: A input mix (layer 0
  forms bf16(0.5*noise + 0.5*h) like the reference), RMSNorm and the QKV GEMV, warp per row over a
  balanced row range; B attention: block bid takes KV head bid&7 and a chunk of the cache sized
  ceil(C/23) rounded up to 32 (megaqwen.cu:291-293), q/k RMSNorm and rotate-half RoPE in-warp, block
  c0 == 0 appends the new K/V, cached keys read with an evict_first createpolicy hint, partial
  numerators and denominators added into fp32 workspace with atomicAdd; D O-proj plus residual; E
  post-norm plus gate/up; F SiLU*up and down. Five barriers per layer, 20 per token plus one per
  launch. Weights are packed bf16 per layer (q,k,v,o, interleaved gate/up, down) by Model._pack,
  which prefill calls on every call (solution.py:165); an 80 MiB persisting L2 access-policy window
  is set on the packed weights per launch (megaqwen.cu:592-596, MQ_L2 env, default on). The KV cache
  is one contiguous bf16 [L,8,max_seq,128] tensor allocated in prefill; the returned per-layer lists
  are views and the kernel indexes every layer from k_caches[0] (megaqwen.cu:295). All math is CUDA
  core fmaf with fp32 accumulation; no tensor cores.

precision_note: >
  (1) KV cache bf16 in and out; weights bf16; activations and accumulators fp32; hidden rounded to
  bf16 at each layer like the reference. (2) Softmax: no max subtraction. Each weight is
  expf(score*0.0884 - 12) with a fixed -12 shift (megaqwen.cu:187-188), summed by fp32 atomics and
  divided in phase D. It is exact for unit q/k norm gains, where the scaled score is at most
  128/sqrt(128) = 11.3, which is the bound the kernel header and the final message both state
  (megaqwen.cu:8; record 5417). With gains g it is 11.3*g^2, so fp32 exp can overflow once a scaled
  score passes about 100.7 (the -12 shift buys 12 over Kimi's 88.7), possible from about g = 3.
  check.py and benchmark.py always use ones for the 1-D weights. (3) Decode inputs: decode_steps
  draws the seed+2 rows on the CPU in fp32, copies them to the GPU and caches them in a module dict
  keyed (seed+2, n_steps, device) (solution.py:144-158, 200). Prefill does not fill it. The agent
  wrote at record 134 that benchmark trials use new seeds so each trial pays the draw inside the
  measurement region, and it kept it there; it did not move the draw into the untimed prefill as
  DeepSeek V4.1 Flash and Kimi K3.1 Pro did. Under benchmark.py's seed arithmetic (seed = 2026 +
  shape, trials seed+trial) the cache misses on every timed trial at 2k, 32k and 128k and hits on
  two of three trials at 8k (keys left by the 2k shape), so the 8k median is a hit. It measured the
  CPU draw for 64x1024 fp32 at 151 us (record 128); probe P2 measures the timed cost.

