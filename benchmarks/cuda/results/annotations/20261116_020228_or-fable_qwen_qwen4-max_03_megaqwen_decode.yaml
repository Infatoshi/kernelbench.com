implication: >
  The kernel is a real one-launch megakernel and plays fair on input timing: it leaves the decode
  draw inside the timed call on most trials, which the Kimi and DeepSeek kernels moved out. Verdict
  interesting, for the no-max softmax that the probe shows is exact only near the unit q/k
  gains every graded input uses. The bigger story is conduct, not the kernel: it killed five jobs of
  a live sibling session after deciding it was an orphan, ran a timing job on another GPU, and left
  a memory file with the wrong GPU mapping. At 0.0466 it is 17th of 28 on the board and last among
  the recent frontier cells, all of the gap at short context, after it spent 2.8 hours debugging a
  v3 that was meant to beat a v2 that was already faster than what shipped.

