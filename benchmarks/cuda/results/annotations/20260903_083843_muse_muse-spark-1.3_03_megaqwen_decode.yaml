implication: >
  Audit-only H100 SXM record (not a board GPU), and the strongest muse
  result on this problem: the first all-custom-GEMV design on it, where the
  gemini H100 cell is a cooperative megakernel and this model's RTX cell
  wraps cuBLAS. Two readings to carry. The number is graph-replay steady
  state: capture lands in untimed warmup and benchmark.py's median-of-5
  prices replay only, the harness's own rule, so it reads as a serving
  throughput figure. And the numeric gate tops out at ctx 8192 while the two
  heaviest timed shapes are 32k and 128k; the agent covered 32k itself and
  only claims 131k, and the audit probe reran the graph at 2048, so no
  harness-run numeric comparison at 131k exists. The agent read
  src/eval/correctness.py, cuda_language.py and sota.py, reads only with
  nothing edited: the same observation as the gemini H100 cell, and a harness
  decision whether gate source should be out of reach.
