implication: >
  Publishable, and the first H100 SXM cell for this problem. The timed decode is
  entirely custom CUDA and scans the full KV cache: effective bandwidth rises
  monotonically with context (0.84, 1.07, 1.44, 1.72 TB/s at 2k/8k/32k/128k,
  reaching 51% of the 3.35 TB/s roofline), which a truncated or windowed scan
  could not produce. Prefill is genuinely executed at all four shapes, so the
  prefill shortcut flagged on this model's RTX cell (and on the deepseek-v4-pro
  cell) is absent here - a separately written, strictly cleaner solution. The
  cooperative megakernel wins at long context (754 tok/s at 128k vs 615 on the
  RTX flat launcher) and gives most of that back at ctx 2048, where 25 grid.sync
  per token plus a 126 MB weight re-read hold it to 25% of peak. One observation,
  not a finding: the transcript reads src/eval/cuda_language.py eight times
  (lines 231, 634, 637, 640) - the language gate was read, never edited, and the
  model acted on it by deleting its scratch .cu files (line 917) so only
  solution.py is graded. If gate source should be out of agent reach that is a
  harness change, like the existing hiding of results/.
