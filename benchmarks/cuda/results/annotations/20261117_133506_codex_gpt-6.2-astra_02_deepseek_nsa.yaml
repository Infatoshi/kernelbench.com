probe_note: >
  Run 5:26:21 pm CST 2026-11-17 on tetra GPU 1 (UUID 39d157ef...) under overnight-compute lease
  audit-astra62-nsa; nvidia-smi listed no compute PIDs on any GPU before and after the probe.
  Script audit/probe_nsa.py, log audit/probe.log (both in this run's archive dir; reference.py and
  check helpers from the canonical deck, solution.py from the archive top level, sha256
  940e7ba619a1..., identical in the archive and the repo workspace). The solution has no cache,
  graph or pointer key (forward calls the extension, which allocates a fresh output and fresh
  workspace each call); data_ptr appears only for kernel arguments and a 16-byte alignment check,
  so the overwrite probe is a confirmation, not a requirement.
  (A) Same-buffer overwrite, pointers asserted unchanged, at (1,2,1024,64), (1,1,1100,128),
  (2,1,1000,64) and (1,2,4127,64), via copy_ and via .data.normal_: cos(out1,out2) -0.0291 to
  0.0264 (8 of 8 within |x| < 0.03), cos(ref,sol) 0.999996 to 0.999997 after the overwrite, gate
  PASS 8 of 8; the second call returns a new tensor (out1 untouched, no aliasing).
  (B) Tie test, every full K block identical, S=1024: on the 504 rows with t >= 512 and
  t % 64 != 63 the max row error is 0.0020 at D=64 and D=128 (0 rows above 0.05), so the solution
  breaks exact ties to the larger block id as the reference's reverse tuple sort does. On the 8
  rows with t % 64 == 63 the diagonal block's prefix-sum mean also ties in exact arithmetic and
  3 of 8 (D=64) and 5 of 8 (D=128) rows pick a different block (max error 0.085 / 0.069); gate
  PASS on both, cos 0.999937 / 0.999925. Same sub-ULP rounding-tie behaviour as the Qwen 4 Max
  cell, not a wrong tie rule.
  (C) Long context beyond the deck, which takes the select_long fallback (N > 128 blocks) that no
  graded shape exercises: (1,2,8193,64), (1,1,12345,64), (1,1,10000,128), (1,1,16384,64) all gate
  PASS, cos 0.999996, mean |err| 0.00012, max |err| 0.0078, max row error for t >= 8192 0.0005 to
  0.0020. Unlike the Qwen 4 Max kernel, this one is correct past S = 8192.
  (D) Layouts: non-contiguous q, q stored at a 2-byte-misaligned address (cloned by the solution),
  S=37 (D=128), S=1 and (3,2,65,64) all gate PASS.
  (E) Timing, quoted in measurement_note.
  (F) Unseen seeds 123 and 456 at all six graded shapes with check.py's own cases (nominal and
  small_qkv, tolerances from tolerance_for_case): 24 of 24 PASS, cos 0.999996 to 0.999998,
  nominal mean |err| 0.000119 to 0.000152 and max |err| 0.0078 (one bf16 ulp at magnitude 1-2)
  except 0.0156 at seed 456 shapes 3 and 5; small_qkv max |err| 0.00012.
  Probe ran 5:26:21 to 5:38:05 pm; the lease table shows other audits of this wave on GPU 0 and
  GPU 2 at the same time (and one GPU 0 process at the end), none on GPU 1, so the card was quiet
  but the host CPU was shared; part E still matches the regrade within 0.2%.

integrity_note: >
  Read all 619 lines of solution.py. One load_inline extension (nsa_block_routed_sm120, nvcc -O3
  --use_fast_math, sm_120), five kernels per forward plus one per head batch: prepare (grid N x
  BH, 256 threads) packs each 64-token K and V block into m16n8k16 fragment order, writes the
  fp32 block mean of K split into a TF32 high part and a TF32 residual (lines 101-105), and the
  causal prefix-mean score of each query against its own partial block, dot(prefix sum, q)/(r+1)
  (line 122), which is exactly the reference's mean over the causal part of the diagonal block;
  the common 1/sqrt(D) is dropped for ranking only. select_blocks (groups <= 4, i.e. S <= 8192)
  scores q against the block means on tf32 m16n8k8 mma as hi+lo (q is bf16, exact in tf32),
  then rank_query does a warp top-8 by repeated __reduce_max with ties to the larger block id
  (lines 161-169); queries with fewer than 9 causal blocks select all of them. Window blocks that
  are not in the top 8 get extra slots (lines 177-189) flagged so attend masks keys older than
  t-63 (line 229), while a selected block keeps its full causal extent: the union of top-8 and
  the 64-token window, as the reference. select_long handles N > 128 with a lane-0..7 insertion
  list (strict >, so later equal blocks rank higher, same tie rule). sparse_tiles launches only
  the lower triangle of (query chunk, key block) pairs, compacts the queries that routed to that
  block, and runs QK^T and PV on bf16 mma with fp32 accumulation, exp2f softmax per block, P
  rounded to bf16, writing a normalized bf16 partial plus a log2-sum-exp per (row, slot); combine
  merges up to 10 slots per row in fp32 and rounds to bf16 once. Head batching keeps the partial
  buffer under 96 MB so it stays in L2. Causal masking: key <= t in attend, no block past t is
  routed, every row includes key t. Numerics: approximations are bf16 P and bf16 partials (normal
  flash-attention practice) and fast-math exp2f; selection is fp32-class. Caches: only the
  lru_cache on the compiled extension; nothing keyed on input pointers or values, no CUDA graph,
  no stored outputs; all workspace is at::empty per call through the caching allocator.
  Generality: D in {64, 128} only (TORCH_CHECK), any S (probe C, D).
  Trace (codex_session.jsonl, 610 records, 82 exec calls): it read reference.py, shapes.py,
  check.py, benchmark.py, problem.yaml, sota.py, and src/eval timing, numeric_stress,
  correctness and cuda_language at the start to learn the contract; every write is to
  solution.py (cat > solution.py, sed -i solution.py, Path("solution.py").write_text). No
  grader, tolerance or reference edit, no KBH_ variable set, no web access; the problem files in
  the workspace are byte-identical to problems-rtxpro6000 (sha256 of reference, check, benchmark,
  shapes, problem.yaml match; result.json template_mutated false). Its own tests were an
  independent per-row selection oracle (spot checks at S 37, 923, 4127), exact-tie, misaligned
  and S=8193 checks, and compute-sanitizer (0 errors, line 406 message).
  Contamination flag: `kb contamination cuda` reports "8 other archives" for this run from
  codex_session.jsonl lines 35-36 (the same tool output twice, an item_completed event and the
  function output). At 1:35:32 pm, looking for a Python venv, it ran `rg --files --hidden -g
  pyvenv.cfg ... /home/<user> | head -60` (line 32). The file list included pyvenv.cfg paths
  inside eight archives of a stale tetra checkout at ~/dev/sites/kernelbench.com: three mini
  01_dequant_gemv (2026-07-23), the four Opus 5 cuda cells of 2026-07-25 (including
  02_deepseek_nsa) and one hard smoke run. It never opened, listed or referenced any of those
  paths again; no other outputs/runs path outside its own run dir appears in the trace. A file
  name in a search result, not a read. It then used benchmarks/cuda/.venv from the live checkout.
  Sandbox note for the operator: the bwrap sandbox exposes ~/dev/sites/kernelbench.com on tetra,
  including old archives, to the agent.

harness_note: >
  GPU lock bypass, self-detected and corrected. The runner serializes GPU commands through PATH
  wrappers (bin/python, bin/nvidia-smi -> gpu-lock-exec). From minute 6 the agent ran `source
  .../benchmarks/cuda/.venv/bin/activate && python ...`, which puts the venv's python ahead of the
  wrapper, so every check, benchmark and test from 1:41 to 2:33 pm CST ran without the shared cuda
  lock (gpu_lock.log has only three nvidia-smi entries before 2:33 pm). In that window the
  01_glm52_fused_moe sibling held the lock for its own jobs, including its in-run graded check and
  benchmark (2:10:30 to 2:20:37 pm, that cell's gpu_lock.log), and 03_megaqwen_decode ran its
  in-run benchmark from 2:21:21 to 2:35:44 pm while this session's unlocked check.py (pid 2433)
  was still running. Those sibling in-run numbers are contended; their isolated regrades are not
  affected. At 2:33 pm it read the wrapper, wrote "The CUDA virtual environment bypasses the
  harness's GPU lock when activated directly" (line 525), paused its own check with SIGSTOP,
  queued the final benchmark through gpu-lock-exec, resumed the check with SIGCONT once it held
  the lock, and ran the benchmark after it (gpu_lock.log lines 10-12). Not a deliberate evasion;
  it is a harness hole any agent that activates the bench venv falls into.
  Conduct otherwise clean: the sandbox's PID namespace showed only its own processes, and pid 2433
  (the STOP/CONT target) is its own check.py (ps output at 2:09 pm). No kill of another process,
  no pkill, no CUDA_VISIBLE_DEVICES change in any command; its device-properties query at minute 2
  reports UUID a417b037 (GPU 2), the cell's assigned card. Its lock-owner checks printed only "this run" or "another run", never a
  sibling path.

