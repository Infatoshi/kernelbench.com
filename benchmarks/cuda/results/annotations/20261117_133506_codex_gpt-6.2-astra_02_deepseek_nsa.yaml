summary: >
  GPT-6.2 Astra wrote a key-stationary NSA pipeline in one hour: K/V pre-packed into tensor-core
  fragment order, block selection scored on tensor cores with fp32-class TF32 hi+lo block means and
  the reference tie rule, each selected 64-key block attended once for every query that chose it,
  then a log-sum-exp merge. 0.123 ms geomean, no caches or graphs.

