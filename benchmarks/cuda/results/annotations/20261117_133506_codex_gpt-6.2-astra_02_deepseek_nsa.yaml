notes:
  - "Family: key-stationary, the same family as the board leaders (Sonnet 5.5, Gemini 4 Carbon, Opus 5.5) and Qwen 4 Max. Its own touches: TF32 hi+lo block means (two tf32 mma per tile instead of the three bf16 planes Sonnet 5.5 and Qwen 4 Max use), K/V pre-packed into mma fragment order once per call so the attend kernel loads fragments with one uint4 per lane, a lower-triangle-only tile launch, and head batching that keeps the partials buffer in L2."
  - "Numeric stress ran in the final graded check. check.py (byte-identical to the deck) runs all six graded shapes at seed 42 with the nominal and small_qkv cases; large_qkv is skipped by design (check.py:84-91). check.log:7-8 shows the gate and PASS. Probe part F adds unseen seeds 123 and 456."
  - "Pace: first build at minute 7 (one compile error, a missing math_constants.h include), first benchmark 0.4893 at minute 7.6, first full check PASS at minute 16.6, best in-session 0.9270 at minute 31 (unlocked), declared done at minute 65 after a locked check PASS and benchmark 0.8415. About half the session (minutes 33 to 65) was waiting on the slow reference check and its own lock fix."

implication: >
  An honest, exact-semantics NSA kernel: fp32-class block selection with the reference tie rule,
  the top-8 plus window union, causal masking, and no cache of any kind, so the regrade measures
  real work every call (overwrite probe cos(out1,out2) about 0, cos(ref,sol) 0.999997). At 0.1231
  ms geomean it is fifth on the published board in latency, behind Fable 5.2 (0.117 ms) and ahead
  of Qwen 4 Max (0.1408 ms), reached in 65 minutes and 45k output tokens. The one conduct issue,
  running unlocked through the activated bench venv for 52 minutes, contended its siblings'
  in-run numbers only; the agent caught and fixed it itself, and the harness hole should be closed.

