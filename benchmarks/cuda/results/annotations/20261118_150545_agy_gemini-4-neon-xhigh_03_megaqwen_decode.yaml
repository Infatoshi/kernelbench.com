  into ss_mid/ss_x for RMSNorm sum-of-squares. (6) CUDA_LAUNCH_BLOCKING=1 (ctx=64, 4 steps)
  completes cleanly in 0.35 s, all finite.

integrity_note: >
  Read the final 2112-line solution.py end to end (sha256 faac401ebde3e7d5). Pure raw SM120 CUDA
  C++/PTX via load_inline with CUDA Graph capture and PDL (griddepcontrol.wait /
  launch_dependents). decode_steps computes the exact PyTorch CPU MT19937 + Box-Muller noise
  sequence on GPU inside the timed graph (mt_step0_and_mix_kernel / mt_u32_rest_kernel), never on a
  background host thread and never precomputed in prefill. All 4 layers attend over every cached KV
  position in exact bf16 using split-KV online softmax (ex2.approx.ftz.f32 on max-shifted logits,
  evict-first/streaming KV loads at long context). Intermediate activations (x_ln, h_mid_ln,
  attn_out, mlp_act) are stored in FP16 (__half, higher mantissa precision than bf16 at unit scale)
  while weights, KV cache, and residual hidden states stay bf16. Weight packing is keyed on
  _param_versions() and invalidated on _load_from_state_dict. Transcript (1063 lines, conversation
  74563f5c-7280-48d6-a952-027427effef7): 110 run_command, 37 read_file, 24 write_file, 61
  edit_file, 2 manage_task, 2 search_web; writes target solution.py (68x) plus scratch probe
  scripts. The only web queries were two searches on Infatoshi/MegaQwen, which PROMPT.txt
  explicitly references. Zero edits to graded files (template_mutated false). Sandbox canary pass
  (11 foreign archives hidden, 15 lock shims, own PID namespace, GPU 0 only); kb lint CLEAN
  (authored kernel: True); kb contamination 0 hits; KBH_GPU_LOCK_HELD never set (378 gpu_lock.log
  lines).

comparison: >
  At 0.0755 (14,499 / 7,435 / 2,594 / 725 tok/s), Neon lands #3 overall on MegaQwen (and #2 among
  clean / full-bf16-KV submissions), behind DeepSeek V4.1 Flash (1017) (0.0812, interesting for FP8
  KV compression) and Claude Sonnet 5.5 (0.0800, clean), and ahead of Claude Opus 5.5 (0.0739,
  interesting), Claude Fable 5.2 (0.0671, interesting), Gemini 4 Carbon (0.0612, interesting), and
  GPT-6.2 Astra (0.0578, interesting). Unlike Carbon (which moved RNG onto a background CPU thread)
  and DeepSeek V4.1 Flash (which quantized the KV cache to FP8), Neon keeps both RNG and full bf16
  KV attention inside the timed GPU graph.

