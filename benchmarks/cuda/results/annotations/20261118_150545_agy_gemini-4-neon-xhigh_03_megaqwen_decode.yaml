          constexpr uint32_t kMask = (1u << 24) - 1u;
          constexpr float kDiv = 1.0f / (float)(1u << 24);
          constexpr float kTwoPi = 6.28318530717958647692f;
          const __nv_bfloat16* h_in = dp->h_in;

          float local_ss = 0.0f;
          #pragma unroll
          for (int iter = 0; iter < 2; ++iter) {
              int p = tid + iter * 256;
              int grp = p >> 3;
              int j = p & 7;
              int idx0 = (grp << 4) + j;
              int idx1 = idx0 + 8;
              float u1 = 1.0f - (float)(sm_u[idx0] & kMask) * kDiv;
              float u2 = (float)(sm_u[idx1] & kMask) * kDiv;
              float radius = sqrtf(-2.0f * logf(u1));
              float sn, cs;
              sincosf(kTwoPi * u2, &sn, &cs);
              __nv_bfloat16 n0 = __float2bfloat16_rn(radius * cs);
              __nv_bfloat16 n1 = __float2bfloat16_rn(radius * sn);
              __nv_bfloat16 x0 = mix_half_bf16(n0, h_in[idx0]);
              __nv_bfloat16 x1 = mix_half_bf16(n1, h_in[idx1]);
              ws.x_curr[idx0] = x0;
              ws.x_curr[idx1] = x1;
              float f0 = __bfloat162float(x0);
              float f1 = __bfloat162float(x1);
              ws.x_ln[idx0] = __float2half_rn(f0 * __bfloat162float(__ldg(&iln0[idx0])));
              ws.x_ln[idx1] = __float2half_rn(f1 * __bfloat162float(__ldg(&iln0[idx1])));
              local_ss += f0 * f0 + f1 * f1;
          }
