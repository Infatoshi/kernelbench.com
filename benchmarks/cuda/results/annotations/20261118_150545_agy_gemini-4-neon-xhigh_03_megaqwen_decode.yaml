summary: >
  Gemini 4 Neon (XHigh) built a full-context SM120 MegaQwen decode engine combining CUDA Graphs
  with Programmatic Dependent Launch (griddepcontrol.wait / griddepcontrol.launch_dependents)
  across QKV, split-KV causal GQA, O-projection, SwiGLU MLP, and Down-projection kernels. Per-step
  PyTorch CPU MT19937 + Box-Muller decode noise is reproduced identically on GPU inside the timed
  CUDA Graph, and the entire KV cache stays in exact bf16 with zero quantization or eviction.

