    label: "The first GRU gate projection is folded with the linear encoder"
    text: |
      // Fold the encoder into layer 0: wfold = W_gru[0] @ W_enc [768][4], bfold = W_gru[0] @ b_enc (fp64 sums).
      __global__ void fold_encoder_kernel(const float* __restrict__ w_gru, const float* __restrict__ w_enc,
                                          const float* __restrict__ b_enc, float* __restrict__ wfold, float* __restrict__ bfold) {
        const int j = blockIdx.x * blockDim.x + threadIdx.x;
        if (j >= 768) return;
        double a0 = 0, a1 = 0, a2 = 0, a3 = 0, b = 0;
        const float* row = w_gru + (size_t)j * 256;
        for (int k = 0; k < 256; ++k) {
          const double w = row[k];
          a0 += w * w_enc[k * 4 + 0];
          a1 += w * w_enc[k * 4 + 1];
          a2 += w * w_enc[k * 4 + 2];
          a3 += w * w_enc[k * 4 + 3];
          b += w * b_enc[k];
        }
        wfold[j * 4 + 0] = (float)a0;
        wfold[j * 4 + 1] = (float)a1;
        wfold[j * 4 + 2] = (float)a2;
        wfold[j * 4 + 3] = (float)a3;
        bfold[j] = (float)b;
      }
