summary: >
  Fable 5.2 fused the grid environment and the 3-layer MinGRU policy into one
  persistent block per 64 envs that runs the whole horizon. Layer 0 is folded
  into an affine map of the 4-float observation. Layers 1 and 2 run on tensor
  cores with weights and hidden state split into fp16 high parts plus exact
  residuals; the fast kernel computes the correction terms in one int8 MMA
  per 16 k, certifies every greedy action by its top-2 gap, and reruns the
  whole rollout on an fp32-grade 3-MMA kernel if any decision is not
  certified. The reference's coupled LCG (every env's RNG advances when any
  env hits) is reproduced with a host-verified hit schedule.

