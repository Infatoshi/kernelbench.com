integrity_note: >
  Read the final 141-line solution.py, the 517-line grid_mingru.cu and the 73-line binding end to
  end. run() pads to 128-env tiles, draws initial positions with the same CPU generator calls as the
  reference, and launches precompute_m0 once then layer0, two GRU GEMMs and the head per step (per
  16384-env chunk). The layer-0 fold is exact algebra (the encoder is linear) evaluated in fp32. The
  food RNG reproduces the reference's batch-coupled LCG: a device counter K counts steps where any
  real env hit food (padded envs excluded), and a hitting env jumps its seed+env state by 2K LCG steps
  in closed form before drawing (r1, r2). policy_forward and env_step, which check.py calls directly,
  use a separate naive one-thread-per-env kernel and an exact env kernel. All math is fp32 SIMT (no
  tensor cores, no downcast); no CUDA graph, no import-time warmup, no grader import. No graded-file
  write, no web access, no foreign run id in any tool call (ids in tool output come from nvidia-smi
  and ps listings of sibling cells); kb contamination's one DEVLOG.md hit is the agent saying it would
  look for a repo DEVLOG, which listed only its own repo root. Nothing came from the dead first
  attempt: hidden by the sandbox, never referenced, and its solution.py shares 64 of 573/141 lines
  with this one by difflib (ratio 0.18). Leg 2's in-session benchmarks ran with another agent's
  puffer_terraria_px job at 100% on GPU 2, which the agent noted and left alone.

