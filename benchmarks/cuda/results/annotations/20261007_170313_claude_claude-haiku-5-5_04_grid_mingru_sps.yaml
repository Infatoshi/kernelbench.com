summary: >
  Haiku 5.5 runs the rollout as four fp32 CUDA kernels per step: layer 0 collapsed to a 4-input map
  (W_gru[0]·W_enc folded once per call), MinGRU layers 1 and 2 as cp.async double-buffered SIMT GEMMs
  over 128-env tiles with the gate math in the epilogue, the action head as per-slice partial logits,
  and a head kernel that does argmax, the move, reward and food respawn with a closed-form LCG jump.

