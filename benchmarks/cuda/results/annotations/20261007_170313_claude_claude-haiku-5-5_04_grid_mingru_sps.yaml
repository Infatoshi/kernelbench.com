comparison: >
  The board leader, Claude Opus 5 at 1.961, and Sonnet 5.5 at 0.944 fuse the whole rollout into one
  persistent kernel with the MinGRU GEMMs on fp16 tensor cores (split terms for accuracy). Haiku keeps
  fp32 SIMT GEMMs and four launches per step, re-reading the hidden-state buffers from DRAM between
  layers, which is why the 65536-env shape lags most. 0.2763 would sit 13th of 18, between Qwen 3.8
  Max (0.285) and Kinetic 0715 1M (0.224).

quotes:
  - file: scratch/grid_mingru.cu
    lines: [39, 56]
    label: "Batch-coupled food RNG reproduced with a closed-form 2K-step LCG jump"
    text: |
      // Advances the env rng by 2K global steps in closed form, then draws the respawn food.
      __device__ __forceinline__ void respawn_food(unsigned long long rng_off, int env, int K, int& fx, int& fy) {
          unsigned long long ra = 1ULL, rb = 0ULL, pa = LCG_A, pb = 1ULL;
          for (unsigned n = 2u * static_cast<unsigned>(K); n; n >>= 1) {
              if (n & 1u) {
                  rb = ra * pb + rb;
                  ra = ra * pa;
              }
              pb = pa * pb + pb;
              pa = pa * pa;
          }
          const unsigned long long x0 = static_cast<unsigned long long>(env) + rng_off;
          const unsigned long long x = (ra * x0 + rb) & LCG_MASK;
          const unsigned long long r1 = lcg_step(x);
          const unsigned long long r2 = lcg_step(r1);
          fx = static_cast<int>(r1 % BOARD);
          fy = static_cast<int>(r2 % BOARD);
      }
