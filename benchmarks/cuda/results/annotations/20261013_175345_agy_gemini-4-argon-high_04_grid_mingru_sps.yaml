implication: >
  0.422 is the real fp32 throughput at the graded shapes, which are exact against the reference. Two
  caveats travel with the cell: the unconditional LCG advance is exact only because large batches always
  contain a hit (wrong at 513 envs), and the packed-weight cache goes stale under .data.copy_. Both match
  earlier interesting verdicts on this problem. The lock-bypass line in solution.py is a harness-integrity
  finding with no effect on the regraded number.
