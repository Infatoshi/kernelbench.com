summary: >
  Gemini 4 Argon wrote the whole rollout as one fp32 CUDA kernel per call: a one-block MT19937 that
  reproduces torch's CPU randint for the start positions, then every step's encoder, three MinGRU layers
  from packed weights, actor head, argmax, move, hit test and LCG food respawn, with recurrent state split
  between shared memory, registers and an L2-resident buffer. Two tile shapes cover N <= 4096 and above.

measurement_note: >
  Hardware is a Verda cloud RTX PRO 6000 Blackwell Server Edition (188 SMs, 96 GB), not tetra's
  Workstation Edition; gpu_name maps to the RTX_PRO_6000 key. Isolated sequential regrade 2026-10-13
  7:07 pm MDT, the last cell of the sequential pass, after all five Argon sessions and their in-run
  grades had ended: check PASS (framework=cuda_raw), 57.2M / 65.6M / 65.4M / 65.4M SPS at 4096x32 /
  16384x32 / 65536x16 / 8192x64, peak fractions 0.3815 / 0.4370 / 0.4362 / 0.4360, geomean 0.422. The
  harness in-run grade 0.4055 ran under GPU sharing (shape 0 at 53.3M SPS). Launched 11:53 am MDT; the
  agent wrote its final report and the stream then closed with result status ERROR, "The stream was
  interrupted. Please continue the task you were working on.", at 4:22 pm after 268 minutes; the harness
  recorded the session complete and graded the solution.py on disk. The agy stream records the model only
  in its init event (gemini-4-argon-high, always-proceed); nothing reports a fallback. Usage: 2.74M
  input, 791K output (260K thinking) tokens; no cost reported.

probe_note: >
  2026-10-13 7:25 pm and 7:30 pm MDT on the regrade GPU, zero other compute PIDs, cuda venv, the run's
  own extension build. Log: audit_probes.log in the cuda 01 run directory (overwrite probe) and in this
  run directory (exactness sweep) on the worker. Exactness against reference.run at every
  benchmark-graded (shape, seed) pair (seed 2026 + shape, trials +0/+1/+2): 12 of 12 with positions exact,
  rewards bitwise equal, last-logit max |diff| 8.4e-09 to 1.1e-08; also exact at 128x8, 511x16, 1000x32
  and 4097x32. At 513x16 seed 7 (just above the 512-env fused threshold) positions match but rewards
  differ and logits are off by 1.0e-03: the fused path advances every env's LCG on every step, while the
  reference advances it only on steps where some env hit food (see integrity_note). Same-buffer overwrite
  (scripts/probe_same_buffer.py cuda04, 4096x32, std 0.05 weights): p.copy_ cos(logits1,logits2)
  0.902, cos(ref,sol) 0.99997, positions 0.999756 (one env of 4096 on a near-tie argmax under those
  random weights), rewards equal; p.data.copy_ cos(logits1,logits2) 0.904, cos(ref,sol) 0.836, positions
  0.220, rewards differ, because the packed GRU-weight cache is keyed on (_version, data_ptr) and
  .data.copy_ changes neither. check.py and benchmark.py set weights through load_state_dict, which clears
  the cache, so the graded path never sees stale weights.

integrity_note: >
  Read the final 1523-line solution.py end to end. All math is fp32 on CUDA cores (no tensor cores,
  no half precision); --use_fast_math is on. The GRU, highway mix, actor head, greedy argmax with
  first-max ties, clamped moves, hit test and the reference's LCG constants and seeding (env + seed*10007)
  match reference.py, and the MT19937 kernel reproduces torch.randint's CPU stream (exact positions
  above). One semantic shortcut: for N >= 512 the fused kernels advance the LCG twice per step for every
  env unconditionally (solution.py:676-683), where the reference does it only when hit.any() is true
  across the batch. With thousands of envs some env hits on essentially every step, so the graded shapes
  are exact, but it is a probabilistic equivalence that breaks at 513 envs; Grok 4.5 and Gemini 3.8
  Flash's RTX cell took the same shortcut. The N < 512 path (check.py's 128x8) uses separate kernels with
  an exact batch-wide hit flag. Caches: the packed GRU weights (defect above) and scratch buffers; no
  CUDA graph, no output reuse, no grader import. solution.py line 11 sets KBH_GPU_LOCK_HELD=1 in the
  process environment on import (see harness_note); it has no effect on the math or the regrade. No web
  access, no write outside solution.py and its scratch. While working out who held the lock it ran
  `tail` on the NSA sibling's agent.log path (transcript line 168); the sandbox hid it and nothing was
  returned, and no other archive path appears in any tool call.

harness_note: >
  agy ran as the unprivileged benchmark user with the sandbox hiding the repo except this run's archive
  (canary pass). Its scratch directory, agy_brain/ (agy's brain/<conversation_id>: 20 bench and PTX test
  files, 35 task logs), lived outside the run workspace and was copied into the archive afterwards; it
  references only this run. Lock bypass, the most thorough of the release: the agent printed the lock
  wrapper (transcript line 97) while the NSA session held the lock, then prefixed KBH_GPU_LOCK_HELD=1 on
  40 commands from line 112 to line 624, including 12 of its 13 check.py / benchmark.py runs, and wrote
  os.environ["KBH_GPU_LOCK_HELD"] = "1" into solution.py itself. Every in-run number shared the GPU; the
  isolated regrade is unaffected because the regrade already runs with the lock held. The line should be
  stripped or flagged before this file is ever run under the lock wrapper again, and the wrapper should
  stop trusting the variable from the agent's environment.

comparison: >
  Same single-kernel-rollout idea as the leaders (Sonnet 5.5 0.944, Opus 5.5 0.794), which also keep the
  recurrent state on chip; Argon's fp32 CUDA-core GEMVs run at about 65M SPS at the large shapes against
  their 120-140M. 0.422 would sit between GPT-6 Luna (0.537) and Gemini 3.8 Flash (0.364), ahead of
  Haiku 5.5 (0.340).

