summary: >
  Gemini 4 Neon (XHigh) built a hand-written SM120 CUDA/PTX sparse attention pipeline with exact
  per-token NSA selection (fp32 block key means split into three bf16 planes for exact tensor-core
  scoring, causal diagonal mean, register top-8 heaps with exact reference tie-breaking to the
  larger block index) and a lock-free inverted-index key-stationary attention kernel that stores
  each (row, block) partial output as saturated signed int8 (pack_i8x4 via cvt.rni.sat.s8.f32)
  with a compact 8-byte (m, l, scale) header before a softmax-weighted merge. Small D=64 shapes
  (S <= 1024) take a fused row-stationary kernel with no int8 intermediate.

