integrity_note: >
  Read the final 2696-line solution.py end to end (sha256 9de09da3c26bb53f). Pure raw SM120 CUDA
  C++/PTX via load_inline: no Triton, no cuBLAS, no CUDA graph, no input/pointer caching. Every
  call recomputes block means, diagonal causal importance, 3xBF16 tensor-core block scores,
  register min-heap top-8 selection (ties broken to larger block index via make_score_key),
  key-stationary sparse attention, and softmax merge from live Q, K, V tensors. Persistent state is
  only regrown scratch workspace buffers sized by (B*H, S, D). Dispatch branches only on (D, S)
  shape (Path A fused for D=64 and S <= 1024, Path B key-stationary int8-partial otherwise), never
