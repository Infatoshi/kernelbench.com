implication: >
  A genuine exact-selection sparse-attention kernel that matches the #1 Sonnet 5.5 result within
  0.8% (0.0730 vs 0.0724 ms). Like Sonnet 5.5, it is marked interesting because intermediate
  partial outputs between the key-stationary attend kernel and the softmax merge are quantized to
  per-row-scaled int8 (measured mean |error| 0.00028-0.00035, roughly 3x the bf16 rounding floor
  and ~300x inside the 0.1 tolerance).
