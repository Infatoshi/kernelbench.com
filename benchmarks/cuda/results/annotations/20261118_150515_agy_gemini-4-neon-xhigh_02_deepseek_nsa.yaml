      __device__ __forceinline__ uint32_t pack_i8x4(float a, float b, float c, float d) {
          uint32_t ra, rb, rc, rd, ab, cd, res;
          asm("cvt.rni.sat.s8.f32 %0, %1;" : "=r"(ra) : "f"(a));
          asm("cvt.rni.sat.s8.f32 %0, %1;" : "=r"(rb) : "f"(b));
          asm("cvt.rni.sat.s8.f32 %0, %1;" : "=r"(rc) : "f"(c));
          asm("cvt.rni.sat.s8.f32 %0, %1;" : "=r"(rd) : "f"(d));
          asm("prmt.b32 %0, %1, %2, 0x0040;" : "=r"(ab) : "r"(ra), "r"(rb));
          asm("prmt.b32 %0, %1, %2, 0x0040;" : "=r"(cd) : "r"(rc), "r"(rd));
          asm("prmt.b32 %0, %1, %2, 0x5410;" : "=r"(res) : "r"(ab), "r"(cd));
          return res;
      }
  - file: solution.py
    lines: [101, 107]
    label: "Order-preserving uint64 score key breaking exact top-8 ties to the larger block index"
    text: |2
      // Order-preserving uint64 key: (v1 > v2) || (v1 == v2 && b1 > b2)
      __device__ __forceinline__ uint64_t make_score_key(float val, int bi) {
          val = val + 0.0f;
          uint32_t u = __float_as_uint(val);
          uint32_t ord = (u & 0x80000000u) ? ~u : (u ^ 0x80000000u);
          return (static_cast<uint64_t>(ord) << 32) | static_cast<uint32_t>(bi);
      }
