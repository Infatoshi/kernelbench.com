summary: >
  Isolated regrade 0.3637 (in-run 0.3639). Real CUDA: fused MinGRU, env-step and
  encoder kernels with cuBLASLt gate GEMMs, the whole horizon captured in one
  CUDA graph. run() has a precision split: num_envs <= 256 (the only shape
  check.py runs) goes to an exact fp32 path under matmul precision "highest",
  every graded shape goes to CUBLAS_COMPUTE_32F_FAST_TF32 compiled with
  --use_fast_math and tanh.approx. That is the pattern behind the grok-4.5
  0.5237 and kinetic 0.4241 hacks, so a strict-oracle fidelity probe was run on
  a quiet GPU 2026-09-03 at every benchmark shape (4096x32, 16384x32, 65536x16,
  8192x64) with seeds 42 and 123: positions equal for every env, rewards equal,
  last_logits max abs diff 7.7e-7, cos(logits)=cos(state)=1.00000; same-buffer
  weight overwrite between two run() calls on one Model: positions equal,
  cos(logits)=0.99796. The graded path is fp32-exact against the reference at
  the graded shapes, so the split does not move the score. No import-time
  backend flag mutation (the deepseek-v4-pro hack); the reference baseline is
  untouched. Transcript: only its own run id, no annotation, leaderboard or
  DEVLOG reads (results/ hidden before this run), no env or key printing.
  template_mutated=false.

