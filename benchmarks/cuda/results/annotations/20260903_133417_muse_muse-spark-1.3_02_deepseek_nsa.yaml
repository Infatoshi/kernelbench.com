implication: >
  Publishable and honest, and the board cell for muse-spark-1.3 on this
  problem. One 128-thread block per query with a single-thread top-8 and
  index build lands about 4x under the warp-per-query scalar cells
  (gemini-3.8-flash-high 0.0958) on the same no-tensor-core budget. The
  short session is a model re-running a design it had already found, not a
  cutoff: it read the problem for six minutes, emitted the kernel in one
  shot, fixed its own vectorization bug (maxabs 3.4 down to 1e-4), ran two
  measured optimization rounds and stopped. Builds at a fixed
  /tmp/nsa_cuda_build directory, a mild shared-box hazard for regrades and
  nothing more.
