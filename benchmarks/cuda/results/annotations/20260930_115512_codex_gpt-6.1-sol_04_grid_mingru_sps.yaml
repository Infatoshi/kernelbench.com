harness_note: >
  Harness exposure, same as the published 2026-09-22 GPT-6 Sol/Luna cells and the 2026-09-28 Sonnet 5.5 cells: the cell ran in host mode (bwrap sandbox, no container), so Codex loaded the operator's global ~/.codex/AGENTS.md (his personal CLAUDE.md) as instructions and listed and read his ~/.codex/skills (kernel, benchmark-integrity, optimize-loop, nsight-compute and similar). Those files hold workflow and profiling advice and the operator's GPU etiquette; they contain no KernelBench solution, grader detail or score. The audit treats this as disclosed context, not contamination: it cannot make a kernel pass or run faster on the graded path, and every cell on the board from this launcher carries it. Effect here: the agent moved its timing onto GPU 3 under its own lease,
  and ended its turn citing the global AGENTS.md rule against stopping other
  GPU jobs without approval.
