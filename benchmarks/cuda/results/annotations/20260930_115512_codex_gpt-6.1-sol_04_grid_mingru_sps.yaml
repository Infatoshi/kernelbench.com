summary: >
  The whole rollout is one cooperative CUDA kernel: each CTA encodes 16
  environments, runs the three MinGRU layers on fp16 tensor cores with a
  hi/lo split of both operands (three mma per product, fp32 accumulate) to
  recover near-fp32 accuracy, takes greedy actions, and does food respawn after
  one grid barrier per step. Recurrent state stays fp32.
implication: >
  Not a plain fp16 downcast like the Grok 4.7 cell: the hi/lo split recovers
  most of fp32 (less than full, since the lo residuals of 0.02-scale weights sit
  in fp16's subnormal range), so position flips should come only from reference
  near-ties, which the branch's 1e-5 margin rule judges.
  The packed weights are cached keyed on (data_ptr, _version) of w_gru;
  reset_parameters clears the cache, load_state_dict bumps _version, but a write
  through .data does not. The session ended at 41 minutes asking permission to
  stop other GPU jobs (see harness_note), so the number likely understates the
  model.
