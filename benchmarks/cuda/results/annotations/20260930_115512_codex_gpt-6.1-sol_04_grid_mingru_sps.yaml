static_probe_note: >
  Reading the code ahead of the probe: only w_gru is packed and cached; w_enc,
  b_enc, w_a and b_a are read live by the rollout kernel every call. The cache
  key (w_gru.data_ptr(), w_gru._version) misses an in-place write through
  w_gru.data, which does not bump _version, so the p.data.copy_ leg of
  scripts/probe_same_buffer.py cuda04 is expected to show a stale pack (low
  cos(ref,sol) on logits, position mismatches). check.py loads weights through
  load_state_dict, which bumps _version, so the graded path is unaffected. The
  published Opus 5 leader uses the same per-parameter (data_ptr, _version) key,
  so this is a shared convention, not a Sol-specific hazard; the probe numbers
  belong in probe_note.
comparison: >
  Same architecture as the board leader, Claude Opus 5 at 1.961: one persistent
  rollout kernel with MinGRU on fp16 mma.m16n8k16 and on-device env step and
  respawn. Opus adds host-side per-lane fragment packing, a speculative dual
  kernel and a cost model for envs per block; Sol spends three mma per product on
  a hi/lo split for accuracy and two grid barriers per step, landing at 0.305
  (Sonnet 5.5 0.944, GPT-6 Sol 0.645 via a captured CUDA graph plus cuBLAS).
