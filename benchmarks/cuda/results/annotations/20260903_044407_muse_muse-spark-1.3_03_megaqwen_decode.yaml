implication: >
  Valid for ranking, with two things a reader should carry. First, the GEMMs
  are cuBLAS through ATen while the kinetic-0715 cell on this same problem
  (0.0470) authored its own; muse's peak is authored attention, norms, RoPE,
  KV packing and launch structure wrapped around a library GEMM, so the two
  cells measure different mixtures and the gap is not purely kernel skill.
  Second, 0.0332 is graph-replay steady state: capture lands in trial 0 (2163
  vs 3340 tok/s at 2k) and benchmark.py's median of 5 discards it, which is
  the harness's own rule but makes the number a serving-throughput figure, not
  a first-call one. The gate is also thinner than the score: check.py tops out
  at ctx 8192 while two of the four graded shapes are 32k and 128k - the agent
  covered 32k against the reference itself (allclose, max 0.0625) but nobody
  ever validated 131072. On honesty, the summary's table is accurate to within
  1.4% of the graded per-shape numbers and its geomean 0.0331 lands on 0.0332,
  but it credits `benchmark.py` and "RESULT OK" for figures its own
  benchmark.py run never produced - the agent's last streamed line is
  "Benchmark still running". Right answer, unsupported attribution.
