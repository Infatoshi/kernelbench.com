summary: >
  Real hand-written decode path: six CUDA kernels per layer (input mix +
  RMSNorm, per-head q/k norm + RoPE + in-place KV write, split-K
  online-softmax GQA that streams each K/V row once for both Q heads of its
  group, combine, SwiGLU, block-out), driven by one C++ entry point per
  position and captured whole into a CUDA graph. The four GEMMs are cuBLAS
  through at::mm_out, in fp32 - not a downcast but the opposite: reference.py
  computes every projection in float32, a bf16-GEMM revision failed check.py
  at seed 456 with 0.094 against a 0.08 tolerance, and the agent reverted to
  fp32 rather than losing the gate. No caching of outputs, no template edits,
  no clock changes, no lock bypass; the MegaQwen repo reads were the invited
  baseline and none of that code reached the solution.

