implication: >
  Publishable. Unlike earlier 04 cells, the food RNG stays exact above 512 envs and at
  non-multiple-of-64 counts. One latent defect off the graded path: the packed weight cache is
  keyed on data_ptr only, so standalone policy_forward after an in-place weight edit uses stale
  w_enc/w_gru (cos 0.996, state cos 0.966); run() repacks every call through model.to() and stays
  exact, and check.py always loads weights through load_state_dict, which clears the cache.
