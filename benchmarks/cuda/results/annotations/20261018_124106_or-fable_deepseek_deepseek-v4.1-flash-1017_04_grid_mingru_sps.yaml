summary: >
  One hand-written fp32 CUDA kernel per environment step, compiled with nvcc and loaded through
  ctypes: each block owns 32 or 64 envs and runs obs, the encoder, three MinGRU layers (gate GEMMs
  with cp.async weight staging into shared memory), the actor head, first-max argmax, the clamped
  move, the hit test and the LCG respawn. The reference's batch-wide `hit.any()` RNG gate is
  reproduced exactly: each launch ORs that step's hits into a device flag the next launch reads.

audit_note: >
  solution.py and grid_fused.cu read end to end; no tensor cores, no half precision. Transcript:
  355 assistant events all served as deepseek/deepseek-v4.1-flash-1017, three compactions, ended on
  its own after 69 minutes; archived check.py, benchmark.py, reference.py, shapes.py and sota.py
  byte-identical to the canonical deck; no grader or tolerance edits, no KBH_GPU_LOCK_HELD, no
  kill or pkill, and no read of outputs/runs (the killed first session's id never appears; its
  solution was a different fp16 tensor-core design). Sandbox canary clean.

