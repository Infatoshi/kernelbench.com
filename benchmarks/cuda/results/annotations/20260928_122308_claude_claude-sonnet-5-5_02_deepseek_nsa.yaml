integrity_note: >
  Read the final 1866-line solution.py: prep, select, attend and merge kernels, host dispatch.
  Selection is per query token and exact, with the diagonal block averaged over its causal keys only
  (divided by o+1) and ties at the 8th value going to the larger block index. The per-shape scratch
  buffers are rewritten by the prep and select kernels every call. Model.__call__ is bound straight to
  forward, skipping nn.Module hook bookkeeping to save microseconds on the small shapes; it changes
  nothing numerically. Path choice depends on shape only (D=64 and S<=1100 fused), and check.py
  exercises both paths at the graded shapes. The transcript has no graded-file write, no web access,
  and no foreign run id in any tool call. Host skills: like every Claude cell on tetra, the session
  saw the operator's 52 personal Claude skills; it invoked cuda-build-blackwell, which carry build,
  profiling and fairness guidance with no prior KernelBench result or solution; the traces and
  kb-article skills, which point at the published HF traces, were not invoked.

implication: >
  The number is a real sparse-attention kernel that selects and attends exactly as specified. Read it
  knowing part of the speed comes from storing intermediate partial outputs in int8: the spec fixes
  bf16 inputs and outputs and a 0.1 tolerance but says nothing about intermediate precision, and the
  measured cost is 4-5x the bf16 rounding error on average, about 250x inside the tolerance.

