summary: >
  Sonnet 5.5 built exact per-token NSA block selection (fp32-exact block key sums split into three
  bf16 pieces, tensor-core importance, a causal mean on the diagonal block, top-8 per row) and a
  key-stationary attention kernel that stores each (row, block) partial output as int8 with a per-row
  scale before a softmax-weighted merge. Short D=64 shapes use a fused row-stationary kernel with no
  int8 step.

