summary: >
  Three CUDA kernels built with nvcc and loaded through ctypes: per-block key means, a top-8 block
  selection per query that uses block-mean linearity with an exact causal prefix for the current block
  and breaks ties toward the larger block id like the reference, then FA2-style online-softmax
  attention with mma.sync over the selected tiles, the current block and the sliding window.

