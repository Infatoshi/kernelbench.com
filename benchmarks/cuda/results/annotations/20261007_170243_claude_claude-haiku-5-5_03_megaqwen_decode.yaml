comparison: >
  The board leader, Sonnet 5.5 at 0.080, runs all four layers in one cooperative persistent kernel
  with 12 mover CTAs prefetching KV and weights into L2. Haiku launches 29 small kernels per decode
  step from the host, so at short context its step time (about 190 us at 2048 context in its own
  timing) is dominated by 29 dependent small kernels rather than bandwidth, while at 128k it streams
  the cache at the same rate as the others. Even the
  in-run 0.0456 would sit 12th of 22 passing cells; the contended regrade's 0.031 would be 19th.

