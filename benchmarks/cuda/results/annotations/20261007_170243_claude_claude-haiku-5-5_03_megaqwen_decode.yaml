integrity_note: >
  Read the final 532-line solution.py end to end. decode_steps draws its per-step noise from the
  seed+2 generator inside the timed call and runs the same kernels as prefill; nothing decode needs
  is precomputed in the untimed prefill. Attention covers every cached position up to and including
  the new token (chunks of 128 keys, online softmax per warp, merged across chunks). All scratch
  buffers are allocated per call; no cache, CUDA graph, data_ptr key or grader import. The only
  network access was cloning the public Infatoshi/MegaQwen repo the prompt points to, at 1:30 pm,
  after its own kernel was final, to time the original kernel for comparison; no MegaQwen code is in
  solution.py. kb contamination's two DEVLOG.md hits are that repo's own DEVLOG, read with grep for
  its tok/s claims. No graded-file write, no tolerance edit, no foreign run id in any tool call (the
  only foreign ids anywhere are sibling cells in ps output), and nothing from the dead first attempt:
  that archive is hidden by the sandbox, its id never appears, and the two solution.py files share
  110 of 663/531 lines by difflib (ratio 0.18, boilerplate and geometry constants). Leg 2 ran its own
  check and benchmark directly on GPU 0 with CUDA_VISIBLE_DEVICES=0 after confirming it idle, outside
  the per-bench lock; that affects in-run timing only.

