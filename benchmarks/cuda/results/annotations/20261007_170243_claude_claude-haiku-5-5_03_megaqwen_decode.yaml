summary: >
  Haiku 5.5 wrote the four-layer Qwen3-0.6B-geometry decode as a host loop of eight plain CUDA
  kernels per step: noise mix, then per layer a fused RMSNorm plus QKV warp-GEMV, per-head Q/K norm
  and RoPE with the KV-cache append, split-KV GQA attention over the full cache with a separate
  combine, the O projection plus residual, fused RMSNorm plus gate/up SiLU, and the down projection.

