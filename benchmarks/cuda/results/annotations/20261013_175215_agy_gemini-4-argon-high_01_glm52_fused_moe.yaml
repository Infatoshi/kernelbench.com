summary: >
  Gemini 4 Argon wrote the GLM-5.2 MoE layer as hand-written CUDA with inline PTX: a one-CTA counting
  sort that builds an expert tile table with the shared expert as one more expert, a cp.async + ldmatrix
  + mma.sync bf16 grouped GEMM for gate/up with silu(gate)*up fused into the epilogue, a second grouped
  GEMM for down that applies the routing weight and scatters with float4 atomics, and a separate
  two-kernel GEMV path for T=1.

measurement_note: >
  Hardware is a Verda cloud RTX PRO 6000 Blackwell Server Edition (188 SMs, 96 GB), not tetra's
  Workstation Edition; gpu_name maps to the RTX_PRO_6000 key. Isolated sequential regrade 2026-10-13
  6:45-6:50 pm MDT, after all five Argon sessions and their in-run grades had ended: check PASS
  (framework=ptx), per shape 0.3727 / 0.3727 / 0.0024 / 0.5117 / 0.0538 / 0.1038 at T = 4096 / 4127 /
  1 / 8192 / 512 / 1000 (9.96 / 10.03 / 0.378 / 14.50 / 8.63 / 8.72 ms), geomean 0.0992. The lead's
  "0.19 several times then 0.0025" is the agent's last in-session benchmark.py (transcript step 338):
  shape 0 at 0.1896, shape 1 at 0.1902 and the T=1 shape at 0.0025, geomean 0.0558, re-printed by every
  manage_task status poll while it ran. Those were per-shape fractions measured while other sessions
  used the GPU (shape 0 took 19.57 ms against 9.96 ms isolated); T=1 sits at 0.0024 in every grade
  because the roofline counts its dense-equivalent work while the kernel reads only the 9 active experts
  (about 0.45 GB in 0.378 ms). The harness in-run grade 0.0885 is contended the same way. Launched
  11:52 am MDT, the session ended on its own at 3:15 pm after 203 minutes with result status SUCCESS.
  The agy stream records the model only in its init event (gemini-4-argon-high, always-proceed); nothing
  in the stream reports a fallback. Usage: 1.88M input, 342K output (171K thinking) tokens; no cost
  reported.

