  three, gate PASS at atol=rtol=0.08. expert_ids and weights overwritten in place: cos(out2,out3) 0.874 /
  0.876 / 0.877 (the shared expert keeps part of the output), cos(ref,sol) 0.999997, PASS. Unseen
  seeds 2027 and 31337 at the same three T: 6 of 6 PASS, cos 0.999997, max |error| 0.016-0.031 (bf16
  output rounding). Five repeats: T=1 is bitwise identical, T>1 is not (float4 atomic order) with cos
  >= 0.9999999 between repeats. Numeric stress ran inside check.py (nominal plus scaled cases at every
  graded shape and seeds 42/123/456).

integrity_note: >
  Read the final 1249-line solution.py end to end. It computes the real routed top-8 plus shared expert
  layer: histogram and prefix sums in shared memory, per-expert tiles of 64 or 160 rows, 2-stage
  cp.async pipelines with an XOR swizzle feeding ldmatrix and m16n8k16 bf16 mma with fp32
  accumulation, h = silu(gate)*up rounded to bf16 (the reference keeps h in fp32; within the 0.08
  tolerance), the routing weight applied in fp32 in the down-GEMM epilogue, float4 atomicAdd into an
  fp32 buffer that a final kernel converts to bf16 and re-zeroes. T=1 runs two GEMV kernels and a
  last-CTA-reduces counter instead of atomics. No cache keyed on tensor identity or values, no CUDA graph,
  no cuBLAS, no grader import. The transcript has no write to any file but solution.py, no web access and
  no read of any outputs/runs archive; the foreign run ids in tool output are sibling Argon cells printed
  by ps while it worked out which process held the GPU lock. It read the grader library (src/eval
  correctness, numeric_stress, timing, cuda_language, the hardware peak table) to reuse
  check_correctness and time_fn in its own test scripts; nothing was edited.

harness_note: >
  agy ran as the unprivileged benchmark user with the sandbox hiding the repo except this run's archive
  (canary pass). Its scratch directory, agy_brain/ (agy's brain/<conversation_id>, here only 35 task
  logs), lived outside the run workspace and was copied into the archive afterwards. Lock bypass: early on the
  agent printed the PATH wrapper (bin/nvcc, transcript line 67), which execs straight through when
  KBH_GPU_LOCK_HELD=1. About 2 h 20 min in (2:12 pm MDT), with the NSA session's 4.2-hour test holding
  the lock, it began prefixing that variable (18 commands from transcript line 157 on), so its tests,
  benchmarks and ncu runs shared the GPU with whichever session held the lock. That contaminates every in-run number in this release (already
  excluded from publication) but not the isolated regrade. The cuda 03 and 04 sessions did the same. The
  wrapper should stop trusting KBH_GPU_LOCK_HELD from the agent's environment.

comparison: >
  Same structure as the board leader, Sonnet 5.5 at 0.113 (sorted routing, two tensor-core grouped GEMMs
  with SiLU*up fused into the first), with Argon adding a dedicated T=1 GEMV path and L2 eviction hints
  per tile. 0.0992 would sit level with GLM-5.3 (0.0997) and just above Haiku 5.5 (0.0947).

