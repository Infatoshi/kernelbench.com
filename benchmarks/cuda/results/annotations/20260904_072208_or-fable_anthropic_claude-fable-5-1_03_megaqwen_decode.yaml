summary: >
  Claude Fable 5.1 through OpenRouter (or-fable harness), max effort,
  unlimited budget, RTX PRO 6000, 3h33m to a voluntary stop. One persistent
  cooperative megakernel: 188 blocks x 512 threads, every decode step and
  all four layers in a single cudaLaunchCooperativeKernel, five grid
  barriers per layer (QKV, attention, O-proj, gate-up, down), the 126 MB
  weight set held L2-resident with evict_last hints while the KV cache
  streams through a 6-stage cp.async.bulk/mbarrier ring tagged evict_first.
  Attention softmax uses a fixed per-layer reference max (p = exp(s - M)
  with M >= max|s| derived from the live q/k-norm weights plus a 2% margin),
  which is exact because the constant cancels in the division; an exact
  online-softmax fallback exists but is dead code under every grader-seeded
  model. 36 measured kernel builds: a cp.async L2-hint illegal instruction
  on sm_120 forced the bulk-copy redesign, one deadlocked build was killed,
  and the agent's own 8192-context spot check caught a NaN regression that
  was fixed before submission. Fresh h_out every call; the kernel_state
  cache keyed on weight data_ptr/_version stores pointers and two scalars,
  weights are re-read from GPU memory on every launch. Contended in-run
  grade 0.0638; isolated sequential regrade on the same box 2026-09-04:
  0.0643 (+0.8%), 11.4k tok/s at ctx 2048 down to 655 tok/s at ctx 131072.
  Probe (probe.log): primed ctx 2048 matches the reference at cos 1.0000, a
  second call with a new seed on the same model produces a different output
  (cos(s1,s1b)=-0.1474) that matches at 1.0000, and overwriting the weights
  in place changes the output (0.0239) and matches at 1.0000. All template
  files byte-identical, no foreign reads, no network, no clock commands, no
  key strings, zero lock contention. Graded file byte-identical to the
  build the agent verified. OpenRouter cost $64.87 (672k output tokens,
  56.3M cache reads). Second on the problem behind or-opus 0.0655.

