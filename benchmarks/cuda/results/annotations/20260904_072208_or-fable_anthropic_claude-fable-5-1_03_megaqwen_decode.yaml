implication: >
  Publishable: the isolated regrade reproduced the contended grade within
  1% and the probe confirms fresh compute on every call. This is the
  claude-fable-5-1 cell on 03_megaqwen_decode and second overall behind
  or-opus 0.0655, ahead of kinetic-0715 0.0622. The number is bandwidth
  work: at ctx 131072 the kernel streams roughly 1.4 TB/s of KV, and the
  geomean is dominated by the two long shapes where the L2-resident weight
  trick stops mattering. The fixed-max softmax is exact by construction but
  its bound comes from the model's own norm weights, so a model with
  inflated q/k norms would route through the never-graded online-softmax
  fallback; nothing in the deck does. The kernel_state cache is keyed on
  data_ptr and autograd _version, so a raw .data.copy_() on a weight would
  not invalidate it, but the cache holds only pointers and scalars and the
  probe's in-place weight overwrite flipped the output correctly. Binary is
  SKU-locked (188-block grid, sm_120 gencode).
