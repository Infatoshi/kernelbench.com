implication: >
  A real fused rollout that lands every final position exactly at every graded size, the first
  fp16-math 04 kernel to do so. Two things to read it with: the policy runs on fp16 tensor cores
  (split terms, not plain fp16) on a problem declared fp32, the same call as earlier fp16 04 cells,
  though here it changes no outcome at any graded size; and solution.py runs the real workload for
