harness_note: >
  Harness exposure, same as the published 2026-09-22 GPT-6 Sol/Luna cells and the 2026-09-28 Sonnet 5.5 cells: the cell ran in host mode (bwrap sandbox, no container), so Codex loaded the operator's global ~/.codex/AGENTS.md (his personal CLAUDE.md) as instructions and listed and read his ~/.codex/skills (kernel, benchmark-integrity, optimize-loop, nsight-compute and similar). Those files hold workflow and profiling advice and the operator's GPU etiquette; they contain no KernelBench solution, grader detail or score. The audit treats this as disclosed context, not contamination: it cannot make a kernel pass or run faster on the graded path, and every cell on the board from this launcher carries it. The agent also took overnight-compute leases on GPUs 0 and 1 for its own
  timing and read one CUTLASS header (mma_sm80.h) from a local CUTLASS clone,
  which the prompt invites.
audit: >
  Read solution.py end to end (2026-10-03, Claude Opus 5.5). Served model
  gpt-6.1-sol at xhigh in every turn_context. Tool calls: no read or copy of any
  outputs/runs* path (foreign run ids appear only in ps and uv output), no grader
  or tolerance edit, no check.py sniffing; sha256 of reference/shapes/check/
  benchmark taken by the agent itself. kb contamination flags 3 foreign ids, all
  in tool output, none in a command or message.
leak_note: >
  Second pass, 2026-10-03 (Claude Opus 5.5). The developer context listed every
  one of the operator's Codex skills by name and description, including traces
  (the private HF trace dataset) and kb-article (KernelBench posts); neither was
  opened. Skills read: kernel, kernel-campaign, optimize-loop, benchmark-integrity,
  cuda-build-blackwell, nsight-compute, fast-iteration, detached-jobs,
  fleet-sync. None of them names another run's solution, an HF trace, an
  annotation or a score (checked against the current tetra copies; fleet-sync
  only describes the tiny-set pullback). One more exposure the sandbox does not
  cover: the agent ran rg --files over ~/.cache/torch_extensions, which holds
  other KernelBench agents' extension sources from earlier host-mode cells
  (glm52_fused_moe_v1, nsa_sm120_v8, mq_decode_sm120_v4, kimi_mega_v1,
  grid_mingru_fused and others). The listing printed only file names, no MoE
  source matched its glob, and its one cuobjdump on that cache path matched no
  file. Nothing from it entered the solution. Fix: mask ~/.cache/torch_extensions
  in scripts/lib/sandbox.sh along with ~/.codex.
