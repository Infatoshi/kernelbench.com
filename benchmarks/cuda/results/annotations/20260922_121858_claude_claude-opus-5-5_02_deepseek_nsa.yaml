          def forward(self, q: torch.Tensor, k: torch.Tensor, v: torch.Tensor) -> torch.Tensor:
              key = (q.shape, q.device)
              ws = self._ws.get(key)
              if ws is None:  # per-shape scratch, zeroed once; every call leaves its counters at zero
                  B, H, S, D = q.shape
                  ws = torch.zeros(_load_ext().nsa_ws_bytes(B, H, S, D), dtype=torch.uint8, device=q.device)
                  self._ws[key] = ws
              return _ext.nsa_forward(q, k, v, ws)
