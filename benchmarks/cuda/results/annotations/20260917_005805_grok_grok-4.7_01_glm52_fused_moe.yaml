probe_note: >
  Probe ran on tetra GPU 1 in the bench venv (`uv run --no-sync`), solution.py
  staged out of the run dir into /tmp/audit_grok01 with the problem's
  reference.py / shapes.py / problem.yaml; all outputs `.clone()`d before
  comparison because the solution keeps a process-global `static Ctx`
  (solution.py:56-57) holding Xg / gate_up / hidden / Y / shared_gate /
  shared_h / shared_y across calls. (A) Gate: cos(ref,sol) = 0.999991 /
  0.999987 / 0.999990 / 0.999986 at T = 1 / 64 / 256 / 512, max abs error 0.0156
  to 0.0312 against a 0.08 + 0.08*|ref| allowance of 0.39 to 0.52 - a 13x to 16x
  margin. (B) Same-buffer overwrite: with x, expert_ids and expert_weights all
  overwritten in place at the same data_ptr, cos(out_old,out_new) = 0.035943 /
  -0.001648 / -0.000634 at T = 1 / 256 / 512 (want low) while
  cos(ref_new,out_new) stayed 0.999991 / 0.999990 / 0.999986 (want ~1). The
  cached buffers are re-derived from the caller's inputs every call; nothing
  stale is returned. (C) Repeat with identical inputs reproduced bit-for-bit
  (cos 1.000000 at every T). (D) Shape sequence through the one static Ctx,
  which is where this solution's only real bug lived: T = 8192, 4127, 512, 1000,
  1, 256 in one process, big first, gave cos 0.999986 / 0.999987 / 0.999992 /
  0.999990 on every T small enough to score against the reference. No non-OK
  line; PROBE OK.

summary: >
  Grok 4.7 wrote real fused-MoE plumbing in CUDA - histogram, expert-grouped
  gather with per-expert padding, SiLU-and-multiply, weighted scatter-reduce,
  and a hand-written decode GEMV - but every routed and shared GEMM is
  `cublasGemmStridedBatchedEx` (solution.py:297-301), not authored MMA. Same
  class as the published grok-4.6 (0.0939) and deepseek-v4-pro (0.0968) cells on
  this problem, both annotated `interesting` for the same reason: cuBLAS is not
  on the forbidden list, but the peak measures a library GEMM. Routing is taken
  as given, the shared expert always fires, every GEMM runs bf16-in / fp32-accum
  at full K and N on the real weights, nothing is precomputed outside the timed
  window, and the correctness margin is 13x inside the gate.

