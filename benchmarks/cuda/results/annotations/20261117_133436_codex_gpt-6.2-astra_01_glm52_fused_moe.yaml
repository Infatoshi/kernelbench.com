summary: >
  GPT-6.2 Astra wrote the whole MoE layer in 36 minutes of hand-written CUDA: an
  expert sort, two grouped tensor-core GEMMs fed by TMA bulk copies (SiLU*up fused
  into the first), and a weighted combine, plus a separate GEMV path for one token.
  Nothing is cached between calls. At 0.1064 it is third on the board.

design_note: >
  solution.py (435 lines) compiles one load_inline extension for sm_120a (lru_cache on the build
  only). T == 1: decode_mv runs a warp per output row over uint4 weight loads, gate and up in one
  pass with SiLU fused, fp32 intermediates, then the down rows, then combine (solution.py:379-390).
  T > 1 (prefill<BM>, solution.py:327-360), every call: histogram of expert ids with atomics;
  make_groups prefix-sums each expert's rows in whole BM-row tiles, treats the shared expert as
  expert E with all T rows, and groups up to eight M tiles of one expert so they share a weight
  panel through L2; pack copies each routed token row into an expert-sorted buffer and records the
  reverse index. grouped_mm then streams A and B tiles with cp.async.bulk.tensor (2D tensor maps,
  128-byte swizzle, encoded on the host per call), waits on mbarriers, and runs ldmatrix +
  mma.sync m16n8k16 bf16 with fp32 accumulators. The gate/up launch loads BN/2 gate rows and BN/2
  up rows into one tile and applies SiLU*up in the epilogue, writing bf16; the down launch writes
  bf16 per-route rows; combine sums top_k weighted rows plus the shared row in fp32 per token.
  Tile choice by load (T*top_k relative to E): BM 16/32/64/128, BN 128 or 256, 3 or 2 stages
  (solution.py:352-355, 391-399); warps wholly past an expert's last row skip the MMAs
  (solution.py:232-235). No weight repacking, no cuBLAS, no CUTLASS (it listed the local CUTLASS
  tree and did not use it). Precision: the gate/up output and per-route down output are rounded
  to bf16 before the fp32 combine; nominal max_abs against the fp32 reference is 0.03125 at
  T >= 512 (probe A).

