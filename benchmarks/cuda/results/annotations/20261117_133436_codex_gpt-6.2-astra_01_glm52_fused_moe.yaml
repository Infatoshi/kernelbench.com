implication: >
  The cell measures what the problem name promises: every FLOP is the model's own TMA-fed
  tensor-core CUDA, routing is recomputed inside the timed window, and nothing depends on
  benchmark.py reusing its inputs. At 0.1064 it is third on the board and the best codex cell by
  about 13%, from a 36-minute session. Read only the isolated regrade: the session's 0.0607 and the
  harness's 0.0672 were slowed by the same-model MegaQwen session running benchmark.py and an
  upstream comparison on the same card without the GPU lock, a harness gap rather than anything
  this session did.

