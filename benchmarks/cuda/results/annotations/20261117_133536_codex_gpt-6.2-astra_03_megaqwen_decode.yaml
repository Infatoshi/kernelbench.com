implication: >
  The number is real decode work: KV and hidden are read live, the input draw stays inside the
  timed call, and long-context outputs match the reference at 32k and 128k. It is the best codex
  result on this problem (0.0578 vs 0.049) and ties Fable 5 for 11th. It got there without the
  megakernel the problem name suggests, using 28 launches per token, so the cell measures a
  well-tuned multi-kernel decode, which the rubric allows. Two caveats. Off the graded inputs,
  multi-step decode drifts out of tolerance once q/k norm gains reach 2 to 4, although each single
  step is accurate. And the session's unlocked GPU use slowed its sibling's timings. That is a
  harness gap to fix, not a scoring problem for this cell, whose published number is the isolated
  regrade. Do not quote its 39.7x claim over upstream.

