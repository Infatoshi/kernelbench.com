summary: >
  GPT-6.2 Astra did not build a megakernel. It wrote seven ordinary CUDA kernels per layer
  (28 launches per token): RMSNorm fused into tensor-core projections, split-KV attention fed by
  bulk copies, and a log-sum-exp merge. At 0.0578 it is the best codex cell on this problem.
  It read the upstream MegaQwen kernel the prompt points to and copied none of it.

design_note: >
  solution.py (622 lines) writes its CUDA source to a temp file, compiles it with nvcc
  (-O3, -arch=sm_120) into ~/.cache/torch/megaqwen_cuda/decode_<sha>.so and calls the C function
  execute() through ctypes (solution.py:432-466). execute() loops over steps and layers on the
  host and launches, per layer (solution.py:396-425): norm_project (input RMSNorm fused into the
  QKV GEMV; the normalized fp32 activation is split into bf16 high and low parts that ride as two
  columns of an mma.sync m16n8k16, against weights pre-tiled [row/8, k/32, row%8, k%32]); rotary
  (q/k RMSNorm and RoPE, appends K and V to the cache, stores q as bf16 high + low); attention
  over tiles of 128 positions (64 for positions 3072 to 16383), one CTA per tile and KV head
  serving both query heads, K and V loaded with cp.async.bulk under an L2 evict_first policy,
  scores on mma.sync with the q high/low trick, a block-local softmax with max subtraction and
  P*V on CUDA cores; merge (one level, or two above 48 chunks, by log-sum-exp); O projection plus
  residual (four warps per row); norm_project again for post-norm + gate/up with SiLU*up fused;
  down projection plus residual, writing the bf16 hidden. Profiler (probe P4): 4 decode steps at
  ctx 2048 are 112 kernels (28 per token) plus one H2D and one D2D copy. No cooperative launch,
  no grid barriers, no CUDA graph. The packed weights and an fp32 RoPE table (max_seq x 128) live
  in model._decode_plan, rebuilt when any parameter's (data_ptr, _version) changes
  (solution.py:503-522); prefill builds it, so the timed decode_steps only validates it. Every
  decode_steps call draws its input rows on the CPU (bf16 randn for all steps at once) and copies
  them to the GPU inside the timed window (solution.py:564), like the Qwen 4 Max cell and unlike
  the Kimi and DeepSeek cells. KV cache bf16, accumulators fp32.

