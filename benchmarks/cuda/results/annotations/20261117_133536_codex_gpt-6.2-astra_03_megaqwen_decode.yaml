  Isolated regrade 0.0578. Field from benchmarks/cuda/results/leaderboard.json per_problem
  03_megaqwen_decode, read 2026-11-17: DeepSeek V4.1 Flash 0.0812, Sonnet 5.5 0.0800, Opus 5.5
  0.0739, Fable 5.2 0.0671, Opus 5 0.0655, Fable 5.1 0.0643, Kinetic 0715 0.0622, Gemini 4 Carbon
  0.0612, Kimi K3.1 Pro 0.0610, DeepSeek V4 Pro 0.0602, then this cell tied with Fable 5 at
  0.0578: 11th of 29 passing cells. Previous best codex cell: GPT-6 Astra Pro 0.0490 (GPT-6 Sol
  0.0398, GPT-6.1 Sol 0.0386). Per the Qwen 4 Max audit's table, the six leading recent cells run
  8892 to 15948 tok/s at 2k and 684 to 1170 at 128k. This cell's 8915 at 2k sits at the bottom of
  that range, and its 691 at 128k is level with the other bf16-cache kernels. A multi-launch
  design pays about 28 launches per token, which caps short context; at 128k the cost is reading
  the KV cache.

