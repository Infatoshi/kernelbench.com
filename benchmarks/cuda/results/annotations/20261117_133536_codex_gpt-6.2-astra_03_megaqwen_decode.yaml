probe_note: >
  Predictions are in each probe's header, written before it ran. Probes (copies and logs in this
  run's audit/ dir on the Mac and on tetra): probe_megaqwen_astra.py with --long, run 5:37:34 to
  5:39:56 pm CST, and probe_megaqwen_gain_astra.py, run 5:40:56 to 5:41:06 pm, both on tetra GPU 0
  (uuid d594fb7a) under overnight-compute leases, zero compute PIDs on GPU 0 before each run. They
  import the canonical deck reference and the archived solution.py (sha256 801e75688d4b).
  P0, unseen seeds 7 / 2718 / 99991 at the check shapes (ctx 128 / 256 / 512) plus ctx 2048 x 16
  steps: 10 of 10 PASS, cos(ref,sol) 0.9999580 to 0.9999810, max_abs 0.0625 to 0.09375 (inside the
  0.08 abs/rel gate). This problem's check.py has no numeric_stress cases; its long check is one
  ctx-8192 run. P1, hidden and every K/V layer overwritten in place at the same data_ptr with the
  state of a different prefill: cos(out1,out2) 0.1257, cos(ref,sol) 0.9999947 before and
  0.9999956 after, both PASS; V layer 2 negated in place: cos(out2,out3) 0.5552, cos(ref,sol)
  0.9999938, PASS. Nothing derived from inputs is memoized. P2 (informational), weights edited
  after prefill: p.copy_ and load_state_dict bump _version, the plan is rebuilt and the output is
  at gate (cos 0.99999, 1.00000); p.data.copy_ does not bump _version and the output matches
  neither weight set (cos 0.944 to the new, 0.724 to the old, FAIL), because the packed QKV and
  gate/up copies go stale while o_proj and down_proj are aliased into the plan and see the edit.
  The graded path builds a new Model and calls load_state_dict per shape, so it never hits this.
  P3, q/k norm gains (ctx 256, 8 steps, the check protocol): gain 1 PASS (cos 0.9999803); gain 2
  FAIL (cos 0.9993, 56 of 1024 elements out of tolerance); gains 4 / 6 / 8 FAIL (cos 0.679 / 0.639
  / 0.597); every output finite. This was predicted to pass and did not. The follow-up localizes
  it: one decode step from an identical reference-built state is within a bf16 ulp at gains 1 /
  2 / 4 / 8 (cos >= 0.9999976, max_abs <= 0.03125, PASS), but 8 steps from that state drift at
  gain 4 (cos 0.9914, 470 of 1024 out) and gain 8 (cos 0.828), while gains 1 and 2 stay at gate.
  So the per-step kernel is accurate and the small per-step error compounds through the decode
  recurrence once larger gains make attention peaky. I did not find the source of the per-step
  error and did not measure how other cells fare under this exact protocol (the Qwen 4 Max
  audit's gain probe, a different protocol, read cos 1.0000000 at gain 4). Every graded input uses
  unit gains, where everything passes. P4, launches: above. P5, decode 4 steps from its own
  prefilled cache vs the reference decode on the same cache: ctx 32768 cos 1.0000000, max_abs
  0.00098; ctx 131072 cos 0.9999975, max_abs 0.03125; both PASS (covers the 64-tile range and the
  two-level merge).

