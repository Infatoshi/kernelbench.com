summary: >
  Fable 5.2 wrote three launches per forward in raw CUDA with inline-PTX bf16
  mma. k_prep builds compensated 8-key prefix sums of K with a hi + lo bf16
  split for tensor-core block scoring; k_select picks top-9 by tournament and
