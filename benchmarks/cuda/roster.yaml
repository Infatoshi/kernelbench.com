# KernelBench-cuda model roster (2026-07-28).
#
# OPEN: any model may be run and published. Single-GPU benches are cheap enough
# that the field does not need restricting — the reason multi has a closed
# roster is that one of its sessions occupies FOUR H100s for an unlimited run,
# which is a GPU-hours constraint, not a statement about model quality.
#
# There is deliberately no enumerated list here. The published field is whatever
# results/leaderboard.json contains; duplicating it in a second file would only
# create a copy that goes stale. No launch gate is applied.

bench: cuda
policy: open
gate: none
