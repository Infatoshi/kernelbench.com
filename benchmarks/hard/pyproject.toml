[project]
name = "kernelbench-hard"
version = "0.1.0"
description = "Surgical GPU kernel benchmark. Small deck, frontier agents, roofline metric, link-don't-spoil problem briefs."
requires-python = ">=3.11"
dependencies = [
    "cuda-tile==1.5.0",
    "nvidia-cutlass-dsl==4.7.0",
    "torch>=2.11",
    "ninja>=1.11",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rich>=13.7",
    "matplotlib>=3.9",
    "hypothesis>=6.140",
    "pytest>=8.0",
    "ruff>=0.6",
    "einops>=0.8.2",
    "requests<2.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
kbh = "src.kbh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The problem deck is the frozen eval surface (never lint-modified).
exclude = ["problems-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Dense table-builder style: one-line `if cond: continue` guards are idiomatic
# in this generated-data assembler and reformatting them adds only noise.
"scripts/build_v2_leaderboard.py" = ["E701"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
cuda-tile = { index = "nvidia" }
nvidia-cutlass-dsl = { index = "nvidia" }
