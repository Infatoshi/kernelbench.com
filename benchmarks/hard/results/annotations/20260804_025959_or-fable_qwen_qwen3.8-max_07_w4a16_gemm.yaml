    wrap/reset and atomic visibility, so retained outputs must be cloned and the
    exact same x buffer must be mutated in place during empirical testing.
  - _get_ext catches extension build/runtime import failure and falls back to the
    genuine fused Triton implementation. There is no forbidden library fallback.

