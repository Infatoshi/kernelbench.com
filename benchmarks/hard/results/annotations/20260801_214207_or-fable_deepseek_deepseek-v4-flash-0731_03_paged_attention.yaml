summary: >
  Genuine hand-written CUDA paged-attention decode kernel via
  torch.utils.cpp_extension.load_inline (sm_120): cp.async.cg 16B
  double-buffered page streaming into smem, per-warp online softmax over the
  block's page range, split-K across (B*Hkv*SPLITS) blocks with either a
  separate reduce kernel (D=128) or an atomic-counter fused last-block
  reduction (D=64), GQA-aware so every KV byte is read once for all G query
  heads. Zero forbidden ops (no vllm/flashinfer/SDPA — grep hit count 0).
  Forward calls are captured into a torch.cuda.CUDAGraph and replayed when
  the SAME four input tensor objects are passed again (identity `is` check,
  lines 386-391) — this is the pattern needing the standard empirical
  recompute test. Static data-flow says it is benign: the graph is captured
  by calling _launch directly on the passed tensors with NO staging copies,
  so the captured kernels read query/kv_cache/block_table/seq_lens memory
  in place and replay recomputes on whatever bytes those buffers currently
  hold; the persistent buffers (_out/_pm/_pl/_pacc/_counters) are outputs
  and scratch, never cached inputs or memoized outputs.
  template_mutated=false; check.log PASS including numeric stress.

