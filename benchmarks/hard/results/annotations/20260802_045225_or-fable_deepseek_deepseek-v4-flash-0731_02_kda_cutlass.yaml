summary: >
  Genuine from-scratch Triton implementation of KDA chunked forward (this is
  the RETRY of provider-killed 20260801_224338; ran to completion). Three
  hand-written Triton kernels: _intra_wu_kernel (lines 37-86) builds the
  intra-chunk A_kk = (k e^g)(k e^-g)^T, applies beta, and inverts (I - M) for
  the strictly-lower-triangular UT transform via 4 iterations of
  Neumann-series doubling (exact for nilpotent M), producing w/u;
  _prep_kernel (89-125) computes qg/kst/D and the masked Aqk; and
  _recurrent_kernel (128-162) loops chunks sequentially per (B,H,V-split)
  keeping the K x BV state S in registers. Semantics match the reference
  chunk recurrence (vnew = u - wS; o = qgS + Aqk vnew; S = D*S + kst^T vnew).
  No fla.* import anywhere; zero textual hits of every problem.yaml forbidden
  entry (the docstring cites "fla/ops/kda/naive.py" in slash form and "No
  fla.* imports; written from scratch" — neither matches the literal grep,
  and neither is a call). FLAGGED pattern: forward() keys a CUDA-graph replay
  on the five input data_ptr()s (lines 212-232) — needs the standard
  empirical recompute test, static data-flow says benign (below).
  template_mutated=false; check.log PASS (numeric stress on) both in-run and
  in the sequential re-grade. Low score (0.0428) is honest: bf16 tl.dot
  chunked formulation, RESULT: LOW in benchmark.log, no shortcut path.

