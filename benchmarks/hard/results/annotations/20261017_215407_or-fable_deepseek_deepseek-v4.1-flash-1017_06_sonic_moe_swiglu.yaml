summary: >
  One autotuned Triton grouped GEMM that computes the gate and up tiles in the
  same K loop and applies silu(g)*u in the epilogue. The ragged expert-to-tile
  map comes from a device-side cumsum and search over expert_offsets; rows are
  clamped on load and masked on store. No matmul, bmm or F.linear.

