empirical_requirements: >
  Two distinct follow-ups are required. First, an isolated technical regrade of
  SHA256 86a1c19c0faa697cccf7a622853468d1e4d88c09b65c50fee25955ebbfd07354
  may establish exact-source behavior, but it must not clear the contamination
  verdict or make this run leaderboard-eligible. Run in a fresh process under
  an exclusive machine-level H100 lease, with no concurrent tuner, profiler,
  benchmark, or other cell and with all seven frozen templates byte-identical.
  Strict-load one reference state_dict into both models. Preserve the exact
  hidden_states, expert_offsets, W_gate, and W_up tensor objects and record their
  data_ptr values. Clone each returned output before the next call. Warm the
  plan cache, mutate hidden_states in place while retaining its pointer, and
  require a materially changed output that matches a fresh reference within the
  applicable tolerance. Under no_grad, independently mutate W_gate and W_up in
  place, record advancing _version values, require the packed-weight cache to
  refresh, and compare each changed output to reference. Repeat a second weight
  mutation to rule out one-refresh artifacts.

  The routing cache requires stronger testing and likely a source fix. On shape
  1, warm balanced 256-row routing, then copy valid 384/128/... counts into the
  same expert_offsets object without changing its pointer; require the output to
  track the new routing and compare to reference. This test is expected to fail
  the archived source because the map cache ignores contents/version. Also
  alternate two distinct offsets tensors A/B/A whose ceil(count/BM) layouts
  differ, because both cached plans share self._map_buf. Include empty experts,
  a non-BM-aligned final nonempty expert, and skewed counts while preserving the
  total T_perm. Record output deltas and maximum errors. Fix the cache to refresh
  on routing changes or avoid sharing mutable map storage, then rerun the same
  tests, the complete official checker, and the official benchmark sequentially
  under the exclusive lease.

  Second, publication for qwen/qwen3.8-max requires a completely fresh
  uncontaminated optimization run, not merely the exact-source regrade. Make
  prior outputs/runs, annotations, leaderboard scores, solutions, and tuning
  scratch inaccessible to the model; preserve that access-control evidence;
  run the unmodified checker; perform the same live-buffer routing/weight tests;
  and benchmark once under an exclusive H100 lease. Only such a clean-room run
  can be considered for publish_grade=true.

