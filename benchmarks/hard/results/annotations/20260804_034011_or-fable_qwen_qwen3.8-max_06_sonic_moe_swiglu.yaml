evidence: |
  Frozen operation, shapes, and grader contract:
  - PROMPT.txt requires, for each expert e, output rows
    silu(hidden[start_e:end_e] @ W_gate[e]) *
    (hidden[start_e:end_e] @ W_up[e]) from live hidden_states and int32 prefix
    sums. The output is bf16 (T_perm,I). It forbids vendor dispatch and asks for
    a real variable-length grouped GEMM with fused SwiGLU.
  - shapes.py lines 8-19 fix
    (T_total,H,I,E,K)=(32768,4096,1536,128,8),
    (4096,2048,1024,64,4), and (16384,2048,4096,64,8).
    reference.py lines 53-70 loops over live expert_offsets, evaluates two
    current per-expert matmuls, applies F.silu(gate)*up, and writes each expert
    slice. Its generated balanced counts are 2048, 256, and 2048 rows/expert.
  - problem.yaml lines 21-33 preserves bf16 atol=rtol=0.02 and forbids the exact
    strings torch.matmul, torch.bmm, torch.nn.functional.linear, F.linear,
    from sonic_moe, and import sonic_moe. It requests three correctness trials
    and 20 performance trials.
  - check.py lines 37-87 scans forbidden strings, builds a fresh reference and
    solution Model per shape, strict-loads state, generates seeds 42/123/456,
    and compares every enabled numeric-stress case. numeric_stress.py lines
    78-85 adds small_hidden at 0.01x and large_hidden at 8x; lines 97-100 enable
    nominal plus stress by default. No transcript action sets or disables
    KBH_NUMERIC_STRESS.
  - benchmark.py lines 57-87 builds each shape and times solution first with 20
    trials. The evaluator timing path performs ten warmups, a 128 MiB L2 flush
    before every timed call, CUDA-event measurement, synchronization, and a
    median. benchmark.py lines 136-147 geometrically aggregate H100 bf16 peak
    fractions.

  Final source and exact routed MoE/SwiGLU semantics:
  - solution.py lines 192-200 lazily pack current W_gate/W_up into alternating
    columns of an (E,H,2I) bf16 tensor. The cache key includes both parameter
    data_ptr and _version values, so ordinary no-grad in-place parameter updates
    are intended to rebuild the pack.
  - Lines 47-90 compute ceil(count_e/BM)*NT tiles from expert_offsets and write
    expert, m-tile, and n-tile maps. Lines 94-145 load the mapped expert's
    current row start/count, use ragged TMA loads for hidden-state tails, load
    the selected packed-weight tiles, accumulate the complete H reduction with
    tl.dot, split alternating gate/up columns, compute
    (gate*sigmoid(gate))*up, and ragged-store bf16 output.
  - Lines 241-294 always launch _gg_swiglu for nonempty input. There is no
    identity return, skipped main kernel, reference call, vendor fallback, or
    cached answer. The only checked-shape branch is lines 303-315, which selects
    a single-store epilogue for shape 1's rows_e<=256, H<=2048, I2<=2048 and
    otherwise uses the two-store epilogue. Both branches execute the same full
    grouped GEMM and SwiGLU operation.
  - NT=I2//BN and range(0,H,BK) do not implement dimension-tail fallbacks, but
    all frozen shapes exactly satisfy I2%256=0 and H%64=0. Ragged row tails are
    handled by create_ragged_descriptor/load_ragged/store_ragged.

  Cache, identity, graph, and routing caveats:
  - Lines 208-213 reuse one output allocation keyed by shape/dtype/device. Every
    active tile is overwritten by the main kernel, but all returned values alias
    the same tensor object. A prior result must be cloned before another call.
  - Lines 260-284 cache TMA descriptors and the tile map by data_ptr values and
    tiling. The main GEMM still reads live hidden and packed-weight memory on
    every hit. Same-pointer hidden mutation should therefore recompute, but the
    official checker does not explicitly prove it.
  - expert_offsets is different: its values determine the cached map, yet the
    key contains only offs.data_ptr. Same-pointer routing mutation with changed
    ceil(count/BM) values is statically stale. Further, every plan references the
    same self._map_buf, so a miss for plan B overwrites plan A's stored map.
    Alternating A/B/A routings can make A's hit use B's map even when the two
    offsets pointers differ.
  - The final source has no CUDAGraph, cuda.graph, replay, captured input buffer,
    empty_cache, or graph pool. Transcript actions 87 through 210 extensively
    explored CUDA graphs and allocator manipulation, but actions 212 and 215
    removed all graph/copy/allocator code in favor of the final eager plan cache;
    action 242 confirmed no graph symbols remained.
  - _w_cat_cache retains a legitimate weight-layout precompute rather than an
    output. Its _version invalidation is plausible, but shared audit policy
    still requires same-buffer empirical weight mutation. _lp_cache stores only
    config-derived launch scalars.

