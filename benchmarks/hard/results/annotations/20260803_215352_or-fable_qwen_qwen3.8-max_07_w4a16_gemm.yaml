empirical_recompute_test: >
  REQUIRED AND PENDING on a later sequential isolated NVIDIA H100 PCIe regrade.
  Run the official checker first with numeric stress enabled. For each official
  M=1, M=32, and M=256 path, strict-load one shared state into reference and
  solution models and warm the exact same x object at least twice; clone each
  returned output immediately. Record x/w_q/scales/zeros data_ptr and _version
  values. Overwrite x in place with a materially different finite bf16 tensor,
  assert its pointer is unchanged, and require the next cloned solution output
  to differ from the prior clone and match the reference. On the CUTLASS paths,
  separately overwrite the existing w_q, scales, and zeros buffers in place
  with changed valid values, applying identical updates to the reference;
  assert pointers remain unchanged and solution versions advance, then require
  every recomputed output to change and match reference tolerance. Recreate and
  destroy models for all official shapes repeatedly in one process, log the
  native cache-key pointer tuples, and verify correctness if allocator pointer
  reuse occurs, because the C++ cache does not include N/K or own its input
  tensors. Finish with the official checker and benchmark under exclusive GPU
  isolation. Passing can establish correctness/cache semantics, but cannot
  remove the contamination verdict.

