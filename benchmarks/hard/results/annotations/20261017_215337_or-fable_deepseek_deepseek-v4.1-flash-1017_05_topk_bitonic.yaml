implication: >
  Publishable; interesting for its launch-overhead engineering rather than any
  shortcut. The agent measured that the timed interval was dominated by CPU
  submit and built a one-node CUDA graph, a raw METH_FASTCALL entry point,
  globally cached output tensors keyed on (batch, k), and __call__ = forward to
  skip nn.Module hook dispatch (no grader path uses hooks). Graph replay re-
  reads x: after an in-place overwrite the selected indices change completely
  (overlap ~0) and the values equal the reference exactly. Headline for this
  problem is milliseconds and geomean speedup vs the frozen eager anchor.
