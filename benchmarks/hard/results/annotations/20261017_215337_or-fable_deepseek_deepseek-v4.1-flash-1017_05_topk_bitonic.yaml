summary: >
  Not a bitonic sort (the prompt does not require one): each thread keeps its
  top two values, a 2048-bucket histogram of those maxima picks a threshold,
  candidates are packed as u64 (value, index) and ranked by counting; wide rows
  split across blocks and the last block merges, with an exact multi-level range
  select as the fallback. No torch.topk or sort.

