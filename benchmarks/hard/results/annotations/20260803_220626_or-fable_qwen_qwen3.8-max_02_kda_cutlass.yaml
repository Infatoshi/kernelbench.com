empirical_recompute_test: >
  REQUIRED AND PENDING on a later isolated H100 PCIe regrade. Use an official
  shape and strict-load the reference state_dict. Preserve the exact q/k/v/g/
  beta tensor objects and their data_ptr values. Call the solution once for the
  eager first sighting, again to capture on the second sighting, and at least
  once more to establish replay. Clone the returned output before every later
  call because self._o is intentionally identity-reused. Under torch.no_grad(),
  modify the same allocations in place without changing pointers, using
  domain-preserving changes such as q/k/v *= 0.95, g *= 0.9, and a modest beta
  copy_ toward 0.5. Assert all five pointers remain identical. Replay and require
  the cloned output to change materially and to match reference.Model on the
  modified contents under the applicable official tolerance. Repeat at least
  once after a second independent in-place mutation to rule out a one-replay
  artifact. Preserve pointer checks, output deltas, maximum reference error,
  graph-active evidence, and the official check result in the regrade log. Then
  run the official checker and benchmark sequentially under an exclusive
  machine-level H100 lock. Because verdict=contamination, even a successful
  regrade must not make this cell publishable; it can establish implementation
  behavior only.

