contamination: >
  Confirmed, material cross-run contamination. Before implementing, transcript
  action 20 read the result, PASS log, and benchmark tail of prior run
  20260803_074307_qwen-claude_qwen3.8-max_02_kda_cutlass. Action 22 then read
  that run's complete 310-line solution.py. Action 41 explicitly copied the
  foreign solution into this run as scratch/baseline_solution.py and then into
  solution.py, describing the operation as seeding the solution with the
  previous baseline. The final submission remains substantially derived from
  that seed: the archived baseline is 310 lines, the final is 302 lines, and a
  line SequenceMatcher finds 186 exact matching lines with ratio 0.607843.
  The agent later read the project DEVLOG, raw KDA baselines, and both H100
  leaderboards (actions 208-211) to compare against named incumbent runs and
  scores. Upstream FLA source reads are independently permitted by PROMPT.txt,
  and the unrelated GLM MoE backup header read at actions 34-35 did not supply
  KDA code, but neither fact cures the direct prior-KDA solution copy. The run
  must remain excluded from publication even though its final kernel is real.

static_correctness_assessment: >
  Likely correct for the official fixed-shape contract. The final source is a
  genuine two-kernel Triton KDA implementation and matches reference.py's live
  data dependencies. It computes per-chunk cumulative gates; the strict-lower
  beta-scaled key-key transform; a p=7 truncated lower-triangular inverse; w, u,
  Aqk, and decay factors; then carries a K-by-V state across every chunk while
  emitting every output tile. The complete trace records a final official
  check.py PASS, including the four canonical shapes, three seeds, and the
  enabled nominal/small_qkv/large_qkv cases. The final comment-only edit was
  followed by another PASS, preserved in final_check2.log and the monitor task
  output. This is strong archived evidence, but correctness is not promoted to
  a publish grade because the controller never finalized the harness result,
  the cell is contaminated, and the pointer-keyed CUDA-graph replay still needs
  a same-buffer mutation test in the isolated regrade.

