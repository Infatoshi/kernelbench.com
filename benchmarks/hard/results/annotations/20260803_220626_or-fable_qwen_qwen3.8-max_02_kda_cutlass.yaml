summary: >
  Real custom Triton KDA, statically and archivally correct, with no stale-value
  lookup or identity return. The intra kernel reads all five live inputs and
  overwrites all intermediates; the scan kernel overwrites the complete output
  from a sequential live state recurrence. Model.forward does, however, retain
  persistent buffers and a CUDA graph keyed only by the five input data_ptr
  values. Static graph semantics predict that replay rereads the current bytes
  at those captured addresses and rewrites the graph-owned output, but check.py
  never mutates a captured tensor in place. Same-buffer empirical proof is
  therefore required. Independently and decisively, the run is contaminated:
  it read and copied a complete previous KDA solution before iterating. No
  correctness or timing metric from this cell may be published.

evidence: |
  Final solution and real operation:
  - Archived solution.py is 11,621 bytes, 302 source lines, SHA256
    ce4ceebeb48c6b5a07d7f863f0305909bebdb5655438ad6f31e3633eae94e5cb.
  - reference.py lines 47-73 convert q/k/v/g/beta to fp32, scale q, chunk the
    tensors, cumsum raw per-token g within each chunk, build the strict-lower
    beta-row-scaled key-key matrix, solve its unit-lower transform, and produce
    w and u. Despite PROMPT.txt line 3's ambiguous wording about cumsum already
    being applied, this executable reference is the real operation.
  - Solution lines 71-83 load live k and g and form the same in-chunk cumulative
    gates and terminal decay. Lines 90-104 reload live k and beta and form the
    strict-lower decay-weighted key-key matrix. Lines 109-116 load live q,
    apply scale and decay, and form lower-triangular Aqk. Lines 123-141 compute
    the truncated inverse plus w and u from live beta, k, and v. There is no
    constant answer, reference call, or framework matmul fallback.
  - Solution lines 169-187 scan all NT chunks. The state starts at zero; each
    chunk computes vn=u-w@S, o=qe@S+Aqk@vn, and
    S=d*S+kg@vn. This is the same recurrence as reference.py lines 75-90.
    Output stores at solution lines 184-185 cover every official token, head,
    and V lane because the grid spans B*H*(V/BV), V=128, and BV is 16 or 32.
  - The p=7 inverse at solution lines 118-129 is approximate rather than the
    exact 64-step nilpotent solve. Its legitimacy rests on the official numeric
    tolerances and archived checks, not on an algebraic claim of exactness.
    The trace shows the agent explicitly tested p=7 versus longer products and
    retained it only after the official checker passed the large_qkv case.

  Live-input, output-cache, and CUDA-graph audit:
  - Persistent state is limited to scratch tensors/descriptors, self._o, one
    torch.cuda.CUDAGraph, its pointer tuple, and a set of seen pointer tuples
    (solution lines 198-203). _get_bufs allocates storage only; it contains no
    source input values or precomputed output (lines 205-217).
  - _launch always launches _kda_intra_kernel and _kda_scan_kernel, passing the
    current q/k/v/g/beta pointers and the persistent output (lines 228-246).
    The intra kernel fully overwrites wq, u, aqk, kg, and d; the scan fully
    overwrites self._o. No prior output value feeds either kernel.
  - forward keys its fast path only on q/k/v/g/beta data_ptr values (line 255).
    A first sighting runs eager; a second sighting captures _launch on exactly
    those addresses and replays; later identical pointer tuples call
    graph.replay (lines 256-279). The returned object self._o is identity-reused,
    but its contents are kernel-written on every eager launch and graph replay.
    It is not an input identity return or an output-value cache.
  - CUDA graph replay preserves kernel argument addresses, not captured input
    bytes. Static analysis therefore predicts live recomputation after an
    in-place write to the same q/k/v/g/beta allocations. However, the key omits
    tensor versions, shapes, strides, dtypes, and devices, and no trace action
    performs the required same-buffer mutation/replay/reference comparison.
  - check.py does not exercise the replay mutation contract. It creates fresh
    base inputs per seed (lines 72-75), calls the solution once per case (lines
    77-87), and hard/src/eval/numeric_stress.py lines 132-141 allocate new
    tensors for scaled q/k/v cases. benchmark.py lines 77-86 deliberately reuse
    one input list, so its timed steady state is the graph fast path without
    checking changed contents at unchanged addresses.

