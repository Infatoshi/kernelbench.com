summary: >
  Genuine from-scratch Triton fused grouped-GEMM + SwiGLU. Core idea:
  interleave W_gate/W_up into one (E, H, 2I) tensor so a single tl.dot per
  tile produces both projections, then fuse the SwiGLU epilogue by
  tl.reshape(acc,(BM,BN,2)) + tl.split -> silu(gate)*up, turning the
  variable-length grouped GEMM into a GROUP_M-scheduled tall-skinny GEMM
  (wgmma-friendly on Hopper). Two kernel variants: unmasked fast path when
  every expert block is BM-aligned (all benchmark shapes) and a masked
  fallback for ragged offsets — the transcript shows the agent explicitly
  bisecting and fixing a fallback OOB on ragged cases, i.e. it engineered
  correctness beyond the graded shapes. Two caching patterns, both benign
  precomputes analogous to the clean Vast sibling: (1) _fused_weights keyed
  on W_gate._version/W_up._version — rebuilds the interleaved tensor whenever
  weights mutate in place (numeric stress weight rescale bumps _version ->
  recompute); (2) _schedule keyed on (id(offsets), offsets._version, BM) —
  caches only the block-to-expert routing schedule, a pure function of
  offsets. Neither caches activations or outputs; hidden_states is computed
  fresh every call, and any hypothetical stale hit yields a WRONG answer that
  check.py would fail, not a cached-correct one. No forbidden ops. 126-min
  agent session with heavy real optimization work (TMA prototypes, warp
  specialization, SASS/PTX inspection of its own triton cache, tuning
  sweeps). 0.1232 is an honest tl.dot-formulation number.

