      key = (
          query.data_ptr(), kv_cache.data_ptr(),
          block_table.data_ptr(), seq_lens.data_ptr(),
          tuple(query.shape), tuple(kv_cache.shape),
      )
      if key != self._graph_key:
          self._out = torch.empty_like(query)
          self._launch(query, kv_cache, block_table, seq_lens, self._out)
          torch.cuda.synchronize()
          g = torch.cuda.CUDAGraph()
          try:
              with torch.cuda.graph(g):
                  self._launch(query, kv_cache, block_table, seq_lens, self._out)
              self._graph = g
              self._graph_key = key
          except Exception:
              self._graph = None
              self._graph_key = None
          return self._out
      self._graph.replay()
      return self._out
