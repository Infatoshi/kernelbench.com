static_correctness_assessment: >
  Correct under the unmodified official grader. Archived solution.py (136
  lines, 4,588 bytes, SHA256
  a430baa563a548f0c0198e8f097ba37a6cada02d6ae3e6dccf6272d5835b631b) was read
  end to end. It is a single Triton fused W4A16 kernel: each BK=128 iteration
  (exactly one quant group) loads the live packed uint8 tile, extracts both
  nibbles, applies the group's bf16 scale and zero-point per the reference
  formula (q - z) * s, and accumulates two tl.dot operations (even/odd K
  lanes) in fp32 before a bf16 store. Model registers exactly the reference
  buffers w_q/scales/zeros so strict load_state_dict works; forward always
  launches the kernel on the current input and weight storage, and
  w4a16_gemm allocates a fresh output tensor every call. There is no output
  cache, no data_ptr/_version keying, no CUDA graph, no lru_cache, no
  torch.backends mutation, no environment manipulation, no persisting-L2
  API use, and no forbidden op (the final source contains none of the four
  forbidden literals and no torch.mm/torch.matmul/F.linear). Unmasked
  tl.load of weights/scales assumes N divisible by BN and K divisible by
  BK=128, which holds for all five official shapes (BN=256 only for the
  M=256 config, otherwise BN=128; N in {4096, 12288, 14336}, K=4096); this
  is a scope limitation, not a correctness defect for the graded contract.
  Because there is no pointer-keyed cache or graph replay of any kind, no
  same-buffer empirical recompute test is required:
  empirical_recompute_required is false.

