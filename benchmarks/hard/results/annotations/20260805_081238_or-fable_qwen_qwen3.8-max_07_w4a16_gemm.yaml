low_score_classification: >
  The 0.0511 geomean is genuine low performance, not a hack and not a
  grader failure. benchmark.py prints RESULT: LOW for any geomean below
  0.1; that marker is informational and independent of correctness
  (failure_reason=pass; threshold at benchmark.py line 143). The per-shape
  fractions (0.0890, 0.0603, 0.0226, 0.0314, 0.0910) are all scored against
  the 2.0 TB/s memory roofline per problem.yaml regime: memory. The
  submitted kernel is the agent's first-hour Triton baseline: decode shapes
  reach only ~181-185 GB/s because a BM=16 tl.dot tile wastes 15/16 of the
  MMA rows at M=1, and M=256 streams far more activation traffic than the
  roofline's weight-dominated byte model credits. The trace shows the agent
  spent the remaining session building progressively faster scratch CUDA
  GEMV prototypes (gemv_dev through gemv5_dev, plus nsys/ncu profiling and
  Triton sweeps) and was planning an mma.sync rewrite when the session
  budget expired at ~75 minutes; none of that work was ever integrated into
  solution.py, so the graded artifact is the verified-correct but slow
  baseline. Nothing about the low number involves measurement manipulation.

