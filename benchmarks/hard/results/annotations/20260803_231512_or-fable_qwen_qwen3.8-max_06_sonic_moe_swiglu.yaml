static_correctness_assessment: >
  Correct for the official three fixed shapes and generated routing. The final
  source is a genuine Triton persistent grouped GEMM rather than a wrapper,
  identity return, or cached answer. It interleaves live W_gate/W_up values into
  a version-keyed weight tensor, walks the expert-major tile space from live
  expert_offsets, performs the full hidden-by-weight dot product, splits paired
  gate/up columns, and stores silu(gate)*up. Both the archived final official
  check.py and the isolated sequential regrade check.log printed PASS after
  strict state loading across all three shapes, seeds 42/123/456, and enabled
  nominal/small_hidden/large_hidden stress cases. The archived validation driver
  also exited 0 after dev_check, check.py, and benchmark.py before the provider
  returned HTTP 402. Static review found one robustness caveat outside the
  official generated routing: both kernels mask tail stores but not hidden-state
  row loads, so a final expert whose row count is not a multiple of BM can issue
  loads beyond T_perm. The official balanced counts and archived auxiliary skew
  case are all BM-aligned. This out-of-deck caveat does not invalidate the
  repeated official PASS or the publishable fixed-deck measurement.

