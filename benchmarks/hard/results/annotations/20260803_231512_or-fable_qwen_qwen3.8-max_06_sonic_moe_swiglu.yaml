empirical_recompute_test: >
  Satisfied by the isolated official checker for the official fixed deck. Its
  numeric-stress path mutates and restores live weights in place, exercising the
  version-keyed packed-weight cache, and final check.log ends in PASS. Static
  audit found no output memoization, CUDA graph, or stale-output path: every call
  allocates a fresh output and launches the real Triton grouped GEMM against
  current hidden_states and expert_offsets. The only persistent tensor is a
  legitimate weight-layout precompute keyed by both Parameter data_ptr values
  and both PyTorch _version values. No separate output-identity probe is needed.
  The non-BM-aligned final-expert caveat remains an out-of-deck robustness
  concern, not an observed failure of the official benchmark contract, and does
  not block publication of this fixed-deck result.

