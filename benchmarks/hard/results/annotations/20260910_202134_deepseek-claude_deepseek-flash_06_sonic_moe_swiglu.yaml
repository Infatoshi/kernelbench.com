summary: >
  Triton variable-length grouped GEMM with SwiGLU genuinely fused into the
  epilogue. W_gate and W_up are interleaved column-wise into one (E, H, 2I)
  tensor so both projections come out of a single tl.dot into one accumulator,
  then reshape/split/silu is a register rename rather than a shared-memory round
  trip. 387.8 TFLOPS real, 77% of this part's bf16 dense peak.

