notes:
  - "FLOP-credit cap: problem.yaml credits 2*T_total*H*(2*I), the active-per-token MoE convention, while the reference and every correct solution process T_total*K rows. Credited FLOPs are 1/K of the work performed, so peak_fraction cannot exceed 1/K per shape and the achievable geomean ceiling is about 0.1447. benchmark.py's RESULT: OK threshold of 0.1 therefore demands ~69% of physical peak on every shape at once, and OK-vs-LOW on this problem is close to a coin flip on GPU noise. Bench-design finding, not a model finding."
  - "The CUDA graph was considered, priced at ~1% of geomean, and declined because a fixed return buffer would be a correctness hazard under property_stress. The opposite call from the 01_fp8_gemm cell in the same wave."
  - "Latent defect: the weight load has no K-tail mask (solution.py:97, :99) while the activation load does. All three deck shapes have H divisible by BK so it never fires, but any ragged H is an out-of-bounds read."
  - "numeric_stress carries no state_scales for this problem, so nothing ever mutates W_gate/W_up in place; the _version guard on the weight cache is argued-correct, not measured-correct."
  - "The small_hidden stress case is toothless: it scales the output to a max around 1.6e-5 against an atol of 5e-4, so an all-zeros kernel would pass it. The teeth are large_hidden and the property case."
  - "The interleaved weight pack runs once in the warmups, roughly 21% of a shape-0 call if it were charged per call. Standard static-weight preprocessing, the identical pattern already annotated clean on this problem twice, and it moves no bytes the reference does not move."

implication: >
  On the isolated regrade this is the board leader on this GPU, not a LOW cell.
  The graded shape 0 and shape 2 are 1.92x and 1.99x the same code's clean times
  while the 0.47 ms shape 1 is untouched, which is the contention signature for
  long kernels, and nvidia-smi caught the co-tenant at 100% util. Read the cell
  as a kernel at 77% of bf16 dense peak measured against a metric that caps the
  geomean near 0.1447.

