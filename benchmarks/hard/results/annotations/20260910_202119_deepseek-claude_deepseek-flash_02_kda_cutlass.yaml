summary: >
  Two-kernel Triton chunk-parallel KDA forward. The intra kernel builds the
  decay-factored Gram matrix and inverts (I+L) exactly through a blocked product
  form on 16x16 diagonal blocks; the chain kernel walks the inter-chunk
  recurrence term-for-term against the reference. No CUTLASS needed: the prompt
  permits Triton and FLA is not even installed on the box.

quotes:
  - file: solution.py
    lines: [112, 119]
    label: "Exact triangular inverse by product form, not a Neumann truncation"
    text: |
          # Md = (I - Ad)^{-1} = (I+Ad)(I+Ad^2)(I+Ad^4)(I+Ad^8); Ad^BC = 0 for BC=16
          M = eye + Ad
          A2 = tl.dot(Ad, Ad, input_precision=_TF32)
          M = M + tl.dot(M, A2, input_precision=_TF32)
          A4 = tl.dot(A2, A2, input_precision=_TF32)
          M = M + tl.dot(M, A4, input_precision=_TF32)
          A8 = tl.dot(A4, A4, input_precision=_TF32)
          Md = M + tl.dot(M, A8, input_precision=_TF32)
  - file: solution.py
    lines: [187, 192]
    label: "Inter-chunk recurrence, line for line against reference.py:87-90"
