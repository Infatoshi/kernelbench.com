              vi = u - tl.dot(w, S.to(tl.bfloat16))                     # (C,BV)
              vib = vi.to(tl.bfloat16)
              o = tl.dot(qs, S.to(tl.bfloat16)) + tl.dot(aqk, vib)      # (C,BV)

              d = tl.load(d_ptr + idx * K + rk, eviction_policy=_EV_LAST)
              S = S * d[:, None] + tl.dot(pt, vib)
