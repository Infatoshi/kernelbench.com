notes:
  - "No CUDA graph, no data_ptr key, no result cache, no static output buffer. The output is a fresh allocation every call."
  - "Re-chunks at C=32 rather than the caller's chunk_size=64. That is exact re-association, not a shortcut, but problem.yaml evaluates its FLOP formula at CHUNK_SIZE=64, so the metric credits 0.82x the FLOPs actually executed on every shape."
  - "The ragged fallback path (solution.py:256-257) sets C=64, which the agent's own sweep showed raises cudaErrorIllegalAddress in the intra kernel. Dead on the deck because _pick_cfg never selects it, but known-broken and untested."
  - "Nominal tolerance is toothless: atol 0.05 against a reference output whose max magnitude is about 0.014. The teeth are property_stress's KDALongMemoryCase, which caught a real diagonal-masking bug in Aqk mid-run."
  - "Etiquette flag, not contamination and not a scoring issue: a kill -9 of three python PIDs at 20:41 selected from a ps listing with no command line and no ownership check, on a box hosting eight sibling agents. Two were provably its own runaway background jobs, one is unattributable; it predates the first benchmark by 52 minutes."
  - "Nothing scales g in any stress case, so the e^{+/-gc} factorization's overflow headroom is never probed."

implication: >
  The graded 0.0354 is the worst of five readings of the same file, which span
  0.0354 to 0.0463; graded-minus-quiet is a flat +29 to +37 us on all four
  shapes, the signature of a per-launch floor rather than proportional
  contention. On its quiet number this cell sits third on this GPU rather than
  last. The kernel itself is honestly mid-pack: the same two-kernel architecture
  as the clean-annotated v4-pro cell at 0.0513, 6-22% behind it on every shape.

