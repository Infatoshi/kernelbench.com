summary: >
  Hand-written Triton fp8 GEMM: tl.dot on two e4m3 operands lowering to
  mma.sync.m16n8k32 with an fp32 accumulator, per-output-channel dequant in the
  epilogue. 578.9 TFLOPS on 4096-cubed is above this part's 500 TFLOPS bf16
  dense peak, which is independent physical proof the fp8 pipe is really
  running rather than a bf16-upcast fallback.

