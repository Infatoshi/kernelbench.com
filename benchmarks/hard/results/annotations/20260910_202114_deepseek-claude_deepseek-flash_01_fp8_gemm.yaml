notes:
  - "All three gate-triggering patterns are present but hold operand or launch state, never results: the weight cache is a repack, the CUDA graph replays over the live input pointer and rewrites every output element, and the shared static output is weakref-guarded."
  - "check.py almost certainly never exercises a graph replay (every call has a distinct key), while benchmark.py replays on 39 of 40 calls; trusted correctness gates the non-graph path."
  - "Mainloop and epilogue loads are unmasked (solution.py:90, :91, :96); MASK_M/MASK_N guard only the store. No deck shape triggers it, but any ragged M or N is an out-of-bounds read."
  - "The padded weight is cached once, so ~34 MB of repack traffic on shape 1 (K=4127) sits outside the timed loop. Standard inference practice; the activation pad is not cached."
  - "The agent rewrote its own docstring to stop the framework detector mislabelling a Triton kernel as ptx, correcting a label that flattered it."

implication: >
  Read the cell as real fp8 kernel engineering. The CUDA graph is worth roughly
  6-7% of the geomean by the agent's own A/B (237.5 vs 250.0 us on the square
  shape, 83.3 vs 96.7 us on the skinny one), not the score, and the same
  data_ptr-keyed-graph pattern was already ruled clean on this problem for
  glm-5.2 and fugu-ultra. This solution is strictly better guarded than either:
  it has the _version key glm-5.2 lacked plus a weakref liveness check on the
  shared output buffer.

