launch_overhead_bound_peak_fraction: >
  peak_fraction 0.0276 (RESULT: LOW) is a property of the metric on this VM,
  not a correctness or kernel-quality verdict. All five official medians sit
  at 21.6-25.4 us, which the trace decomposes: action 146 measures the CUDA
  event pair alone at 10.70 us and an empty CUDA-graph replay at 14.22 us
  under the same flush-and-time flow, and action 133 measures kernel-only
  replay-loop times of ~17.5/9.5/9.4/8.4/2.1 us for shapes 0-4. Action 81
  shows the SM idling at 345 MHz between flush windows (DVFS) and boosting
  to 1755 MHz under sustained load, with a 1 GiB D2D copy reaching 1848 GB/s
  (r+w), confirming real H100 PCIe bandwidth. With per-window measurement
  overhead of ~10-14 us dominating 2-18 us kernels, the bandwidth-roofline
  fraction is floor-bound for every possible solution at these tiny shapes;
  the deck's own sota/torch.topk sweep scores peak fractions of the same
  order. TopK's publishable headline is per-shape milliseconds and paired
  speedup versus torch.topk, and by that headline this solution is ~4x
  faster than the deck comparator on the same box.

