  agent_container=true with image nvcr.io/nvidia/tensorrt-llm/release:1.2.1,
  and gpu_queue_mode=agent_container_native_profiling_path_wrapper_gpu_lock.
  The GPU is proven in-trace: nvidia-smi at 11:04:49 UTC reports NVIDIA H100
  PCIe, bus 00000000:06:00.0, 0 MiB / 81559 MiB used, 0% utilization, driver
  595.84, CUDA 13.2, and "No running processes found"; every later process
  table in the transcript also shows no running processes. The container runs
  NGC PyTorch 2.10.0a0+b4e4ee8 (Release 25.12). Isolation is corroborated by
  both lock logs: gpu_lock.log shows the post-session harness check (49 s)
  and benchmark (4 s) starting with zero queue delay, and
  agent_home/gpu_lock_container.log serializes all 278 in-session GPU
  commands with only two 1-second same-second wait-to-start offsets (lock
