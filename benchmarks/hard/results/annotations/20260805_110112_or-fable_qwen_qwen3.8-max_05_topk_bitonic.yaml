  wrapper's own nvidia-smi preflight in the same second) and no multi-second
  waits, i.e. no foreign command ever occupied the queue. These artifacts
  prove single-tenant operation of this run's queue during the session; that
  is exactly what is claimed, and the in-run harness benchmark medians are
  the publishable numbers for this cell.

  Headline interpretation: template_files/benchmark.py reports one solution
