  Final source (solution.py, 622 lines, SHA256 94fc6ad4...):
  - Lines 1-26 document the v6 strategy. Lines 55-66 implement the monotonic
    float-bit transform and 64-bit key packing; lines 71-119 the warp-scan
    pivot pick with early exit (dstar=-1) when the alive set fits k; lines
    121-185 warp bitonic sort/emit over register-held keys with pre-round
    snapshots; lines 187-230 the four-pass radix select over double-buffered
    smem histograms; lines 232-250 winner compaction.
  - Lines 251-318 topk_main: float4 chunk loads into registers with alive
    bitmasks (out-of-range slots never alive), smem init overlapped with
    loads, radix select, compaction, then single-block emit or per-block
    scratch publish. Lines 320-345 topk_tail_small (warp sort of <=256
    candidates); lines 347-400 topk_tail (per-row radix merge of BPR*K
    candidates); lines 402-459 topk_argmax with warp/block reductions and
    int64 index write.
  - Lines 476-520 host dispatch on PyTorch's current CUDA stream for cfgs
    0-4 (16x1024/8, 1x1024/8, 8x512/4, 3x512/8 + small tail, argmax 512);
    ensure_smem never fires (all dynamic smem <= ~10.8 KB < 48 KB), so no
    illegal cudaFuncSetAttribute occurs inside graph capture. Lines 523-537
    build the extension with -gencode=arch=compute_90a,code=sm_90a. Lines
    540-547 _CONFIGS maps exactly the five official tuples; unsupported
    shapes raise RuntimeError (the prompt scopes the task to these shapes).
  - Lines 550-622 Model: dummy buffer for strict loading, preallocated
    out_v/out_i/scratch, pointer-keyed graph dict, last-pointer fast path
    whose hit still calls replay, capture-on-miss inside
    torch.cuda.graph(g) followed by immediate replay, and module-level
