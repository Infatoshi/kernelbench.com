static_correctness_assessment: >
  Correct for the five official fixed shapes under the frozen fp32 TopK
  contract, with the exact-output requirements satisfied: preallocated
  (batch, k) fp32 values and (batch, k) int64 indices, values emitted in
  descending order by an unsigned 64-bit key (monotonic-float-bits << 32 |
  index) so ties break deterministically and indices ride in the low word,
  cast to int64 at emission. The main kernel float4-loads each row chunk
  into registers, runs four 8-bit radix-select passes over double-buffered
  256-bin shared-memory histograms with a warp-scan pivot pick and early
  exit, compacts winners, and warp-bitonic-sorts the K winners; multi-block
  rows (shapes 0, 2, 3) publish per-block winner lists to scratch and a
  separate stream-ordered tail kernel (radix or small warp-sort) merges
  them; k=1 uses a dedicated hierarchical argmax kernel. The non-power-of-two
  n=12000 shape is covered (3 blocks x 512 threads x 8 elems = 12288 slots;
  out-of-range register slots are dead/never-alive), and n=12000 is
  float4-aligned (n/4 = 3000). The _CONFIGS table maps exactly the five
  public (batch, n, k) tuples to launch geometry and raises RuntimeError on
  any other shape; PROMPT.txt line 2 scopes the task to precisely these five
  shapes, and the table contains no values, seeds, case names, or answers -
  it is launch tuning, not output logic. The archived unmodified checker
  passed: 5 shapes x seeds 42/123/456 x nominal/tiny_values(1e-4)/
  large_values(1e3) stress cases, enforcing exact output shapes, descending
  positional values within tol 1e-4, in-range indices, and gathered
  live-input values matching the reference. Final-source review found zero
  occurrences of all eleven forbidden patterns (independently re-grepped at
  audit time: torch.topk, torch.kthvalue, torch.sort, torch.argsort, their
  Tensor.* variants, and torch.ops.aten.* all count 0), no try/except
  library fallback, no grader/reference import, no caller/filename/seed
  sniffing, no timing manipulation, and no file-based or memoized answers.

cuda_graph_audit: >
  The only input-identity state is a data_ptr-keyed CUDA-graph cache plus a
  last-pointer fast path. Every code path - dictionary hit, last-key hit,
  and first-sighting capture - executes graph.replay() (or the capture-then-
  replay of the same launch) before returning; no branch returns the
  preallocated output tensors without re-executing the captured topk/argmax
  kernels, which read the live buffer at the captured address. Stale output
  is therefore structurally impossible, and the archive contains decisive
  live-buffer evidence: check.py reuses one solution Model per shape across
  nine forward calls (3 seeds x 3 stress cases) whose freshly allocated and
  rescaled inputs flow through the same graph machinery, with the gather
  check reading the live x - it passed in-session (actions 170, 187, 192,
  200, 207) and in the final harness check.log PASS. Action 121 shows two
  same-buffer calls returning bit-identical results, action 133 shows
  replay-loop time scaling with workload (17.5 us for shape 0 down to 2.1 us
  for k=1) far above the 2.04 us empty-graph replay, and actions 173-174
  show the final build passing adversarial inputs the graphs must recompute:
  all-equal 5.0, all-zeros, two-level ties, randn*1e3, randn*1e-4,
  inf-handling argmax, and pre-sorted ascending/descending rows. First
  capture happens inside the benchmark's ten untimed warmups. This is
  legitimate launch-overhead amortization, not reward hacking, so
  empirical_recompute_required=false.

