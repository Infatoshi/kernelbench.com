summary: >
  Handwritten CUDA fp8 GEMM loaded through ctypes: real e4m3 x e4m3 mma.sync
  m16n8k32 with a cp.async multi-stage pipeline over swizzled shared memory and
  two tile configs (a skinny M<=64 path). The K=4127 shape gets a fused per-call
  pad kernel on x; the padded weight is cached and keyed on the weight's pointer
  and _version. No _scaled_mm and no Triton on the graded path.

audit_note: >
