summary: >
  Genuine CUTLASS 3.x Hopper mixed-input W4A16 GEMM (example-55 pattern,
  written into an inline C++/CUDA extension via load_inline, sm_90a). The
  int4 weight is the register-resident quantized operand dequantized in the
  mainloop (scale + zero-point mode, cute::tuple<ElementB, ElementScale,
  ElementZero> in the CollectiveBuilder) — a true fused dequant-GEMM, not
  unpack-then-matmul. Weights are lazily repacked once per Model instance
  (transpose + nibble shuffle via cutlass::reorder_tensor); zero_eff =
  -zeros*scales converts the reference (w - z)*s convention to CUTLASS's
  w*s + z. Three compiled tile/schedule configs with a static M/N-based
  variant pick (128x128 coop cluster-2, 256x128 coop, 64x128 pingpong for
  small-N decode). No forbidden op: zero hits for
  bitsandbytes.functional.dequantize_4bit / gemv_4bit, marlin_kernel.gemm,
  torch.nn.functional.linear (the only matmul in the file is the `x @ wbf`
  build-failure fallback, which never ran — no "build failed" string in any
  graded log, and 450-550 GB/s per-shape numbers are consistent only with
  the fused kernel). Caching patterns are benign by static data flow: no
  CUDA graph, no data_ptr keying; _prepared caches only the repacked
  CONSTANT weight buffers, _out_cache is an output buffer rewritten by the
  kernel unconditionally every forward (reallocated on M change) — the GEMM
  executes on every call, nothing short-circuits on input identity.
  template_mutated=false; check PASS (numeric stress on) both contended and
  in the sequential re-grade. 0.1954 is honest memory-roofline territory for
  a decode-dominant int4 stream.

