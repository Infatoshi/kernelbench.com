contamination: >
  contaminated. The trace contains a deliberate cross-run source read from the
  shared Torch-extension cache created by the earlier same-problem run
  20260803_034401_qwen-claude_qwen3.8-max_01_fp8_gemm. The agent opened that
  cache's cuda.cu, main.cpp, and build.ninja, described it as a "massive head
  start" and as another agent's attempt, then reused its load-bearing CUTLASS
  PerChannelScaleEVT/CollectiveBuilder/run_gemm structure. The foreign
  build.ninja exposed the prior run id directly. Other foreign ids in broad
  filesystem/process listings are incidental, but this same-problem source
  read is substantive and independently requires exclusion.

