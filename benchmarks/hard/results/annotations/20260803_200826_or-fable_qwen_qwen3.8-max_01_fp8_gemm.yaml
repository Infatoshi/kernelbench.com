empirical_recompute_test: >
  REQUIRED AND PENDING on a later isolated RTX_PRO_6000 regrade. Use official
  shape M=4096, N=4096, K=4127 and the archived reference/check tolerance.
  Strict-load one state_dict into the solution model, warm at least twice on
  the same x object to populate both _pad_cache entries, and save y0, x and
  weight data_ptr values, and _version values. Under torch.no_grad(), form
  x_new=(-x.float()).to(float8_e4m3fn), execute x.copy_(x_new), assert the x
  data_ptr is unchanged and _version advanced, then compute y1; require y1 to
  differ from y0 and match reference on the overwritten x. Next form
  w_new=(-solution.weight.float()).to(float8_e4m3fn), copy the identical w_new
  into the exact existing solution and reference weight buffers, assert both
  pointers are unchanged and the solution weight _version advanced, then
  compute y2; require y2 to differ from y1 and match reference. Preserve the
  exact output deltas, pointer/version transitions, and official checker
  result in the regrade log. Passing this test can close the cache-semantics
  concern but cannot cleanse the cross-run contamination verdict.

