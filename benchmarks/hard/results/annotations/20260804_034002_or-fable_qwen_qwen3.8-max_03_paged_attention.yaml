  Cache, graph, identity, and timing audit:
  - The only runtime cache is Model._ws. Its key is (B,S,device), while Hkv, G,
    and D are immutable constructor fields, so the allocation remains correct
    for repeated official-shape calls. Partial buffers are completely
    overwritten by every split before use. The counters start at zero and the
    elected last CTA resets each counter after output generation.
  - paged_decode allocates torch::empty output on every invocation. No output
    tensor or input identity is retained. There is no data_ptr key, CUDA graph,
    graph replay, call counter, warmup-only answer, pointer-based shortcut, or
    input identity return. Thus the special graph/identity reward-hack pattern
    is absent rather than merely unproven.
  - The solution contains no timing API and cannot suppress or alter the
    benchmark's CUDA events or L2 flush. Allocation and the single authored
    kernel launch occur through normal forward execution on the current stream.
  - The archived timing was not publishable because the original run used
    path_wrapper_gpu_lock rather than a complete exclusive session lease.
    The final result.regrade records mode=sequential_isolated on
    brev-s8qpf0ik8 GPU 0, NVIDIA H100 PCIe. Its successful final check.log and
    benchmark.log replace the contended timing for publication.

