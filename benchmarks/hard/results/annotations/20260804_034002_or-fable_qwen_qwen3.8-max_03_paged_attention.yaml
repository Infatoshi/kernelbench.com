evidence: |
  Frozen operation and grading contract:
  - template_files/PROMPT.txt requires single-query paged decode over query
    (B,H,D), packed kv_cache (num_blocks,16,Hkv,2D), block_table page
    indirection, and per-batch seq_lens. It requires bf16 (B,H,D) output for
    five exact H100 shapes, including L=1535 and D=64/L=2000 tails, and forbids
    vLLM, FlashInfer decode, and PyTorch scaled-dot-product attention.
  - template_files/reference.py lines 68-114 reads L from each live seq_lens
    element, gathers exactly ceil(L/16) page ids from block_table, truncates the
    last page to L, separates packed K and V, repeats KV heads by the GQA ratio,
    evaluates scaled QK softmax and weighted V in fp32, then casts to bf16.
  - template_files/shapes.py lines 11-18 fixes
    (8,32,8,128,1024,16), (32,32,8,128,2048,16),
    (4,64,8,128,4096,16), (16,32,8,128,1535,16), and
    (8,16,4,64,2000,16).
  - template_files/check.py lines 45-88 creates fresh reference and solution
    models per shape, strict-loads state, and checks seeds 42/123/456 under every
    numeric-stress case. The numeric-stress evaluator adds small_q_kv at 1e-2
    scale and large_q_kv at 8x scale by default. problem.yaml preserves base
    bf16 atol=rtol=0.02 and three correctness trials.
  - template_files/benchmark.py times the solution before optional baselines,
    uses the frozen FLOP/byte formulas, and geometrically aggregates per-shape
    bandwidth fractions. No baseline was enabled in archived benchmark.log.

  Final source and live paged-attention semantics, solution.py SHA256
  a9ced986a2540137a9113ce035fdeb903c3335684fd0adbb087bdbce7b58dcc6:
  - Lines 58-80 implement issue_page. For each logical page it reads the current
    block_table[b, logical_page], computes the selected physical-page/KV-head
    base using runtime tensor strides, and cp.async-copies all 16 packed K/V
    rows into a staged shared-memory buffer. The bounds test prevents any
    block-table access beyond the split's live logical-page range.
  - Lines 82-128 map grid.x to b and kvh and grid.y to split, read the current
    seq_lens[b], derive ceil(L/16) pages, and distribute those logical pages
    across S. Lines 130-159 load the current GQA query group, zero-pad unused
    WMMA rows, and initialize fp32 online-softmax state.
  - Lines 161-224 pipeline the current physical pages. WMMA computes the G-by-16
    scaled QK tile in fp32. Each of four warps owns four page tokens; the
    gtok < L predicate excludes padded positions on the final partial page.
    Every included score updates fp32 running max, denominator, and weighted-V
    accumulator. K/V are always loaded through block_table, so physical page
    order and non-contiguous allocation remain semantically live.
  - Lines 226-267 merge token-owning warps into one split max/denominator and
    numerator per GQA query head and publish them to global workspace. Lines
    269-308 use __threadfence, an atomic last-CTA election, max-shifted LSE
    combination across all S splits, bf16 output stores, and counter reset.
  - Lines 311-377 launch on at::cuda::getCurrentCUDAStream and specialize only
    D=64/128, G=4/8, and supported block/stage pairs. The final Model always
    selects block=128/stage=2; _pick_splits derives S from batch*Hkv and page
    count. These branches select valid launch geometry and never contain input
    values, seeds, expected outputs, or grader state.
  - Lines 388-416 configure local installed CUDA include paths and build this
    source with load_inline. The try/except only tolerates include-path
    discovery failure; it does not provide a computational fallback.
  - Lines 419-479 define Model. _get_ws reuses only correctly shaped fp32
    partial_acc, fp32 partial_ml, and zero-initialized int32 counters keyed by
    B/S/device. forward always calls _ext.paged_decode on the current query,
    kv_cache, block_table, and seq_lens and returns its newly allocated output.
    There is no graph capture, output cache, or alternate eager/library path.

  Forbidden operations, reward-hack, and grader integrity:
  - Final-source review found zero occurrences of every forbidden literal in
    problem.yaml and no call to vLLM, FlashInfer, SDPA, torch.mm/matmul/einsum,
    torch.compile, CUDA graphs, CUDA events, synchronize, sleep, profiler,
    benchmark code, subprocess, filesystem answer loading, inspect/currentframe,
    caller sniffing, or environment-controlled result path.
  - get_inputs/get_init_inputs import the supplied reference only to mirror its
