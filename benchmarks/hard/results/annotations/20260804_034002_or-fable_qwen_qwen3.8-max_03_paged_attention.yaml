static_correctness_assessment: >
  Correct for the five frozen H100 deck shapes. The final fresh-process
  sequential isolated official checker passed before the isolated benchmark.
  The final source is a real custom CUDA WMMA paged-attention implementation.
  Each CTA corresponds to
  one batch/KV-head/split, reads the current seq_lens and block_table, gathers
  the live packed K/V pages, computes all grouped query heads, maintains fp32
  online-softmax numerator/max/denominator state, and merges split state before
  writing bf16 output. The non-power-of-two 1535-token case is predicated by
  gtok < L, so the last page's padded token is loaded but not included. D=64/128
  and G=4/8 dispatch branches exactly cover all five shapes. Launch split
  heuristics choose execution geometry, not answers.

  The reusable workspace contains only fp32 split accumulators, fp32 max/sum
  pairs, and int32 completion counters. Every forward allocates a new output and
  launches the authored kernel on PyTorch's current stream. There is no CUDA
  graph, data_ptr-keyed executable cache, output identity reuse, input-value
  fingerprint, output memoization, or answer cache. The last CTA is selected by
  an atomic counter after all CTA threads publish partials and execute
  __threadfence; it merges every split and resets the counter to zero for the
  next call. Static analysis therefore supports repeated-call correctness,
  while the final isolated checker supplies empirical correctness evidence for
  the exact archived source. No output, graph, input-value, or answer cache
  exists that would require a separate cache-invalidation exception.

