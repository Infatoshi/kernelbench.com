summary: >
  ctypes CUDA W4A16 GEMM that fuses the int4 unpack and dequant
  (sub/mul.rn.bf16x2 against a packed scale and 128+zero word, exact under the
  integral-zero contract) into mma m16n8k16 bf16. Weights are repacked once into
  fragment order and streamed from global with intra-CTA split-K; a per-shape
  table picks tile configs only, with a generic fallback.

