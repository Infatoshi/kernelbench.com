implication: >
  Publishable; interesting for a latent stale-weight cache that the grader never
  exercises. The repacked weights are keyed on the w_q, scales and zeros
  pointers without _version, so an in-place weight edit leaves them stale:
  doubling scales in place gave norm(sol)/norm(ref)=0.5000 (cosine stays 1.0
  because it ignores scale). _apply and _load_from_state_dict invalidate it, and
  the check only perturbs activations, so the graded number is real. Activations
  are read fresh every call.
