          def _pack(self, want4: bool):
              w_q, sc, zp = self.w_q, self.scales, self.zeros
              key = (w_q.data_ptr(), sc.data_ptr(), zp.data_ptr(), w_q.device, want4)
              if self._packed is not None and self._packed[0] == key:
                  return self._packed[1], self._packed[2]
              w_c = w_q.contiguous()
              wp = _prepack_w4(w_c, self.N, self.K) if want4 else _prepack_w(w_c, self.N, self.K)
              sz = _prepack_sz(sc, zp, self.N)
