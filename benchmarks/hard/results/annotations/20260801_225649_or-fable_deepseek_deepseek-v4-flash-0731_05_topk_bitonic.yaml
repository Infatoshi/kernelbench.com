  Genuine custom CUDA top-k via load_inline: three k-specialized fused
  kernels — k=1 block argmax with warp shuffles (lines 79-138), k=8 bitonic
  register sort + block-wide repeated-max with a warp-level P-way merge
  (lines 141-290, the deck's k), k>=16 CUB BlockRadixSort (lines 293-377).
  Each row is split into P blocks; the last block per row (atomic counter,
  lines 238-243) merges partials in the same launch — no second kernel.
  Steady state is a CUDA-graph replay keyed on x.data_ptr() (lines 500-506)
  to cut launch overhead, plus an nn.Module __call__ hook bypass (lines
  508-511). Returns (float32 values desc, int64 indices) matching
  reference.py's contract. Zero forbidden-op hits in solution.py
  (torch.topk/kthvalue/sort/argsort/.sort(/.topk(/aten — grep rc=1). CUB
  BlockRadixSort is an in-kernel CUDA primitive, not a banned torch/aten
  dispatch, and the solution docstring declares it openly.
  template_mutated=false. 0.0284 peak_fraction is normal for this
  launch-overhead-bound problem (ceiling ~0.02 for every model).

