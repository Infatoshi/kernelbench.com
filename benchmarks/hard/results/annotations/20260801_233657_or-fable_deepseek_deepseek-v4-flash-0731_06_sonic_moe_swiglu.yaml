summary: >
  Genuine Triton grouped-GEMM + fused SwiGLU: gate and up weights interleaved
  into one (E, H, 2I) combined tensor so a single tl.dot MMA tile carries both
  projections; the epilogue tl.split()s even/odd columns and fuses
  silu(gate)*up in fp32 before bf16 store (kernel lines 26-80). Each program
  binary-searches expert_offsets to find its owning expert (lines 39-48).
  Zero forbidden ops: no torch.matmul/bmm/F.linear anywhere, no sonic_moe
  import — the only matmul is tl.dot inside the agent's own kernel. One
  caching pattern: _combined_weights() memoizes the interleaved WEIGHT tensor
  keyed on (W_gate._version, W_up._version) (lines 116-127) — it caches a
  derived copy of the inputs, never outputs; any in-place weight mutation
  (load_state_dict, numeric-stress rescale) bumps _version and forces a
  rebuild. No data_ptr keying, no CUDA graphs, activations never cached —
  every forward launches the kernel on the live hidden_states. Low-risk, but
  listed below for the operator's standard empirical recompute pass.
  template_mutated=false, check.log PASS.

