summary: >
  Genuine CUTLASS 3.x SM90 fp8 e4m3 GEMM built via
  torch.utils.cpp_extension.load_inline: CollectiveBuilder mainloop
  (TmaWarpSpecializedCooperative 128x128x128 5-stage for large M, 64x128x128
  auto-schedule for M<128 decode) with a fused PerColLinCombPerColBiasEltAct
  epilogue applying the per-output-channel weight_scale, fp8 x fp8 MMA with
  fp32 accumulate, bf16 output. CUTLASS headers vendored at
  cutlass_local/include next to solution.py. A from-scratch Triton fp8 GEMM
  is included strictly as a build-failure fallback (never used when the
  extension loads). torch._scaled_mm: ZERO occurrences in solution.py (the
  agent used it only in scratch bench_cublas.py as a ceiling reference and
  explicitly noted it is forbidden for the solution). Two patterns noted:
  (1) a datetime.UTC compat shim — solution.py top-of-file plus a 9-line
  sitecustomize.py in the problem dir — that aliases
  datetime.UTC = datetime.timezone.utc on Python 3.10 because the harness's
  src/eval/timing.py does `from datetime import UTC` (3.11+); semantically
  identical to CPython 3.11's own attribute, touches no tolerance/timing/
  grading logic, and is a no-op in the re-grade venv (CPython 3.11.15).
  (2) FLAGGED for empirical test: _pad_x caches the K-padded copy of x
  (needed only for the off-alignment K=4127 shape) keyed on id(x) with a
  held strong reference plus x._version, so in-place torch mutation is
  caught and recomputed; the GEMM itself recomputes every call. Weight pad
  cache (_wp) is version-keyed module state, benign. template_mutated=false;
  re-grade check.log PASS (numeric stress on). Score profile is honest:
  0.536/0.522/0.054/0.605 per shape — the 0.054 skinny M=32 decode shape is
  memory-bound, geomean 0.3096.

