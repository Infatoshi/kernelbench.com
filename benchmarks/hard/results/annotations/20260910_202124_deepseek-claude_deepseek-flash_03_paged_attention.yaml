summary: >
  Hand-written CUDA split-KV paged decode through load_inline: one launch, four
  warps merging (m, l, acc), an atomic ticket electing the last CTA to combine
  the chunk partials. What makes it interesting is the ceiling: the agent
  derived a 1205 GB/s bandwidth roof from torch.Tensor.sum() and stopped, 26%
  short of what this GPU delivers.

