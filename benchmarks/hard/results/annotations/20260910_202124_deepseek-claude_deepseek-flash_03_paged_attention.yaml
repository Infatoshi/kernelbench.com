notes:
  - "Stricter than either board leader on this problem: both the Qwen 3.8 Max and Grok 4.6 cells keep pointer-keyed CUDA-graph caches, this one has no cache surface at all."
  - "The false ceiling is load-bearing. scratch/ceiling.py measures bandwidth with a torch reduction, which under-reads this GPU by ~25%; Qwen's archived shape-1 number on the same family is 1523.9 GB/s. That belief converted 'shapes 1 and 3 are at 0.63 and 0.57' into 'shapes 1 and 3 are done' and the last hour went to re-verification."
  - "One global chunk_tokens for five shapes. The agent measured +44% bandwidth on shape 2 from simply adding CTAs, then swept the knob globally, found no global winner, and kept 128; g_cfg is already keyed per shape, so a per-shape table was a five-line change."
  - "Scalar-FMA QK reduction with a 3-step shfl_xor butterfly where the leaders use tensor cores."
  - "Deck tolerance gap: with inputs at randn*0.1 an all-zeros kernel passes the nominal case on every shape and small_q_kv on every shape. Only large_q_kv has teeth. The predicated tail that shape 3's L=1535 exists to force is four orders of magnitude inside atol, and property_stress pins its one real gate to shape index 0, so two of the three kernel instantiations are never property-tested."
  - "chunk_tokens is read from the PA_CT environment variable (defaulting to 128, unset at grade time). A tuning hook in a graded artifact; it cannot change correctness."

implication: >
  Two things are true at once and the cell should be read with both. The graded
  0.3359 is a measurement artifact: the same binary read 0.474-0.481 across
  22:23-22:34, the per-shape slowdown is monotone in working-set size (1.13x at
  269 MB up to 1.76x at 34 MB), and the box's own 64 MB read probe went 1247.6
  to 627.1 GB/s between the windows. But even at 0.475 the cell sits well below
  Qwen 3.8 Max's 0.6926 and Grok 4.6's 0.6217, and that gap is real engineering
  headroom the agent talked itself out of chasing.

