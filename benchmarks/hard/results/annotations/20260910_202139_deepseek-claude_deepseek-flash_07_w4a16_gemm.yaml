summary: >
  Real fused W4A16 Triton kernel. Packed uint8 is read inside the K loop and
  both nibble planes are widened, zero-shifted and scaled in registers, so no
  dequantised weight ever reaches memory and no pre-dequant cache exists. The
  scale is folded into the weight operand so one fp32 accumulator spans the
  whole K, measured at 2.9x the two-accumulator form.

