    label: "Nibbles unpacked and dequantised in registers inside the mainloop"
    text: |
              wq = tl.load(w_row + nrow, mask=n_mask[None, :], other=0)
              zbf = tl.load(zr_ptr + offs_n, mask=n_mask, other=0.0)
              s = tl.load(sc_ptr + offs_n, mask=n_mask, other=0.0)

              # (q - z) is exact in bf16; the product rounds exactly like the
              # reference's bf16 dequant.
              wlo = ((wq & 15).to(tl.bfloat16) - zbf[None, :]) * s[None, :]
              whi = ((wq >> 4).to(tl.bfloat16) - zbf[None, :]) * s[None, :]

              tot = tl.dot(x0, wlo, tot)
              tot = tl.dot(x1, whi, tot)
