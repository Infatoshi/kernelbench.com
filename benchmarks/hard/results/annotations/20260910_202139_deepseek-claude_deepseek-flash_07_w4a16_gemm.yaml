notes:
  - "07 is the one hard check.py that never imports property_stress (02, 03, 05 and 06 all do). The same-buffer overwrite probe that 06 got for free inside its own trusted check is entirely absent here, so both deviations below go unobserved by anything in the run. Bench ticket, not an agent finding."
  - "The replay path returns a shared static buffer where the reference returns a fresh tensor, and the cache key omits the scales and zeros pointers plus the Model identity. Unreachable from this deck (all five shapes have distinct M, N, K), but a duplicated shape in a future sweep could replay against a dead model's scales."
  - "The graph is worth about +10% of geomean by the agent's own in-process A/B, and the same pattern is already annotated clean on this problem at 0.3653, 0.3681, 0.3439 and 0.2608."
  - "No weight preprocessing sits outside the timed window, because there is none: DRAM sees exactly the packed bytes plus the two bf16 tables, which is what bytes_formula credits."
  - "st[\"ok\"] = False is a process-wide latch, so one capture failure silently drops every later shape to the eager path."
  - "Both numeric-stress cases here have teeth, unlike 06's. The real margin note runs the other way: the agent's own M=256 max-abs-diff of 0.0469 against atol 0.10 is only 2.1x of headroom, all accumulation-order noise."

implication: >
  The graded 0.1791 and the agent's own 0.2596 are both artifacts of the same
  thing, in opposite directions. An empty Triton kernel measures 45.06 us
  through timing.py's event pattern against 9.96 us of wall time, while the five
  shapes' roofline times are 4.96-19.52 us; the graded run sits ~27 us per call
  above the agent's, a uniform additive shift rather than the multiplicative one
  contention usually leaves. Modelled against that floor the graded number is
  98% of the ceiling a perfect kernel could reach. The 07 board on this GPU is
  ordered substantially by the harness's event-timing floor at grading time, not
  by kernel quality, and the regrade must record a null-kernel floor in the same
  process or the number stays uninterpretable.

