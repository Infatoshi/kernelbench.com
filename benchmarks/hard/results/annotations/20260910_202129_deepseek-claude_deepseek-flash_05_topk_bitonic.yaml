summary: >
  Single-launch CUDA bitonic selection, not a sort. Every element is packed into
  one 64-bit (monotonic key << 32) | index word, so values come back bit-exact
  and indices cannot duplicate. The merge compares a pair's second list
  backwards where it lies instead of copying it reversed into a gap, which makes
  the union bitonic for free.

quotes:
  - file: solution.py
    lines: [84, 94]
    label: "Order-preserving float-to-key map; the packing that makes values exact"
    text: |
      DEVI unsigned f2key(float f) {
          unsigned u = __float_as_uint(f);
          return (u & 0x80000000u) ? ~u : (u | 0x80000000u);
      }
      DEVI float key2f(unsigned kk) {
          unsigned u = (kk & 0x80000000u) ? (kk & 0x7fffffffu) : ~kk;
          return __uint_as_float(u);
      }
      DEVI unsigned long long pack(float f, unsigned idx) {
          return ((unsigned long long)f2key(f) << 32) | (unsigned long long)idx;
      }
