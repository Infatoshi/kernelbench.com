  - "Floor domination is the headline. This problem's roofline times are 0.29-1.17 us per shape, against a harness event-timing floor of 2.6 us quiet, ~7.1 us bare launch under confidential computing, and 43.6 us under eight agents. At the loaded floor a kernel taking literally zero time caps at geomean 0.0163, so 79% of the graded 0.0129 is floor and at most 26% of it was ever addressable by code."
  - "The graded per-shape times are flat to 8% across shapes whose real kernel times differ by 3.1x. That is a measurement reporting its own floor, not a kernel."
  - "benchmark.py's RESULT: OK threshold of 0.1 sits above even the quiet bare-launch ceiling of 0.0913 and has never been reached on this GPU. That is a bench-design finding, not a model finding."
  - "No cache, no CUDA graph, no data_ptr or _version key. The one recorded caveat is that vals/idxs are plan-lifetime buffers returned by every call, the same class already annotated clean on this problem twice."
  - "CUDA graphs were measured and declined (replay 2.56 us vs direct 2.72 us) in a window where that was true. The board leaders appear to have won on exactly that lever, which makes it the run's most consequential honest measurement."
  - "forward never validates x's layout (solution.py:388-398); a strided input would read out of bounds silently. Unreachable from the harness."
  - "One manual GPU-lock bypass: KBH_GPU_LOCK_HELD=1 set by hand to run a numpy-only CPU simulation. Zero GPU impact, recorded for the file."

implication: >
  Even after the regrade this cell is about half the board, and that half is
  real. Predicted isolated ~0.048 would move it from last to mid-table, but the
  leaders (Opus 5 0.0946, DeepSeek V4 Pro 0.0935) got there by beating the
  launch path itself. This is the comparator-network family, which loads every
  element into shared memory, against leaders who reject most elements in
  registers. The published number measures a kernel; the graded 0.0129 measured
  the box.

