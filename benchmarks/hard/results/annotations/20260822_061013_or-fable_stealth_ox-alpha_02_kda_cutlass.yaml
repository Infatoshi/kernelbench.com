      @triton.jit
      def _inv_unit_lower16(z):
          """Return y with (I - z) @ y = I, for strictly-lower 16x16 fp32 z."""
          o = tl.arange(0, 16)
          y = (o[:, None] == o[None, :]).to(tl.float32)
          for i in tl.static_range(1, 16):
              sel = o == i
              zi = tl.where(sel[:, None] & (o[None, :] < i), z, 0.0)
              zv = tl.sum(zi, axis=0)
              row = sel.to(tl.float32) + tl.sum(zv[:, None] * y, axis=0)
              y = tl.where(sel[:, None], row[None, :], y)
          return y
