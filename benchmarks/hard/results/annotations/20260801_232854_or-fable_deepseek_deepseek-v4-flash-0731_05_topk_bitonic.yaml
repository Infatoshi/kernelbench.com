  Solution audit (all 639 lines read):
  - Real kernels: warp bitonic sort desc, shared-memory merge tree, two-level
    segment reduction, float4 vectorized loads, k==1 argmax fast path.
    Computes the full op on device; no constant/cached/shortcut output path,
    no CPU-side torch sorting anywhere.
  - Forbidden ops: grep -E "torch.topk|torch.kthvalue|torch.sort|
    torch.argsort|.topk(|.kthvalue(|.sort(|.argsort(|aten|torch.ops"
    solution.py = 0 hits. data_ptr appears only as C++ tensor accessors
    inside the CUDA source (lines 451-508), not as a Python cache key.
  - FLAGGED pattern (reason for pending empirical test): forward() replays a
    captured CUDA graph iff self._graph_x is x — Python object identity, not
    data_ptr. Capture runs _run_kernels(x) directly on the caller's
    (already-contiguous) buffer, so replay re-executes the kernels against
    that tensor's live bytes; _values/_indices are recomputed outputs each
    replay, never memoized. A DIFFERENT tensor object always misses the key
    and triggers a fresh capture (numeric-stress cases pass fresh tensors and
    PASS). A non-contiguous input produces a new .contiguous() object every
    call, so the identity key can never hit a stale copy — statically
    stricter than the 02_kda_cutlass data_ptr key already validated by the
    operator's recompute test. Operator's same-buffer-overwrite test closes
    it definitively.
  - No env reads or mutation in solution.py; no os.environ / inspect /
    monkeypatch / builtins tricks.

