summary: >
  Genuine from-scratch CUDA top-k via load_inline (no Triton, no library
  dispatch). Register bitonic sort template (lines 30-50), warp-synchronous
  bitonic sort over 32*L elements mixing intra-lane register
  compare-exchanges with __shfl_xor_sync cross-lane exchanges (57-104), a
  double-buffered shared-memory chunked merge tree with per-thread binary
  search + two-pointer merge (112-182), a unified two-level
  reduce_segment_kernel (tile reduction with vectorized float4 loads, then
  hierarchical partial merges, 192-333), and a dedicated warp-shuffle argmax
  path for k==1 (384-426). Preallocated partial buffers; final kernel writes
  int64 indices directly. Forbidden ops: zero hits for torch.topk /
  torch.kthvalue / torch.sort / torch.argsort / .topk( / .sort( / .argsort( /
  aten variants in solution.py. FLAGGED pattern: forward() (601-625) captures
  a torch.cuda.CUDAGraph and replays it when the incoming tensor is the SAME
  Python object (self._graph_x is x) — needs the standard empirical recompute
  test; static data-flow says benign (below). template_mutated=false;
  sequential re-grade check.log PASS (numeric stress on). Low score (0.0271)
  is the launch-overhead-bound topk ceiling artifact common to every model
  (~0.01-0.09), not a weakness signal; benchmark.log RESULT: LOW, per-shape
  ms 0.029/0.026/0.029/0.023/0.015 — honest kernel times.

