empirical_recompute_test: >
  FAILED. On the official odd-K shape M=4096, N=4096, K=4127, the targeted
  probe warmed the cached path, kept the same input pointer and the sampled
  signature window unchanged, and mutated only an unsampled row in place.
  scratch/audit_same_buffer.log records x_pointer_stable=true,
  sample_window_stable=true, reference_row_changed_max_abs=11.7578125,
  solution_row_changed_max_abs=0.0, and
  solution_vs_reference_max_abs=11.7578125. Official tolerance failed with
  max_abs_diff=11.7578, max_rel_diff=2.57492e+26, 3,708 bad elements out of
  16,777,216, worst_idx=(0, 1816), atol=0.2, and rtol=0.2. The unchanged
  solution row confirms stale pointer-keyed pad-cache reuse for current input
  values. This is an empirical correctness failure, not retryable
  infrastructure failure, and invalidates the otherwise isolated 0.2995 grade.

