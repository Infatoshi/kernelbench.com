cache_graph_buffer_audit: >
  Closely inspected; no pointer-keyed cache, no CUDA graph, no output-value
  cache, no input-identity behavior. grep of the final solution finds zero
  occurrences of CUDAGraph, graph.replay, capture, data_ptr, lru_cache, or
  cache. The only persistent state is the _workspace dict (solution.py lines
  255-274), keyed on the shape tuple (B,T,H,K,V) -- never on data pointers --
  and holding only intermediate buffers (w, u, qg, kg, a, l, f, gl). Every one
  of those buffers is fully overwritten from the live inputs on every forward
  before it is consumed: prep stores full tiles of qg/f/gl/kg for both K
  halves (lines 77-78, 81-82, 103-104, 107-108) and full 64x64 a and l tiles
  (lines 120-124) across the whole grid; the wu kernel overwrites full-K w and
  full-V u (lines 167-182); the scan kernel reads only those freshly written
  buffers plus live-derived state. The output is freshly allocated with
  torch.empty_like(v) on every call (line 290) -- no identity reuse. Because
  no fast path is keyed on input identity or address, benchmark.py's reuse of
  one input list cannot skip work: all three kernels launch and read current
  input bytes on every timed iteration. No empirical same-buffer mutation test
  is required for this cell.

