static_correctness_assessment: >
  Correct for the official fixed-shape contract, and confirmed by the official
  in-run graded check (exit 0, PASS in check.log) run by the harness on the
  archived final solution after the session ended. The solution is a genuine
  three-kernel Triton implementation matching reference.py's live data flow:
  _kda_prep_kernel (lines 35-124) loads live q/k/g/beta, forms in-chunk
  base-2 cumulative gates, lower-triangular Aqk with scale folded in, and the
  strict-lower beta-row-scaled key-key matrix L; _kda_wu_kernel (lines 131-182)
  builds X = prod_{i=0..5}(I + L^(2^i)) = sum_{j<64} L^j, which for a 64x64
  strictly-lower (nilpotent) L is the algebraically exact (I-L)^{-1} expansion
  (tf32 dot precision), then w = X @ (beta*k*exp2(G)) and u = X @ (beta*v);
  _kda_scan_kernel (lines 189-227) runs the sequential inter-chunk recurrence
  v_n = u - w@S, o = qg@S + Aqk@v_n, S = exp2(g_last)*S + kg^T@v_n, identical
  to reference.py lines 75-96. Output stores at lines 224-225 cover every
  token, head, and V lane (grid B*H x V/BV, BV=32, loop over all NT chunks).
  Unlike the contaminated 20260803_220626 KDA cell, the inverse here is the
  exact 64-term nilpotent expansion, not a truncated approximation. The final
  solution.py edit (10:48:39Z, an equivalence-preserving refactor of the
  explicit squaring chain into the static_range loop) was followed by the
  official harness check PASS at 10:57:40Z, which is the graded evidence.

