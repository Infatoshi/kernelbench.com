summary: >
  Genuine fused W4A16 (AWQ-style asymmetric int4 group-128, bf16 activations)
  GEMM, two custom paths, no dequantized weight matrix ever materialized. M==1
  decode path: a hand-written CUDA SIMT GEMV via torch load_inline compiled
  -arch=sm_120a (lines 37-167) — packed uint8 weights read as vectorized
  uint32, per-thread 4-column in-register K-reduction, (q - zero) * scale
  dequant inline (line 108), split-K=32 with fp32 partials and an
  atomic-counter last-block reduction. M>=16 path: a Triton GEMM (lines
  203-250) with fused unpack+dequant in the K-loop ((v - z) * s at line 243
  before tl.dot) plus a small finalize kernel for split-K partials. Zero
  forbidden ops (no bitsandbytes, no marlin, no F.linear — grep rc=1). No
  data_ptr-keyed caches, no CUDA graphs, no output memoization; the only
  persistent scratch is a preallocated _out/_part/_counters buffer set the
  GEMV kernel fully rewrites every call. template_mutated=false.

