empirical_recompute_test: >
  NOT REQUIRED as a separate gate, and no separate live-buffer probe is
  claimed. The pointer-keyed CUDA-graph cache and identity fast path cannot
  return stale outputs by construction: every return is preceded by either
  the eager kernel launch or graph.replay(), and a key or identity hit
  guarantees the captured launch reads the addresses the current tensors
  occupy, so each call recomputes attention from live memory (seq_lens and
  block_table included). The archive's decisive empirical evidence is the
  fresh-process official checker PASS, which drove each per-shape model
  instance through three value-regimes differing by roughly three orders of
  magnitude on freshly allocated buffers under 0.02/5e-2 tolerances - a
  memoized or stale output path would have failed immediately. What is not
  empirically proven is only which specific calls hit the replay path during
  that PASS (pointer collisions are unlogged); no publication claim rests on
  that detail.

