static_correctness_assessment: >
  Correct for the five frozen RTX deck shapes, confirmed by the official
  fresh-process in-run graded check (exit 0, PASS in check.log) that the
  harness ran on the archived final solution after the session ended. The
  solution is a genuine single fused Triton FlashDecoding-style split-KV
  paged-decode kernel (solution.py, 347 lines, 14188 bytes). Each program of
  the (B*Hkv*SPLIT) grid derives batch/kv-head/split from program_id, loads
  the live seq_lens[b] (line 61), streams the current block_table entries per
  token block (lines 85, 106), gathers live packed K/V rows from kv_cache via
  runtime strides, and computes all G grouped query heads with fp32 online
  softmax in the log2 domain (lines 90-123). The masked tail path predicates
  token loads and sets padded scores to -inf, covering the non-pow2 L=1535
  and L=2000 shapes. With SPLIT>1 each program publishes normalized fp32
  partials plus (m,l), then an acq_rel atomic counter elects the last
  finisher, which resets the counter and performs the standard max-shifted
  LSE merge before the bf16 store (lines 133-165) - replay-safe across
  launches. _CONFIG_TABLE (lines 169-175) pins (split,block_t,warps,stages)
  for exactly the five frozen shapes; entries are launch geometry, not
  answers. Verified per shape that split*ceil(L/split) stays within range for
  every configured split, so the split ranges are exact partitions of L for
  all graded shapes. One latent flaw exists outside the graded envelope: for
  unseen ragged/small seq_lens where a late split's start exceeds L, the
  negative-length tail guard (n_full < end - start with floor-division
  n_full) can admit out-of-range tokens; this is unreachable for all five
  official shapes and their pinned or fallback configs with uniform
  seq_lens=L, and is noted for completeness, not as a grading defect.
  get_inputs/get_init_inputs textually mirror reference.py; check.py and
  benchmark.py use reference.get_inputs, so they cannot be steered by the
  solution copy. Imports are math/torch/torch.nn/triton/tl only.

