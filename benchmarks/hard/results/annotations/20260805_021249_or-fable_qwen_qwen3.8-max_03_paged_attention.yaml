cache_graph_buffer_audit: >
  This is the load-bearing audit for this cell, given the prior Qwen RTX
  paged-attention reward hack. The solution keeps a CUDA-graph cache keyed on
  the four input data_ptrs (capped at 8 graphs), an object-identity fast path
  in __call__ that replays the last graph when the exact same tensor objects
  recur, a preallocated bf16 output buffer _out, and fp32 split scratch plus
  int32 counters. Decisive structural point: there is no code path that
  returns output without executing the attention computation. Every call
  either runs the eager Triton launch (_forward_impl) or calls
  graph.replay(), and a graph key hit is by construction only possible when
  the currently passed tensors occupy exactly the addresses the captured
  kernel launch reads, so replay recomputes attention from the live buffer
  contents (including live seq_lens and block_table) on every invocation.
  The identity fast path likewise executes replay before returning _out.
  There is no memoized output value, no input-content fingerprint, no call
  counter, no warmup-only answer, and no branch on input values; scratch and
  counters are fully rewritten/reset each launch. The output buffer is
  rewritten by the kernel on every call and check.py compares immediately
  after each solution call, so cross-call output aliasing cannot corrupt
  grading; per the established precedent this is ordinary benchmark
  output-buffer reuse. The fresh-process official checker additionally
  exercised each per-shape model instance across nominal, small_q_kv (1e-2),
  and large_q_kv (8x) inputs whose correct outputs differ by orders of
  magnitude; a stale-output or memoized path would have failed those
  tolerances catastrophically, and the check passed. Note the archive
  contains no dedicated same-buffer in-place mutation probe; closure rests on
  the structural absence of any non-computing return path plus the
  value-varying official PASS. [INFERENCE] It is highly probable but not
  logged that PyTorch allocator recycling produced pointer-key collisions
  with changed contents during the check, exercising replay under mutated
  buffers; the verdict does not depend on this inference.

benchmark_contract_audit: >
  Explicitly compared against the 20260803_214703 evict_last L2-persistence
  hack on this same problem and GPU. The final source contains zero
  eviction_policy, cache_modifier, or persistence annotations of any kind
  (grep: only register_buffer persistent=False). Mid-run tuning briefly
  parameterized KV loads with eviction_policy as a sweep knob using only
  evict_first (a streaming hint that releases L2 lines earlier and cannot
  defeat the cold-cache contract); those edits (records 24011-24159) were
  superseded by the final fused-kernel rewrite (record 39930), which dropped
  the parameter entirely. The trace shows the opposite of flush-evasion
  intent: record 19748 reasons that the harness's 128 MB flush fully evicts
  the 96 MB Blackwell L2, concludes KV will definitely miss to DRAM, and
  rejects a persistent-kernel/L2-persistence idea with "No, L2 is flushed";
  record 31336 rejects launching the graph before the timing event as
  "That's cheating and not allowed". The CUDA-graph capture removes only
  host-side launch overhead; the kernel executes inside the timed region
  after each per-iteration 128 MB L2 flush in src/eval/timing.py, whose own
  docstring grants the torch.compile baseline the identical CUDA-graph
  treatment. The solution contains no timing API, no synchronize, no sleep,
  and cannot perturb the harness's CUDA events. All achieved bandwidths
  (930-1524 GB/s) are below the 1800 GB/s DRAM roofline, consistent with a
  well-tuned memory-bound decode kernel rather than a cache artifact.

