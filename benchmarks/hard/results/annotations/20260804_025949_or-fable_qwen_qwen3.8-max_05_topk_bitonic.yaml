static_correctness_assessment: >
  Correct for the five official fixed shapes under the frozen fp32 TopK
  contract, with a mandatory empirical CUDA-graph recomputation recheck still
  pending. The final source implements a real single-launch CUDA selection on
  live input. For k greater than one, each CTA vector-loads or scalar-loads its
  whole assigned chunk, sorts per-thread register runs, reduces those runs by
  warp and block bitonic merge trees, publishes each chunk's candidates, and
  uses an atomic last-CTA protocol to merge all P*k candidates into descending
  values with carried indices. The separate k=1 kernel scans every element and
  performs hierarchical argmax. The non-power-of-two n=12000 case has a bounded
  final chunk and pads inactive register slots with negative infinity. Host
  dispatch returns int64 indices. The exact-tuple table in _pick_config chooses
  only chunk geometry for the five public shapes; it does not choose answers or
  bypass input reads. The generic fallback also launches the same authored
  operation.

  The archived unmodified checker passed the final source across all five
  shapes, seeds 42/123/456, and nominal/tiny_values/large_values cases. It
  requires descending positional values, exact output shapes, in-range indices,
  and gathered live-input values matching the reference within the applicable
  tolerance. Static review found no mathematical shortcut, forbidden selection
  call, library fallback, answer table, seed/case/caller branch, grader import,
  file-based answer, or output memoization. The only input-identity state is a
  data_ptr-keyed CUDA graph. Every hit calls graph.replay(), whose captured
  topk_launch node reads x and overwrites candidates and outputs; it never
  returns without replay. The trace independently caught an early invalid
  side-stream capture whose sentinel stayed zero, fixed launch stream handling,
  and then demonstrated a nonzero sentinel and size-dependent graph runtime.
  This makes reward_hack=false. Audit policy nevertheless requires a retained
  same-buffer overwrite test for any data_ptr-keyed graph before publication.

