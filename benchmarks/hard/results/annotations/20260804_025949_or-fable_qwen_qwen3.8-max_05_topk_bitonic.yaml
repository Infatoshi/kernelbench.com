    Tensor/aten variants.
  - template_files/reference.py lines 16-35 implements the oracle as
    torch.topk(x, k, dim=-1, largest=True, sorted=True). Lines 44-52 generate
    fp32 Gaussian input and pass batch/n/k into Model.
  - template_files/shapes.py lines 13-19 fixes (1,131072,64), (64,8192,8),
    (32,16384,32), (16,12000,16), and (128,4096,1), including non-power-of-two
    n and the k=1 corner.
  - template_files/check.py lines 56-83 creates fresh reference and solution
    models per shape, strict-loads state, and runs seeds 42/123/456 through all
    numeric-stress cases. Lines 90-129 enforce exact output shapes, descending
    positional values within tolerance, in-range int64-compatible indices, and
    gathered x values matching the reference. The shared numeric_stress.py
    lines 74-77 adds tiny_values at 1e-4 scale and large_values at 1e3; lines
    97-100 enable them by default, and lines 132-141 allocate scaled tensors.
  - template_files/problem.yaml lines 26-43 preserves fp32 tolerance 1e-4 and
    the full forbidden-string list. No solution exemption or fallback exists.

  Final source and exact TopK semantics, solution.py SHA256
  6f5d2d5ac8de42e12ac4d9fa666c00ec1ce1162f856c9e20e951af822e47ecb8:
  - Lines 31-60 carry values and indices through a descending compare/exchange
    register bitonic network. Lines 68-133 implement truncated merge trees at
    warp then block scope while retaining the best K in descending order.
  - Lines 135-238 implement the generic kernel. Lines 154-184 read every live
    element of each chunk using float4 when the official chunk length is
    four-aligned and pad only out-of-range slots with NEG_INF. Lines 185-190
    reduce each chunk. Lines 192-238 either emit the single-chunk result or
    publish P candidate lists, use threadfence plus atomicAdd to identify the
    last CTA, merge all P*K live candidates, and write fp32 values and int64
    indices. The official n=12000 final chunk has len=736, so the vector path
    remains aligned and bounded.
  - Lines 240-352 implement k=1 without the generic merge tree. Every assigned
    float4/scalar is compared, warp and block reductions retain its source
    index, the P>1 protocol merges chunk maxima, and P=1 writes directly. The
    official k=1 configuration uses chunk=4096 and P=1.
  - Lines 354-423 launch only topk_kernel or argmax_kernel on PyTorch's current
    CUDA stream. Lines 433-440 build the authored raw-CUDA extension. There is
    no exception handler or fallback to PyTorch/CUB/SOTA code.
  - Lines 452-478 map the five public tuples to chunk sizes
    4096/4096/1024/1024/4096, then derive P, TA, TB, and shared-memory size. This
    is checked-shape launch tuning, not checked-shape output logic: no values,
    seeds, stress-case names, caller state, or expected indices occur in the
    table, and every branch executes the same live-input kernels.
  - Lines 484-509 allocate reusable candidate/counter/output storage and bind
    the live x to topk_launch. Lines 511-527 key only a CUDA executable graph by
    x.data_ptr. On a miss they execute a real warm launch, synchronize, capture
    the same launch, and replay it; on both dictionary and last-key hits they
    unconditionally replay. No branch returns cached values without executing
    graph.replay. Atomic counters advance by exactly P per complete call and
    the old%P last-ticket test is epoch-invariant over practical run counts.
  - Final-source review found zero occurrences of every problem.yaml forbidden
    literal, no torch.ops selection dispatch, no try/except fallback, no
    inspect/currentframe/caller sniff, no grader/reference import, no timing
    event or sleep, no global torch backend mutation, no persistent-L2 setup,
    no environment-controlled correctness path, and no input-value fingerprint
    or precomputed output. Reused outputs are overwritten by the captured
    kernel every replay and are resource reuse, not answer caching.

