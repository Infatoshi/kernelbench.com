# KernelBench-Mini model roster (2026-07-28).
#
# Mini's whole premise IS a roster — it ranks small models, so eligibility is
# part of the benchmark definition rather than a cost control. Encoding it here
# instead of leaving it in prose (SPEC.md) so it is checkable.

bench: mini
policy: sub_200b_open_weight
gate: advisory        # no launch gate yet; enforce at publish when mini debuts

eligibility:
  max_params_b: 200
  weights: open
  rationale: >
    A model whose weights are not downloadable cannot be verified to be under
    the size cap, so closed models are ineligible regardless of claimed size.

exceptions:
  - id: frontier_baseline
    ranked: false
    reason: >
      A single frontier model may be run UNRANKED as a calibration anchor, so
      readers can see how far the small-model field is from the ceiling. It is
      not a leaderboard entry.
