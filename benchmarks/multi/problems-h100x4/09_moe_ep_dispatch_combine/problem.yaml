name: 09_moe_ep_dispatch_combine
display_name: "MoE EP Dispatch + Combine (irregular, fp8)"
collective: all_to_all
world_size: 4
hardware: [H100x4]
precision: mixed_fp8_bf16
dtype_bytes: 2

# HEADLINE: geomean speedup vs the frozen production anchor (sota.py: sort by
# destination, exchange counts, NCCL all_to_all_single the fp8 payload with
# variable splits, expert, all_to_all_single back, unpermute). Traffic here is
# DATA-DEPENDENT — the gate decides the per-destination counts every call — so
# there is no fixed byte count to put in a busbw fraction. Anchor measured once on
# the canonical 4xH100 SXM node and FROZEN — see DEVLOG 2026-07-25.
metric: speedup
anchor_ms: []   # PENDING measurement on the canonical node; benchmark.py refuses to grade until filled

# Informational only, and only in expectation (counts vary per call): fp8 dispatch
# leg (1 byte) plus bf16 combine leg (2 bytes) crossing the fabric.
busbw_bytes_formula: "(world_size-1)/world_size * world_size*tokens*hidden*3"

tolerance:
  bfloat16: 2.5e-2

# Local permutation/quantization may use anything. The two all-to-alls may not use
# a c10d collective — including the count exchange.
forbidden:
  - "dist.all_reduce"
  - "dist.all_gather"
  - "dist.all_gather_into_tensor"
  - "dist.reduce_scatter"
  - "dist.reduce_scatter_tensor"
  - "dist.all_to_all"
  - "dist.all_to_all_single"
  - "dist.broadcast"
  - "dist.reduce"
  - "dist.gather"
  - "dist.scatter"
  - "torch.distributed.all_reduce"
  - "torch.distributed.all_gather"
  - "torch.distributed.reduce_scatter"
  - "torch.distributed.all_to_all"
  - "torch.distributed.reduce"
  - "torch.distributed.broadcast"
  - "_c10d_functional"
  - "torch.distributed.nn"

sota:
  name: "NCCL all_to_all_single with variable splits (fp8 dispatch, bf16 combine)"

num_correct_trials: 5
num_perf_trials: 100
num_warmup: 200
