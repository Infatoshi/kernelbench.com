name: 08_ring_attention_cp
display_name: "Context-Parallel Ring Attention (causal)"
collective: ring_p2p
world_size: 4
hardware: [H100x4]
precision: bf16
dtype_bytes: 2

# HEADLINE: geomean speedup vs the frozen production anchor (sota.py: NCCL
# all-gather of K/V then one masked bf16 SDPA). Comm and attention math are fused
# here, so the measured time is not describable by any single collective's bus
# bytes and a busbw peak_fraction would be meaningless. Anchor measured once on
# the canonical 4xH100 SXM node and FROZEN — see DEVLOG 2026-07-25.
metric: speedup
# FROZEN 2026-07-25, hades (4xH100 SXM NVSwitch), quiet node, median of 5 passes.
# Per-shape spread across those passes: 0.7%, 0.2%, 7.5%, 0.5%.
# Measured against the FUSED anchor (causal_lower_right over the sliced K/V). The
# first draft passed a dense bool attn_mask and measured ~2x slower; anchoring
# against that would have paid every model for avoiding a mistake, not for a ring.
anchor_ms: [1.4404, 2.1626, 0.3090, 1.3878]

# Informational only: one full ring of K+V chunks moves this many bytes per rank.
busbw_bytes_formula: "2 * (world_size-1)/world_size * world_size*seq_local*heads*head_dim*dtype_bytes"

# [atol, rtol] for the scale-aware gate: tol = atol*rms(ref) + rtol*|ref|.
# CALIBRATED, not guessed — scripts/numerics_probe_attention.py on the canonical
# node, 2026-07-25. atol is the floor that near-zero output elements are judged
# against, and honest bf16 attention needs more of it than the reduction decks do:
#   worst honest variant (one-shot bf16 SDPA, and a ring with bf16 accumulate):
#     atol_min 0.0281
#   cheapest cheat (drop the last KV chunk):        atol_min 2.04 - 6.85
#   skipping the online-softmax rescale:            atol_min 4.45 at the large
#     stress scale (it is nearly free of error on homogeneous nominal data, which
#     is also why it buys no real time — numeric stress is what catches it)
# 0.1 leaves 3.6x over honest noise and sits 20x under the cheapest cheat.
tolerance:
  bfloat16: [0.1, 0.025]

# The per-chunk attention math may use any local library (SDPA / flash-attn /
# cuDNN / your own kernel). The chunk exchange may not use a c10d collective.
forbidden:
  - "dist.all_reduce"
  - "dist.all_gather"
  - "dist.all_gather_into_tensor"
  - "dist.reduce_scatter"
  - "dist.reduce_scatter_tensor"
  - "dist.all_to_all"
  - "dist.all_to_all_single"
  - "dist.broadcast"
  - "dist.reduce"
  - "dist.gather"
  - "dist.scatter"
  - "torch.distributed.all_reduce"
  - "torch.distributed.all_gather"
  - "torch.distributed.reduce_scatter"
  - "torch.distributed.all_to_all"
  - "torch.distributed.reduce"
  - "torch.distributed.broadcast"
  - "_c10d_functional"
  - "torch.distributed.nn"

sota:
  name: "NCCL all-gather K/V + masked bf16 SDPA (no ring, no overlap)"

num_correct_trials: 5
num_perf_trials: 100
num_warmup: 200
