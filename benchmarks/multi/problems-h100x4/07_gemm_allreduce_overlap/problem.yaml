name: 07_gemm_allreduce_overlap
display_name: "TP GEMM + AllReduce (overlapped)"
collective: all_reduce
world_size: 4
hardware: [H100x4]
precision: bf16
dtype_bytes: 2

# HEADLINE: geomean speedup vs the frozen production anchor (sota.py: cuBLAS bf16
# GEMM then NCCL all-reduce, sequential). This problem fuses compute WITH comm, so
# no single collective convention describes its bytes and a busbw peak_fraction
# would be uninterpretable (the measured time includes the GEMM). Anchor measured
# once on the canonical 4xH100 SXM node and FROZEN — see DEVLOG 2026-07-25.
metric: speedup
anchor_ms: []   # PENDING measurement on the canonical node; benchmark.py refuses to grade until filled

# Informational only (not used for scoring under metric: speedup): the all-reduce
# leg alone would move this many bus bytes.
busbw_bytes_formula: "2*(world_size-1)/world_size * tokens*hidden*dtype_bytes"

tolerance:
  bfloat16: 2.5e-2

# The GEMM may use any local library (cuBLAS/CUTLASS/torch.matmul/Triton). The
# CROSS-GPU SUM may not use a c10d collective — that is the part under test.
forbidden:
  - "dist.all_reduce"
  - "dist.all_gather"
  - "dist.all_gather_into_tensor"
  - "dist.reduce_scatter"
  - "dist.reduce_scatter_tensor"
  - "dist.all_to_all"
  - "dist.all_to_all_single"
  - "dist.broadcast"
  - "dist.reduce"
  - "dist.gather"
  - "dist.scatter"
  - "torch.distributed.all_reduce"
  - "torch.distributed.all_gather"
  - "torch.distributed.reduce_scatter"
  - "torch.distributed.all_to_all"
  - "torch.distributed.reduce"
  - "torch.distributed.broadcast"
  - "_c10d_functional"
  - "torch.distributed.nn"

sota:
  name: "cuBLAS bf16 GEMM + NCCL all-reduce (sequential)"

num_correct_trials: 5
num_perf_trials: 100
num_warmup: 200
