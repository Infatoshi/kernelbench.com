speedup_clean: 1.5874  # sequential re-grade on quiet kbmulti 2026-07-31 (in-run 1.6217) — best 07 on the board (grok 1.3972). First two regrade attempts FAILed CUBLAS_STATUS_NOT_INITIALIZED: the workspace-local build_fused/kbm_fused.so was linked while /usr/lib/x86_64-linux-gnu/libcublas.so still pointed at cublas-12 (symlink retarget landed at 00:26, after the 00:06 build) and ninja reused the stale .so. Deleting build_fused and rebuilding against the cublas-13 symlink -> check PASS, ldd shows libcublas.so.13.
method: inline code audit + deck-diff (grader files byte-identical) + trace guard-edit sweep (none); canonical-stack check re-run PASSED (see portability note)
portability_note: |
  The in-run grade (PASS 1.6217) executed on Lambda's SYSTEM torch (cu12.8):
  run_agent.sh graded with bare `python3`, which the bin/ wrapper resolves to
  /usr/bin/python3 — harness bug, fixed 2026-07-30 (grade now pinned to the
  bench venv). Under the venv (torch 2.13 cu130) the solution initially
  hard-failed: its _load_ext bakes `CUDA_HOME=/usr` + `-L/usr/lib/x86_64-linux-gnu
  -lcublas`, linking the ext against system libcublas.so.12, and a cublas-13
  handle from torch cu130 passed into cublas-12 returns
  CUBLAS_STATUS_NOT_INITIALIZED (versioned symbols defeat LD_PRELOAD).
  Resolution WITHOUT touching solution files: installed cuda-toolkit-13-0 on
  kbmulti, retargeted the /usr/lib libcublas.so DEV symlink to cublas-13 for
  the rebuild (runtime .so.12 untouched, symlink restored after), rebuilt
  build_fused with CUDA_HOME=/usr/local/cuda-13.0 — ext now links
  libcublas.so.13 and check PASSES on the canonical venv stack, numeric
  stress included. The cublas-13 build_fused is cached in the run ws for the
  quiet-node benchmark re-grade.
notes: |
  First solution to actually OVERLAP gemm and comm on 07 (grok/GLM/codex all ran
  sequential): token rows split into pipeline rounds; rank r reduce-scatters +
  broadcasts round q over NVSwitch in-network reduction (multimem.ld_reduce /
  multimem.st via a hand-built CUDA VMM multicast mapping — torch's
  has_multicast_support() reports False on this node, agent built it from the
  driver API anyway) while the MMA pipeline works round q+1. Also found the
  cuBLAS ldb=8191 5.3x cliff independently (pads weight to 64-col multiple,
  same discovery GLM made). Per-round readiness via release-store epoch
  counters so a waiter can never be satisfied by the previous forward — and
  the whole forward is CUDA-graph captured, keyed on input pointers, to kill
  ~370us of launch overhead.
  The graph cache is the one pattern requiring empirical verification per the
  standing audit rule (overwrite same input buffer, confirm output changes).
  Numeric stress in check.py already exercises rescaled inputs through the
  same buffers and PASSED, which is strong evidence of recompute; the explicit
  probe runs before node teardown and this annotation gets its result.
  Grader files byte-identical; zero guard edits; no foreign-run refs.
