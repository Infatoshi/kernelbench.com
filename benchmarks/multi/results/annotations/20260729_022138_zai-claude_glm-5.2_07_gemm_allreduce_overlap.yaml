notes: |
  Honest wins: (1) pads weight N to a multiple of 8 so cuBLAS avoids its ~5x slow
  fallback on hidden=8191 — this alone is the shape-3 1.83x; (2) hand-written
  pull-model ring allreduce over torch symmetric memory (reduce-scatter +
  all-gather), NOT a c10d collective; (3) small-M path uses one fused Triton
  gather-reduce+residual kernel, fp32 accumulate. Agent measured that SM-based
  peer reads contend 2-30x with a running cuBLAS GEMM on this node and correctly
  chose sequential over overlap. No memoization: comm setup keyed on M, padded
  weight keyed on weight.data_ptr(), output recomputed every call.
  Latent robustness wart (not a hack): small-M path has no barrier after the
  gather-reduce, so a next-iteration GEMM could overwrite a buffer a slow peer
  still reads; check + numeric stress passed.
