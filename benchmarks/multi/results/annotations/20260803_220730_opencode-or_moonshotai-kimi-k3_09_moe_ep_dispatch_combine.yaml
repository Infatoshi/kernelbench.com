  retry-loop infra deaths, not model fails.

  Design (end-to-end solution.py read, 688 lines): DeepEP-style fused EP over
  torch CUDA symmetric memory. No c10d collectives on the data path
  (dist used only for rank/world_size + symm_mem.rendezvous). One persistent
  symm buffer with K=4 ping-pong slots; meta kernel does per-dest histogram +
  stable positions and exchanges counts device-side; dispatch quantizes to
  e4m3 (bit-exact with the reference's reciprocal-multiply scale, including
  torch's 1/448 reciprocal) and writes payload+scale+packed (src,idx) straight
  into the dest rank's receive slot (permute fused into the transfer); signal
  kernel fences + per-source sent flags; expert+combine waits, does
  y_j=0.5*(x_j+x_{j-1})*w over the received batch, writes bf16 straight into
  the origin rank's combine slot (unpermute fused); outwait returns a strided
  view of the combine slot (no copy-out). Cross-rank sync is epoch-tagged
  system-scope release/acquire flags. Built via nvcc + ctypes.CDLL (not
  load_inline). forward() stamps live x/dest/w data_ptrs + stream + epoch into
  a params block and launches moe_forward; returns self._out_views[slot]
  (strided view of that epoch's combine region — allocation reuse keyed on
  (n,H)/slot, not output memoization).

