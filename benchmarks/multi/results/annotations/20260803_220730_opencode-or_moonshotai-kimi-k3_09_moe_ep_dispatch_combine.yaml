notes: |
  Completes the five-model multi board's last open cell. Session ran on a
  Brev Nebius 8xH100 SXM node (full NV18 mesh) with CUDA_VISIBLE_DEVICES=0,1,2,3
  because Lambda had zero 4xH100 capacity; topology is the same NVSwitch fabric
