# KernelBench-Multi model roster (2026-07-28).
#
# WHY THIS BENCH HAS A ROSTER AND HARD/MEGA/CUDA DO NOT: cost structure, not
# prestige. A multi session occupies FOUR H100s for an unlimited-wall-clock run,
# so a model that flails for 40 minutes costs 4x the GPU-time of the same flail
# on a single-GPU bench. Restricting the field is a GPU-hours decision.
#
# The gate is enforced at launch by scripts/sweep_wave.sh. Set
# KBM_ALLOW_OFF_ROSTER=1 to run an exploratory cell — it will still be archived,
# but do not publish it without adding the row here first.

bench: multi
policy: frontier_only

models:
  - id: grok-4.5
    harness: grok
    effort: high
    scheduled: true
    status: complete          # 4/4 clean, 2026-07-25

  - id: glm-5.2
    harness: zai-claude
    scheduled: true
    status: ready             # ZAI_API_KEY present; zero porting needed

  - id: claude-opus-5
    harness: claude
    effort: max               # hard's Opus matrix uses max; a lower tier is not comparable
    scheduled: true
    status: needs_auth        # no CLAUDE_CODE_OAUTH_TOKEN on the worker yet

  - id: gpt-5.6-sol
    harness: codex
    effort: xhigh             # this is codex's effort tier, not a separate model
    scheduled: true
    status: needs_cli         # codex not installed on the worker

  - id: kimi-k3
    harness: kimi-claude
    scheduled: true
    status: ready             # KIMI_API_KEY present; released 2026-07-16, 1M ctx
    note: >
      Newer than the kimi-k2.7-code the hard bench runs, so a multi cell is this
      model's first KernelBench appearance either way.

  - id: claude-fable-5
    harness: claude
    effort: max
    scheduled: false
    reason: >
      Excluded on token cost (operator decision, 2026-07-27). Note the GPU side is
      NOT the expense here — on a leased or already-running node the four H100s are
      sunk cost, so Fable's multi bill is the same shape as its hard bill, which is
      already being paid. Worth revisiting against a measured column rather than an
      estimate.

  - id: deepseek-v4-pro
    harness: deepseek-claude
    scheduled: false
    reason: >
      Proposed addition, awaiting operator decision. Harness branch is already
      ported. Strongest omission from the original seven: it is a serious
      kernel-writing model and is already published on hard.

# Deliberate non-frontier control row. A board where every cell is 1.3-4.4x
# cannot distinguish "these models are good" from "this deck is easy". The frozen
# anchor gives a 1.0x reference but says nothing about whether a weaker model can
# pass check AT ALL — which on a deck needing fp32-accumulate numerics (07) and a
# real neighbour dependency (09) is the more interesting signal.
# NOTE: intentionally not written as `- id:` — the launch gate matches that key,
# and a placeholder there would let a model literally named "TBD" through.
control:
  candidate: undecided
  scheduled: false
  ranked: false
  reason: calibration only — proves the deck discriminates, not a leaderboard entry
